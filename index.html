and out comes resident ⟦2⟧. The door reads ⟦3⟧. Pour equal residents into the same mould, and what comes out should be equal too."],["等式の鍵で書き換えると、扉の両辺は同じ ⟦0⟧ で揃った。三枚目の定理カード「関数の合同」が手に入る。","Rewriting with the equation key, both sides of the door become the same ⟦0⟧. You obtain the third theorem card, \"Congruence for functions\"."],["作業台に二本の鍵、⟦0⟧ と ⟦1⟧。扉は ⟦2⟧。だが、この工房の書き換えは、等式の右辺を左辺に置き換える一方向だけだ。⟦3⟧ のままでは、扉の ⟦4⟧ に手が届かない。入口の広間に置かれた、あのカードの出番だ。","On the workbench lie two keys, ⟦0⟧ and ⟦1⟧. The door is ⟦2⟧. But rewriting in this forge goes only one way, replacing the right side of an equation with its left side. With ⟦3⟧ as it is, you cannot reach the ⟦4⟧ in the door. Now is the time for that card in the entrance hall."],["カード「等号の対称律」で ⟦0⟧ を ⟦1⟧ に裏返すと、二本の等式がつながった。一度鍛えた定理は、こうして何度でも使える。","You flip ⟦0⟧ over into ⟦1⟧ with the card \"Symmetry of equality\", and the two equations join. A theorem once forged can be used again and again like this."],["工房の奥の炉の前で、親方が腕を組む。「左から掛けても変わらない ⟦0⟧ と、右から掛けても変わらない ⟦1⟧。この二つが同じものだと示してみよ」。扉には ⟦2⟧。手がかりは一つ――⟦3⟧ と ⟦4⟧ を掛け合わせた ⟦5⟧ を、両側から眺めてみることだ。","Before the forge at the back of the workshop, the master folds his arms. \"⟦0⟧, which changes nothing when multiplied on the left, and ⟦1⟧, which changes nothing when multiplied on the right. Show me that these two are the same.\" The door reads ⟦2⟧. There is one clue: look at ⟦5⟧, the product of ⟦3⟧ and ⟦4⟧, from both sides."],["⟦0⟧ は、⟦1⟧ の側から見れば ⟦2⟧、⟦3⟧ の側から見れば ⟦4⟧。二つの見方がつながり、扉は開いた。親方は満足げに炉の火を落とし、工房の外に広がる学者たちの街を指さした。","⟦0⟧ is ⟦2⟧ when seen from the side of ⟦1⟧, and ⟦4⟧ when seen from the side of ⟦3⟧. The two views join, and the door opens. Satisfied, the master banks the fire and points to the town of scholars spreading beyond the forge."],["最初の扉には ⟦0⟧。「⟦1⟧ と ⟦2⟧ の両方に属する区画は、⟦3⟧ に含まれる」。点線の ⊆ に触れると、扉は「どの住人も、⟦4⟧ に属するなら ⟦5⟧ に属する」と書き直されるはずだ。","The first door reads ⟦0⟧: \"the quarter of those belonging to both ⟦1⟧ and ⟦2⟧ is contained in ⟦3⟧\". Touch the dotted ⊆, and the door should be rewritten as \"every resident who belongs to ⟦4⟧ belongs to ⟦5⟧\"."],["書き下してみれば、∀ と → と ∧ の、見慣れた扉だった。新しい印も、定義をたどれば古い言葉に戻る。","Written out, it was a familiar door of ∀, → and ∧. Follow the definitions, and new signs return to the old words."],["次の扉は ⟦0⟧。⟦1⟧ は、⟦2⟧ か ⟦3⟧ のどちらかに属する住人の区画だ。⟦4⟧ の住人なら、当然そこに含まれるだろう。∪ の点線の向こうには、懐かしい ∨ の扉が待っている。","The next door is ⟦0⟧. ⟦1⟧ is the quarter of residents who belong to either ⟦2⟧ or ⟦3⟧. A resident of ⟦4⟧ is surely contained in it. Beyond the dotted ∪, a familiar ∨ door is waiting."],["∪ を書き下すと ∨ の扉が現れ、左を選べば鍵がそのまま合った。和集合は、∨ の言葉で書かれた区画だった。","Writing out ∪, a ∨ door appears; choose the left, and the key fits as it is. The union was a quarter written in the words of ∨."],["扉には ⟦0⟧。区画の名前の並びが入れ替わっているだけに見える。鍵の ∩ も、扉の ∩ も、どちらも書き下してしまえばいい。","The door reads ⟦0⟧. It looks as if only the order of the quarter names has been swapped. Write out both the ∩ of the key and the ∩ of the door."],["書き下された鍵から二本を取り出し、並びを入れ替えて扉に収めた。最初の階層で、鎖の鍵をほどいたときと同じ手つきだ。","You took two keys out of the written-out key, swapped their order, and fitted them into the door — the same handiwork as when you untied the chained key on the first level."],["街の地図には、⟦0⟧ は ⟦1⟧ の中に、⟦2⟧ は ⟦3⟧ の中にあると記されている。扉は ⟦4⟧。城壁の内側の、さらに内側。⟦5⟧ の住人は、間違いなく ⟦6⟧ の中にいるはずだ。","The town map shows ⟦0⟧ inside ⟦1⟧, and ⟦2⟧ inside ⟦3⟧. The door is ⟦4⟧. Inside the walls, and inside those walls again. A resident of ⟦5⟧ must surely be inside ⟦6⟧."],["⟦0⟧ の住人を一人連れてきて、⟦1⟧、⟦2⟧ の順に当てはめると、⟦3⟧ の門が開いた。包含は、∀ と → の鎖でつながっている。","You brought one resident of ⟦0⟧ and applied ⟦1⟧, then ⟦2⟧, and the gate of ⟦3⟧ opened. Inclusion is linked by a chain of ∀ and →."],["札には ⟦0⟧。扉は ⟦1⟧。⟦2⟧ が ⟦3⟧ に含まれるなら、どちらにも同じ区画 ⟦4⟧ を重ねても、包含は崩れないはずだ。扉の ∩ を書き下すと、二枚の扉に分かれるだろう。","The notice reads ⟦0⟧. The door is ⟦1⟧. If ⟦2⟧ is contained in ⟦3⟧, overlaying the same quarter ⟦4⟧ on both should not break the inclusion. Write out the door's ∩, and it will split into two doors."],["片方の扉には ⟦0⟧ を当てはめ、もう片方には ⟦1⟧ の鍵をそのまま差した。同じものを重ねても、包含は保たれる。","To one door you applied ⟦0⟧; into the other you inserted the key ⟦1⟧ as it was. Overlaying the same thing preserves inclusion."],["街の外れに、城壁の「外側」を表す ᶜ の印の扉があった。⟦0⟧ は「⟦1⟧ は ⟦2⟧ に属さない」という意味だ。扉には ⟦3⟧。⟦4⟧ に属さない者は、⟦5⟧ の外にも、⟦6⟧ の外にもいる――定義をすべて書き下して、確かめてみよう。","On the edge of the town stood a door marked ᶜ, the sign for the \"outside\" of the walls. ⟦0⟧ means \"⟦1⟧ does not belong to ⟦2⟧\". The door reads ⟦3⟧. One who does not belong to ⟦4⟧ is outside ⟦5⟧ and outside ⟦6⟧ too — write out every definition and see."],["書き下された扉は、否定と ∨ と ∧ の組み合わせだった。地下室で覚えた亀裂の技が、ここでも扉を開けた。","Written out, the door was a combination of negation, ∨ and ∧. The crack technique you learned in the cellar opened the door here as well."],["街の最後の城門。番人が告げる。「⟦0⟧ と ⟦1⟧ の両方には属さない者は、⟦2⟧ の外か、⟦3⟧ の外にいる。それを示せ」。扉には ⟦4⟧。ド・モルガンの塔で開いた扉の、集合の姿だ。前の扉とは違い、こちらの向きには、あの術が要る。","The last gate of the town. The guardian announces, \"One who does not belong to both ⟦0⟧ and ⟦1⟧ is outside ⟦2⟧ or outside ⟦3⟧. Show it.\" The door reads ⟦4⟧ — the set version of the door you opened in De Morgan's Tower. Unlike the previous door, this direction needs that art."],["背理の術を重ねて、城門は開いた。集合の言葉も、書き下せば論理の言葉に戻る――番人はそう言って、街の外れから響いてくる金槌の音のほうを指さした。","With the art of reductio cast again and again, the gate opened. The words of sets, too, return to the words of logic once written out — so says the guardian, pointing toward the ring of a hammer echoing from the edge of the town."],["最初の学舎の壁には、順序 ≤ の掟が掲げられている。「⟦0⟧ かつ ⟦1⟧ なら、⟦2⟧」。さらに、⟦3⟧ も ⟦4⟧ も、どの住人と比べても小さくない――どちらも最大の住人だという。扉は ⟦5⟧。最大の者が二人いるなら、その二人は同じ者のはずだ。","On the wall of the first academy hangs the law of the order ≤: \"if ⟦0⟧ and ⟦1⟧, then ⟦2⟧\". Moreover, ⟦3⟧ and ⟦4⟧ are each no smaller than any resident — both, it is said, are the greatest. The door is ⟦5⟧. If there are two greatest ones, they must be the same one."],["⟦0⟧ と ⟦1⟧ を揃えて掟に当てはめると、⟦2⟧ が出てきた。最大の者は、ただ一人だった。","You lined up ⟦0⟧ and ⟦1⟧ and applied the law, and out came ⟦2⟧. The greatest was one and only one."],["次の学舎の掟は二つ。「自分自身より小さい者はいない」「⟦0⟧、⟦1⟧ なら ⟦2⟧」。扉は「⟦3⟧ なら、⟦4⟧ ではない」。もし ⟦5⟧ と ⟦6⟧ が同時に成り立てば、掟によって ⟦7⟧ になってしまう――その矛盾を導けばよい。","The next academy has two laws: \"no one is smaller than oneself\" and \"if ⟦0⟧ and ⟦1⟧, then ⟦2⟧\". The door says \"if ⟦3⟧, then not ⟦4⟧\". If ⟦5⟧ and ⟦6⟧ held at once, the law would give ⟦7⟧ — derive that contradiction."],["⟦0⟧ と ⟦1⟧ をつなぐと ⟦2⟧ が生まれ、一つ目の掟とぶつかった。狭い順序は、向きを逆にできない。","Joining ⟦0⟧ and ⟦1⟧ gave rise to ⟦2⟧, which collided with the first law. A strict order cannot be reversed."],["写像の学舎には、二つの型 ⟦0⟧ と ⟦1⟧ が飾られている。どちらも「違う住人を、違う住人に移す」型――単射だ。扉は、二つを続けて使った ⟦2⟧ も単射であることを求めている。∀ の鍵には、住人だけでなく ⟦3⟧ のような項も当てはめられる。","The academy of maps displays two moulds, ⟦0⟧ and ⟦1⟧. Both are moulds that \"send different residents to different residents\" — injections. The door asks that ⟦2⟧, using the two in succession, is injective too. A ∀ key can take not only residents but also terms such as ⟦3⟧."],["⟦0⟧ の掟に ⟦1⟧ と ⟦2⟧ を当てはめ、次に ⟦3⟧ の掟に ⟦4⟧ と ⟦5⟧ を当てはめた。二つの単射を重ねても、単射のままだった。","You applied ⟦1⟧ and ⟦2⟧ to the law of ⟦0⟧, then ⟦4⟧ and ⟦5⟧ to the law of ⟦3⟧. Two injections stacked together remained an injection."],["写像の学舎の奥の部屋。壁には、単射の掟 ⟦0⟧ が掲げられている――「型 ⟦1⟧ で同じ住人ができるなら、もとの住人も同じ」。扉は、その逆向き「もとの住人が同じなら、型 ⟦2⟧ でできる住人も同じ」も合わせて示せという。逆向きの掟は、等号の工房で手に入れた、あのカードに刻まれていたはずだ。","A back room of the academy of maps. On the wall hangs the law of injectivity ⟦0⟧: \"if the mould ⟦1⟧ makes the same resident, the original residents were the same\". The door asks you to show its converse as well: \"if the original residents are the same, the mould ⟦2⟧ makes the same resident\". That converse law should be engraved on the card you obtained in the Equality Forge."],["左の扉は単射の掟が、右の扉は定理カード「関数の合同」が、そのまま開けた。工房で鍛えたカードが、学者の街で役に立った。","The law of injectivity opened the left door, and the theorem card \"Congruence for functions\" opened the right door, just as they were. A card forged in the workshop proved its worth in the town of scholars."],["隣の学舎には、「どの住人も、型 ⟦0⟧ で作られたものだ」――全射の掟が掲げられている。型 ⟦1⟧ も全射だという。扉は、⟦2⟧ も全射であること。住人 ⟦3⟧ を一人連れてきたら、⟦4⟧ の掟から ⟦5⟧ の素を、⟦6⟧ の掟からさらにその素を、順にたどってみよう。","The neighbouring academy displays the law of surjection: \"every resident is made by the mould ⟦0⟧\". The mould ⟦1⟧, it is said, is surjective too. The door asks that ⟦2⟧ is surjective as well. Once you bring one resident ⟦3⟧, trace back in turn: from the law of ⟦4⟧, the source of ⟦5⟧; from the law of ⟦6⟧, the source of that source."],["⟦0⟧ の素の素を証人に立てると、⟦1⟧ が ⟦2⟧ に等しいことが揃った。存在の鍵から連れてきた誰かが、次の証人になる。","You put forward the source of the source of ⟦0⟧ as the witness, and ⟦1⟧ came out equal to ⟦2⟧. Someone brought from a key of existence becomes the next witness."],["学者の街の最奥、群論の講堂。演壇の番人が、三つの公理を指し示す――結合律、左単位元、左逆元。そして告げる。「⟦0⟧ なら、⟦1⟧ である。左から掛けた ⟦2⟧ を消し去ってみせよ」。この講堂では、等式を両方の向きに使ってよい。","The innermost lecture hall of the scholars' town: the hall of group theory. The guardian on the podium points to three axioms — associativity, left identity, left inverse — and announces, \"If ⟦0⟧, then ⟦1⟧. Make the ⟦2⟧ multiplied on the left vanish.\" In this hall, equations may be used in both directions."],["⟦0⟧ の逆元を左から掛け、結合律で組み替え、単位元を消した。⟦1⟧ と ⟦2⟧ のあいだに立ちはだかっていた ⟦3⟧ は、跡形もなく消え去った。番人は、講堂の奥の工房へあなたを案内した。","You multiplied by the inverse of ⟦0⟧ on the left, regrouped by associativity, and removed the identity. The ⟦3⟧ that stood between ⟦1⟧ and ⟦2⟧ vanished without a trace. The guardian led you to the workshop behind the lecture hall."],["作業台の札には、⟦0⟧ から ⟦1⟧、⟦2⟧ から ⟦3⟧、⟦4⟧ から ⟦5⟧、⟦6⟧ から ⟦7⟧ へと続く四本の掟。そして住人 ⟦8⟧、⟦9⟧、⟦10⟧ はどれも ⟦11⟧ だという。扉は ⟦12⟧。同じ鎖を三度たどるのは骨が折れる。「⟦13⟧ ならば ⟦14⟧」という道具を、先に一つ作ってしまおう。","The notice on the workbench lists four laws in a chain: from ⟦0⟧ to ⟦1⟧, from ⟦2⟧ to ⟦3⟧, from ⟦4⟧ to ⟦5⟧, from ⟦6⟧ to ⟦7⟧. And the residents ⟦8⟧, ⟦9⟧, ⟦10⟧ are all ⟦11⟧, it says. The door is ⟦12⟧. Following the same chain three times is hard work. Make one tool first: \"if ⟦13⟧ then ⟦14⟧\"."],["一度作った道具 ⟦0⟧ を、⟦1⟧、⟦2⟧、⟦3⟧ に順に当てはめるだけで、三枚の扉が開いた。補題は、繰り返しを一度にまとめる。","Just by applying the tool ⟦0⟧, made once, to ⟦1⟧, ⟦2⟧, ⟦3⟧ in turn, three doors opened. A lemma gathers repetition into one."],["講堂で開けた左からの消去の扉を、今度は道具として鍛え直す。特定の ⟦0⟧、⟦1⟧、⟦2⟧ についてではなく、すべての住人について――⟦3⟧ を示せば、定理カード「左消去律」が手に入る。","Now reforge as a tool the door of left cancellation you opened in the lecture hall. Not for particular ⟦0⟧, ⟦1⟧, ⟦2⟧, but for every resident — show ⟦3⟧, and you obtain the theorem card \"Left cancellation\"."],["すべての住人について消去律が鍛え上がり、新しい定理カードが光を帯びた。一度示した定理は、もう示し直す必要がない。","The cancellation law was forged for every resident, and the new theorem card began to glow. A theorem once shown never needs to be shown again."],["工房の主が、最後の課題を出す。「群の掟は、⟦0⟧ を左から掛けても変わらない、としか言っていない。だが実は、右から掛けても変わらないのだ。それを示せ」。扉は ⟦1⟧。鍛えたばかりの左消去律のカードが、ここで生きるはずだ。","The master of the workshop sets the final task: \"The laws of a group only say that multiplying by ⟦0⟧ on the left changes nothing. But in fact, multiplying on the right changes nothing either. Show it.\" The door is ⟦1⟧. The left cancellation card you have just forged should come into its own here."],["⟦0⟧ の逆元を左から掛けた二つの式を、左消去律がつないだ。⟦1⟧ は、右からも単位元だった。工房の主は道具箱を閉じ、さらに深い階層――数の塔への階段を示した。","Left cancellation joined the two expressions, each multiplied on the left by the inverse of ⟦0⟧. ⟦1⟧ was an identity from the right as well. The master closes the toolbox and shows you the stairs to a deeper level — the tower of numbers."],["一階の扉には ⟦0⟧。つまり 1+1=2 だ。誰もが知っている事実だが、この塔では、入口の二つの掟だけを使って示さねばならない。掟を当てはめるたびに、式は少しずつ形を変えていく。","The door on the ground floor reads ⟦0⟧ — that is, 1+1=2. Everyone knows this, but in this tower it must be shown using only the two laws at the entrance. Each time you apply a law, the formula changes shape little by little."],["二つ目の掟で ⟦0⟧ を ⟦1⟧ に、一つ目の掟で ⟦2⟧ に。掟だけで、1+1 は確かに 2 になった。","By the second law ⟦0⟧ became ⟦1⟧, and by the first law ⟦2⟧. With the laws alone, 1+1 did indeed become 2."],["次の扉は ⟦0⟧。掟は「⟦1⟧」と言うが、「⟦2⟧」とは言っていない。塔のすべての階で成り立つことを、どう示せばいいのか。塔の守り人が教えてくれた――「一階で成り立ち、どの階からも次の階へ受け継がれるなら、それは塔のすべての階で成り立つ」。帰納法の扉だ。","The next door is ⟦0⟧. The law says \"⟦1⟧\", but not \"⟦2⟧\". How can you show that something holds on every floor of the tower? The tower's keeper told you: \"If it holds on the ground floor, and passes from every floor to the next, then it holds on every floor of the tower.\" The door of induction."],["一階では掟がそのまま成り立ち、⟦0⟧ の階で成り立つなら ⟦1⟧ の階でも成り立った。こうして ⟦2⟧ は、塔の頂まで届いた。定理カード「0 を左から足す」が手に入る。","On the ground floor the law held as it was, and if it held on the floor of ⟦0⟧, it held on the floor of ⟦1⟧ too. So ⟦2⟧ reached the top of the tower. You obtain the theorem card \"Adding 0 on the left\"."],["扉は ⟦0⟧。掟の二つ目は、右側の ⟦1⟧ を外へ出す掟だった。今度は、左側の ⟦2⟧ を外へ出せというのだ。⟦3⟧ を一人の住人 ⟦4⟧ に決めてから、⟦5⟧ についての帰納法で塔を上っていこう。","The door is ⟦0⟧. The second law was a law that moves the ⟦1⟧ on the right outward. Now you are asked to move the ⟦2⟧ on the left outward. Fix ⟦3⟧ as one resident ⟦4⟧, then climb the tower by induction on ⟦5⟧."],["一階でも、どの階から次の階へ上るときも、左の ⟦0⟧ は外へ出られた。定理カード「後者を外に出す」が手に入る。","On the ground floor, and whenever you climbed from any floor to the next, the ⟦0⟧ on the left could move outward. You obtain the theorem card \"Moving the successor out\"."],["塔の中層の踊り場で、守り人が待っていた。「⟦0⟧ と ⟦1⟧ は同じ数だ。それを、すべての数について示せ」。⟦2⟧ についての帰納法の扉。一階の出発点には「0 を左から足す」のカードが、次の階への階段には「後者を外に出す」のカードが、ちょうど合うはずだ。","On a landing halfway up the tower, the keeper was waiting. \"⟦0⟧ and ⟦1⟧ are the same number. Show it for every number.\" A door of induction on ⟦2⟧. The card \"Adding 0 on the left\" should fit the starting point on the ground floor exactly, and the card \"Moving the successor out\" the stairs to the next floor."],["二枚のカードが出発点と階段を支え、交換法則は塔のすべての階に届いた。守り人は新しいカード「足し算の交換法則」を授け、さらに上の階を指さした。","The two cards supported the starting point and the stairs, and commutativity reached every floor of the tower. The keeper grants you a new card, \"Commutativity of addition\", and points to the floors further up."],["最初の扉は ⟦0⟧。1 を掛けても数は変わらない、ということだ。掛け算の掟の二つ目を当てはめると ⟦1⟧、さらに一つ目で ⟦2⟧。その先に、足し算の階で鍛えたカードが待っている。","The first door is ⟦0⟧ — multiplying by 1 does not change a number. Apply the second law of multiplication and you get ⟦1⟧; then the first gives ⟦2⟧. Beyond that, a card forged on the floors of addition awaits."],["⟦0⟧ は ⟦1⟧ に、⟦2⟧ に、そしてカードで ⟦3⟧ に戻った。1 を掛けることは、何もしないのと同じだった。","⟦0⟧ became ⟦1⟧, then ⟦2⟧, and with the card returned to ⟦3⟧. Multiplying by 1 was the same as doing nothing."],["扉は ⟦0⟧。掟は「⟦1⟧」と言うだけだ。0 を左から掛けても 0 になることは、またしても帰納法で塔を上って示さねばならない。","The door is ⟦0⟧. The law only says \"⟦1⟧\". That multiplying by 0 on the left also gives 0 must once again be shown by climbing the tower with induction."],["一階では掟のまま 0、次の階へは 0 を足しても変わらない。定理カード「0 を左から掛ける」が手に入る。","On the ground floor it is 0 by the law, and adding 0 on the way to the next floor changes nothing. You obtain the theorem card \"Multiplying by 0 on the left\"."],["ここで一度、足し算に立ち返る。扉は ⟦0⟧。足す順番の括り方を変えても、結果は同じ――それを ⟦1⟧ についての帰納法で示す。式が長くなるので、書き換えのたびに、どの項がどこへ移るかを見失わないように。","Here you turn back to addition for a moment. The door is ⟦0⟧. However the sums are grouped, the result is the same — show it by induction on ⟦1⟧. The formulas get long, so do not lose track of which term moves where at each rewrite."],["次の階へ上るたびに、二つ目の掟が ⟦0⟧ を外へ運び、括り方の違いは消えた。定理カード「足し算の結合法則」が手に入る。","Each time you climbed to the next floor, the second law carried ⟦0⟧ outward, and the difference in grouping disappeared. You obtain the theorem card \"Associativity of addition\"."],["掛け算の階の頂で、守り人が問う。「⟦0⟧ と ⟦1⟧ は等しい。足し算と掛け算の掟をすべて使い、それを示せ」。⟦2⟧ についての帰納法の扉。最後の仕上げには、鍛えたばかりの結合法則のカードが要る。","At the top of the floors of multiplication, the keeper asks: \"⟦0⟧ and ⟦1⟧ are equal. Show it, using every law of addition and multiplication.\" A door of induction on ⟦2⟧. The finishing touch needs the associativity card you have just forged."],["掛け算が足し算の上に分配され、結合法則のカードが最後の括弧を組み替えた。守り人は「分配法則」のカードを授け、塔の上層への扉を開いた。","Multiplication distributed over addition, and the associativity card regrouped the last brackets. The keeper grants you the card \"Distributivity\" and opens the door to the upper levels of the tower."],["一本目の巻物の題は「掛け算の結合法則」。扉は ⟦0⟧。⟦1⟧ についての帰納法で示すが、次の階へ上る階段の最後で、分配法則のカードが必要になるはずだ。","The first scroll is titled \"Associativity of Multiplication\". The door is ⟦0⟧. You show it by induction on ⟦1⟧, but at the end of the stairs to the next floor, the distributivity card should be needed."],["分配法則のカードが、次の階への最後の一段をつないだ。破り取られていた頁が埋まり、定理カード「掛け算の結合法則」が手に入る。","The distributivity card bridged the last step to the next floor. The torn-out page is filled in, and you obtain the theorem card \"Associativity of multiplication\"."],["二本目の巻物には、⟦0⟧ と記されている。交換法則へ向かう前の、準備の一歩だ。この階層で最も長い計算になる。足し算の結合法則と交換法則、二枚のカードを手元に置き、⟦1⟧ についての帰納法で上っていこう。","The second scroll records ⟦0⟧ — a preparatory step before heading for commutativity. It will be the longest calculation on this level. Keep two cards at hand, associativity and commutativity of addition, and climb by induction on ⟦1⟧."],["長い書き換えの果てに、二枚のカードが項を正しい位置へ運んだ。定理カード「後者を左から掛ける」が手に入る。","At the end of a long rewriting, the two cards carried the terms to their proper places. You obtain the theorem card \"Successor on the left of a product\"."],["三本目の巻物の題は「掛け算の交換法則」。⟦0⟧ と ⟦1⟧ は同じ数だ――足し算の交換法則を示したときのことを、思い出そう。出発点には「0 を左から掛ける」、次の階への階段には「後者を左から掛ける」。二枚のカードが、あのときと同じ役目を果たすはずだ。","The third scroll is titled \"Commutativity of Multiplication\". ⟦0⟧ and ⟦1⟧ are the same number — remember when you showed commutativity of addition. \"Multiplying by 0 on the left\" for the starting point, \"Successor on the left of a product\" for the stairs to the next floor: the two cards should play the same roles as then."],["二枚のカードが出発点と階段を支え、掛け算の交換法則は塔のすべての階に届いた。破り取られていた頁が埋まり、定理カード「掛け算の交換法則」が手に入る。","The two cards supported the starting point and the stairs, and commutativity of multiplication reached every floor of the tower. The torn-out page is filled in, and you obtain the theorem card \"Commutativity of multiplication\"."],["書庫の最奥、最後の巻物を守る番人が言う。「⟦0⟧ と ⟦1⟧ は同じ数だ。もう帰納法は要らぬ。これまでに鍛えた法則だけで示してみよ」。巻物の最後の頁には、結合法則と交換法則、二枚のカードの絵が描かれている。","In the depths of the library, the guardian of the last scroll says, \"⟦0⟧ and ⟦1⟧ are the same number. You need induction no longer. Show it with the laws you have forged so far.\" On the last page of the scroll are pictures of two cards: associativity and commutativity."],["結合法則で括弧を付け替え、交換法則で順番を入れ替え、もう一度結合法則で括弧を戻す。足し算と掛け算の法則は、自由に組み合わせて使える道具になった。番人は、塔の最上層にある測量の間への階段を示した。","Regroup the brackets by associativity, swap the order by commutativity, and regroup the brackets back by associativity again. The laws of addition and multiplication have become tools you can combine freely. The guardian shows you the stairs to the surveying hall at the very top of the tower."],["最初の扉は ⟦0⟧。0 はどの数よりも大きくない、ということだ。≤ を書き下せば、「0 に何かを足して ⟦1⟧ にせよ」という扉になる。何を足せばいいかは、すぐに分かるだろう。","The first door is ⟦0⟧ — 0 is not bigger than any number. Write out ≤ and the door becomes \"add something to 0 to make ⟦1⟧\". What to add, you will see at once."],["0 に ⟦0⟧ そのものを足せば、カード「0 を左から足す」で ⟦1⟧ になった。0 は、すべての数の出発点だ。","Add ⟦0⟧ itself to 0, and with the card \"Adding 0 on the left\" it became ⟦1⟧. 0 is the starting point of every number."],["扉は ⟦0⟧。自分自身に何を足せば、自分自身になるだろうか。","The door is ⟦0⟧. What can you add to yourself to get yourself back?"],["0 を足せば、掟のとおり ⟦0⟧ のままだった。どの数も、自分自身以下である。","Add 0, and by the law it stayed ⟦0⟧. Every number is less than or equal to itself."],["扉は ⟦0⟧。⟦1⟧ に何かを足して、⟦2⟧ の次の数にせよ、という。証人には、住人だけでなく ⟦3⟧ のような項も選べる。","The door is ⟦0⟧: add something to ⟦1⟧ to make the number after ⟦2⟧. As the witness you can choose not only residents but also terms such as ⟦3⟧."],["⟦0⟧ に ⟦1⟧ を足すと、掟によって ⟦2⟧、そして ⟦3⟧ になった。次の数は、確かに大きい。","Adding ⟦1⟧ to ⟦0⟧ gave ⟦2⟧ by the law, and then ⟦3⟧. The next number is indeed bigger."],["扉は ⟦0⟧。⟦1⟧ と ⟦2⟧ の差を ⟦3⟧ とすれば、⟦4⟧ だ。では、⟦5⟧ と ⟦6⟧ の差は何だろうか。∃ の鍵から差 ⟦7⟧ を連れてきて、確かめてみよう。","The door is ⟦0⟧. If the difference between ⟦1⟧ and ⟦2⟧ is ⟦3⟧, then ⟦4⟧. Then what is the difference between ⟦5⟧ and ⟦6⟧? Bring the difference ⟦7⟧ from the ∃ key and find out."],["⟦0⟧ と ⟦1⟧ の差も、やはり ⟦2⟧ だった。カード「後者を外に出す」が、それを示した。次の数へ進んでも、大小の関係は変わらない。","The difference between ⟦0⟧ and ⟦1⟧ was ⟦2⟧ as well. The card \"Moving the successor out\" showed it. Moving on to the next number does not change which is bigger."],["測量の間の中央で、番人が問う。「⟦0⟧、⟦1⟧ ならば ⟦2⟧。それを示せ」。⟦3⟧ から ⟦4⟧ への差 ⟦5⟧ と、⟦6⟧ から ⟦7⟧ への差 ⟦8⟧。二つの差を、どうつなげばよいだろうか。選ぶ欄の下の入力欄には、⟦9⟧ のような項も書き込める。","In the middle of the surveying hall, the guardian asks: \"If ⟦0⟧ and ⟦1⟧, then ⟦2⟧. Show it.\" The difference ⟦5⟧ from ⟦3⟧ to ⟦4⟧, and the difference ⟦8⟧ from ⟦6⟧ to ⟦7⟧. How should the two differences be joined? In the input box below the picker, you can also write a term such as ⟦9⟧."],["⟦0⟧ と ⟦1⟧ を足した ⟦2⟧ を証人に立てると、結合法則のカードが式を整え、扉は開いた。塔の頂から見下ろす景色の先に、最後の広間――公理の鏡が見えた。","You put forward ⟦2⟧, the sum of ⟦0⟧ and ⟦1⟧, as the witness; the associativity card tidied the formula, and the door opened. Beyond the view from the top of the tower, the last hall came into sight — the Mirror of Axioms."],["最初の鏡には、半順序の掟――反射律、反対称律、推移律――が映っている。扉は「どの二人も比べられる」。掟を満たしながら、比べられない二人がいる模型の街を作れるだろうか。","The first mirror reflects the laws of a partial order — reflexivity, antisymmetry, transitivity. The door says \"any two can be compared\". Can you build a model town that keeps the laws yet has two who cannot be compared?"],["自分自身とだけ比べられる二人の住人。掟はすべて守られているのに、二人は互いに比べられなかった。半順序の掟は、全順序までは約束しない。","Two residents, each comparable only with themselves. All the laws are kept, yet the two could not be compared with each other. The laws of a partial order do not promise a total order."],["次の鏡には、反射律と推移律だけが映っている。反対称律――「互いに ≤ なら同じ者」――は、そこにはない。掟が一つ欠けると、何が起こるだろうか。","The next mirror reflects only reflexivity and transitivity. Antisymmetry — \"if each is ≤ the other, they are the same\" — is not there. What happens when one law is missing?"],["別々の二人が、互いに ≤ の関係にある模型。反射律と推移律は守られているのに、二人は同じ者ではなかった。","A model where two different residents are each ≤ the other. Reflexivity and transitivity are kept, yet the two were not the same."],["三枚目の鏡に、住人 ⟦0⟧ が映っている。⟦1⟧ より大きい者は、誰もいない――⟦2⟧ は極大だ。では、⟦3⟧ はすべての住人以上、つまり最大と言えるだろうか。⟦4⟧ がどの住人を表すかも、模型の中で決めることになる。","The third mirror reflects a resident, ⟦0⟧. No one is bigger than ⟦1⟧ — ⟦2⟧ is maximal. Then can ⟦3⟧ be said to be at least every resident, that is, the greatest? Which resident ⟦4⟧ stands for is also decided inside the model."],["⟦0⟧ と比べられない住人が一人いる模型で、⟦1⟧ は極大のまま、最大ではなかった。極大と最大は、似て非なるものだ。","In a model with one resident who cannot be compared with ⟦0⟧, ⟦1⟧ remained maximal but was not the greatest. Maximal and greatest are alike, but not the same."],["群の鏡が現れた。だが、そこに映る掟は結合律と左単位元だけで、左逆元の掟が欠けている。補題の工房では、三つの掟から右単位元を鍛え上げた。左逆元がなくても、同じことが言えるだろうか。積の表と、⟦0⟧ がどの住人かを決めて、確かめてみよう。","A mirror of groups appears. But the laws it reflects are only associativity and the left identity; the law of left inverses is missing. In the Lemma Workshop you forged the right identity from three laws. Can the same be said without left inverses? Decide the multiplication table and which resident ⟦0⟧ is, and see."],["「積はいつも右側の住人」という模型で、⟦0⟧ は左からは単位元なのに、右からは単位元にならなかった。工房で鍛えた定理には、左逆元の掟が欠かせなかったのだ。","In the model where \"the product is always the right-hand resident\", ⟦0⟧ was an identity from the left but not from the right. The theorem forged in the workshop could not do without the law of left inverses."],["次の鏡には、二つの左単位元 ⟦0⟧ と ⟦1⟧ が映っている。等号の工房では、左の単位元と右の単位元が一致することを示した。では、二つとも左の単位元のときは、どうだろうか。","The next mirror reflects two left identities, ⟦0⟧ and ⟦1⟧. In the Equality Forge you showed that a left identity and a right identity coincide. But what if both are left identities?"],["同じ「積はいつも右側の住人」の模型で、⟦0⟧ と ⟦1⟧ を別々の住人に置いても、どちらも左単位元だった。二つの左単位元は、一致するとは限らない。","In the same model where \"the product is always the right-hand resident\", even with ⟦0⟧ and ⟦1⟧ placed on different residents, both were left identities. Two left identities need not coincide."],["モノイドの鏡――結合律と、左右の単位元の掟が映っている。扉は ⟦0⟧、掛ける順番を入れ替えても同じ、という可換律だ。住人三人で、それが崩れる模型を作れるはずだ。","The mirror of monoids reflects associativity and the law of a two-sided identity. The door is ⟦0⟧ — commutativity, the same whichever order you multiply in. With three residents, you should be able to build a model where it breaks."],["単位元以外の二人のあいだでは「積はいつも右側の住人」とした模型で、掛ける順番を入れ替えると、結果が違う住人になった。モノイドの掟は、可換律を約束しない。","In a model where, between the two non-identity residents, \"the product is always the right-hand resident\", swapping the order of multiplication gave a different resident. The laws of a monoid do not promise commutativity."],["群の掟がすべて映った鏡。扉は「どの元も、2 乗すると単位元」。広間の片隅には、よく知られた群の模型が棚に並んでいる――既製の構造だ。いくつか手に取って、扉が偽となる群を探してみよう。","A mirror reflecting all the laws of a group. The door says \"every element squares to the identity\". In a corner of the hall, models of well-known groups stand on a shelf — preset structures. Pick up a few and look for a group in which the door is false."],["三人の巡回群 ℤ/3 では、単位元以外の元を 2 乗しても、単位元には戻らなかった。群の掟は、そこまでは約束しない。","In the cyclic group ℤ/3 of three residents, squaring an element other than the identity did not return to the identity. The laws of a group do not promise that much."],["同じ群の鏡に、今度は可換律の扉が映る。掛ける順番を入れ替えても同じ――そうでない群は、最小でも六人の住人を必要とする。六かける六の積の表を手で埋めるのは大変だ。棚の模型の中に、ちょうどよいものがあるはずだ。","In the same mirror of groups, the door of commutativity now appears — the same whichever order you multiply in. A group where this fails needs at least six residents. Filling a six-by-six multiplication table by hand is hard work. Among the models on the shelf, there should be just the right one."],["三次対称群 S₃――三つのものの並べ替えの群――で、掛ける順番を入れ替えると結果が変わった。群の掟は、可換律を約束しない。","In the symmetric group S₃ — the group of rearrangements of three things — swapping the order of multiplication changed the result. The laws of a group do not promise commutativity."],["数の塔の鏡には、足し算の二つの掟だけが映っている。帰納法の掟は、そこにはない。塔では帰納法で ⟦0⟧ を示した。帰納法がなければ、それは示せるだろうか。0 から階段をいくら上っても届かない、余分な住人のいる模型を作ってみよう。","The mirror of the tower of numbers reflects only the two laws of addition. The law of induction is not there. In the tower you showed ⟦0⟧ by induction. Without induction, can it be shown? Build a model with an extra resident that can never be reached, however far you climb the stairs from 0."],["0 から ⟦0⟧ をたどっても決して届かない住人 2 がいる模型で、0+2 は 2 にならなかった。帰納法の掟は、こうした余分な住人を締め出すためにあったのだ。","In a model with resident 2, never reached by following ⟦0⟧ from 0, 0+2 did not become 2. The law of induction existed to shut out such extra residents."],["広間の最奥、最後の鏡の前に、旅の途中で出会った番人たちが並んでいる。鏡に映るのは狭い順序の掟――「自分より小さい者はいない」と推移律。番人たちが三枚の扉を示す。「証明できる扉は開け、証明できない扉は模型で暴け。これが、おまえの最後の鑑定だ」。","In the depths of the hall, before the last mirror, the guardians you met along the way stand in a row. The mirror reflects the laws of a strict order — \"no one is smaller than oneself\" and transitivity. The guardians show three doors. \"Open the doors that can be proved, and expose with models the doors that cannot. This is your final judgment.\""],["三枚の扉を見極めると、最後の鏡が静かに光を放った。鍵を組み合わせて扉を開くことも、模型を作って偽りを暴くことも、あなたはすべて身につけた。迷宮の出口の扉が、ゆっくりと開いていく――。","When you have judged the three doors, the last mirror gives off a quiet light. Opening doors by combining keys, exposing falsehoods by building models — you have mastered them all. The exit door of the labyrinth slowly begins to open—."],["目標：それぞれの扉が、術で開く本物か、模型の街（構造）が偽りを暴く扉かを見極めよ。","Goal: for each door, decide whether it is genuine (opens with the spell) or one whose falsehood a model town (structure) exposes."],["目標：それぞれの扉が、術で開く本物か、鏡が偽りを暴く扉かを見極めよ。","Goal: for each door, decide whether it is genuine (opens with the spell) or one whose falsehood a mirror exposes."],["目標：それぞれの扉が、術なしで開く扉か、術なしでは決して開かない魔法の扉かを見極めよ。","Goal: for each door, decide whether it opens without the art or is a magic door that never opens without the art."],["手元の掟（鍵）","the laws at hand (keys)"],["鍵 ⟦0⟧ ","keys ⟦0⟧"],["模型の街（構造）","a model town (structure)"],["鏡（真理値の割り当て）","a mirror (truth assignment)"],["時の塔（Kripke 模型）","the tower of time (Kripke model)"],["目標：⟦0⟧扉 ⟦1⟧ は開けられないことを、⟦2⟧で示せ。","Goal: ⟦0⟧show with ⟦2⟧ that door ⟦1⟧ cannot be opened."],["⟦0⟧があっても、","even with ⟦0⟧, "],["目標：⟦0⟧扉 ⟦1⟧ を開けよ。","Goal: ⟦0⟧open door ⟦1⟧."],["⟦0⟧を使って、","using ⟦0⟧, "],["何も持たずに、","with nothing in hand, "],["<p class=\"w-note extra-note\">隠し層：クリアしなくても、次の層に進めます。</p>","<p class=\"w-note extra-note\">Hidden Level: you can go on to the next level without clearing it.</p>"],["⟦0⟧「⟦1⟧」のボスのステージをクリアすると、この層に入れます（制限なしモードなら、すぐに入れます）。","Clear the boss stage of ⟦0⟧ \"⟦1⟧\" to enter this level (in unrestricted mode you can enter right away)."],["\n  <section class=\"hero\">\n    <h1>自然演繹の迷宮</h1>\n    <div class=\"demo f\"><i class=\"at\">Γ</i><span class=\"turn\">⊢</span><i class=\"at\">A</i></div>\n    <p>手持ちの鍵 <span class=\"f\"><i class=\"at\">Γ</i></span>（仮定）を使って、扉 <span class=\"f\"><i class=\"at\">A</i></span>（証明目標）を開けます。扉を分け、部屋に入り、鍵を組み合わせて、すべての扉を開ければ脱出成功。脱出すると、あなたの攻略手順が自然演繹の証明木として表示されます。</p>\n    <div class=\"hero-actions\">\n      <button class=\"btn primary\" type=\"button\" data-stage=\"⟦0⟧\">⟦1⟧</button>\n      <button class=\"btn tut-btn⟦2⟧\" type=\"button\" data-cmd=\"help\">遊び方⟦3⟧</button>\n      <span class=\"progress\">クリア ⟦4⟧ / ⟦5⟧</span>\n      <button type=\"button\" class=\"toggle story-toggle\" data-cmd=\"story\" aria-pressed=\"⟦6⟧\" title=\"層やステージの説明を、物語仕立てにする\"><span class=\"sw-track\"><span class=\"sw-knob\"></span></span>ストーリー</button>\n      ⟦7⟧\n    </div>\n  </section>","\n  <section class=\"hero\">\n    <h1>The Labyrinth of Natural Deduction</h1>\n    <div class=\"demo f\"><i class=\"at\">Γ</i><span class=\"turn\">⊢</span><i class=\"at\">A</i></div>\n    <p>Use the keys <span class=\"f\"><i class=\"at\">Γ</i></span> in your hand (the assumptions) to open the door <span class=\"f\"><i class=\"at\">A</i></span> (the goal). Split doors, enter rooms, combine keys, and open every door to escape. When you escape, your moves are shown as a natural deduction proof tree.</p>\n    <div class=\"hero-actions\">\n      <button class=\"btn primary\" type=\"button\" data-stage=\"⟦0⟧\">⟦1⟧</button>\n      <button class=\"btn tut-btn⟦2⟧\" type=\"button\" data-cmd=\"help\">How to play⟦3⟧</button>\n      <span class=\"progress\">Cleared ⟦4⟧ / ⟦5⟧</span>\n      <button type=\"button\" class=\"toggle story-toggle\" data-cmd=\"story\" aria-pressed=\"⟦6⟧\" title=\"Tell the level and stage descriptions as a story\"><span class=\"sw-track\"><span class=\"sw-knob\"></span></span>Story</button>\n      ⟦7⟧\n    </div>\n  </section>"],["続きから（⟦0⟧）","Continue (⟦0⟧)"],["はじめる","Start"],["<span class=\"progress\">手に入れた定理カード：⟦0⟧</span>","<span class=\"progress\">Theorem cards obtained: ⟦0⟧</span>"],["\n  <section class=\"world⟦0⟧⟦1⟧\">\n    <div class=\"world-head\"><span class=\"wn\">⟦2⟧</span><h2>⟦3⟧</h2><span class=\"wr\">学ぶ規則：⟦4⟧</span></div>⟦5⟧⟦6⟧\n    <div class=\"tiles\">⟦7⟧\n    </div>\n  </section>","\n  <section class=\"world⟦0⟧⟦1⟧\">\n    <div class=\"world-head\"><span class=\"wn\">⟦2⟧</span><h2>⟦3⟧</h2><span class=\"wr\">Rules: ⟦4⟧</span></div>⟦5⟧⟦6⟧\n    <div class=\"tiles\">⟦7⟧\n    </div>\n  </section>"],["\n      <button class=\"tile⟦0⟧⟦1⟧⟦2⟧\" type=\"button\" data-stage=\"⟦3⟧\" aria-label=\"⟦4⟧ ⟦5⟧（⟦6⟧）\">\n        <span class=\"tile-win\" aria-hidden=\"true\"></span><span class=\"tile-top\"><span class=\"tile-id\">⟦7⟧</span><span class=\"tile-name\">⟦8⟧</span>⟦9⟧</span>\n        <span class=\"tile-seq\">⟦10⟧</span>\n        <span class=\"tile-status\">⟦11⟧</span>\n      </button>","\n      <button class=\"tile⟦0⟧⟦1⟧⟦2⟧\" type=\"button\" data-stage=\"⟦3⟧\" aria-label=\"⟦4⟧ ⟦5⟧ (⟦6⟧)\">\n        <span class=\"tile-win\" aria-hidden=\"true\"></span><span class=\"tile-top\"><span class=\"tile-id\">⟦7⟧</span><span class=\"tile-name\">⟦8⟧</span>⟦9⟧</span>\n        <span class=\"tile-seq\">⟦10⟧</span>\n        <span class=\"tile-status\">⟦11⟧</span>\n      </button>"],["クリア済み","cleared"],["<span class=\"tile-boss\">ボス</span>","<span class=\"tile-boss\">Boss</span>"],["クリア：","Cleared: "],["⟦0⟧ つの扉を鑑定する","Judge ⟦0⟧ doors"],["反例を作る","Make a counterexample"],["目安 ⟦0⟧ ⟦1⟧","Par ⟦0⟧ ⟦1⟧"],["<section class=\"reset-zone\"><button type=\"button\" class=\"btn small danger-line\" data-cmd=\"resetAsk\">進行度をリセット</button></section>","<section class=\"reset-zone\"><button type=\"button\" class=\"btn small danger-line\" data-cmd=\"resetAsk\">Reset progress</button></section>"],["<button type=\"button\" class=\"toggle unlock-toggle\" data-cmd=\"unlockall\" aria-pressed=\"⟦0⟧\" title=\"すべての層を、前の層をクリアしなくてもプレイできるようにする\"><span class=\"sw-track\"><span class=\"sw-knob\"></span></span>制限なしモード</button>","<button type=\"button\" class=\"toggle unlock-toggle\" data-cmd=\"unlockall\" aria-pressed=\"⟦0⟧\" title=\"Make every level playable without clearing the previous level\"><span class=\"sw-track\"><span class=\"sw-knob\"></span></span>Unrestricted mode</button>"],["まず、これを証明します","First, this is what you prove"],["この式を<b>シーケント</b>と呼びます。<span class=\"turn\">⊢</span> の左⟦0⟧が最初から使える<b>仮定</b>、右（⟦1⟧）が示したい<b>結論</b>です。仮定から結論を導くことが、この部屋の目標です。","This line is called a <b>sequent</b>. To the left of <span class=\"turn\">⊢</span> ⟦0⟧ are the <b>assumptions</b> you can use from the start; to the right (⟦1⟧) is the <b>conclusion</b> you want to show. Your goal in this room is to derive the conclusion from the assumptions."],["（⟦0⟧）"," (⟦0⟧)"],["（ここでは何もない）"," (nothing here)"],["仮定は「鍵」","Assumptions are \"keys\""],["⊢ の左の ⟦0⟧ は、入口の広間に<b>鍵</b>として置かれています。","⟦0⟧, to the left of ⊢, are placed in the entrance hall as <b>keys</b>."],["この問題には、最初から持っている鍵がありません。扉の記号を使って、鍵を手に入れていきます。","This problem has no keys to start with. You will obtain keys by using the symbols on the door."],["結論は「扉」","The conclusion is the \"door\""],["⊢ の右の ⟦0⟧ が、<b>開けるべき扉</b>です。扉の色の付いた記号をタップしたり、鍵を扉へドラッグしたりして、すべての扉を開ければクリアです。","⟦0⟧, to the right of ⊢, is the <b>door to open</b>. Tap the colored symbols on the door or drag keys onto the door; open every door to clear the stage."],["証明図が組み上がる","The proof tree grows"],["操作するたびに、ここに自然演繹の<b>証明図</b>が組み上がっていきます。マウスを重ねると、操作する前に変化の見本が出ます。","Each move builds a natural deduction <b>proof tree</b> here. Hover over a symbol to preview the change before you make it."],["全体地図","Full map"],["このスイッチで、証明全体の部屋と扉を一度に見る「全体地図」と、いまの部屋だけを見る表示を切り替えられます。","This switch toggles between the \"full map\", which shows every room and door of the proof at once, and a view of the current room only."],["困ったら","If you get stuck"],["画面の見方や操作の説明は「遊び方」に、操作の動きは「チュートリアル」にあります。","\"How to play\" explains the screen and the moves; \"Tutorial\" shows them in action."],["鍵の ∧","∧ of a key"],["鍵の <b>∧</b> をタップすると、中身の二つの鍵を取り出せます（∧E）。取り出した鍵は点線の枠で表示されます。","Tap the <b>∧</b> of a key to take out the two keys inside (∧E). Keys taken out are shown with a dotted frame."],["手元の部品","Parts at hand"],["取り出した鍵の作り方は、証明図の下に「手元の部品」として表示されます。その鍵で扉を開けると、部品が証明図につながります。","How a key taken out was made appears below the proof tree as \"parts at hand\". When you open a door with that key, the part is attached to the proof tree."],["扉の →","→ of a door"],["扉の <b>→</b> をタップすると、→ の左を鍵として持って<b>新しい部屋</b>に入り、扉は → の右になります（→I）。部屋の鍵は、その部屋の中だけで使えます。","Tap the <b>→</b> of a door to enter a <b>new room</b> holding the left side of → as a key; the door becomes the right side of → (→I). Keys of a room can be used only inside that room."],["鍵穴のある鍵","A key with a keyhole"],["鍵 A→B は鍵穴のある鍵です。鍵 A をこの鍵へドラッグすると鍵 B が手に入り、この鍵を扉 B へドラッグすると扉が A に変わります（→E）。","Key A→B is a key with a keyhole. Drag key A onto it to get key B; drag it onto door B to turn the door into A (→E)."],["部屋は範囲","Rooms are scopes"],["この問題では部屋がいくつもできます。部屋に入ったら、部屋の名前（「範囲を見る」）をタップしてみましょう。その部屋の鍵が使える範囲が、証明図に同じ色で示されます。","In this problem several rooms appear. Once inside a room, tap its name (\"show scope\"): the part of the proof tree where the room's keys can be used is shown in the same color."],["扉の ∨","∨ of a door"],["扉の <b>∨</b> をタップすると、左右どちらを示すかを選びます（∨I）。元に戻らない選択なので、選ぶ前に、示せる側かどうかよく考えましょう。","Tap the <b>∨</b> of a door to choose which side to show (∨I). It cannot be undone, so think about which side can actually be shown before choosing."],["鍵の ∨","∨ of a key"],["鍵の <b>∨</b> をタップすると、「左の場合」と「右の場合」の二つの<b>世界</b>に分かれます（∨E）。両方の世界で扉を開ければ、元の扉が開きます。","Tap the <b>∨</b> of a key to split into two <b>worlds</b>: \"the left case\" and \"the right case\" (∨E). Open the door in both worlds, and the original door opens."],["矛盾 ⊥","Contradiction ⊥"],["⊥ は矛盾を表します。鍵 A と鍵 A→⊥ を組み合わせると ⊥ の鍵ができ、⊥ の鍵はどの扉にも差し込めます（⊥E）。","⊥ stands for a contradiction. Combining key A with key A→⊥ gives the ⊥ key, and the ⊥ key fits any door (⊥E)."],["⊥ を目指す","Aim for ⊥"],["扉の「⊥ を目指す」で、扉そのものを ⊥ に切り替えることもできます。","With \"Aim for ⊥\" on a door, you can also switch the door itself to ⊥."],["否定 ¬","Negation ¬"],["¬A は A→⊥ の略記です。扉 ¬A の <b>¬</b> をタップすると、A を持って部屋に入り、⊥ を目指します。鍵 ¬A は、A を差し込むと ⊥ が出てくる鍵です。","¬A is short for A→⊥. Tap the <b>¬</b> of door ¬A to enter a room holding A and aim for ⊥. Key ¬A is a key that produces ⊥ when you insert A."],["この層から<b>背理法の魔法</b>が使えます。「この扉でない」を鍵として持って魔法の部屋に入り、矛盾 ⊥ を導けば扉が開きます。","From this level on you can use the <b>reductio spell</b>. Enter a spell room holding \"not this door\" as a key; derive the contradiction ⊥ and the door opens."],["⊬ は「証明できない」","⊬ means \"not provable\""],["このステージは、証明ではなく<b>反例</b>を作って「証明できない」ことを示す問題です。<span class=\"turn\">⊬</span> がその印です。","In this stage you do not prove anything; you make a <b>counterexample</b> to show that it is not provable. <span class=\"turn\">⊬</span> marks such problems."],["真理値の割り当て","Truth assignment"],["原子命題に真・偽を割り当てます。最初は未定で、ボタンを押すたびに 偽 → 真 → 偽 … と変わります。","Assign true or false to the atomic propositions. They start unknown; each press changes them false → true → false …."],["真偽の計算","Evaluation"],["割り当てに応じて、各式の真偽が自動で計算されます。図の上が式全体、下が原子命題で、原子命題から順に真偽が決まっていきます。","The truth value of each formula is computed from the assignment. The whole formula is at the top and the atomic propositions at the bottom; values are settled from the atoms upward."],["反例の完成","Counterexample complete"],["仮定がすべて真、目標が偽になれば反例の完成です。ここに「この割り当てで反証する」ボタンが現れます。","When all assumptions are true and the goal is false, the counterexample is complete. A \"Refute with this assignment\" button appears here."],["扉ごとに、<b>正しい</b>（証明できる）か<b>誤り</b>（証明できない）かを見極めます。正しいと思ったら「証明する」、誤りだと思ったら「反例を作る」を選びます。間違った方を選んでも、何度でも選び直せます。","For each door, decide whether it is <b>valid</b> (provable) or <b>invalid</b> (not provable). If you think it is valid, choose \"Prove\"; if invalid, choose \"Make a counterexample\". You can change your choice as often as you like."],["魔法なしでは証明できない","Not provable without the spell"],["この層では背理法の魔法は使えません。魔法なしでは証明できないことを、<b>Kripke 模型</b>という反例で示します。","On this level the reductio spell cannot be used. You show that something is not provable without the spell by a counterexample called a <b>Kripke model</b>."],["階と灯り","Floors and lights"],["階は知識の状態です。灯りのボタンで原子命題を点け、「＋ 上の階」で未来の階を足します。下の階で点いた灯りは、上の階でも消えません。","A floor is a state of knowledge. Turn on atomic propositions with the light buttons, and add future floors with \"+ Floor above\". A light turned on at a lower floor stays on at the floors above."],["強制関係","Forcing"],["選んだ階で、各式が光るか（強制されるか）が自動で計算されます。仮定がすべて光り、目標が光らない階を作れば反証成功です。","At the selected floor, whether each formula is lit (forced) is computed automatically. Build a floor where all assumptions are lit and the goal is not, and the refutation succeeds."],["扉の ∀","∀ of a door"],["扉の <b>∀</b> をタップすると、<b>任意の住人</b>を連れて新しい部屋に入ります（∀I）。住人は部屋の外に出られません。","Tap the <b>∀</b> of a door to enter a new room with an <b>arbitrary resident</b> (∀I). The resident cannot leave the room."],["鍵の ∀","∀ of a key"],["鍵の <b>∀</b> をタップすると、住人を選んで当てはめた鍵を作れます（∀E）。","Tap the <b>∀</b> of a key to choose a resident and make the instantiated key (∀E)."],["名前を自分で選ぶ","Choose names yourself"],["このスイッチをオンにすると、∀I と ∃E で住人の名前を自分で選べます。固有変数条件に反する名前を選ぶと、理由を示して拒否されます。","Turn on this switch to choose resident names yourself in ∀I and ∃E. A name that violates the eigenvariable condition is rejected with the reason."],["鍵の ∃","∃ of a key"],["鍵の <b>∃</b> をタップすると、条件を満たす「名前の分からない誰か」を連れて部屋に入ります（∃E）。","Tap the <b>∃</b> of a key to enter a room with \"someone whose name we don't know\" who satisfies the condition (∃E)."],["扉の ∃","∃ of a door"],["扉の <b>∃</b> では、<b>証人</b>となる住人を選びます（∃I）。元に戻らない選択なので、証人になれる住人を先に連れてきましょう。","At the <b>∃</b> of a door you choose a resident as the <b>witness</b> (∃I). It cannot be undone, so bring in a resident who can serve as the witness first."],["住人の数","Number of residents"],["一階述語論理の反例は<b>構造</b>です。まず住人の数を ＋／− で決めます。","A counterexample in first-order logic is a <b>structure</b>. First set the number of residents with + / −."],["述語の表","Predicate tables"],["表のボタンで、どの住人について述語が真かを決めます。最初は未定で、押すたびに 偽 → 真 と変わります。","Use the buttons in the table to decide for which residents a predicate is true. They start unknown; each press changes them false → true."],["∀ と ∃ は住人ごとに枝分かれした図で計算されます。仮定がすべて真、目標が偽になれば反例です。","∀ and ∃ are evaluated in a diagram that branches for each resident. When all assumptions are true and the goal is false, you have a counterexample."],["等号","Equality"],["等号 = を扱います。両辺が同じ項の扉は、扉の = をタップすると開きます（=I）。等式の鍵 s = t を扉に差し込むと、扉の中の t を s に書き換えられます（=E）。","This deals with equality =. A door whose two sides are the same term opens when you tap its = (=I). Insert an equation key s = t into a door to rewrite t in the door to s (=E)."],["以前に証明した定理が、<b>定理カード</b>として置かれています。普通の鍵と同じように、∀ に住人を当てはめて使えます。","Theorems you proved earlier are placed here as <b>theorem cards</b>. Use them like ordinary keys, instantiating their ∀ with residents."],["定義の展開","Unfolding definitions"],["点線の枠の記号（⊆ ∩ ∪ ᶜ）は<b>定義による略記</b>です。タップすると、定義どおりの式に展開されます。","The symbols in dotted frames (⊆ ∩ ∪ ᶜ) are <b>abbreviations by definition</b>. Tap one to unfold it into the defining formula."],["項を当てはめる","Instantiating with terms"],["∀ の鍵には、住人の名前だけでなく、f(a) のような<b>項</b>も当てはめられます。","A ∀ key can be instantiated not only with resident names but also with <b>terms</b> such as f(a)."],["等式は両方の向きに","Equations both ways"],["この層では、等式の鍵を<b>両方の向き</b>に使えます。逆向きに使った分の対称律は、自動で証明図に入ります。","On this level you can use equation keys <b>in both directions</b>. When you use one backwards, the symmetry step is added to the proof tree automatically."],["補題を立てる","State a lemma"],["まず別の式（<b>補題</b>）を証明して、それを鍵として使えます。同じ推論を何度も使うときに便利です。","You can first prove another formula (a <b>lemma</b>) and then use it as a key. This is handy when the same reasoning is used many times."],["<b>数学的帰納法</b>：扉を「0 の場合」と「n から n の次への場合」に分けます。","<b>Mathematical induction</b>: split the door into \"the case 0\" and \"the step from n to the next number\"."],["順序の定義","Definition of order"],["x ≤ y は ∃z(x + z = y) の略記です。点線の ≤ をタップすると展開されます。","x ≤ y is short for ∃z(x + z = y). Tap the dotted ≤ to unfold it."],["項を書いて当てはめる","Typing a term to instantiate"],["住人を選ぶ欄の下の入力欄に <code>d + e</code> のように書くと、まだどこにも現れていない項も当てはめられます。","Type a term such as <code>d + e</code> in the input box below the resident picker to instantiate with a term that does not appear anywhere yet."],["定数の解釈","Interpreting constants"],["定数（e や 0 など）が、どの住人を表すかを選びます。","Choose which resident a constant (such as e or 0) stands for."],["演算の表","Operation tables"],["演算の値を表で決めます。最初は ?（未定）で、押すたびに住人 1 → 2 → … と変わります。","Set the values of an operation in its table. Cells start as ? (unknown); each press changes them to resident 1 → 2 → …."],["手数と目安","Moves and par"],["今回かかった<b>手数</b>と、<b>目安</b>の手数（お手本の解き方の手数）です。目安以内でクリアすると ★ が付きます。","The number of <b>moves</b> you took and the <b>par</b> (the number of moves in the model solution). Clear within par to earn ★."],["完成した証明木","The finished proof tree"],["あなたの操作が、そのまま<b>自然演繹の証明図</b>になりました。いちばん下が証明した結論、上に向かって使った仮定（鍵）が並びます。","Your moves have become a <b>natural deduction proof tree</b>. The conclusion you proved is at the bottom; the assumptions (keys) you used are above."],["証明の再生","Replaying the proof"],["▶ を押すと、証明図が<b>一手ずつ組み上がる様子</b>を再生できます。◀ ▶ で一手ずつ、⏮ ⏭ で最初と最後へ移ります。","Press ▶ to watch the proof tree <b>being built move by move</b>. Use ◀ ▶ to step one move at a time, and ⏮ ⏭ to jump to the start or the end."],["証明の検査","Proof check"],["すべての推論が規則どおりで、仮定の使える範囲も正しいことを、自動で確かめた結果です。","The result of checking automatically that every inference follows the rules and that assumptions are used within their scopes."],["操作と推論規則の対応","Moves and inference rules"],["ゲームでの操作と、自然演繹の推論規則（∧I など）の対応です。行を押すと、その手まで再生した状態になります。","How your moves in the game correspond to natural deduction rules (∧I and so on). Click a row to see the proof replayed up to that move."],["次へ進む","Moving on"],["「もう一度」で同じステージに挑戦、「ステージ一覧」で一覧へ、「次のステージへ」で先に進みます。","\"Retry\" plays the same stage again, \"Stage list\" returns to the list, and \"Next stage\" moves on."],["既製の構造","Preset structures"],["大きな反例が必要なときは、「既製の構造」から、よく知られた群などを読み込めます。","When a large counterexample is needed, you can load well-known groups and the like from \"Preset structures\"."],["案内","Guide"],["<div class=\"gb-step\">案内 ⟦0⟧ / ⟦1⟧</div><div class=\"gb-title\">⟦2⟧</div><div class=\"gb-text\">⟦3⟧</div>\n    <div class=\"gb-actions\"><button type=\"button\" class=\"btn small\" data-guide=\"skip\">⟦4⟧</button>⟦5⟧</div>","<div class=\"gb-step\">Guide ⟦0⟧ / ⟦1⟧</div><div class=\"gb-title\">⟦2⟧</div><div class=\"gb-text\">⟦3⟧</div>\n    <div class=\"gb-actions\"><button type=\"button\" class=\"btn small\" data-guide=\"skip\">⟦4⟧</button>⟦5⟧</div>"],["閉じる","Close"],["案内を閉じる","Close guide"],["<button type=\"button\" class=\"btn small primary\" data-guide=\"done\">はじめる</button>","<button type=\"button\" class=\"btn small primary\" data-guide=\"done\">Start</button>"],["<button type=\"button\" class=\"btn small primary\" data-guide=\"next\">次へ</button>","<button type=\"button\" class=\"btn small primary\" data-guide=\"next\">Next</button>"],["<div class=\"meta\"><span>⟦0⟧「⟦1⟧」</span>⟦2⟧⟦3⟧<span id=\"bestMeta\">⟦4⟧</span></div>\n    <h1><span class=\"sid\">⟦5⟧</span><span>⟦6⟧</span></h1>","<div class=\"meta\"><span>⟦0⟧ \"⟦1⟧\"</span>⟦2⟧⟦3⟧<span id=\"bestMeta\">⟦4⟧</span></div>\n    <h1><span class=\"sid\">⟦5⟧</span><span>⟦6⟧</span></h1>"],["<span class=\"boss\">ボス</span>","<span class=\"boss\">Boss</span>"],["<span>目安 ⟦0⟧ ⟦1⟧</span>","<span>Par ⟦0⟧ ⟦1⟧</span>"],["<div class=\"story-box\"><div class=\"story-lab\">語り</div><p class=\"story-text\">⟦0⟧</p><p class=\"story-goal\">⟦1⟧</p></div>","<div class=\"story-box\"><div class=\"story-lab\">Narration</div><p class=\"story-text\">⟦0⟧</p><p class=\"story-goal\">⟦1⟧</p></div>"],["<details class=\"lesson rules\"⟦0⟧><summary>規則の説明</summary><p>⟦1⟧</p></details>","<details class=\"lesson rules\"⟦0⟧><summary>The rules</summary><p>⟦1⟧</p></details>"],["<details class=\"lesson\" open><summary>この部屋の説明</summary><p>⟦0⟧</p></details>","<details class=\"lesson\" open><summary>About this room</summary><p>⟦0⟧</p></details>"],["<section class=\"mission\">⟦0⟧⟦1⟧⟦2⟧⟦3⟧</section>\n      <div class=\"aux solo\"><section><h3>ヒント</h3><div id=\"hints\"></div></section>⟦4⟧</div>","<section class=\"mission\">⟦0⟧⟦1⟧⟦2⟧⟦3⟧</section>\n      <div class=\"aux solo\"><section><h3>Hints</h3><div id=\"hints\"></div></section>⟦4⟧</div>"],["<div class=\"seq-row\"><button type=\"button\" class=\"btn small guide-again\" data-guide=\"start\">案内を見る</button></div>","<div class=\"seq-row\"><button type=\"button\" class=\"btn small guide-again\" data-guide=\"start\">Show guide</button></div>"],["<div class=\"part-bar\"><button type=\"button\" class=\"btn small\" data-cmd=\"hub\">鑑定の間に戻る</button><span>いま鑑定している扉：<b>扉 ⟦0⟧</b></span></div>","<div class=\"part-bar\"><button type=\"button\" class=\"btn small\" data-cmd=\"hub\">Back to the judgment hall</button><span>Door being judged: <b>door ⟦0⟧</b></span></div>"],["<div class=\"modes\" role=\"group\" aria-label=\"取り組み方\"><button type=\"button\" class=\"mode\" data-mode=\"refute\" aria-pressed=\"⟦0⟧\">⟦1⟧</button><button type=\"button\" class=\"mode\" data-mode=\"prove\" aria-pressed=\"⟦2⟧\">⟦3⟧</button></div>","<div class=\"modes\" role=\"group\" aria-label=\"Approach\"><button type=\"button\" class=\"mode\" data-mode=\"refute\" aria-pressed=\"⟦0⟧\">⟦1⟧</button><button type=\"button\" class=\"mode\" data-mode=\"prove\" aria-pressed=\"⟦2⟧\">⟦3⟧</button></div>"],["反例を作る（住人と表）","Make a counterexample (residents and tables)"],["反例を作る（真理値の割り当て）","Make a counterexample (truth assignment)"],["反証する（Kripke 模型を作る）","Refute (build a Kripke model)"],["証明する","Prove"],["証明を試す","Try to prove"],["<section class=\"mission\">⟦0⟧⟦1⟧\n    <div class=\"seq-row\"><div class=\"seq\" aria-label=\"シーケント\">⟦2⟧</div>⟦3⟧</div>⟦4⟧⟦5⟧</section>\n    <div id=\"pane\">⟦6⟧</div>","<section class=\"mission\">⟦0⟧⟦1⟧\n    <div class=\"seq-row\"><div class=\"seq\" aria-label=\"Sequent\">⟦2⟧</div>⟦3⟧</div>⟦4⟧⟦5⟧</section>\n    <div id=\"pane\">⟦6⟧</div>"],["<button type=\"button\" class=\"btn small guide-again\" data-guide=\"start\" title=\"この部屋で新しく登場したものを、もう一度案内する\">案内を見る</button>","<button type=\"button\" class=\"btn small guide-again\" data-guide=\"start\" title=\"Show the guide to what is new in this room again\">Show guide</button>"],["\n  <div class=\"play\">\n    <section class=\"plan\" id=\"area\" aria-label=\"現在の扉と部屋\">\n      <div class=\"plan-head\" id=\"planHead\"></div>\n      <div id=\"rooms\"></div>\n      <div class=\"status\" id=\"status\"></div>\n    </section>\n    <section class=\"proof\" aria-label=\"自然演繹の証明図\">\n      <div class=\"proof-head\"><h2>証明図</h2><span>操作するたびに、自然演繹の証明図が組み上がっていきます</span>\n        <span class=\"tog-row\"><button type=\"button\" class=\"toggle\" data-cmd=\"toggleterm\" id=\"termToggle\" aria-pressed=\"⟦0⟧\"><span class=\"sw-track\"><span class=\"sw-knob\"></span></span>証明項（λ項）を表示</button><button type=\"button\" class=\"toggle lean-tog\" data-cmd=\"togglelean\" id=\"leanToggle\" aria-pressed=\"⟦1⟧\"><span class=\"sw-track\"><span class=\"sw-knob\"></span></span>Lean モード</button></span></div>\n      <div class=\"rule-line\" id=\"ruleLine\" aria-live=\"polite\"></div>\n      <div id=\"leanBox\" class=\"lean-box\"⟦2⟧></div>\n      <div class=\"ptw live\" id=\"liveTree\"></div>\n      <div id=\"scopeNote\"></div>\n      <div id=\"parts\"></div>\n      <div class=\"legend\">\n        <span>⋮ はまだ開いていない扉（未完成の部分）。タップでその扉へ移動</span>\n        <span><span class=\"sw\"></span>直前の操作で増えた部分</span>\n        <span>[ ]¹ は →I¹ で解除される仮定</span>\n        <span><span class=\"sw scope\"></span>いまの扉を囲む部屋の範囲（ た。</p>\n    <div class=\"score\"><span><b>⟦3⟧</b> 階</span>⟦4⟧</div>\n    <h3>完成した Kripke 模型</h3>\n    <div class=\"km-wrap static\" id=\"kmStatic\"><div class=\"km-inner\"><svg class=\"km-links\" aria-hidden=\"true\"></svg>⟦5⟧</div></div>\n    <h3>階 ⟦6⟧ での計算</h3>\n    ⟦7⟧\n    <p class=\"check\">反証に成功：階 ⟦8⟧ で⟦9⟧目標 ⟦10⟧ は強制されません。Kripke 意味論の健全性定理（証明できる式は、どの模型のどの階でも強制される）により、⟦11⟧ です。</p>\n    <div class=\"actions\">\n      <button class=\"btn\" type=\"button\" data-cmd=\"retry\">もう一度</button>\n      <button class=\"btn\" type=\"button\" data-cmd=\"map\">ステージ一覧</button>\n      ⟦12⟧\n    </div>","\n    <h2>Refuted</h2>\n    ⟦0⟧\n    <p>You showed that the door of ⟦1⟧ \"⟦2⟧\" is a magic door that never opens without the spell.</p>\n    <div class=\"score\"><span><b>⟦3⟧</b> floors</span>⟦4⟧</div>\n    <h3>The finished Kripke model</h3>\n    <div class=\"km-wrap static\" id=\"kmStatic\"><div class=\"km-inner\"><svg class=\"km-links\" aria-hidden=\"true\"></svg>⟦5⟧</div></div>\n    <h3>Evaluation at floor ⟦6⟧</h3>\n    ⟦7⟧\n    <p class=\"check\">Refutation succeeded: at floor ⟦8⟧, ⟦9⟧the goal ⟦10⟧ is not forced. By the soundness theorem for Kripke semantics (every provable formula is forced at every floor of every model), ⟦11⟧.</p>\n    <div class=\"actions\">\n      <button class=\"btn\" type=\"button\" data-cmd=\"retry\">Retry</button>\n      <button class=\"btn\" type=\"button\" data-cmd=\"map\">Stage list</button>\n      ⟦12⟧\n    </div>"],["<span class=\"par\">目安 ⟦0⟧ 階</span>⟦1⟧","<span class=\"par\">Par ⟦0⟧ floors</span>⟦1⟧"],["<span class=\"star\">★ 目安達成</span>","<span class=\"star\">★ Par reached</span>"],["<span class=\"par\">あと ⟦0⟧ 階、減らせます</span>","<span class=\"par\">⟦0⟧ more floors than par</span>"],["仮定はすべて強制され、","all assumptions are forced but "],["<div class=\"jcard⟦0⟧\"><div class=\"jhead\"><b>扉 ⟦1⟧</b>","<div class=\"jcard⟦0⟧\"><div class=\"jhead\"><b>Door ⟦1⟧</b>"],["鑑定の途中","In progress"],["未鑑定","Not judged"],["正しいとみて証明する","Judge valid and prove"],["魔法なしで開くとみて証明する","Judge it opens without the spell and prove"],["誤りとみて反例を作る","Judge invalid and make a counterexample"],["魔法の扉とみて反証する","Judge it a magic door and refute"],["正しい：証明した","Valid: proved"],["誤り：反例を示した","Invalid: counterexample shown"],["魔法なしで開く：証明した","Opens without the spell: proved"],["魔法の扉：反証した","Magic door: refuted"],["扉 ⟦0⟧ を、⟦1⟧しました。","Door ⟦0⟧: ⟦1⟧."],["正しいと見極めて証明","judged valid and proved"],["魔法なしで開くと見極めて証明","judged it opens without the spell and proved"],["誤りと見極めて反例を示","judged invalid and showed a counterexample"],["魔法の扉と見極めて反証","judged it a magic door and refuted"],["\n    <h2>鑑定完了</h2>\n    ⟦0⟧\n    <p>⟦1⟧「⟦2⟧」の 3 つの扉をすべて見極めました。</p>\n    <ul class=\"jsum\">⟦3⟧</ul>\n    <p class=\"note\">⟦4⟧</p>\n    <div class=\"actions\">\n      <button class=\"btn\" type=\"button\" data-cmd=\"retry\">もう一度</button>\n      ⟦5⟧\n    </div>","\n    <h2>Judgment complete</h2>\n    ⟦0⟧\n    <p>You judged all the doors of ⟦1⟧ \"⟦2⟧\".</p>\n    <ul class=\"jsum\">⟦3⟧</ul>\n    <p class=\"note\">⟦4⟧</p>\n    <div class=\"actions\">\n      <button class=\"btn\" type=\"button\" data-cmd=\"retry\">Retry</button>\n      ⟦5⟧\n    </div>"],["<li><b>扉 ⟦0⟧</b>　⟦1⟧　<span class=\"jres ⟦2⟧\">⟦3⟧</span><p class=\"note\">⟦4⟧</p></li>","<li><b>Door ⟦0⟧</b>　⟦1⟧　<span class=\"jres ⟦2⟧\">⟦3⟧</span><p class=\"note\">⟦4⟧</p></li>"],["完成した証明は「正しい」ことの証拠、反例となる構造は「誤り」であることの証拠です。一階述語論理でも、健全性定理とゲーデルの完全性定理により、どの式にもどちらか一方が必ず存在します（ただし、反例の構造が有限とは限りません）。","A finished proof is evidence of \"valid\", and a counterexample structure is evidence of \"invalid\". In first-order logic too, by the soundness theorem and Gödel's completeness theorem, every formula has one or the other (although the counterexample structure need not be finite)."],["完成した証明は「正しい」ことの証拠、真理値の割り当ての反例は「誤り」であることの証拠です。古典命題論理では、健全性定理と完全性定理により、どの式にもどちらか一方の証拠が必ず存在します。","A finished proof is evidence of \"valid\", and a counterexample truth assignment is evidence of \"invalid\". In classical propositional logic, by the soundness and completeness
