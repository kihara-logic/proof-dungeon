const eqA = (a, b) => ({ t: "atom", n: "=", args: [a, b] });
const symTerm = (v, s1, t1) => ({ k: "rew", a: v, p: { k: "refl", ty: eqA(s1, s1) }, ty: eqA(t1, s1) });
// 住人を選ぶ欄からの操作の振り分け
function pickOp(S, pk, v) {
  if (typeof v === "string" && v[0] === "#") v = (UI.pickTerms || [])[+v.slice(1)];
  switch (pk.kind) {
    case "allE": return opAllE(S, pk.key, v, S.active);
    case "exI": return opExI(S, S.active, v);
    case "allI": return opIntro(S, S.active, v);
    case "exE": return opSplit(S, pk.key, S.active, v);
  }
  return { ok: false, msg: "" };
}
function opIntro(S, gid, chosen) {
  const g = S.goals[gid], t = g.target;
  if (t.t === "all") { // ∀I：任意の住人 a を連れて新しい部屋へ
    if (chosen && chosen !== "*new") {
      const bad = eigenViolation(g, chosen, [t]);
      if (bad.length) return { ok: false, flag: chosen, msg: `住人 ${termH(chosen)} は ${bad.join("、")} に現れているので、「任意の住人」とは言えません（固有変数条件）。まだ登場していない名前を選びましょう。` };
    }
    const a = chosen && chosen !== "*new" ? chosen : freshName(S), sid = S.nx++, nid = "g" + S.nid++, lvl = g.level + 1, body = inst(t.b, t.v, a);
    S.goals[nid] = { id: nid, ctx: g.ctx, target: body, level: lvl, names: [...(g.names || []), { n: a, level: lvl, via: "all", sid }] };
    S.fills[gid] = stamp({ k: "tlam", a, sid, ty: t, body: { k: "hole", id: nid, ty: body } }, S.ops + 1);
    S.holeOp[nid] = S.ops + 1;
    replaceOpen(S, gid, [nid]);
    return { ok: true, log: { rule: "∀I", text: `任意の住人 ${termH(a)} を連れて部屋に入る。扉は ${FF(body)} になる（${termH(a)} は部屋の外に出られない）。`,
      fig: `目標 ${FF(t)} の上に ∀I の線（固有変数 ${termH(a)}）。その上で ${FF(body)} を目指す` } };
  }
  if (t.t === "ex") return { ok: false, msg: "扉の ∃ は、証人となる住人を選んで使います。" };
  if (isEq(t)) { // =I：両辺が同じ項なら開く（反射律）
    if (!termEq(t.args[0], t.args[1])) return { ok: false, msg: `両辺が同じ項のときだけ、= をタップして開けられます（=I）。等式の鍵で扉を書き換えましょう（=E）。` };
    S.fills[gid] = stamp({ k: "refl", ty: t }, S.ops + 1);
    replaceOpen(S, gid, []);
    return { ok: true, log: { rule: "=I", text: `扉 ${FF(t)} は両辺が同じなので開く（反射律）。`, fig: `⋮ ${FF(t)} が =I（前提なし）でふさがる` } };
  }
  if (t.t === "imp") {
    const x = "x" + S.nx++, nid = "g" + S.nid++, lvl = g.level + 1;
    S.goals[nid] = { id: nid, ctx: [...g.ctx, { name: x, f: t.l, kind: "asm", level: lvl }], target: t.r, level: lvl };
    S.fills[gid] = stamp({ k: "lam", x, xty: t.l, ty: t, body: { k: "hole", id: nid, ty: t.r } }, S.ops + 1);
    S.holeOp[nid] = S.ops + 1;
    replaceOpen(S, gid, [nid]);
    const k = x.slice(1);
    return { ok: true, log: { rule: "→I", text: `仮定 ${FF(t.l)} を持って部屋 ${k} に入る。扉は ${FF(t.r)} になる。`,
      fig: `目標 ${FF(t)} の上に →I<sup>${k}</sup> の線。その上で、仮定 [${FF(t.l)}]<sup>${k}</sup> から ${FF(t.r)} を目指す` } };
  }
  if (t.t === "and") {
    const a = "g" + S.nid++, b = "g" + S.nid++;
    S.goals[a] = { id: a, ctx: g.ctx, target: t.l, level: g.level };
    S.goals[b] = { id: b, ctx: g.ctx, target: t.r, level: g.level };
    S.fills[gid] = stamp({ k: "pair", ty: t, a: { k: "hole", id: a, ty: t.l }, b: { k: "hole", id: b, ty: t.r } }, S.ops + 1);
    S.holeOp[a] = S.holeOp[b] = S.ops + 1;
    replaceOpen(S, gid, [a, b]);
    return { ok: true, log: { rule: "∧I", text: `扉 ${FF(t)} を ${FF(t.l)} と ${FF(t.r)} に分ける。`,
      fig: `目標 ${FF(t)} の上に ∧I の線。${FF(t.l)} と ${FF(t.r)} の二つの ⋮ に分かれる` } };
  }
  if (t.t === "or") return { ok: false, msg: "扉の ∨ は、左右どちらを示すかを選んで使います。" };
  return { ok: false, msg: "原子命題の扉は分解できません。合う鍵を差し込みましょう。" };
}
// 背理法 RAA：「A でない」（¬A）を仮定して部屋に入り、⊥ を目指す
function opRAA(S, gid) {
  const g = S.goals[gid], t = g.target;
  if (t.t === "bot") return { ok: false, msg: "⊥ の扉に背理法の魔法を唱えても、何も変わりません。" };
  const x = "x" + S.nx++, nid = "g" + S.nid++, lvl = g.level + 1, k = x.slice(1);
  const neg = { t: "imp", l: t, r: { t: "bot" } }, bot = { t: "bot" };
  S.goals[nid] = { id: nid, ctx: [...g.ctx, { name: x, f: neg, kind: "asm", level: lvl, via: "raa", concl: t }], target: bot, level: lvl };
  S.fills[gid] = stamp({ k: "raa", x, xty: neg, ty: t, body: { k: "hole", id: nid, ty: bot } }, S.ops + 1);
  S.holeOp[nid] = S.ops + 1;
  replaceOpen(S, gid, [nid]);
  return { ok: true, log: { rule: "RAA", text: `背理法の魔法を唱え、「${FF(t)} でない」と仮定して（${FF(neg)}）魔法の部屋 ${k} に入る。扉は ⊥ になる。`,
    fig: `目標 ${FF(t)} の上に RAA<sup>${k}</sup> の線。その上で、仮定 [${FF(neg)}]<sup>${k}</sup> から矛盾 ⊥ を目指す` } };
}
// ⊥E（後ろ向き）：扉を ⊥ に切り替える（元に戻らない選択）
function opExfalso(S, gid) {
  const g = S.goals[gid], t = g.target;
  if (t.t === "bot") return { ok: false, msg: "この扉はすでに ⊥ です。" };
  const nid = "g" + S.nid++, bot = { t: "bot" };
  S.goals[nid] = { id: nid, ctx: g.ctx, target: bot, level: g.level };
  S.fills[gid] = stamp({ k: "abort", ty: t, p: { k: "hole", id: nid, ty: bot } }, S.ops + 1);
  S.holeOp[nid] = S.ops + 1;
  replaceOpen(S, gid, [nid]);
  return { ok: true, log: { rule: "⊥E", text: `扉 ${FF(t)} を、矛盾 ⊥ を導く扉に切り替える。`,
    fig: `目標 ${FF(t)} の上に ⊥E の線。その上では矛盾 ⊥ を目指す` } };
}
// ∨I：左右どちらを示すかを選ぶ（元に戻らない選択）
function opOrIntro(S, gid, side) {
  const g = S.goals[gid], t = g.target;
  if (t.t !== "or") return { ok: false, msg: "この扉は選言ではありません。" };
  const nid = "g" + S.nid++, part = side === "l" ? t.l : t.r;
  S.goals[nid] = { id: nid, ctx: g.ctx, target: part, level: g.level };
  S.fills[gid] = stamp({ k: side === "l" ? "inl" : "inr", ty: t, p: { k: "hole", id: nid, ty: part } }, S.ops + 1);
  S.holeOp[nid] = S.ops + 1;
  replaceOpen(S, gid, [nid]);
  return { ok: true, log: { rule: "∨I", text: `扉 ${FF(t)} の${side === "l" ? "左" : "右"}を選び、${FF(part)} を示すことにする。`,
    fig: `目標 ${FF(t)} の上に ∨I の線。その上では ${FF(part)} だけを目指す` } };
}

function opUse(S, name, gid) {
  const g = S.goals[gid], e = findEntry(g, name);
  if (!e) return { ok: false, msg: "その鍵はこの部屋では使えません。" };
  if (eq(e.f, g.target)) {
    S.fills[gid] = stamp({ k: "var", x: name, ty: e.f }, S.ops + 1);
    replaceOpen(S, gid, []);
    const lbl = e.kind === "asm" ? `[${FF(e.f)}]<sup>${e.name.slice(1)}</sup>` : FF(e.f);
    return { ok: true, log: { rule: "仮定", text: `鍵 ${FF(e.f)} で扉 ${FF(g.target)} を開ける。`,
      fig: e.kind === "der" ? `⋮ ${FF(g.target)} の位置に、部品（鍵 ${FF(e.f)} の作り方）がつながる` : `⋮ ${FF(g.target)} が仮定 ${lbl} でふさがり、証明図の葉になる` } };
  }
  if (e.f.t === "bot") { // ⊥E（前向きの ⊥ の鍵で、どの扉でも開ける）
    S.fills[gid] = stamp({ k: "abort", ty: g.target, p: { k: "var", x: name, ty: e.f } }, S.ops + 1);
    replaceOpen(S, gid, []);
    return { ok: true, log: { rule: "⊥E", text: `⊥ の鍵で扉 ${FF(g.target)} を開ける（矛盾からは何でも導ける）。`,
      fig: `⊥ の下に ⊥E の線を引いて ${FF(g.target)} を導き、⋮ ${FF(g.target)} をふさぐ` } };
  }
  const prem = []; let cur = e.f, found = false;
  while (cur.t === "imp") { prem.push(cur.l); cur = cur.r; if (eq(cur, g.target)) { found = true; break; } }
  if (found) {
    let term = { k: "var", x: name, ty: e.f }, ty = e.f; const ids = [];
    for (const p of prem) {
      const nid = "g" + S.nid++;
      S.goals[nid] = { id: nid, ctx: g.ctx, target: p, level: g.level };
      ids.push(nid); ty = ty.r; S.holeOp[nid] = S.ops + 1;
      term = { k: "app", f: term, a: { k: "hole", id: nid, ty: p }, ty };
    }
    S.fills[gid] = stamp(term, S.ops + 1);
    replaceOpen(S, gid, ids);
    const text = prem.length === 1
      ? `鍵 ${FF(e.f)} を扉 ${FF(g.target)} に差し込む。扉は ${FF(prem[0])} に付け替わる。`
      : `鍵 ${FF(e.f)} を扉 ${FF(g.target)} に差し込む。扉は ${prem.map(FF).join("、")} の ${prem.length} つに分かれる。`;
    const fig = prem.length === 1
      ? `目標 ${FF(g.target)} の上に →E の線。鍵 ${FF(e.f)} と、新しい ⋮ ${FF(prem[0])} が並ぶ`
      : `目標 ${FF(g.target)} の上に →E の線が ${prem.length} 本。鍵 ${FF(e.f)} と、新しい ⋮ ${prem.map(FF).join("、")} が並ぶ`;
    return { ok: true, log: { rule: prem.length === 1 ? "→E" : "→E×" + prem.length, text, fig }, srcDoor: [name] };
  }
  if (e.f.t === "and" && (eq(e.f.l, g.target) || eq(e.f.r, g.target)))
    return { ok: false, msg: `鍵 ${FF(e.f)} はそのままでは合いません。鍵の ∧ をタップして中身を取り出しましょう（∧E）。` };
  if (e.f.t === "or" && (eq(e.f.l, g.target) || eq(e.f.r, g.target)))
    return { ok: false, msg: `鍵 ${FF(e.f)} は、左右どちらが成り立つのか分からないので、そのままでは差し込めません。鍵の ∨ をタップして場合分けしましょう（∨E）。` };
  if (isEq(e.f)) return opRewBack(S, name, gid); // 等式の鍵を扉へ：=E（後ろ向き）
  if (e.f.t === "all") return { ok: false, msg: `鍵 ${FF(e.f)} は、∀ をタップして住人を当てはめてから使いましょう（∀E）。` };
  if (e.f.t === "ex") return { ok: false, msg: `鍵 ${FF(e.f)} は、∃ をタップして住人を連れてきてから使いましょう（∃E）。` };
  if (e.f.t === "imp" && (() => { let c = e.f; while (c.t === "imp") c = c.r; return c.t === "bot"; })())
    return { ok: false, msg: `鍵 ${FF(e.f)} から出てくるのは矛盾 ⊥ です。扉の「⊥ を目指す」で扉を ⊥ に切り替えてから差し込むか（⊥E）、先に ⊥ の鍵を作りましょう。` };
  if (e.f.t === "imp")
    return { ok: false, msg: `鍵 ${FF(e.f)} の右側（結論の側）に ${FF(g.target)} が現れないので、この扉には差し込めません。` };
  return { ok: false, msg: `鍵 ${FF(e.f)} は扉 ${FF(g.target)} に合いません。` };
}

function opSplit(S, name, gid, chosen) {
  const g = S.goals[gid], e = findEntry(g, name);
  if (e && e.f.t === "ex") { // ∃E：A を満たす誰か b を連れて部屋に入る
    if (chosen && chosen !== "*new") {
      const bad = eigenViolation(g, chosen, [g.target]);
      if (bad.length) return { ok: false, flag: chosen, msg: `住人 ${termH(chosen)} は ${bad.join("、")} に現れているので、「名前の分からない誰か」の名前には使えません（固有変数条件）。まだ登場していない名前を選びましょう。` };
    }
    const b = chosen && chosen !== "*new" ? chosen : freshName(S), k = S.nx++, x = "x" + k, nid = "g" + S.nid++, lvl = g.level + 1, body = inst(e.f.b, e.f.v, b);
    S.goals[nid] = { id: nid, ctx: [...g.ctx, { name: x, f: body, kind: "asm", level: lvl, via: "ex", src: e.f, param: b }], target: g.target, level: lvl,
                     names: [...(g.names || []), { n: b, level: lvl, via: "ex", sid: k }] };
    S.fills[gid] = stamp({ k: "unpack", p: { k: "var", x: name, ty: e.f }, b, x, xty: body, ty: g.target, body: { k: "hole", id: nid, ty: g.target } }, S.ops + 1);
    S.holeOp[nid] = S.ops + 1;
    replaceOpen(S, gid, [nid]);
    return { ok: true, log: { rule: "∃E", text: `鍵 ${FF(e.f)} から、${FF(body)} を満たす誰か ${termH(b)} を連れて部屋に入る（${termH(b)} は部屋の外に出られない）。`,
      fig: `目標 ${FF(g.target)} の上に ∃E<sup>${k}</sup> の線。${FF(e.f)} と、仮定 [${FF(body)}]<sup>${k}</sup> からの ${FF(g.target)} が並ぶ（固有変数 ${termH(b)}）` }, srcDoor: [name] };
  }
  if (e && e.f.t === "or") { // ∨E：世界を二つに分け、両方で同じ扉を開ける
    const op = S.ops + 1, lvl = g.level + 1;
    const xa = "x" + S.nx++, xb = "x" + S.nx++, a = "g" + S.nid++, b = "g" + S.nid++;
    const pair = [+xa.slice(1), +xb.slice(1)];
    S.goals[a] = { id: a, ctx: [...g.ctx, { name: xa, f: e.f.l, kind: "asm", level: lvl, via: "or", side: "l", sib: xb, src: e.f, pair }], target: g.target, level: lvl };
    S.goals[b] = { id: b, ctx: [...g.ctx, { name: xb, f: e.f.r, kind: "asm", level: lvl, via: "or", side: "r", sib: xa, src: e.f, pair }], target: g.target, level: lvl };
    S.fills[gid] = stamp({ k: "case", ty: g.target, p: { k: "var", x: name, ty: e.f },
      x: xa, xty: e.f.l, l: { k: "hole", id: a, ty: g.target }, y: xb, yty: e.f.r, r: { k: "hole", id: b, ty: g.target } }, op);
    S.holeOp[a] = S.holeOp[b] = op;
    replaceOpen(S, gid, [a, b]);
    return { ok: true, log: { rule: "∨E", text: `鍵 ${FF(e.f)} で条件分岐。${FF(e.f.l)} の場合（世界 ${pair[0]}）と ${FF(e.f.r)} の場合（世界 ${pair[1]}）の両方で、扉 ${FF(g.target)} を開ける。`,
      fig: `目標 ${FF(g.target)} の上に ∨E<sup>${pair.join(",")}</sup> の線。${FF(e.f)}、[${FF(e.f.l)}]<sup>${pair[0]}</sup> からの ${FF(g.target)}、[${FF(e.f.r)}]<sup>${pair[1]}</sup> からの ${FF(g.target)} の三つが並ぶ` }, srcDoor: [name] };
  }
  if (!e || e.f.t !== "and") return { ok: false, msg: "この鍵は分解できません。" };
  const fresh = [], defs = [];
  for (const [k, f] of [["fst", e.f.l], ["snd", e.f.r]]) {
    if (hasFormula(g, f) || fresh.some(c => eq(c.f, f))) continue;
    const d = "d" + S.nd++;
    fresh.push({ name: d, f, kind: "der", level: g.level, rule: "∧E" });
    defs.push({ x: d, def: { k, p: { k: "var", x: name, ty: e.f }, ty: f } });
  }
  if (!fresh.length) return { ok: false, msg: "この鍵の中身は、どちらもすでに持っています。" };
  const nid = "g" + S.nid++;
  S.goals[nid] = { id: nid, ctx: [...g.ctx, ...fresh], target: g.target, level: g.level };
  let term = { k: "hole", id: nid, ty: g.target };
  for (let i = defs.length - 1; i >= 0; i--) term = { k: "let", x: defs[i].x, def: defs[i].def, body: term, ty: g.target };
  S.fills[gid] = stamp(term, S.ops + 1);
  S.holeOp[nid] = S.holeOp[gid];
  replaceOpen(S, gid, [nid]);
  return { ok: true, log: { rule: "∧E", text: `鍵 ${FF(e.f)} から ${fresh.map(c => FF(c.f)).join(" と ")} を取り出す。`,
    fig: `手元の部品に ∧E の断片ができる：${FF(e.f)} から ${fresh.map(c => FF(c.f)).join(" と ")}` }, fresh: fresh.map(c => c.name), src: [name] };
}

function opCombine(S, n1, n2, gid) {
  const g = S.goals[gid], e1 = findEntry(g, n1), e2 = findEntry(g, n2);
  if (!e1 || !e2 || n1 === n2) return { ok: false, msg: "その鍵はこの部屋では使えません。" };
  const r = combineResult(e1, e2, g);
  const rewCan = (eqE, k) => isEq(eqE.f) && (countOcc(k.f, eqE.f.args[0]) || (STAGE.eqBoth && countOcc(k.f, eqE.f.args[1])));
  if (!r && rewCan(e1, e2)) return opRewFwd(S, n1, n2, gid); // 等式の鍵を別の鍵へ：=E（前向き）
  if (!r && rewCan(e2, e1)) return opRewFwd(S, n2, n1, gid);
  if (!r) {
    let fn = null;
    if (e2.f.t === "imp" && eq(e2.f.l, e1.f)) fn = e2; else if (e1.f.t === "imp" && eq(e1.f.l, e2.f)) fn = e1;
    if (fn) return { ok: false, msg: `鍵 ${FF(fn.f.r)} はすでに持っています。` };
    const imps = [e2, e1].filter(e => e.f.t === "imp");
    if (!imps.length) return { ok: false, msg: `どちらの鍵も ${F("A->B")} の形ではないので、組み合わせられません。` };
    return { ok: false, msg: `鍵 ${FF(imps[0].f)} に差し込めるのは ${FF(imps[0].f.l)} の鍵だけです。` };
  }
  const d = "d" + S.nd++, nid = "g" + S.nid++;
  S.goals[nid] = { id: nid, ctx: [...g.ctx, { name: d, f: r.res, kind: "der", level: g.level, rule: "→E" }], target: g.target, level: g.level };
  S.fills[gid] = { k: "let", x: d, ty: g.target, body: { k: "hole", id: nid, ty: g.target },
    def: { k: "app", f: { k: "var", x: r.fn.name, ty: r.fn.f }, a: { k: "var", x: r.arg.name, ty: r.arg.f }, ty: r.res } };
  stamp(S.fills[gid], S.ops + 1);
  S.holeOp[nid] = S.holeOp[gid];
  replaceOpen(S, gid, [nid]);
  return { ok: true, log: { rule: "→E", text: `鍵 ${FF(r.arg.f)} を鍵 ${FF(r.fn.f)} に差し込み、${FF(r.res)} を得る。`,
    fig: `手元の部品に →E の断片ができる：${FF(r.fn.f)} と ${FF(r.arg.f)} から ${FF(r.res)}` }, fresh: [d], src: [r.fn.name, r.arg.name] };
}

/* --- ランタン：直観主義命題論理の決定手続き G4ip（Dyckhoff 1992）で、扉に出口があるかを判定する --- */
const mkImp = (a, b) => ({ t: "imp", l: a, r: b });
const G4MEMO = new Map();
// 古典論理での判定：真理値表（すべての割り当てで、仮定が真なら目標も真か）
function provableC(ctx, goal) {
  const atoms = atomsOf([...ctx, goal]);

    case "tapp": s = `${tstr(t.f, 1, holes, active)} ${termH(t.t)}`; p = 1; break;

let toastTimer = 0;
function toast(html, kind) {
  toastEl.innerHTML = html;
  toastEl.className = "toast show" + (kind === "bad" ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = "toast" + (kind === "bad" ? " bad" : ""); }, 3200);
}
function showModal(html, dismissable) {
  closeModal();
  const o = document.createElement("div");
  o.className = "overlay";
  if (dismissable) o.dataset.dismiss = "1";
  o.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(o);
  o.addEventListener("click", e => { if (e.target === o && o.dataset.dismiss) closeModal(); });
  const b = o.querySelector(".actions .primary") || o.querySelector("button");
  if (b) b.focus({ preventScroll: true });
}
function closeModal() { TUT_RUN++; rpStop(); helpStop(); if (GUIDE && GUIDE.keys.includes("clear")) guideEnd(true); document.querySelectorAll(".overlay").forEach(o => o.remove()); }

const seqHTML = (st, turn = "⊢") => `${st.prem.map(p => F(p)).join('<span class="comma">,</span>')}<span class="turn">${turn}</span>${F(st.goal)}`;
const unitOf = st => st.kind === "refute" ? "階" : "手";
function bestText(st) {
  const b = PROG.best[st.pid];
  if (b == null) return "未クリア";
  if (st.kind === "judge") return "鑑定済み";
  if (st.kind === "refute" && (st.fol || st.classical)) return "反証済み";
  return `ベスト ${b} ${unitOf(st)}${st.par != null && b <= st.par ? "（パー達成 ★）" : ""}`;
}
function tileSeq(s) {
  if (s.kind === "judge") return `<span>扉 ${s.parts.map(p => p.key).join("・")}：本物か偽物か</span>`;
  return withNeg(!s.expandNeg, () => seqHTML(s, s.kind === "refute" ? "⊬" : "⊢"));
}

// 表示の明るさ：自動（表示している環境の設定に従う）／ライト／ダーク。
// 環境（Claude の画面など）が data-theme を付けることがあるので、その値を覚えておき、「自動」ではそれに戻す
const HOST_THEME = { v: document.documentElement.getAttribute("data-theme"), setting: false };
new MutationObserver(() => {
  if (HOST_THEME.setting) return;
  HOST_THEME.v = document.documentElement.getAttribute("data-theme");
  if (PREFS.theme === "light" || PREFS.theme === "dark") applyColorTheme();
}).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
function applyColorTheme() {
  const el = document.documentElement, want = PREFS.theme === "light" || PREFS.theme === "dark" ? PREFS.theme : HOST_THEME.v;
  HOST_THEME.setting = true;
  if (want) el.setAttribute("data-theme", want); else el.removeAttribute("data-theme");
  Promise.resolve().then(() => { HOST_THEME.setting = false; });
}
const THEME_LABEL = { auto: "自動", light: "ライト", dark: "ダーク" }, THEME_ICON = { auto: "◐", light: "☀", dark: "☾" };
function applyTheme() { // 迷宮モードと、お試しの装飾（鉄格子、プレイ画面の飾り）
  applyColorTheme();
  document.body.classList.add("maze", "maze-bars", "maze-deco"); // 迷宮の装飾（鉄格子・プレイ画面の飾りを含む）は常に ON
}

    "3-1": { t: `扉には ${F("P|Q")}。「${F("P")} か ${F("Q")} のどちらかを示せ」という意味だ。あなたの手元には ${F("P")} がある。扉の ∨ の印に触れると、左右どちらの道を進むか選べるらしい。ただし、一度選んだ道は引き返せない。`,
             d: `迷わず左の道を選び、鍵 ${F("P")} で扉を開けた。どちらかでよいなら、示せる方を選べばいい。` },
    "3-2": { t: `手にした鍵は ${F("P|Q")}。「${F("P")} か ${F("Q")} か、どちらかが成り立つ」――けれども、どちらなのかは鍵にも分からない。鍵の ∨ に触れると、目の前の景色が二つに裂けた。${F("P")} が成り立つ世界と、${F("Q")} が成り立つ世界。あなたは両方で、同じ扉を開けねばならない。`,
             d: `二つの世界の両方で扉が開くと、裂けた景色は一つに戻った。どちらの場合でも開くなら、どちらなのかを知る必要はない。` },
    "3-3": { t: `分かれ道の先にある扉は、どちらも ${F("R")}。壁には ${F("P->R")} と ${F("Q->R")} の二本の鍵。${F("P")} の道を進んでも、${F("Q")} の道を進んでも、たどり着く扉は同じらしい。使う鍵は、道ごとに違ってかまわない。`,
             d: `${F("P")} の世界では ${F("P->R")} が、${F("Q")} の世界では ${F("Q->R")} が扉を開けた。異なる道が、同じ出口に通じていた。` },
    "3-4": { t: `扉の奥に部屋があり、部屋の中で道が分かれる――そういう造りの区画だ。部屋で手に入れた鍵は、その奥で分かれたどちらの世界にも持っていける。部屋に入るのが先か、世界を分けるのが先か。順番次第で、歩く距離が変わりそうだ。`,
             d: `部屋の鍵を携えたまま二つの世界を抜け、扉は開いた。部屋と世界は、重ねて使える。` },
    "3-5": { t: `分岐の階層の最奥。番人が問う。「${F("P")} と、${F("Q")} か ${F("R")} か。それを、${F("P")} と ${F("Q")} か、${F("P")} と ${F("R")} か、に分け直せ」。扉の ∨ の印は、ここでも引き返せない選択を迫ってくる。だが、どちらを選ぶべきかが分かるのは、いつだろうか。`,
             d: `世界を分けてから選べば、迷いはなかった。番人は道を開け、さらに深い階層への階段が姿を見せる。` },
    "4-1": { t: `扉には ${F("Q")} とあるが、${F("Q")} に通じる鍵はどこにもない。手元にあるのは ${F("P")} と、${F("P->#")} という不穏な鍵だけだ。${F("P")} を差し込めば、⊥――矛盾の亀裂が開く。亀裂の向こうには、どんな扉もある。`,
             d: `亀裂を抜けた先に、${F("Q")} の扉があった。矛盾からは、何でも導ける。` },
    "4-2": { t: `扉の印は ${F("P->~~P")}。¬ が二つ重なっている。¬A とは A→⊥、つまり「A を持ち込めば亀裂が開く」という意味だった。ならば ${F("~~P")} は、「${F("~P")} を持ち込めば亀裂が開く」ということになる。`,
             d: `${F("P")} と ${F("~P")} を同時に手にした瞬間、亀裂が開いた。否定の正体は、矛盾への道だった。` },
    "4-3": { t: `壁に掛かる鍵は ${F("P->Q")}。扉には ${F("~Q->~P")}。${F("Q")} でないなら、${F("P")} でもない――言われてみれば当然だが、それを示すには、${F("~Q")} と ${F("P")} の両方を持ち込んで、亀裂が開くことを確かめねばならない。`,
             d: `${F("P")} から ${F("Q")} を作った途端、${F("~Q")} とぶつかって亀裂が開いた。対偶は、矛盾を通って示される。` },
    "4-4": { t: `鍵 ${F("P|Q")} で世界を二つに分けると、片方の世界はどこか脆く見える。手元には ${F("~P")} もある。${F("P")} の世界に ${F("~P")} を持ち込めば――その世界ごと、亀裂に崩れ落ちるだろう。崩れた世界では、どの扉も開く。`,
             d: `${F("P")} の世界は亀裂に呑まれ、${F("Q")} の世界では鍵 ${F("Q")} がそのまま扉を開けた。成り立たない場合は、矛盾として片付けられる。` },
    "4-5": { t: `地下室の最奥で、番人が静かに語る。「${F("P")} か、${F("P")} でないか。それを確かめる術は、この地下室にはない。だが、それを否定することが矛盾だとは示せるはずだ」。扉には ${F("~~(P|~P)")}。同じ鍵は、何度使ってもかまわない。`,
             d: `排中律そのものではなく、その影――二重否定の扉が開いた。この先の階層では、古い魔導書があなたを待っている。` },
    "6-1": { t: `魔導書を手にした最初の部屋。扉には ${F("~~P->P")}。「${F("P")} でないことはない、ならば ${F("P")}」――前の階層では、どうしても開けられなかった形の扉だ。だが今のあなたには術がある。開けたい扉の前で、「この扉は開かない」と唱えてみるのだ。`,
             d: `「${F("P")} でない」と唱えた瞬間、手元の ${F("~~P")} とぶつかって亀裂が開いた。矛盾が生まれたのなら、${F("P")} ははじめから成り立っていたのだ。` },
    "6-2": { t: `扉に刻まれているのは ${F("P|~P")}。${F("P")} か、${F("P")} でないか。ありふれた言葉に見えるが、地下室ではその影しか開けられなかった扉だ。扉の ∨ でいきなり左右を選ぶと、どちらの道も行き止まりになる。まずは術を唱え、「この扉は開かない」という仮定から始めよう。`,
             d: `開かないと仮定した扉が、二度、矛盾を呼んだ。こうして排中律の扉は、術によって正面から開かれた。` },
    "c-imp": { t: `壁に掛かる鍵は ${F("P->Q")}。扉には ${F("~P|Q")}。「${F("P")} ならば ${F("Q")}」を「${F("P")} でないか、${F("Q")}」と言い換えよ、ということらしい。だが、∨ の左右のどちらを選ぶべきかは、まだ分からない。迷ったときこそ、術の出番だ。`,
             d: `術の部屋で ${F("P")} が成り立つかどうかを確かめるうちに、選ぶべき側がおのずと見えてきた。言い換えの扉は、静かに開いた。` },
    "c-contra": { t: `鍵は ${F("~Q->~P")}、扉は ${F("P->Q")}。数学者たちが「対偶を示せば十分だ」と言うとき、彼らはこの扉をくぐっている。${F("P")} を持って部屋に入っても、${F("Q")} の扉はそのままでは開かない。部屋の中で、もう一度術を唱える必要がありそうだ。`,
             d: `「${F("Q")} でない」と唱えると、鍵 ${F("~Q->~P")} が ${F("~P")} を生み、手元の ${F("P")} とぶつかった。対偶から元の命題へ――その道には、術が欠かせなかった。` },
    "6-3": { t: `この部屋に入ると、魔導書が固く閉じてしまった。術を封じる結界が張られているらしい。代わりに、床には排中律 ${F("P|~P")} の鍵が置かれている。術なしで、${F("~~P")} から ${F("P")} を導けるだろうか。もし導けるなら、排中律こそが術の正体の一つということになる。`,
             d: `${F("P")} の世界ではそのまま、${F("~P")} の世界では ${F("~~P")} とぶつかって亀裂が開いた。排中律の鍵があれば、術は要らなかった。` },
    "6-4": { t: `この部屋でも魔導書は閉じたままだ。代わりに置かれているのは、二重否定を取り去る鍵 ${F("~~(P|~P)->(P|~P)")}。地下室の最奥で開けた ${F("~~(P|~P)")} の扉を、覚えているだろうか。あのときの道筋が、ここでもう一度役に立つ。`,
             d: `地下室で開いた影の扉と、二重否定を取り去る鍵。二つが合わさって、排中律の扉が開いた。背理法、排中律、二重否定除去――三つの術は、互いに互いを呼び出せる。` },
    "6-5": { t: `書庫の奥にそびえる塔の扉には ${F("~P|~Q")}。手元の鍵は ${F("~(P&Q)")}――「${F("P")} と ${F("Q")} が両方成り立つことはない」。ならば、どちらかは成り立たないはずだ。ただし、どちらが成り立たないのかは、鍵も教えてくれない。術は何度唱えてもかまわない。`,
             d: `重ねて唱えた術が ${F("P")} と ${F("Q")} をともに引き出し、${F("~(P&Q)")} とぶつけた。ド・モルガンの塔の頂で、魔導書の最後の頁がめくれた。` },
    "r-conv": { t: `最初の鏡の前の扉には ${F("Q->P")}。鍵は ${F("P->Q")}。「${F("P")} ならば ${F("Q")}」から、その逆を導けというのだ。だが、逆向きの道は本当にあるのだろうか。${F("P")} と ${F("Q")} に真か偽を割り当てて、鍵は真に、扉は偽に映る鏡を探してみよう。`,
                d: `${F("P")} を偽、${F("Q")} を真に映した鏡の中で、鍵は真に、扉は偽に光った。逆向きの道は、はじめから存在しなかったのだ。` },
    "r-inv": { t: `次の扉には ${F("~P->~Q")}。「${F("P")} ならば ${F("Q")}」の「裏」だ。正しく導けるのは対偶 ${F("~Q->~P")} のほうだと、あなたはもう知っている。では、裏はどうか。鏡に問うてみよう。`,
               d: `${F("P")} が偽で ${F("Q")} が真の鏡では、${F("~P")} は真、${F("~Q")} は偽。裏の扉は偽りだった。` },
    "r-or": { t: `鍵は ${F("P|Q")}、扉は ${F("P")}。「${F("P")} か ${F("Q")} か」と言われただけで、${F("P")} だと決めつけてよいのだろうか。分岐の階層で、あなたが両方の世界を歩かされた理由が、この鏡に映っているはずだ。`,
              d: `${F("P")} が偽で ${F("Q")} が真の鏡が、答えを示した。「どちらか」から、片方を選び取ることはできない。` },
    "r-dm": { t: `塔で開けた扉によく似た扉が、ここにもある。鍵は ${F("~(P&Q)")}、扉は ${F("~P&~Q")}。否定を配るとき、∧ と ∨ を入れ替えるのを忘れていないだろうか。鏡がそれを確かめてくれる。`,
              d: `片方だけが真に映る鏡では、鍵は真、扉は偽だった。否定を配るなら、∧ は ∨ に変わらねばならない。` },
    "6-6": { t: `鏡の広間の最奥で、番人が四枚の扉を指し示す。「この中には、術で開く本物の扉と、鏡が偽りを暴く扉が混じっている。見極めよ」。本物と見たなら術も使って開け、偽りと見たなら、それを暴く鏡を一枚見つけ出すのだ。`,
             d: `四枚の扉の真偽を見極めると、番人は鏡の一枚を外し、奥の階段を示した。その先では、術そのものが通じないという。` },
    "5-1": { t: `最初の扉には ${F("P|~P")}。前の階層では術で開いた扉だ。だが術のない今、これを開ける道はあるのだろうか。今はまだ ${F("P")} とも ${F("~P")} とも言えない――けれど、未来には ${F("P")} が分かるかもしれない。そんな塔を建てれば、この扉が偽物だと示せる。`,
             d: `一階では灯りがともらず、二階で ${F("P")} がともる塔。一階では ${F("P")} も ${F("~P")} も光らなかった。術がなければ、排中律は偽物の扉だ。` },
    "5-2": { t: `次の扉は ${F("~~P->P")}。術があれば、魔導書の最初の部屋で開けた扉だ。「${F("P")} でないことはない」と分かっていても、今まさに ${F("P")} が分かっているとは限らない。さっき建てた塔を、もう一度思い出してみよう。`,
             d: `同じ塔の一階では、${F("~~P")} は光るのに ${F("P")} は光らなかった。二重否定を外すのにも、術が要るのだ。` },
    "5-3": { t: `否定の印を一つも持たない扉が現れた。${F("((P->Q)->P)->P")}――「パースの扉」と呼ばれるものだ。否定がないから術も要らない、と思うのは早い。この扉もまた、時の塔の上では偽物の顔を見せる。`,
             d: `一階では何もともらず、二階で ${F("P")} だけがともる塔で、扉は一階で光らなかった。否定がなくても、術でしか開かない扉はある。` },
    "5-4": { t: `ド・モルガンの塔で開いた扉が、ここでは偽物として立ちはだかる。鍵は ${F("~(P&Q)")}、扉は ${F("~P|~Q")}。時の塔の階段は、枝分かれさせることもできる。ある未来では ${F("P")} が、別の未来では ${F("Q")} が分かる――どちらの未来に進むかは、まだ決まっていない。`,
             d: `二つに枝分かれした塔の根元では、${F("P")} と ${F("Q")} が両方ともる未来はないのに、${F("~P")} も ${F("~Q")} も光らなかった。未来が決まっていなければ、「どちらかが成り立たない」とは言えない。` },
    "5-5": { t: `術の届かない階層の最奥。番人が三枚の扉を示して言う。「術なしで開く本物と、術がなければ開かない偽物を見極めよ。前の階層で正しかった扉が、ここでは偽物かもしれぬ」。本物と見たなら開け、偽物と見たなら時の塔で暴くのだ。`,
             d: `三枚の扉を見極めると、番人は時の塔の鍵をあなたに託した。命題の階層はここまで。この先には、住人たちの住む街が広がっている。` },
    "7-1": { t: `街の最初の扉には ${F("!x.P(x)")}。「すべての住人は ${F("P")}」という意味だ。手元の鍵は ${F("!x.(P(x)&Q(x))")}――「すべての住人は ${F("P")} であり、${F("Q")} でもある」。扉の ∀ に触れると、名前のない住人 ${termH("a")} を連れて部屋に入れる。${termH("a")} が誰であっても成り立つことを示せば、全員について示したことになる。`,
             d: `鍵の ∀ に ${termH("a")} を当てはめ、束ねられた ${F("P(a)")} を取り出すと、扉は静かに開いた。名前のない一人について示せたなら、それは全員について示せたのと同じことだ。` },
    "f-rename": { t: `扉に刻まれているのは ${F("(!x.P(x))->(!y.P(y))")}。左と右で違うのは、${termH("x")} と ${termH("y")} という文字だけだ。住人に呼び名を付けるとき、${termH("x")} と呼ぼうが ${termH("y")} と呼ぼうが、指しているものは変わらない――それを確かめる扉らしい。`,
                  d: `${termH("x")} と呼んでも ${termH("y")} と呼んでも、住人 ${termH("a")} は ${termH("a")} のままだった。束縛された変数の名前は、意味を変えない。` },
    "7-2": { t: `掲示板に二枚の札が貼られている。「すべての住人は、${F("P")} ならば ${F("Q")}」「すべての住人は ${F("P")}」。扉には ${F("!x.Q(x)")}。部屋に連れてきた住人 ${termH("a")} に、二枚の札を両方とも当てはめてみよう。∀ の鍵は、同じ住人に何度でも使える。`,
             d: `${termH("a")} は ${F("P")} であり、${F("P")} ならば ${F("Q")}。二枚の札が同じ住人の上で重なり、扉が開いた。` },
    "f-barbara": { t: `広場の古い石碑に、二行の文が刻まれている。「すべての ${F("P")} は ${F("Q")} である」「すべての ${F("Q")} は ${F("R")} である」。そして扉には「すべての ${F("P")} は ${F("R")} である」。遠い昔の賢者が説いた三段論法だ。名前のない住人 ${termH("a")} を連れて、その道筋をたどってみよう。`,
                   d: `${termH("a")} が ${F("P")} なら ${F("Q")}、${F("Q")} なら ${F("R")}。石碑の二行は、一人の住人の上でつながった。三段論法は、∀ と → の組み合わせだったのだ。` },
    "f-alll": { t: `この区画の札には ${F("!z.(A->B(z))")}。${F("A")} は住人に関わりのない命題――たとえば「今日は晴れている」のようなものだ。扉には ${F("A->!x.B(x)")}。住人に関わらない条件なら、∀ の外へ出してもかまわないはずだ。`,
                d: `${F("A")} を持って部屋に入り、名前のない住人 ${termH("a")} を連れてくると、札の ∀ は ${termH("a")} の上で ${F("A->B(a)")} になった。住人に関わらない ${F("A")} は、∀ の外へ出せる。` },
    "f-allr": { t: `さっきとは逆向きの扉だ。鍵は ${F("A->!x.B(x)")}、扉は ${F("!z.(A->B(z))")}。まず名前のない住人 ${termH("a")} を連れて部屋に入り、次に ${F("A")} を持ってもう一つ奥の部屋へ。${F("A")} が手に入れば、鍵から ${F("!x.B(x)")} を引き出せる。`,
                d: `${F("A")} から引き出した ${F("!x.B(x)")} を ${termH("a")} に当てはめると、扉が開いた。住人に関わらない ${F("A")} をまたいで、∀ は外へも内へも動かせる。` },
    "f-dist": { t: `街の中心にある時計塔。その扉の前で、番人が言う。「すべての住人が ${F("P")} かつ ${F("Q")} なら、すべての住人は ${F("P")} であり、すべての住人は ${F("Q")} である。それを示せ」。∧ で分かれた二枚の扉の先では、それぞれ別の名前のない住人を連れて行くことになる。`,
                d: `二枚の扉の先で、二人の名前のない住人 ${termH("a")} と ${termH("b")} が、それぞれの役目を果たした。時計塔の鐘が鳴り、街の奥の門が開く。` },
    "7-3": { t: `最初の扉には ${F("?x.P(x)")}――「${F("P")} である住人がいる」。手元の鍵は ${F("?x.(P(x)&Q(x))")}。鍵の ∃ に触れると、${F("P")} と ${F("Q")} を満たす「誰か」を部屋に連れて来られる。正体は分からないが、その誰かこそが、扉の求める証人になれるはずだ。`,
             d: `鍵が連れてきた誰か ${termH("a")} を証人に立てると、扉は開いた。正体が分からなくても、証人としては十分だった。` },
    "f-wit": { t: `掲示板には、住人 ${termH("a")} と住人 ${termH("b")} がどちらも ${F("P")} だと書かれている。扉は ${F("?x.P(x)")}。証人は一人いれば足りる。${termH("a")} を選んでも、${termH("b")} を選んでもかまわない。ただし、これだけで「全員が ${F("P")}」とは言えない――街には、${termH("a")} でも ${termH("b")} でもない住人もいるのだから。`,
               d: `${termH("a")} を証人に立てると、扉はあっさり開いた。存在を示すには、一人見つければ十分だ。` },
    "f-ae1": { t: `鍵は ${F("A&?x.B(x)")}、扉は ${F("?x.(A&B(x))")}。${F("A")} は住人に関わらない命題だ。扉の ∃ でいきなり証人を選んでも、誰が ${F("B")} なのか分からなければ行き詰まる。まず鍵の ∃ から「誰か」を連れてきて、それから証人に立てるのが順序というものだ。`,
               d: `鍵が連れてきた誰か ${termH("a")} は ${F("B")} であり、${F("A")} も成り立っている。${termH("a")} を証人に立てると、扉は開いた。証人を選ぶのは、相手が分かってからでいい。` },
    "f-ae2": { t: `今度は逆向きだ。鍵は ${F("?x.(A&B(x))")}、扉は ${F("A&?x.B(x)")}。鍵から誰か ${termH("a")} を連れてくれば、${F("A")} も、${F("B")} である住人の存在も、まとめて手に入るはずだ。`,
               d: `${termH("a")} は ${F("A")} と ${F("B(a)")} を携えていた。${F("A")} は ${F("A")} の扉へ、${termH("a")} は ${F("?x.B(x)")} の証人へ。二枚の扉が続けて開いた。` },
    "f-ex1": { t: `札には ${F("!z.(A(z)->B)")}――「どの住人も、${F("A")} ならば ${F("B")}」。${F("B")} は住人に関わらない命題だ。扉は ${F("(?x.A(x))->B")}。${F("A")} である住人がいると分かったら、その誰かに札を当てはめてみればよい。誰であっても、札は当てはまるのだから。`,
               d: `${F("A")} である誰か ${termH("a")} に札を当てはめると、${F("B")} が出てきた。誰であっても ${F("B")} が出るのなら、それが誰なのかを知る必要はない。` },
    "f-ex2": { t: `逆向きの扉だ。鍵は ${F("(?x.A(x))->B")}、扉は ${F("!z.(A(z)->B)")}。名前のない住人 ${termH("a")} を連れて部屋に入り、${termH("a")} が ${F("A")} だと仮定する。すると、${termH("a")} 自身が「${F("A")} である住人がいる」ことの証人になる。`,
               d: `${termH("a")} を証人に立てて ${F("?x.A(x)")} を作ると、鍵から ${F("B")} が出てきた。名前のない住人が、そのまま証人になれることもある。` },
    "7-4": { t: `街の外れの古い屋敷。門の札には ${F("~?x.P(x)")}――「${F("P")} である住人はいない」。扉には ${F("!x.~P(x)")}――「どの住人も ${F("P")} ではない」。同じことを言っているように聞こえるが、示すには手順がいる。名前のない住人 ${termH("a")} が ${F("P")} だと仮定すれば、札とぶつかって亀裂が開くだろう。`,
             d: `${termH("a")} が ${F("P")} なら、${termH("a")} が証人となって ${F("?x.P(x)")} が生まれ、札と矛盾した。誰も ${F("P")} ではない――屋敷の扉は、そう告げて開いた。` },
    "7-5": { t: `扉の文字は ${F("!x.?y.R(x,y)")}、鍵は ${F("?y.!x.R(x,y)")}。量化子の並びが入れ替わっている。「ある一人 ${termH("y")} が、全員と ${F("R")} の関係にある」なら、「誰にでも、${F("R")} の関係にある相手がいる」はずだ。ただし、証人を選ぶ順番を誤ると、扉は開かない。`,
             d: `鍵が連れてきた ${termH("b")} を、名前のない住人 ${termH("a")} の相手に選ぶと、扉は開いた。全員と関係する一人がいるなら、誰にとっても相手はいる。だが、その逆が言えるとは限らない。` },
    "f-mouse": { t: `街の地下倉庫には、ネズミとネコが棲んでいる。番人が告げる。「すべてのネズミに恐れられているネコが、一匹いる。ならば、どのネズミにも、恐れているネコがいるはずだ。それを示せ」。${F("M(x)")} は ${termH("x")} がネズミ、${F("C(x)")} は ${termH("x")} がネコ、${F("F(x,y)")} は ${termH("x")} が ${termH("y")} を恐れる、という意味だ。`,
                 d: `倉庫の主のネコ ${termH("b")} が、どのネズミにとっても恐れる相手だった。番人はうなずき、街の門の外へ続く道を指した。その先では、ふたたび魔導書の力が目を覚ますという。` },
    "f-barber": { t: `島には床屋が一人いる。名は ${termH("p")}。島の掟にはこうある――「自分で髪を切らない住人の髪は、すべて ${termH("p")} が切る」。では、${termH("p")} 自身の髪は誰が切るのか。扉には ${F("H(p,p)")}、「${termH("p")} は自分の髪を切る」。正面から確かめる手立てはない。術を唱えてみよう。`,
                  d: `「${termH("p")} は自分の髪を切らない」と仮定すると、掟によって ${termH("p")} が ${termH("p")} の髪を切ることになり、矛盾した。床屋は、自分の髪を自分で切っていたのだ。` },
    "f-nen": { t: `島の古文書には ${F("~?x.~P(x)")}――「${F("P")} でない住人はいない」と記されている。扉は ${F("!x.P(x)")}。名前のない住人 ${termH("a")} を連れてきても、${termH("a")} が ${F("P")} だと直接示す手がかりはない。だが、${termH("a")} が ${F("P")} でないと仮定すれば、${termH("a")} こそが、古文書がいないと言う住人になってしまう。`,
               d: `${F("P")} でない ${termH("a")} を証人に立てると、古文書と矛盾した。反例がどこにもいないなら、全員が ${F("P")} だ。` },
    "8-1": { t: `扉には ${F("?x.~P(x)")}――「${F("P")} でない住人がいる」。手元の鍵は ${F("~!x.P(x)")}、「全員が ${F("P")} というわけではない」。数学でも頻繁に使われる推論だが、誰が ${F("P")} でないのか、手がかりはまったくない。証人を直接は差し出せない以上、術を重ねて道を開くしかない。`,
             d: `二度唱えた術が、「${F("P")} でない住人がいないなら、全員が ${F("P")} になってしまう」という矛盾を暴いた。名指しはできなくても、そういう住人は確かにいる。` },
    "f-nan": { t: `鍵は ${F("~!x.~P(x)")}――「どの住人も ${F("P")} でない、ということはない」。扉は ${F("?x.P(x)")}。否定が二重に重なった鍵から、${F("P")} である住人の存在を引き出せというのだ。ここでも、証人は直接には見つからない。`,
               d: `${F("P")} である住人がいないと仮定すると、どの住人も ${F("P")} でないことになり、鍵と矛盾した。否定の否定の奥に、証人の存在が隠れていた。` },
    "f-const": { t: `島の掟には ${F("!x.(P(x)|Q)")}――「どの住人も、${F("P")} であるか、さもなくば ${F("Q")}」。${F("Q")} は住人に関わらない命題だ。扉は ${F("(!x.P(x))|Q")}。${F("Q")} が成り立つかどうかで場合を分けられれば話は早いが、それには術の力が要る。`,
                 d: `${F("Q")} が成り立たないなら全員が ${F("P")}、成り立つなら ${F("Q")}。術によって場合が分かれ、扉は開いた。魔法なしでは、この扉は開かない。` },
    "8-2": { t: `島の酒場で、老人が奇妙な話をする。「この酒場には、ある一人がいる。その者が飲むなら、全員が飲むのだ」。そんな都合のよい者がいるものか――そう思うが、扉には ${F("?x.(P(x)->!y.P(y))")} と刻まれている。住人は少なくとも一人いる。証人を選び直すことを恐れずに、術を唱えよう。`,
             d: `全員が飲むなら誰を選んでもよく、飲まない者がいるならその者を選べばよい。老人は笑ってグラスを掲げた。古典論理の不思議な定理が、ここに開いた。` },
    "s-ex": { t: `最初の作業台の札には、「${F("P")} である住人がいる」から「全員が ${F("P")}」を導け、とある。だが、本当にそう言えるだろうか。住人が二人いて、片方だけが ${F("P")} の模型を作ってみよう。`,
              d: `住人 1 は ${F("P")}、住人 2 は ${F("P")} でない模型の中で、鍵は真に、扉は偽になった。誰かがそうだからといって、全員がそうだとは限らない。` },
    "s-pos": { t: `次の札は、街の順序の扉によく似ている。鍵は ${F("?x.!y.R(x,y)")}、扉は ${F("!x.?y.R(x,y)")}。並びは同じ「∃∀ から ∀∃」だが、${F("R")} のどちらの席の変数を量化しているかが違う。わずかな違いが、扉の真偽を分けることがある。`,
               d: `住人 1 は誰とでも ${F("R")} の関係にあるが、住人 2 には ${F("R")} の相手が一人もいない。そんな模型で、扉は偽になった。変数の位置ひとつで、意味は大きく変わる。` },
    "s-mouse": { t: `工房の奥に、地下倉庫の模型が置かれている。札には、「どのネズミにも、恐れるネコがいる」から「すべてのネズミに恐れられているネコがいる」を導け、とある。倉庫で開いた扉の、ちょうど逆向きだ。ネズミは少なくとも一匹いるという。`,
                 d: `二匹のネズミが、それぞれ別のネコを恐れる模型。どのネズミにも恐れる相手はいるが、全員に恐れられるネコはいなかった。逆向きの扉は、偽物だったのだ。` },
    "s-nomouse": { t: `札には、「すべてのネズミは、すべてのネコを恐れる」から「あるネズミが、あるネコを恐れている」を導け、とある。ネコは少なくとも一匹いるという。一見もっともらしいが、「すべてのネズミは」という言葉は、ネズミがいることまでは約束していない。`,
                   d: `ネコが一匹いて、ネズミは一匹もいない模型。「すべてのネズミは…」は、確かめる相手がいないまま真となり、扉は偽になった。` },
    "8-3": { t: `工房の主である番人が、三枚の扉を並べる。「量化子の並びを入れ替えた扉、∀ を ∨ に配った扉。本物と偽物が混じっている。本物と見たなら開け、偽物と見たなら、模型の街でそれを暴け」。`,
             d: `三枚の扉を見極めると、番人は工房の奥の扉を開けた。その先には、城壁で区切られた区画がいくつも連なる街が広がっている。` },
    "9-1": { t: `親方が最初に示した扉には ${F("!x.!y.(x = y -> y = x)")}。「${termH("x")} と ${termH("y")} が等しいなら、${termH("y")} と ${termH("x")} も等しい」。当たり前に思えるが、この工房で使える技は二つだけだ。両辺がまったく同じなら、扉は開く。そして等式の鍵があれば、扉の中の式を書き換えられる。`,
             d: `等式の鍵で書き換えると、扉の両辺は同じ形に揃い、そのまま開いた。親方はうなずき、最初の定理カード「等号の対称律」を手渡した。` },
    "9-2": { t: `次の扉は ${F("!x.!y.!z.(x = y -> (y = z -> x = z))")}。二本の等式を、一本につなげよという。${F("x = y")} と ${F("y = z")} の鍵を手にしたら、扉の中のどこを書き換えれば、鍵と同じ形になるだろうか。`,
             d: `二本目の等式で扉を書き換えると、一本目の鍵がそのまま扉に合った。二枚目の定理カード「等号の推移律」が、カード入れに収まる。` },
    "9-3": { t: `炉の脇には、住人を別の住人に変える不思議な型がある。型 ${termH("f")} に住人 ${termH("x")} を流し込むと、住人 ${termH({ f: "f", args: ["x"] })} ができあがる。扉には ${F("!x.!y.(x = y -> f(x) = f(y))")}。等しい住人を同じ型に流し込めば、できあがるものも等しいはずだ。`,
             d: `等式の鍵で書き換えると、扉の両辺は同じ ${termH({ f: "f", args: ["x"] })} で揃った。三枚目の定理カード「関数と等号」が手に入る。` },
    "9-4": { t: `作業台に二本の鍵、${F("a = b")} と ${F("c = b")}。扉は ${F("a = c")}。だが、この工房の書き換えは、等式の右辺を左辺に置き換える一方向だけだ。${F("c = b")} のままでは、扉の ${termH("c")} に手が届かない。入口の広間に置かれた、あのカードの出番だ。`,
             d: `カード「等号の対称律」で ${F("c = b")} を ${F("b = c")} に裏返すと、二本の等式がつながった。一度鍛えた定理は、こうして何度でも使える。` },
    "9-5": { t: `工房の奥の炉の前で、親方が腕を組む。「左から掛けても変わらない ${termH("e")} と、右から掛けても変わらない ${termH("e'")}。この二つが同じものだと示してみよ」。扉には ${F("e = e'")}。手がかりは一つ――${termH("e")} と ${termH("e'")} を掛け合わせた ${termH({ f: "*", args: ["e", "e'"] })} を、両側から眺めてみることだ。`,
             d: `${termH({ f: "*", args: ["e", "e'"] })} は、${termH("e")} の側から見れば ${termH("e'")}、${termH("e'")} の側から見れば ${termH("e")}。二つの見方がつながり、扉は開いた。親方は満足げに炉の火を落とし、工房の外に広がる学者たちの街を指さした。` },
    "10-5": { t: `最初の扉には ${F("A ∩ B ⊆ A")}。「${termH("A")} と ${termH("B")} の両方に属する区画は、${termH("A")} に含まれる」。点線の ⊆ に触れると、扉は「どの住人も、${termH({ f: "∩", args: ["A", "B"] })} に属するなら ${termH("A")} に属する」と書き直されるはずだ。`,
              d: `書き下してみれば、∀ と → と ∧ の、見慣れた扉だった。新しい印も、定義をたどれば古い言葉に戻る。` },
    "x-union": { t: `次の扉は ${F("A ⊆ A ∪ B")}。${termH({ f: "∪", args: ["A", "B"] })} は、${termH("A")} か ${termH("B")} のどちらかに属する住人の区画だ。${termH("A")} の住人なら、当然そこに含まれるだろう。∪ の点線の向こうには、懐かしい ∨ の扉が待っている。`,
                 d: `∪ を書き下すと ∨ の扉が現れ、左を選べば鍵がそのまま合った。和集合は、∨ の言葉で書かれた区画だった。` },
    "x-swap": { t: `扉には ${F("A ∩ B ⊆ B ∩ A")}。区画の名前の並びが入れ替わっているだけに見える。鍵の ∩ も、扉の ∩ も、どちらも書き下してしまえばいい。`,
                d: `書き下された鍵から二本を取り出し、並びを入れ替えて扉に収めた。最初の階層で、鎖の鍵をほどいたときと同じ手つきだ。` },
    "10-6": { t: `街の地図には、${termH("A")} は ${termH("B")} の中に、${termH("B")} は ${termH("C")} の中にあると記されている。扉は ${F("A ⊆ C")}。城壁の内側の、さらに内側。${termH("A")} の住人は、間違いなく ${termH("C")} の中にいるはずだ。`,
              d: `${termH("A")} の住人を一人連れてきて、${F("A ⊆ B")}、${F("B ⊆ C")} の順に当てはめると、${termH("C")} の門が開いた。包含は、∀ と → の鎖でつながっている。` },
    "x-mono": { t: `札には ${F("A ⊆ B")}。扉は ${F("A ∩ C ⊆ B ∩ C")}。${termH("A")} が ${termH("B")} に含まれるなら、どちらにも同じ区画 ${termH("C")} を重ねても、包含は崩れないはずだ。扉の ∩ を書き下すと、二枚の扉に分かれるだろう。`,
                d: `片方の扉には ${F("A ⊆ B")} を当てはめ、もう片方には ${termH("C")} の鍵をそのまま差した。同じものを重ねても、包含は保たれる。` },
    "10-8": { t: `街の外れに、城壁の「外側」を表す ᶜ の印の扉があった。${F("x ∈ Aᶜ")} は「${termH("x")} は ${termH("A")} に属さない」という意味だ。扉には ${F("(A ∪ B)ᶜ ⊆ Aᶜ ∩ Bᶜ")}。${termH({ f: "∪", args: ["A", "B"] })} に属さない者は、${termH("A")} の外にも、${termH("B")} の外にもいる――定義をすべて書き下して、確かめてみよう。`,
              d: `書き下された扉は、否定と ∨ と ∧ の組み合わせだった。地下室で覚えた亀裂の技が、ここでも扉を開けた。` },
    "x-dmc": { t: `街の最後の城門。番人が告げる。「${termH("A")} と ${termH("B")} の両方には属さない者は、${termH("A")} の外か、${termH("B")} の外にいる。それを示せ」。扉には ${F("(A ∩ B)ᶜ ⊆ Aᶜ ∪ Bᶜ")}。ド・モルガンの塔で開いた扉の、集合の姿だ。前の扉とは違い、こちらの向きには、あの術が要る。`,
               d: `背理の術を重ねて、城門は開いた。集合の言葉も、書き下せば論理の言葉に戻る――番人はそう言って、街の外れから響いてくる金槌の音のほうを指さした。` },
    "10-1": { t: `最初の学舎の壁には、順序 ≤ の掟が掲げられている。「${F("x <= y")} かつ ${F("y <= x")} なら、${F("x = y")}」。さらに、${termH("m")} も ${termH("n")} も、どの住人と比べても小さくない――どちらも最大の住人だという。扉は ${F("m = n")}。最大の者が二人いるなら、その二人は同じ者のはずだ。`,
              d: `${F("m <= n")} と ${F("n <= m")} を揃えて掟に当てはめると、${F("m = n")} が出てきた。最大の者は、ただ一人だった。` },
    "10-2": { t: `次の学舎の掟は二つ。「自分自身より小さい者はいない」「${F("x < y")}、${F("y < z")} なら ${F("x < z")}」。扉は「${F("x < y")} なら、${F("y < x")} ではない」。もし ${F("x < y")} と ${F("y < x")} が同時に成り立てば、掟によって ${F("x < x")} になってしまう――その矛盾を導けばよい。`,
              d: `${F("x < y")} と ${F("y < x")} をつなぐと ${F("x < x")} が生まれ、一つ目の掟とぶつかった。狭い順序は、向きを逆にできない。` },
    "10-3": { t: `写像の学舎には、二つの型 ${termH("f")} と ${termH("g")} が飾られている。どちらも「違う住人を、違う住人に移す」型――単射だ。扉は、二つを続けて使った ${termH({ f: "g", args: [{ f: "f", args: ["x"] }] })} も単射であることを求めている。∀ の鍵には、住人だけでなく ${termH({ f: "f", args: ["a"] })} のような項も当てはめられる。`,
              d: `${termH("g")} の掟に ${termH({ f: "f", args: ["a"] })} と ${termH({ f: "f", args: ["b"] })} を当てはめ、次に ${termH("f")} の掟に ${termH("a")} と ${termH("b")} を当てはめた。二つの単射を重ねても、単射のままだった。` },
    "10-4": { t: `隣の学舎には、「どの住人も、型 ${termH("f")} で作られたものだ」――全射の掟が掲げられている。型 ${termH("g")} も全射だという。扉は、${termH({ f: "g", args: [{ f: "f", args: ["x"] }] })} も全射であること。住人 ${termH("z")} を一人連れてきたら、${termH("g")} の掟から ${termH("z")} の素を、${termH("f")} の掟からさらにその素を、順にたどってみよう。`,
              d: `${termH("z")} の素の素を証人に立てると、${termH({ f: "g", args: [{ f: "f", args: ["a"] }] })} が ${termH("z")} に等しいことが揃った。存在の鍵から連れてきた誰かが、次の証人になる。` },
    "10-7": { t: `学者の街の最奥、群論の講堂。演壇の番人が、三つの公理を指し示す――結合律、左単位元、左逆元。そして告げる。「${F("a * b = a * c")} なら、${F("b = c")} である。左から掛けた ${termH("a")} を消し去ってみせよ」。この講堂では、等式を両方の向きに使ってよい。`,
              d: `${termH("a")} の逆元を左から掛け、結合律で組み替え、単位元を消した。${termH("b")} と ${termH("c")} のあいだに立ちはだかっていた ${termH("a")} は、跡形もなく消え去った。番人は、講堂の奥の工房へあなたを案内した。` },
    "11-1": { t: `作業台の札には、${F("P")} から ${F("Q")}、${F("Q")} から ${F("S")}、${F("S")} から ${F("T")}、${F("T")} から ${F("R")} へと続く四本の掟。そして住人 ${termH("a")}、${termH("b")}、${termH("c")} はどれも ${F("P")} だという。扉は ${F("R(a) & (R(b) & R(c))")}。同じ鎖を三度たどるのは骨が折れる。「${F("P")} ならば ${F("R")}」という道具を、先に一つ作ってしまおう。`,
              d: `一度作った道具 ${F("!x.(P(x) -> R(x))")} を、${termH("a")}、${termH("b")}、${termH("c")} に順に当てはめるだけで、三枚の扉が開いた。補題は、繰り返しを一度にまとめる。` },
    "11-2": { t: `講堂で開けた左からの消去の扉を、今度は道具として鍛え直す。特定の ${termH("a")}、${termH("b")}、${termH("c")} についてではなく、すべての住人について――${F("!x.!y.!z.(x * y = x * z -> y = z)")} を示せば、定理カード「左消去律」が手に入る。`,
              d: `すべての住人について消去律が鍛え上がり、新しい定理カードが光を帯びた。一度示した定理は、もう示し直す必要がない。` },
    "11-3": { t: `工房の主が、最後の課題を出す。「群の掟は、${termH("e")} を左から掛けても変わらない、としか言っていない。だが実は、右から掛けても変わらないのだ。それを示せ」。扉は ${F("!x.(x * e = x)")}。鍛えたばかりの左消去律のカードが、ここで生きるはずだ。`,
              d: `${termH("x")} の逆元を左から掛けた二つの式を、左消去律がつないだ。${termH("e")} は、右からも単位元だった。工房の主は道具箱を閉じ、さらに深い階層――数の塔への階段を示した。` },
    "12-1": { t: `一階の扉には ${F("s(0) + s(0) = s(s(0))")}。つまり 1+1=2 だ。誰もが知っている事実だが、この塔では、入口の二つの掟だけを使って示さねばならない。掟を当てはめるたびに、式は少しずつ形を変えていく。`,
              d: `二つ目の掟で ${termH({ f: "+", args: [{ f: "s", args: ["0"] }, { f: "s", args: ["0"] }] })} を ${termH({ f: "s", args: [{ f: "+", args: [{ f: "s", args: ["0"] }, "0"] }] })} に、一つ目の掟で ${termH({ f: "s", args: [{ f: "s", args: ["0"] }] })} に。掟だけで、1+1 は確かに 2 になった。` },
    "12-2": { t: `次の扉は ${F("!x.(0 + x = x)")}。掟は「${F("x + 0 = x")}」と言うが、「${F("0 + x = x")}」とは言っていない。塔のすべての階で成り立つことを、どう示せばいいのか。塔の守り人が教えてくれた――「一階で成り立ち、どの階からも次の階へ受け継がれるなら、それは塔のすべての階で成り立つ」。帰納法の扉だ。`,
              d: `一階では掟がそのまま成り立ち、${termH("a")} の階で成り立つなら ${termH({ f: "s", args: ["a"] })} の階でも成り立った。こうして ${F("0 + x = x")} は、塔の頂まで届いた。定理カード「0 を左から足す」が手に入る。` },
    "12-3": { t: `扉は ${F("!x.!y.(s(x) + y = s(x + y))")}。掟の二つ目は、右側の ${termH("s")} を外へ出す掟だった。今度は、左側の ${termH("s")} を外へ出せというのだ。${termH("x")} を一人の住人 ${termH("a")} に決めてから、${termH("y")} についての帰納法で塔を上っていこう。`,
              d: `一階でも、どの階から次の階へ上るときも、左の ${termH("s")} は外へ出られた。定理カード「後者を外に出す」が手に入る。` },
    "12-4": { t: `塔の中層の踊り場で、守り人が待っていた。「${termH({ f: "+", args: ["x", "y"] })} と ${termH({ f: "+", args: ["y", "x"] })} は同じ数だ。それを、すべての数について示せ」。${termH("y")} についての帰納法の扉。一階の出発点には「0 を左から足す」のカードが、次の階への階段には「後者を外に出す」のカードが、ちょうど合うはずだ。`,
              d: `二枚のカードが出発点と階段を支え、交換法則は塔のすべての階に届いた。守り人は新しいカード「足し算の交換法則」を授け、さらに上の階を指さした。` },
    "13-1": { t: `最初の扉は ${F("!x.(x * s(0) = x)")}。1 を掛けても数は変わらない、ということだ。掛け算の掟の二つ目を当てはめると ${termH({ f: "+", args: [{ f: "*", args: ["x", "0"] }, "x"] })}、さらに一つ目で ${termH({ f: "+", args: ["0", "x"] })}。その先に、足し算の階で鍛えたカードが待っている。`,
              d: `${termH({ f: "*", args: ["x", { f: "s", args: ["0"] }] })} は ${termH({ f: "+", args: [{ f: "*", args: ["x", "0"] }, "x"] })} に、${termH({ f: "+", args: ["0", "x"] })} に、そしてカードで ${termH("x")} に戻った。1 を掛けることは、何もしないのと同じだった。` },
    "13-2": { t: `扉は ${F("!x.(0 * x = 0)")}。掟は「${F("x * 0 = 0")}」と言うだけだ。0 を左から掛けても 0 になることは、またしても帰納法で塔を上って示さねばならない。`,
              d: `一階では掟のまま 0、次の階へは 0 を足しても変わらない。定理カード「0 を左から掛ける」が手に入る。` },
    "13-3": { t: `ここで一度、足し算に立ち返る。扉は ${F("!x.!y.!z.((x + y) + z = x + (y + z))")}。足す順番の括り方を変えても、結果は同じ――それを ${termH("z")} についての帰納法で示す。式が長くなるので、書き換えのたびに、どの項がどこへ移るかを見失わないように。`,
              d: `次の階へ上るたびに、二つ目の掟が ${termH("s")} を外へ運び、括り方の違いは消えた。定理カード「足し算の結合法則」が手に入る。` },
    "13-4": { t: `掛け算の階の頂で、守り人が問う。「${termH({ f: "*", args: ["x", { f: "+", args: ["y", "z"] }] })} と ${termH({ f: "+", args: [{ f: "*", args: ["x", "y"] }, { f: "*", args: ["x", "z"] }] })} は等しい。足し算と掛け算の掟をすべて使い、それを示せ」。${termH("z")} についての帰納法の扉。最後の仕上げには、鍛えたばかりの結合法則のカードが要る。`,
              d: `掛け算が足し算の上に分配され、結合法則のカードが最後の括弧を組み替えた。守り人は「分配法則」のカードを授け、塔の上層への扉を開いた。` },
    "14-1": { t: `一本目の巻物の題は「掛け算の結合法則」。扉は ${F("!x.!y.!z.((x * y) * z = x * (y * z))")}。${termH("z")} についての帰納法で示すが、次の階へ上る階段の最後で、分配法則のカードが必要になるはずだ。`,
              d: `分配法則のカードが、次の階への最後の一段をつないだ。破り取られていた頁が埋まり、定理カード「掛け算の結合法則」が手に入る。` },
    "14-2": { t: `二本目の巻物には、${F("s(x) * y = x * y + y")} と記されている。交換法則へ向かう前の、準備の一歩だ。この階層で最も長い計算になる。足し算の結合法則と交換法則、二枚のカードを手元に置き、${termH("y")} についての帰納法で上っていこう。`,
              d: `長い書き換えの果てに、二枚のカードが項を正しい位置へ運んだ。定理カード「後者を左から掛ける」が手に入る。` },
    "14-3": { t: `書庫の最奥、最後の巻物を守る番人が言う。「${termH({ f: "*", args: ["x", "y"] })} と ${termH({ f: "*", args: ["y", "x"] })} は同じ数だ。足し算の交換法則を示したときのことを、思い出すがよい」。出発点には「0 を左から掛ける」、次の階への階段には「後者を左から掛ける」――二枚のカードが、あのときと同じ役目を果たすはずだ。`,
              d: `二枚のカードが出発点と階段を支え、掛け算の交換法則は塔のすべての階に届いた。足し算と掛け算の法則が、すべて揃った。番人は、塔の最上層にある測量の間への階段を示した。` },
    "15-1": { t: `最初の扉は ${F("!x.(0 <= x)")}。0 はどの数よりも大きくない、ということだ。≤ を書き下せば、「0 に何かを足して ${termH("x")} にせよ」という扉になる。何を足せばいいかは、すぐに分かるだろう。`,
              d: `0 に ${termH("x")} そのものを足せば、カード「0 を左から足す」で ${termH("x")} になった。0 は、すべての数の出発点だ。` },
    "15-2": { t: `扉は ${F("!x.(x <= x)")}。自分自身に何を足せば、自分自身になるだろうか。`,
              d: `0 を足せば、掟のとおり ${termH("x")} のままだった。どの数も、自分自身以下である。` },
    "15-3": { t: `扉は ${F("!x.(x <= s(x))")}。${termH("x")} に何かを足して、${termH("x")} の次の数にせよ、という。証人には、住人だけでなく ${termH({ f: "s", args: ["0"] })} のような項も選べる。`,
              d: `${termH("x")} に ${termH({ f: "s", args: ["0"] })} を足すと、掟によって ${termH({ f: "s", args: [{ f: "+", args: ["x", "0"] }] })}、そして ${termH({ f: "s", args: ["x"] })} になった。次の数は、確かに大きい。` },
    "15-4": { t: `扉は ${F("!x.!y.(x <= y -> s(x) <= s(y))")}。${termH("x")} と ${termH("y")} の差を ${termH("c")} とすれば、${F("x + c = y")} だ。では、${termH({ f: "s", args: ["x"] })} と ${termH({ f: "s", args: ["y"] })} の差は何だろうか。∃ の鍵から差 ${termH("c")} を連れてきて、確かめてみよう。`,
              d: `${termH({ f: "s", args: ["x"] })} と ${termH({ f: "s", args: ["y"] })} の差も、やはり ${termH("c")} だった。カード「後者を外に出す」が、それを示した。次の数へ進んでも、大小の関係は変わらない。` },
    "15-5": { t: `測量の間の中央で、番人が問う。「${F("x <= y")}、${F("y <= z")} ならば ${F("x <= z")}。それを示せ」。${termH("x")} から ${termH("y")} への差 ${termH("d")} と、${termH("y")} から ${termH("z")} への差 ${termH("e")}。二つの差を、どうつなげばよいだろうか。選ぶ欄の下の入力欄には、${termH({ f: "+", args: ["d", "e"] })} のような項も書き込める。`,
              d: `${termH("d")} と ${termH("e")} を足した ${termH({ f: "+", args: ["d", "e"] })} を証人に立てると、結合法則のカードが式を整え、扉は開いた。塔の頂から見下ろす景色の先に、最後の広間――公理の鏡が見えた。` },
    "x-total": { t: `最初の鏡には、半順序の掟――反射律、反対称律、推移律――が映っている。扉は「どの二人も比べられる」。掟を満たしながら、比べられない二人がいる模型の街を作れるだろうか。`,
                 d: `自分自身とだけ比べられる二人の住人。掟はすべて守られているのに、二人は互いに比べられなかった。半順序の掟は、全順序までは約束しない。` },
    "x-antisym": { t: `次の鏡には、反射律と推移律だけが映っている。反対称律――「互いに ≤ なら同じ者」――は、そこにはない。掟が一つ欠けると、何が起こるだろうか。`,
                   d: `別々の二人が、互いに ≤ の関係にある模型。反射律と推移律は守られているのに、二人は同じ者ではなかった。` },
    "x-max": { t: `三枚目の鏡に、住人 ${termH("m")} が映っている。${termH("m")} より大きい者は、誰もいない――${termH("m")} は極大だ。では、${termH("m")} はすべての住人以上、つまり最大と言えるだろうか。${termH("m")} がどの住人を表すかも、模型の中で決めることになる。`,
               d: `${termH("m")} と比べられない住人が一人いる模型で、${termH("m")} は極大のまま、最大ではなかった。極大と最大は、似て非なるものだ。` },
    "x-rid": { t: `群の鏡が現れた。だが、そこに映る掟は結合律と左単位元だけで、左逆元の掟が欠けている。補題の工房では、三つの掟から右単位元を鍛え上げた。左逆元がなくても、同じことが言えるだろうか。積の表と、${termH("e")} がどの住人かを決めて、確かめてみよう。`,
               d: `「積はいつも右側の住人」という模型で、${termH("e")} は左からは単位元なのに、右からは単位元にならなかった。工房で鍛えた定理には、左逆元の掟が欠かせなかったのだ。` },
    "x-twoid": { t: `次の鏡には、二つの左単位元 ${termH("e")} と ${termH("e'")} が映っている。等号の工房では、左の単位元と右の単位元が一致することを示した。では、二つとも左の単位元のときは、どうだろうか。`,
                 d: `同じ「積はいつも右側の住人」の模型で、${termH("e")} と ${termH("e'")} を別々の住人に置いても、どちらも左単位元だった。二つの左単位元は、一致するとは限らない。` },
    "x-comm": { t: `モノイドの鏡――結合律と、左右の単位元の掟が映っている。扉は ${F("!x.!y.(x * y = y * x)")}、掛ける順番を入れ替えても同じ、という可換律だ。住人三人で、それが崩れる模型を作れるはずだ。`,
                d: `単位元以外の二人のあいだでは「積はいつも右側の住人」とした模型で、掛ける順番を入れ替えると、結果が違う住人になった。モノイドの掟は、可換律を約束しない。` },
    "x-order2": { t: `群の掟がすべて映った鏡。扉は「どの元も、2 乗すると単位元」。広間の片隅には、よく知られた群の模型が棚に並んでいる――既製の構造だ。いくつか手に取って、扉が偽となる群を探してみよう。`,
                  d: `三人の巡回群 ℤ/3 では、単位元以外の元を 2 乗しても、単位元には戻らなかった。群の掟は、そこまでは約束しない。` },
    "x-nonab": { t: `同じ群の鏡に、今度は可換律の扉が映る。掛ける順番を入れ替えても同じ――そうでない群は、最小でも六人の住人を必要とする。六かける六の積の表を手で埋めるのは大変だ。棚の模型の中に、ちょうどよいものがあるはずだ。`,
                 d: `三次対称群 S₃――三つのものの並べ替えの群――で、掛ける順番を入れ替えると結果が変わった。群の掟は、可換律を約束しない。` },
    "x-ind": { t: `数の塔の鏡には、足し算の二つの掟だけが映っている。帰納法の掟は、そこにはない。塔では帰納法で ${F("!x.(0 + x = x)")} を示した。帰納法がなければ、それは示せるだろうか。0 から階段をいくら上っても届かない、余分な住人のいる模型を作ってみよう。`,
               d: `0 から ${termH("s")} をたどっても決して届かない住人 2 がいる模型で、0+2 は 2 にならなかった。帰納法の掟は、こうした余分な住人を締め出すためにあったのだ。` },
    "x-judge": { t: `広間の最奥、最後の鏡の前に、旅の途中で出会った番人たちが並んでいる。鏡に映るのは狭い順序の掟――「自分より小さい者はいない」と推移律。番人たちが三枚の扉を示す。「証明できる扉は開け、証明できない扉は模型で暴け。これが、おまえの最後の鑑定だ」。`,
                 d: `三枚の扉を見極めると、最後の鏡が静かに光を放った。鍵を組み合わせて扉を開くことも、模型を作って偽りを暴くことも、あなたはすべて身につけた。迷宮の出口の扉が、ゆっくりと開いていく――。` },
  },
};
const storyOn = () => !!PREFS.story;
const storyStage = st => st && STORY.stages[st.oldId];
const storyWorld = w => w && w.stages.length ? STORY.worlds[w.stages[0].oldId] : null;
function storyGoal(prob) { // GM の指示：シーケントから自動で作る
  if (prob.kind === "judge") return prob.fol ? "目標：それぞれの扉が、術で開く本物か、模型の街（構造）が偽りを暴く扉かを見極めよ。" : prob.classical ? "目標：それぞれの扉が、術で開く本物か、鏡が偽りを暴く扉かを見極めよ。" : "目標：それぞれの扉が、術なしで開く本物か、偽物かを見極めよ。";
  const prem = prob.prem.map(p => F(p));
  const many = prob.prem.length >= 3 || prob.prem.join("").length > 40; // 掟（公理）が多いときは、鍵を列挙しない
  const keys = many ? "手元の掟（鍵）" : `鍵 ${prem.join("、")} `;
  if (prob.kind === "refute") {
    const how = prob.fol ? "模型の街（構造）" : prob.classical ? "鏡（真理値の割り当て）" : "時の塔（Kripke 模型）";
    return `目標：${prem.length ? `${keys}があっても、` : ""}扉 ${F(prob.goal)} は開けられないことを、${how}で示せ。`;
  }
  return `目標：${prem.length ? `${keys}を使って、` : "何も持たずに、"}扉 ${F(prob.goal)} を開けよ。`;
}

  SEEN_CLEARED = clearedNow;
  const next = STAGES.find(s => PROG.best[s.pid] == null) || STAGES[0];
  app.innerHTML = `
  <section class="hero">
    <h1>自然演繹の迷宮</h1>

      ${PROG.cards && Object.keys(PROG.cards).length ? `<span class="progress">手に入れた定理カード：${Object.keys(PROG.cards).map(k => CARDS[k] ? CARDS[k].name : k).join("、")}</span>` : ""}
    </div>
  </section>` + WORLDS.map(w => `
  <section class="world">
    <div class="world-head"><span class="wn">World ${w.id}</span><h2>${w.name}</h2><span class="wr">学ぶ規則：${w.rules}</span></div>${storyOn() && storyWorld(w) ? `<p class="story-prologue">${storyWorld(w)}</p>` : ""}
    <div class="tiles">${w.stages.map(s => `
      <button class="tile${s.boss ? " boss" : ""}${PROG.best[s.pid] != null ? " done" : ""}${fresh.has(s.pid) ? " just-opened" : ""}" type="button" data-stage="${s.id}" aria-label="${s.id} ${s.name}（${PROG.best[s.pid] != null ? "クリア済み" : "未クリア"}）">
        <span class="tile-win" aria-hidden="true"></span><span class="tile-top"><span class="tile-id">${s.id}</span><span class="tile-name">${s.name}</span>${s.boss ? '<span class="tile-boss">ボス</span>' : ""}</span>
        <span class="tile-seq">${tileSeq(s)}</span>
        <span class="tile-status">${PROG.best[s.pid] != null ? "クリア：" + bestText(s) : s.kind === "judge" ? `${s.parts.length} つの扉を鑑定する` : s.par == null ? (s.kind === "refute" ? "反例を作る" : "") : `パー ${s.par} ${unitOf(s)}`}</span>
      </button>`).join("")}
    </div>
  </section>`).join("");
  if (fresh.size) requestAnimationFrame(() => { const t = document.querySelector(".tile.just-opened"); if (t && t.scrollIntoView) t.scrollIntoView({ block: "center", behavior: "smooth" }); });
}

const GUIDE_AT = { "6-6": ["judge"] }; // チュートリアルのない新しい画面（元の番号で指定）
const guideKeys = stg => !stg ? [] : [...(stg.tut || []).filter(k => GUIDES[k]), ...(GUIDE_AT[stg.oldId] || [])];
function guideSteps(keys) { return keys.flatMap(k => GUIDES[k](STAGE)); }
function guideStart(keys) {
  guideEnd(false);
  keys = keys || guideKeys(STAGE);
  if (!keys.length) return;
  GUIDE = { i: 0, keys, steps: guideSteps(keys) };
  guideShow();
}
function guideShow() {
  document.querySelectorAll(".guide-spot").forEach(e => e.classList.remove("guide-spot"));
  const old = $("#guideBubble"); if (old) old.remove();
  if (!GUIDE) return;
  const st = GUIDE.steps[GUIDE.i], el = st.el();
  if (!el) { if (GUIDE.i < GUIDE.steps.length - 1) { GUIDE.i++; return guideShow(); } return guideEnd(true); }
  el.classList.add("guide-spot");
  if (el.scrollIntoView) el.scrollIntoView({ block: "center" });
  const last = GUIDE.i === GUIDE.steps.length - 1;
  const b = document.createElement("div");
  b.id = "guideBubble"; b.className = "guide-bubble"; b.setAttribute("role", "dialog"); b.setAttribute("aria-label", "案内");
  b.innerHTML = `<div class="gb-step">案内 ${GUIDE.i + 1} / ${GUIDE.steps.length}</div><div class="gb-title">${st.title}</div><div class="gb-text">${st.text}</div>
    <div class="gb-actions"><button type="button" class="btn small" data-guide="skip">${last ? "閉じる" : "案内を閉じる"}</button>${last ? `<button type="button" class="btn small primary" data-guide="done">はじめる</button>` : `<button type="button" class="btn small primary" data-guide="next">次へ</button>`}</div>`;
  document.body.appendChild(b);
  guidePlace();
}
function guidePlace() {
  const b = $("#guideBubble"), el = document.querySelector(".guide-spot"); if (!b || !el) return;
  const r = el.getBoundingClientRect(), bw = Math.min(380, innerWidth - 16), bh = b.offsetHeight;
  b.style.width = bw + "px";
  const below = r.bottom + bh + 14 < innerHeight || r.top < bh + 14;
  const top = below ? r.bottom + 12 : r.top - bh - 12, left = Math.max(8, Math.min(innerWidth - bw - 8, r.left + Math.min(r.width, 300) / 2 - bw / 2));
  const fixed = !!el.closest(".overlay"); b.style.position = fixed ? "fixed" : "absolute";
  b.style.top = (top + (fixed ? 0 : scrollY)) + "px"; b.style.left = (left + (fixed ? 0 : scrollX)) + "px";
  b.classList.toggle("above", !below);
  b.style.setProperty("--ax", Math.max(16, Math.min(bw - 16, r.left + Math.min(r.width, 300) / 2 - left)) + "px");
}
function guideEnd(seen) {
  document.querySelectorAll(".guide-spot").forEach(e => e.classList.remove("guide-spot"));
  const b = $("#guideBubble"); if (b) b.remove();
  if (seen && GUIDE) { PROG.guideSeen = PROG.guideSeen || {}; GUIDE.keys.forEach(k => { PROG.guideSeen[k] = true; }); saveProgress(); }
  GUIDE = null;
}
addEventListener("resize", () => requestAnimationFrame(guidePlace));
document.addEventListener("scroll", e => { if (GUIDE && e.target && e.target.closest && e.target.closest(".overlay")) requestAnimationFrame(guidePlace); }, true);
function startStage(id) {
  guideEnd(false);
  STAGE = STAGES.find(s => s.id === id);
  if (!STAGE) return;
  UI = freshUI(); SCREEN = "play";
  NEG_SUGAR = !STAGE.expandNeg;
  closeModal();
  if (STAGE.kind === "judge") {
    UI.judge = { solved: {}, saved: {} };
    PROB = null; S = null; R = null; HIST = []; HISTR = [];
    renderTools(); renderShell();
  } else loadProblem(STAGE, STAGE.kind === "refute" ? "refute" : "prove");
  window.scrollTo(0, 0);
  const fresh = guideKeys(STAGE).filter(k => !(PROG.guideSeen || {})[k]); // 新しい操作や画面が初めて登場したら、案内する

  if (mx) { const k = mx.dataset.mexp; if (UI.mapExp.has(k)) UI.mapExp.delete(k); else UI.mapExp.add(k); renderDynamic(); return; }
  const go = t.closest("[data-goto]");
  if (go) { S.active = go.dataset.goto; UI.sel = null; UI.can = new Set(); UI.fx = true; UI.orChoice = null; UI.pick = null; renderDynamic(); return; }
  const key = t.closest("#rooms .key"); if (key) { tapKey(key.dataset.key); return; }
  const door = t.closest("#rooms .door"); if (door) { tapDoor(); return; }
  if (UI.sel && t.closest("#area")) select(null);
});

document.addEventListener("pointerover", e => {
  if (e.pointerType !== "mouse" || SCREEN !== "play" || drag || !S || !PROB || UI.mode === "refute") return;
  const t = e.target.closest ? e.target : e.target.parentElement;
  const pick = t.closest("[data-scope-pick]");
  const n = pick ? +pick.dataset.scopePick : null;
  if (n !== UI.hoverScope) { UI.hoverScope = n; applyScope(); }
  if (!S.active || $(".overlay")) return;
  // マウスを重ねた操作を試して、証明図に見本を出す
  const orp = t.closest("[data-orpick]"), intro = t.closest("[data-intro]"), split = t.closest("[data-split]");
  if (t.closest("[data-exfalso]")) return previewOp("exf", St => opExfalso(St, St.active));
  const ufv = t.closest("[data-unfold]");
  if (ufv) { const v = ufv.dataset.unfold; return previewOp("uf:" + v, St => v === "door" ? opUnfoldDoor(St, St.active) : opUnfoldKey(St, v, St.active)); }
  if (t.closest("[data-raa]")) return previewOp("raa", St => opRAA(St, St.active));
  const lpv = t.closest("[data-lempick]");
  if (lpv && UI.lemma) { const L = parse(STAGE.lemmas[+lpv.dataset.lempick]); return previewOp("lem:" + lpv.dataset.lempick, St => opCut(St, St.active, L)); }
  if (t.closest("[data-ind]")) return previewOp("ind", St => opInd(St, St.active));
  if (t.closest("[data-lemma]")) return previewOp("lemhint", null, { preview: true, rule: "補題", fig: "タップして、補題にする式を選ぶ（または書く）。扉が「補題の証明」と「補題を使う側」の二つに分かれる" });
  if (orp && orp.dataset.orpick !== "x") { const side = orp.dataset.orpick; return previewOp("or:" + side, St => opOrIntro(St, St.active, side)); }
  if (UI.rew && t.closest("[data-rewgo]")) { const rw = UI.rew; return previewOp("rew:" + rw.sel.join(","), St => rewOp(St, rw, rw.sel)); }
  const tpv = t.closest("[data-tpick]");
  if (tpv && UI.pick && tpv.dataset.tpick !== "x") { const v = tpv.dataset.tpick, pk = UI.pick;
    return previewOp("tp:" + v, St => pickOp(St, pk, v)); }
  if (intro && S.goals[S.active].target.t === "ex")
    return previewOp("exhint", null, { preview: true, rule: "∃I", fig: "タップして、証人となる住人を選ぶ。選んだ住人について示す ∃I の線が引かれる" });
  if (split && (findEntry(S.goals[S.active], split.dataset.split) || {}).f && findEntry(S.goals[S.active], split.dataset.split).f.t === "all")
    return previewOp("allhint", null, { preview: true, rule: "∀E", fig: "タップして、当てはめる住人を選ぶ。手元の部品に ∀E の断片ができる" });
  if (intro) {
    if (S.goals[S.active].target.t === "or")
      return previewOp("orhint", null, { preview: true, rule: "∨I", fig: "タップして、左右どちらを示すかを選ぶ。選んだ側だけを目指す ∨I の線が引かれる" });
    return previewOp("intro", St => opIntro(St, St.active));
  }
  if (split) { const k = split.dataset.split; return previewOp("split:" + k, St => opSplit(St, k, St.active)); }
  if (UI.sel) {
    const door = t.closest("#rooms .door"), key = t.closest("#rooms .key");
    if (door) { const a = UI.sel; return previewOp("use:" + a, St => opUse(St, a, St.active)); }
    if (key && key.dataset.key !== UI.sel) { const a = UI.sel, b = key.dataset.key; return previewOp("comb:" + a + ":" + b, St => opCombine(St, a, b, St.active)); }
  }
  endPreview();
});

/* --- 入力（ドラッグ：マウスとタッチの両方に対応） --- */
let pend = null, drag = null;
document.addEventListener("pointerdown", e => {
  if (SCREEN !== "play" || (e.button != null && e.button > 0)) return;
  const key = e.target.closest && e.target.closest("#rooms .key");
  if (!key || e.target.closest(".mainop")) return;
  pend = { name: key.dataset.key, x: e.clientX, y: e.clientY, el: key };
});
window.addEventListener("pointermove", e => {
  if (!pend) return;
  if (!drag) {
    if (Math.hypot(e.clientX - pend.x, e.clientY - pend.y) < 8) return;
    const ghost = document.createElement("div");
    ghost.className = "ghost"; ghost.innerHTML = pend.el.outerHTML;
    ghost.firstElementChild.classList.remove("sel", "can", "fresh");
    document.body.appendChild(ghost); document.body.classList.add("dragging");
    drag = { name: pend.name, ghost, over: null };
    select(pend.name);
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
  const el = document.elementFromPoint(e.clientX, e.clientY);
  let tgt = el && (el.closest("#rooms .door") || el.closest("#rooms .key"));
  if (tgt && tgt.dataset.key === drag.name) tgt = null;
  if (drag.over !== tgt) {
    if (drag.over) drag.over.classList.remove("drop-hover");
    if (tgt) tgt.classList.add("drop-hover");
    drag.over = tgt;
    const a = drag.name; // ドラッグ中も、落とす先に応じて証明図に見本を出す
    if (!tgt) endPreview();
    else if (tgt.classList.contains("door")) previewOp("use:" + a, St => opUse(St, a, St.active));
    else { const b = tgt.dataset.key; previewOp("comb:" + a + ":" + b, St => opCombine(St, a, b, St.active)); }
  }
}, { passive: false });
function endDrag() {
  if (!drag) return null;
  const d = drag; drag = null;
  d.ghost.remove(); document.body.classList.remove("dragging");
  if (d.over) d.over.classList.remove("drop-hover");
  return d;
}
window.addEventListener("pointerup", () => {
  if (!pend) return;
  pend = null;
  const d = endDrag();
  if (!d) return; // 動かしていなければタップとしてクリック処理に任せる
  suppressUntil = Date.now() + 350;
  if (!d.over) { endPreview(); select(null); return; }
  if (d.over.classList.contains("door")) doAct(S => opUse(S, d.name, S.active));
  else { const other = d.over.dataset.key; doAct(S => opCombine(S, d.name, other, S.active)); }
});
window.addEventListener("pointercancel", () => { pend = null; if (endDrag()) { endPreview(); select(null); } });

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if ($(".overlay")) closeModal(); else if (UI.sel) select(null); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("#rooms .key, #rooms .door")) { e.preventDefault(); e.target.click(); return; }
  if (e.target && e.target.id === "lemmaInput") { if (e.key === "Enter") { e.preventDefault(); submitLemma(); } return; } // 入力欄では他のキー操作を無効にする
  if (e.target && e.target.id === "termInput") { if (e.key === "Enter") { e.preventDefault(); submitTerm(); } return; }
  if (SCREEN === "play" && PROB && !$(".overlay") && (e.key === "z" || e.key === "Z") && !e.altKey) { e.preventDefault(); UI.mode === "refute" ? undoR() : undo(); }
});

// 動作確認用

applyTheme();
renderTools();
renderSelect();
})();
</script>
</body>
</html>
