 and worlds can be combined. If you split into worlds inside a room, the room's key can be used in both worlds. The number of moves depends on the order, so aim for par."],["→I も ∨E も、いつ使っても損をしない操作。でも順番によって手数が変わる。","Neither →I nor ∨E ever hurts. But the order changes the number of moves."],["先に →I で部屋に入ってから世界を分けると、部屋に入るのは1回で済む。","If you enter the room with →I before splitting into worlds, you only need to enter the room once."],["①扉の → をタップ、②鍵 ⟦0⟧ の ∨ をタップ、③鍵 ⟦1⟧ を扉 ⟦2⟧ へ、④鍵 ⟦3⟧ を扉 ⟦4⟧ へ、⑤鍵 ⟦5⟧ を扉 ⟦6⟧ へ。","① Tap the → of the door, ② tap the ∨ of key ⟦0⟧, ③ key ⟦1⟧ into door ⟦2⟧, ④ key ⟦3⟧ into door ⟦4⟧, ⑤ key ⟦5⟧ into door ⟦6⟧."],["分配の間","Hall of Distribution"],["扉の ∨（∨I）は元に戻らない選択です。いつ選ぶのがよいでしょうか。目安は 10 手。","The door's ∨ (∨I) is a choice you cannot undo. When is the right time to choose? Par is 10 moves."],["扉の ∨ でいきなり左右を選ぶと、どちらを選んでも行き詰まる。⟦0⟧ と ⟦1⟧ のどちらが成り立つのかは、まだ分からないから。","If you choose a side with the door's ∨ right away, you get stuck either way, because we do not yet know whether ⟦0⟧ or ⟦1⟧ holds."],["元に戻らない選択は後回し。まず鍵を分解し、⟦0⟧ で世界を分けてから、それぞれの世界で扉の向きを選ぼう。","Postpone irreversible choices. First take the key apart and split into worlds with ⟦0⟧, then choose the side of the door in each world."],["①鍵の ∧ をタップ、②鍵 ⟦0⟧ の ∨ をタップ、③扉の ∨ で左を選ぶ、④扉の ∧ をタップ、⑤⑥ ⟦1⟧、⟦2⟧ の扉を開ける、⑦扉の ∨ で右を選ぶ、⑧扉の ∧ をタップ、⑨⑩ ⟦3⟧、⟦4⟧ の扉を開ける。","① Tap the ∧ of the key, ② tap the ∨ of key ⟦0⟧, ③ choose left with the door's ∨, ④ tap the ∧ of the door, ⑤⑥ open the doors ⟦1⟧ and ⟦2⟧, ⑦ choose right with the door's ∨, ⑧ tap the ∧ of the door, ⑨⑩ open the doors ⟦3⟧ and ⟦4⟧."],["矛盾の地下室","Cellar of Contradiction"],["⊥E、¬（= →⊥）","⊥E, ¬ (= →⊥)"],["行き止まりの鍵","The Dead-End Key"],["⊥ は<b>矛盾</b>を表す特別な命題です。⊥ の鍵が手に入れば、その鍵でどの扉でも開けられます（⊥E、爆発律）。まず鍵 ⟦0⟧ を鍵 ⟦1⟧ に差し込んで、⊥ の鍵を作りましょう。扉の「⊥ を目指す」を押して、扉そのものを ⊥ に切り替える方法もあります（これも ⊥E）。","⊥ is a special proposition standing for a <b>contradiction</b>. Once you have the ⊥ key, it opens any door (⊥E, ex falso). First insert key ⟦0⟧ into key ⟦1⟧ to make the ⊥ key. You can also press \"Aim for ⊥\" on the door to switch the door itself to ⊥ (this is ⊥E too)."],["鍵 ⟦0⟧ に ⟦1⟧ を差し込むと、何が出てくる？","What comes out when you insert ⟦1⟧ into key ⟦0⟧?"],["⊥ の鍵は、どの扉にも差し込める。","The ⊥ key fits any door."],["①鍵 ⟦0⟧ を鍵 ⟦1⟧ へ、②出てきた鍵 ⊥ を扉 ⟦2⟧ へ。","① Key ⟦0⟧ onto key ⟦1⟧, ② the ⊥ key that came out into door ⟦2⟧."],["否定の正体","What Negation Is"],["⟦0⟧ は ⟦1⟧ の略記で、「⟦2⟧ を仮定すると矛盾する」という意味です。扉 ⟦3⟧ の ¬ をタップすると、⟦4⟧ を持って部屋に入り、扉 ⊥ を目指します（→I）。鍵 ⟦5⟧ は、⟦6⟧ を差し込むと ⊥ が出てくる鍵です（→E）。","⟦0⟧ is short for ⟦1⟧ and means \"assuming ⟦2⟧ leads to a contradiction\". Tap the ¬ of door ⟦3⟧ to enter a room holding ⟦4⟧ and aim for door ⊥ (→I). Key ⟦5⟧ is a key that produces ⊥ when you insert ⟦6⟧ (→E)."],["まず ⟦0⟧ を持って部屋に入ろう。次の扉 ⟦1⟧ も、¬ をタップすれば部屋に入れる。","First enter a room holding ⟦0⟧. The next door ⟦1⟧ also lets you enter a room if you tap its ¬."],["扉が ⊥ になったら、矛盾を作る。手元には ⟦0⟧ と ⟦1⟧ がそろっている。","Once the door is ⊥, make a contradiction. You have both ⟦0⟧ and ⟦1⟧."],["①扉の → をタップ、②扉の ¬ をタップ、③鍵 ⟦0⟧ を扉 ⊥ へ、④鍵 ⟦1⟧ を扉 ⟦2⟧ へ。","① Tap the → of the door, ② tap the ¬ of the door, ③ key ⟦0⟧ into door ⊥, ④ key ⟦1⟧ into door ⟦2⟧."],["対偶","Contraposition"],["⟦0⟧ を示すには、⟦1⟧ と ⟦2⟧ を仮定して矛盾 ⊥ を導きます。","To show ⟦0⟧, assume ⟦1⟧ and ⟦2⟧ and derive the contradiction ⊥."],["→ と ¬ をタップして、⟦0⟧ と ⟦1⟧ を持った部屋に入ろう。","Tap → and ¬ to enter a room holding ⟦0⟧ and ⟦1⟧."],["扉 ⊥ に鍵 ⟦0⟧ を差し込むと、扉は ⟦1⟧ になる。その先は鍵 ⟦2⟧ の出番。","Insert key ⟦0⟧ into door ⊥ and the door becomes ⟦1⟧. From there, it is key ⟦2⟧'s turn."],["①扉の → をタップ、②扉の ¬ をタップ、③鍵 ⟦0⟧ を扉 ⊥ へ、④鍵 ⟦1⟧ を扉 ⟦2⟧ へ、⑤鍵 ⟦3⟧ を扉 ⟦4⟧ へ。","① Tap the → of the door, ② tap the ¬ of the door, ③ key ⟦0⟧ into door ⊥, ④ key ⟦1⟧ into door ⟦2⟧, ⑤ key ⟦3⟧ into door ⟦4⟧."],["崩れる世界","A Collapsing World"],["条件分岐すると、片方の世界が矛盾していることがあります。矛盾した世界では ⊥ の鍵が作れるので、どの扉でも開けられます。","After branching, one of the worlds may be contradictory. In a contradictory world you can make the ⊥ key, so any door opens."],["鍵 ⟦0⟧ で条件分岐しよう。","Branch on key ⟦0⟧."],["⟦0⟧ の世界には ⟦1⟧ と ⟦2⟧ がそろっている。⊥ の鍵を作れば、扉 ⟦3⟧ も開く。","In the world of ⟦0⟧ you have both ⟦1⟧ and ⟦2⟧. Make the ⊥ key, and door ⟦3⟧ opens too."],["①鍵 ⟦0⟧ の ∨ をタップ、②鍵 ⟦1⟧ を鍵 ⟦2⟧ へ、③出てきた鍵 ⊥ を扉 ⟦3⟧ へ、④（もう一方の世界で）鍵 ⟦4⟧ を扉 ⟦5⟧ へ。","① Tap the ∨ of key ⟦0⟧, ② key ⟦1⟧ onto key ⟦2⟧, ③ the ⊥ key that came out into door ⟦3⟧, ④ (in the other world) key ⟦4⟧ into door ⟦5⟧."],["排中律の影","Shadow of the Excluded Middle"],["直観主義論理では、排中律 ⟦0⟧ そのものは証明できません。けれども、その二重否定なら証明できます。同じ鍵は何度使ってもかまいません。目安は 7 手。","In intuitionistic logic the law of excluded middle ⟦0⟧ itself cannot be proved. Its double negation, however, can. You may use the same key as many times as you like. Par is 7 moves."],["まず外側の ¬ をタップして部屋に入ろう。扉は ⊥、鍵は ⟦0⟧。","First tap the outer ¬ to enter a room. The door is ⊥ and the key is ⟦0⟧."],["扉 ⊥ に鍵 ⟦0⟧ を差し込むと、扉は ⟦1⟧。ここで、すぐには示せないように見える右側 ⟦2⟧ を選ぶのがポイント。","Insert key ⟦0⟧ into door ⊥ and the door becomes ⟦1⟧. The point is to choose the right side ⟦2⟧, which does not look provable right away."],["①扉の ¬ をタップ、②鍵 ⟦0⟧ を扉 ⊥ へ、③扉の ∨ で右を選ぶ、④扉の ¬ をタップ、⑤もう一度、鍵 ⟦1⟧ を扉 ⊥ へ、⑥扉の ∨ で左を選ぶ、⑦鍵 ⟦2⟧ を扉 ⟦3⟧ へ。","① Tap the ¬ of the door, ② key ⟦0⟧ into door ⊥, ③ choose right with the door's ∨, ④ tap the ¬ of the door, ⑤ again, key ⟦1⟧ into door ⊥, ⑥ choose left with the door's ∨, ⑦ key ⟦2⟧ into door ⟦3⟧."],["偽物の扉","Fake Doors"],["Kripke 模型による反証","Refutation by Kripke models"],["決して開かない扉","The Door That Never Opens"],["{{w:6-1}} では背理法の魔法で証明できた排中律ですが、<b>魔法を使わない論理（直観主義論理）</b>では証明できません。この層では魔法は使えず、扉は「魔法なしでは決して開かない魔法の扉」です。魔法なしで証明できないことは、<b>Kripke 模型</b>という反例を作って示します（{{w:r-conv}} の真理値の割り当ては、魔法ありの古典論理での反例でした）。模型は「階」を上り階段でつないだもので、階は知識の状態、階段は時間の経過を表します。各階で、分かっている原子命題の灯りを点けます。一度点いた灯りは、上の階でも消えません。⟦0⟧ が光るのは ⟦1⟧ か ⟦2⟧ が光るとき、⟦3⟧ が光るのは、その階とそれより上のどの階でも ⟦4⟧ が光らないときです。仮定がすべて光り、目標だけが光らない階を作れれば、反証成功です。","The law of excluded middle could be proved with the reductio spell in {{w:6-1}}, but it cannot be proved in <b>logic without the spell (intuitionistic logic)</b>. On this level the spell cannot be used, and the door is a \"magic door that never opens without the spell\". To show that something is not provable without the spell, build a counterexample called a <b>Kripke model</b> (the truth assignments of {{w:r-conv}} were counterexamples for classical logic, with the spell). A model is a set of \"floors\" connected by stairs going up: a floor is a state of knowledge, and the stairs represent the passage of time. At each floor, turn on the lights of the atomic propositions that are known. A light once on stays on at the floors above. ⟦0⟧ is lit when ⟦1⟧ or ⟦2⟧ is lit, and ⟦3⟧ is lit when ⟦4⟧ is not lit at that floor or at any floor above. Build a floor where all assumptions are lit and only the goal is not, and the refutation succeeds."],["この問題には仮定がないので、目標 ⟦0⟧ が光らない階を作ればよい。","This problem has no assumptions, so build a floor where the goal ⟦0⟧ is not lit."],["⟦0⟧ が光らないためには、⟦1⟧ も ⟦2⟧ も光らない必要がある。⟦3⟧ が光らないのは、それより上のどこかの階で ⟦4⟧ が光るとき。","For ⟦0⟧ not to be lit, neither ⟦1⟧ nor ⟦2⟧ may be lit. ⟦3⟧ is not lit when ⟦4⟧ is lit at some floor above."],["階 0 に「＋ 上の階」で階 1 を足し、階 1 だけで ⟦0⟧ の灯りを点ける。階 0 では ⟦1⟧ も ⟦2⟧ も光らない。","Add floor 1 above floor 0 with \"+ Floor above\" and turn on ⟦0⟧ only at floor 1. At floor 0 neither ⟦1⟧ nor ⟦2⟧ is lit."],["同じ罠","The Same Trap"],["⟦0⟧ が階 w で光るのは、w とそれより上のどの階でも「⟦1⟧ が光るなら ⟦2⟧ も光る」ときです。二重否定除去 ⟦3⟧ も、直観主義では証明できません。","⟦0⟧ is lit at floor w when, at w and every floor above it, \"if ⟦1⟧ is lit then ⟦2⟧ is lit\". Double negation elimination ⟦3⟧ is not provable intuitionistically either."],["⟦0⟧ が光り、⟦1⟧ が光らない階を作ろう。","Build a floor where ⟦0⟧ is lit and ⟦1⟧ is not."],["{{s:5-1}} で作った模型を、もう一度試してみよう。","Try the model you built in {{s:5-1}} again."],["階 0 の上に階 1 を足し、⟦0⟧ は階 1 だけ。どの階でも ⟦1⟧ は光らないので、階 0 で ⟦2⟧ が光る。","Add floor 1 above floor 0, with ⟦0⟧ only at floor 1. ⟦1⟧ is lit at no floor, so ⟦2⟧ is lit at floor 0."],["パースの扉","Peirce's Door"],["古典論理では正しい「パースの法則」です。¬ を使わない式ですが、これも直観主義では証明できません。","\"Peirce's law\", valid in classical logic. It uses no ¬, yet it is not provable intuitionistically either."],["目標が光らないためには、どこかの階で ⟦0⟧ が光り、⟦1⟧ が光らない必要がある。","For the goal not to be lit, ⟦0⟧ must be lit and ⟦1⟧ not lit at some floor."],["⟦0⟧ の灯りはどこにも点けずにおこう。{{s:5-1}} と同じ形の模型が使える。","Leave the light ⟦0⟧ off everywhere. A model of the same shape as in {{s:5-1}} works."],["階 0 の上に階 1 を足し、⟦0⟧ は階 1 だけ、⟦1⟧ はどこにも点けない。階 0 では ⟦2⟧ が光らない（階 1 で ⟦3⟧ が光り ⟦4⟧ が光らない）ので、⟦5⟧ は階 0 で光る。","Add floor 1 above floor 0, with ⟦0⟧ only at floor 1 and ⟦1⟧ nowhere. At floor 0, ⟦2⟧ is not lit (at floor 1, ⟦3⟧ is lit and ⟦4⟧ is not), so ⟦5⟧ is lit at floor 0."],["枝分かれする未来","Branching Futures"],["階段は枝分かれさせることもできます。枝分かれした未来では、どちらの未来に進むかがまだ決まっていません。","Stairs can also branch. In branching futures, which future we move to is not yet decided."],["仮定 ⟦0⟧ は光り、目標 ⟦1⟧ は光らない階を作ろう。","Build a floor where the assumption ⟦0⟧ is lit and the goal ⟦1⟧ is not."],["⟦0⟧ も ⟦1⟧ も光らないためには、上のどこかで ⟦2⟧ が光り、上のどこかで ⟦3⟧ が光る必要がある。でも ⟦4⟧ と ⟦5⟧ が同時に光る階があると、仮定 ⟦6⟧ が光らなくなる。","For neither ⟦0⟧ nor ⟦1⟧ to be lit, ⟦2⟧ must be lit somewhere above and ⟦3⟧ must be lit somewhere above. But if some floor lights ⟦4⟧ and ⟦5⟧ together, the assumption ⟦6⟧ is no longer lit."],["階 0 の上に、二つの階を枝分かれさせて足す（階 0 の「＋ 上の階」を2回）。一方では ⟦0⟧ だけ、もう一方では ⟦1⟧ だけを点ける。","Add two branching floors above floor 0 (press \"+ Floor above\" on floor 0 twice). Turn on only ⟦0⟧ in one and only ⟦1⟧ in the other."],["鑑定の間","Judgment hall"],["3 つの扉のうち、魔法なしで開く扉（魔法なしで証明できる）と、魔法なしでは決して開かない魔法の扉（魔法なしでは証明できない）を見極めましょう。この部屋でも背理法の魔法は使えません。魔法なしで開く扉は証明し、魔法の扉は Kripke 模型で反証します。{{w:6-1}}、{{w:r-conv}} で正しかった式が、ここでは魔法の扉かもしれません。","Of the 3 doors, tell the ones that open without the spell (provable without the spell) from the magic doors that never open without the spell (not provable without the spell). The reductio spell cannot be used in this room either. Prove the doors that open without the spell and refute the magic doors with Kripke models. A formula that was valid in {{w:6-1}} or {{w:r-conv}} may be a magic door here."],["直観主義で証明できない式の典型は、二重否定を外す推論や、排中律に近い推論。","Typical formulas not provable intuitionistically are inferences that remove a double negation, or ones close to the excluded middle."],["扉 A は、外側の ¬ から順に部屋に入って進められる。扉 B は、結論を ⟦0⟧ に弱めれば証明できるが、⟦1⟧ のままでは…。扉 C は、{{s:5-4}} のような枝分かれを考えよう。","Door A can be done by entering rooms one by one from the outer ¬. Door B is provable if you weaken the conclusion to ⟦0⟧, but with ⟦1⟧ as it is…. For door C, think of branching as in {{s:5-4}}."],["A は魔法なしで開く扉、B と C は魔法の扉。B は 2 階の模型（⟦0⟧ は上の階だけ、⟦1⟧ は両方の階）、C は枝分かれした模型（一方の未来で ⟦2⟧ だけ、もう一方で ⟦3⟧ だけ）で反証できる。","A opens without the spell; B and C are magic doors. B is refuted by a 2-floor model (⟦0⟧ only at the upper floor, ⟦1⟧ at both floors), and C by a branching model (only ⟦2⟧ in one future, only ⟦3⟧ in the other)."],["三重否定 ⟦0⟧ は ⟦1⟧ と同値です。二重否定は外せなくても、三重否定は一つに減らせます。","The triple negation ⟦0⟧ is equivalent to ⟦1⟧. A double negation cannot be removed, but a triple negation can be reduced to one."],["結論を ⟦0⟧ に弱めれば証明できますが、⟦1⟧ のままでは二重否定除去が必要になります。","It is provable if you weaken the conclusion to ⟦0⟧, but with ⟦1⟧ as it is, double negation elimination is needed."],["古典論理では成り立つ式です。枝分かれした未来では ⟦0⟧ と ⟦1⟧ のどちらが先に分かるかが決まらないため、反例ができます。","A formula valid in classical logic. In branching futures it is not decided whether ⟦0⟧ or ⟦1⟧ becomes known first, which gives a counterexample."],["古典論理の塔","Tower of Classical Logic"],["背理法の魔法（RAA）","The reductio spell (RAA)"],["背理法","Reductio"],["普通の数学で使う<b>古典論理</b>では、<b>背理法</b>（RAA）という<b>魔法</b>が使えます。扉 ⟦0⟧ で「背理法の魔法」を唱えると、「⟦1⟧ でない」という仮定 ⟦2⟧ を持って部屋に入り、矛盾 ⊥ を目指します。矛盾が導ければ、⟦3⟧ が示されたことになります。ここで示す<b>二重否定除去</b> ⟦4⟧ は、この魔法なしでは証明できない式です（{{w:5-1}} で確かめます）。","In <b>classical logic</b>, used in ordinary mathematics, the <b>spell</b> of <b>reductio ad absurdum</b> (RAA) is available. Cast the \"Reductio spell\" on door ⟦0⟧ to enter a room holding the assumption ⟦2⟧, \"not ⟦1⟧\", and aim for the contradiction ⊥. If you derive a contradiction, ⟦3⟧ is shown. <b>Double negation elimination</b> ⟦4⟧, shown here, cannot be proved without this spell (we check this in {{w:5-1}})."],["まず → をタップして、⟦0⟧ を持って部屋に入ろう。扉は ⟦1⟧。","First tap → to enter a room holding ⟦0⟧. The door is ⟦1⟧."],["扉 ⟦0⟧ で背理法の魔法を唱えると、鍵 ⟦1⟧ と ⟦2⟧ がそろう。","Cast the reductio spell on door ⟦0⟧ and you have both keys ⟦1⟧ and ⟦2⟧."],["①扉の → をタップ、②扉の「背理法の魔法」、③鍵 ⟦0⟧ を扉 ⊥ へ、④鍵 ⟦1⟧ を扉 ⟦2⟧ へ。","① Tap the → of the door, ② \"Reductio spell\" on the door, ③ key ⟦0⟧ into door ⊥, ④ key ⟦1⟧ into door ⟦2⟧."],["排中律","Excluded Middle"],["<b>排中律</b> ⟦0⟧ を背理法で証明しましょう。扉の ∨ でいきなり左右を選ぶと、どちらを選んでも行き詰まります。同じ鍵は何度使ってもかまいません。","Prove the <b>law of excluded middle</b> ⟦0⟧ by reductio. If you choose a side with the door's ∨ right away, you get stuck either way. You may use the same key as many times as you like."],["まず扉全体に背理法の魔法を唱えよう。鍵 ⟦0⟧ が手に入る。","First cast the reductio spell on the whole door. You get key ⟦0⟧."],["扉 ⊥ に鍵 ⟦0⟧ を差し込むと、扉は ⟦1⟧ に戻る。今度は右の ⟦2⟧ を選んでみよう。","Insert key ⟦0⟧ into door ⊥ and the door goes back to ⟦1⟧. This time try choosing the right side ⟦2⟧."],["①扉の「背理法の魔法」、②鍵 ⟦0⟧ を扉 ⊥ へ、③扉の ∨ で右を選ぶ、④扉の ¬ をタップ、⑤鍵 ⟦1⟧ を扉 ⊥ へ、⑥扉の ∨ で左を選ぶ、⑦鍵 ⟦2⟧ を扉 ⟦3⟧ へ。","① \"Reductio spell\" on the door, ② key ⟦0⟧ into door ⊥, ③ choose right with the door's ∨, ④ tap the ¬ of the door, ⑤ key ⟦1⟧ into door ⊥, ⑥ choose left with the door's ∨, ⑦ key ⟦2⟧ into door ⟦3⟧."],["排中律から背理法へ","From Excluded Middle to Reductio"],["この部屋では<b>背理法の魔法が封じられています</b>。代わりに、排中律 ⟦0⟧ が鍵として与えられています。⟦1⟧ は「⟦2⟧ を仮定すると矛盾する」という意味なので、ここで ⟦3⟧ が示せれば、<b>排中律があれば、魔法なしでも背理法と同じことができる</b>と分かります。","In this room <b>the reductio spell is sealed</b>. Instead, the law of excluded middle ⟦0⟧ is given as a key. ⟦1⟧ means \"assuming ⟦2⟧ leads to a contradiction\", so if you can show ⟦3⟧ here, we learn that <b>with excluded middle, you can do what reductio does without the spell</b>."],["⟦0⟧ の世界には、⟦1⟧ と ⟦2⟧ がそろっている。矛盾 ⊥ の鍵が作れる。","In the world of ⟦0⟧ you have both ⟦1⟧ and ⟦2⟧. You can make the contradiction ⊥ key."],["①鍵 ⟦0⟧ の ∨ をタップ、②鍵 ⟦1⟧ を扉 ⟦2⟧ へ、③（もう一方の世界で）鍵 ⟦3⟧ を鍵 ⟦4⟧ へ、④出てきた鍵 ⊥ を扉 ⟦5⟧ へ。","① Tap the ∨ of key ⟦0⟧, ② key ⟦1⟧ into door ⟦2⟧, ③ (in the other world) key ⟦3⟧ onto key ⟦4⟧, ④ the ⊥ key that came out into door ⟦5⟧."],["二重否定除去から排中律へ","From Double Negation Elimination to Excluded Middle"],["この部屋でも背理法の魔法は封じられています。代わりに、二重否定除去の鍵 ⟦0⟧ が与えられています。","The reductio spell is sealed in this room as well. Instead, the double negation elimination key ⟦0⟧ is given."],["この鍵を扉 ⟦0⟧ に差し込むと、扉は ⟦1⟧ になる。","Insert this key into door ⟦0⟧ and the door becomes ⟦1⟧."],["その先は、魔法なしで ⟦0⟧ を示す問題。外側の ¬ をタップして部屋に入ろう。","From there, the problem is to show ⟦0⟧ without the spell. Tap the outer ¬ to enter a room."],["①鍵を扉へ、②扉の ¬ をタップ、③鍵 ⟦0⟧ を扉 ⊥ へ、④扉の ∨ で右を選ぶ、⑤扉の ¬ をタップ、⑥鍵 ⟦1⟧ を扉 ⊥ へ、⑦扉の ∨ で左を選ぶ、⑧鍵 ⟦2⟧ を扉 ⟦3⟧ へ。","① The key into the door, ② tap the ¬ of the door, ③ key ⟦0⟧ into door ⊥, ④ choose right with the door's ∨, ⑤ tap the ¬ of the door, ⑥ key ⟦1⟧ into door ⊥, ⑦ choose left with the door's ∨, ⑧ key ⟦2⟧ into door ⟦3⟧."],["<b>背理法・二重否定除去・排中律は、互いに導けます。</b>背理法 ⇒ 二重否定除去（{{s:6-1}}）、背理法 ⇒ 排中律（{{s:6-2}}）、排中律 ⇒ 背理法（{{s:6-3}}）、二重否定除去 ⇒ 排中律（{{s:6-4}}）を確かめました。二重否定除去 ⇒ 背理法は1手です。⟦0⟧ から ⊥ が導けるなら、→I で ⟦1⟧ が得られ、二重否定除去で ⟦2⟧ が出ます。どの証明も、⟦3⟧ を任意の論理式に置き換えてそのまま通用します（推論規則は図式なので）。","<b>Reductio, double negation elimination and excluded middle can each be derived from the others.</b> We checked reductio ⇒ double negation elimination ({{s:6-1}}), reductio ⇒ excluded middle ({{s:6-2}}), excluded middle ⇒ reductio ({{s:6-3}}), and double negation elimination ⇒ excluded middle ({{s:6-4}}). Double negation elimination ⇒ reductio takes one step: if ⊥ follows from ⟦0⟧, then →I gives ⟦1⟧, and double negation elimination yields ⟦2⟧. Every one of these proofs works unchanged with ⟦3⟧ replaced by any formula (because inference rules are schemata)."],["ド・モルガンの塔","De Morgan's Tower"],["「⟦0⟧ かつ ⟦1⟧」の否定は、「⟦2⟧ でないか、⟦3⟧ でない」。数学でよく使うド・モルガンの法則のこの向きは、背理法の魔法を使って証明します。魔法は何度唱えてもかまいません。","The negation of \"⟦0⟧ and ⟦1⟧\" is \"not ⟦2⟧ or not ⟦3⟧\". This direction of De Morgan's law, used often in mathematics, is proved with the reductio spell. You may cast the spell as many times as you like."],["まず扉全体に背理法の魔法。鍵 ⟦0⟧ を手に入れよう。","First cast the reductio spell on the whole door. Get key ⟦0⟧."],["扉 ⊥ に鍵 ⟦0⟧ を差し込むと、扉は ⟦1⟧。分かれた扉 ⟦2⟧ と ⟦3⟧ のそれぞれで、もう一度背理法の魔法を唱える。","Insert key ⟦0⟧ into door ⊥ and the door becomes ⟦1⟧. Cast the reductio spell again on each of the split doors ⟦2⟧ and ⟦3⟧."],["①背理法の魔法、②鍵 ⟦0⟧ を扉 ⊥ へ、③扉の ∧、④扉 ⟦1⟧ で背理法の魔法、⑤鍵 ⟦2⟧ を扉 ⊥ へ、⑥扉の ∨ で左を選ぶ、⑦鍵 ⟦3⟧ を扉へ。扉 ⟦4⟧ も同じように（⑧〜⑪）。","① Reductio spell, ② key ⟦0⟧ into door ⊥, ③ the door's ∧, ④ reductio spell on door ⟦1⟧, ⑤ key ⟦2⟧ into door ⊥, ⑥ choose left with the door's ∨, ⑦ key ⟦3⟧ into the door. Door ⟦4⟧ in the same way (⑧–⑪)."],["真偽の鑑定","Judging Truth"],["4 つの扉のうち、<b>正しい</b>（証明できる）ものと<b>誤り</b>（証明できない）ものを見極めましょう。正しいものは背理法の魔法も使って証明し、誤りのものは、仮定がすべて真で目標が偽になる真理値の割り当て（反例）を作って示します。","Of the 4 doors, tell the <b>valid</b> ones (provable) from the <b>invalid</b> ones (not provable). Prove the valid ones, using the reductio spell as needed, and show the invalid ones by a truth assignment (counterexample) that makes all assumptions true and the goal false."],["誤りかどうかは、真理値表を一行ずつ確かめてみるとよい。","To see whether a formula is invalid, check its truth table row by row."],["扉 B は「逆」の形。扉 A、C、D は、背理法の魔法を使えば証明できる。","Door B has the form of a \"converse\". Doors A, C and D are provable with the reductio spell."],["A と C は正しく、B は誤り。B は ⟦0⟧ を偽、⟦1⟧ を真にすれば反例になる。C は背理法の魔法で始めて扉の ∨ で左を選び、→ で部屋に入ってから「⊥ を目指す」を使う。D は → で部屋に入り、扉 ⟦2⟧ で背理法の魔法を唱えてから、鍵 ⟦3⟧ を使う。","A and C are valid; B is invalid. Making ⟦0⟧ false and ⟦1⟧ true gives a counterexample to B. For C, start with the reductio spell, choose left with the door's ∨, enter a room with →, and then use \"Aim for ⊥\". For D, enter a room with →, cast the reductio spell on door ⟦2⟧, and then use key ⟦3⟧."],["「⟦0⟧ でないなら ⟦1⟧」から「⟦2⟧ または ⟦3⟧」が言えます。背理法の魔法（または排中律）が必要な、古典論理らしい推論です。","From \"if not ⟦0⟧ then ⟦1⟧\" we get \"⟦2⟧ or ⟦3⟧\". A typically classical inference that needs the reductio spell (or excluded middle)."],["逆は必ずしも真ならず。⟦0⟧ が偽、⟦1⟧ が真の割り当てが反例です。","The converse need not hold. The assignment with ⟦0⟧ false and ⟦1⟧ true is a counterexample."],["古典論理では、どちらか一方の含意は必ず成り立ちます（⟦0⟧ が真なら ⟦1⟧、偽なら ⟦2⟧ が真）。","In classical logic one of the two implications always holds (if ⟦0⟧ is true then ⟦1⟧ is, and if false then ⟦2⟧ is)."],["<b>パースの法則</b>です。¬ を含まない式ですが、証明には背理法の魔法が必要です。魔法なしでは証明できないことを、{{w:5-1}} で確かめます。","This is <b>Peirce's law</b>. It contains no ¬, but proving it needs the reductio spell. We check in {{w:5-1}} that it cannot be proved without the spell."],["住人の街","Town of Residents"],["∀I、∀E、∃I、∃E","∀I, ∀E, ∃I, ∃E"],["全員の部屋","Everyone's Room"],["⟦0⟧ は「すべての住人 ⟦1⟧ について ⟦2⟧」という意味です。扉の ∀ をタップすると、<b>任意の</b>住人 ⟦3⟧ を連れて新しい部屋に入り、⟦4⟧ を目指します（∀I）。⟦5⟧ はこの部屋で新しく呼んだ住人なので、外の鍵には登場しません。鍵 ⟦6⟧ の ∀ をタップすると、好きな住人を当てはめて ⟦7⟧ のような鍵が作れます（∀E）。","⟦0⟧ means \"for every resident ⟦1⟧, ⟦2⟧\". Tap the ∀ of a door to enter a new room with an <b>arbitrary</b> resident ⟦3⟧ and aim for ⟦4⟧ (∀I). ⟦5⟧ is a resident newly called in this room, so it does not appear in outer keys. Tap the ∀ of key ⟦6⟧ to instantiate it with any resident and make a key such as ⟦7⟧ (∀E)."],["扉 ⟦0⟧ の ∀ をタップして、住人 ⟦1⟧ の部屋に入ろう。","Tap the ∀ of door ⟦0⟧ to enter the room of resident ⟦1⟧."],["鍵 ⟦0⟧ に住人 ⟦1⟧ を当てはめると、⟦2⟧ が手に入る。","Instantiate key ⟦0⟧ with resident ⟦1⟧ and you get ⟦2⟧."],["①扉の ∀ をタップ、②鍵の ∀ をタップして住人 ⟦0⟧ を選ぶ、③鍵 ⟦1⟧ の ∧、④鍵 ⟦2⟧ を扉へ。","① Tap the ∀ of the door, ② tap the ∀ of the key and choose resident ⟦0⟧, ③ the ∧ of key ⟦1⟧, ④ key ⟦2⟧ into the door."],["同じ住人で","With the Same Resident"],["∀ の鍵には、同じ住人を何度でも当てはめられます。部屋の住人 ⟦0⟧ を、二つの鍵に当てはめてみましょう。","A ∀ key can be instantiated with the same resident any number of times. Instantiate both keys with the room's resident ⟦0⟧."],["扉の ∀ をタップして、住人 ⟦0⟧ の部屋へ。扉は ⟦1⟧ になる。","Tap the ∀ of the door to go to the room of resident ⟦0⟧. The door becomes ⟦1⟧."],["鍵 ⟦0⟧ に ⟦1⟧ を当てはめて扉に差し込み、鍵 ⟦2⟧ にも ⟦3⟧ を当てはめよう。","Instantiate key ⟦0⟧ with ⟦1⟧ and insert it into the door; instantiate key ⟦2⟧ with ⟦3⟧ as well."],["①扉の ∀、②鍵 ⟦0⟧ の ∀ で ⟦1⟧、③鍵 ⟦2⟧ を扉 ⟦3⟧ へ、④鍵 ⟦4⟧ の ∀ で ⟦5⟧、⑤鍵 ⟦6⟧ を扉へ。","① The door's ∀, ② ⟦1⟧ for the ∀ of key ⟦0⟧, ③ key ⟦2⟧ into door ⟦3⟧, ④ ⟦5⟧ for the ∀ of key ⟦4⟧, ⑤ key ⟦6⟧ into the door."],["誰かがいる","Someone Is There"],["⟦0⟧ は「⟦1⟧ を満たす住人 ⟦2⟧ がいる」という意味です。扉の ∃ をタップすると、<b>証人</b>となる住人を選んで ⟦3⟧ を目指します（∃I。元に戻らない選択）。鍵 ⟦4⟧ の ∃ をタップすると、⟦5⟧ を満たす<b>誰か</b>を連れて部屋に入ります（∃E）。その誰かの正体は分からないので、部屋の外には出られません。","⟦0⟧ means \"there is a resident ⟦2⟧ satisfying ⟦1⟧\". Tap the ∃ of a door to choose a resident as the <b>witness</b> and aim for ⟦3⟧ (∃I; a choice you cannot undo). Tap the ∃ of key ⟦4⟧ to enter a room with <b>someone</b> who satisfies ⟦5⟧ (∃E). We do not know who that someone is, so they cannot leave the room."],["証人を選ぶ前に、証人になれる住人を連れてこよう。","Before choosing a witness, bring in a resident who can be the witness."],["鍵の ∃ をタップすると、⟦0⟧ を満たす誰か ⟦1⟧ が現れる。","Tap the ∃ of the key and someone ⟦1⟧ satisfying ⟦0⟧ appears."],["①鍵の ∃ をタップ、②鍵 ⟦0⟧ の ∧、③扉の ∃ で住人 ⟦1⟧ を選ぶ、④鍵 ⟦2⟧ を扉へ。","① Tap the ∃ of the key, ② the ∧ of key ⟦0⟧, ③ choose resident ⟦1⟧ with the door's ∃, ④ key ⟦2⟧ into the door."],["否定と量化子","Negation and Quantifiers"],["「⟦0⟧ である住人はいない」から「どの住人も ⟦1⟧ ではない」を導きます。","From \"no resident is ⟦0⟧\", derive \"every resident is not ⟦1⟧\"."],["扉の ∀ で住人 ⟦0⟧ の部屋に入り、扉の ¬ でさらに部屋に入ろう。","Enter the room of resident ⟦0⟧ with the door's ∀, then enter another room with the door's ¬."],["扉 ⊥ に鍵 ⟦0⟧ を差し込むと、扉は ⟦1⟧。証人はもちろん ⟦2⟧。","Insert key ⟦0⟧ into door ⊥ and the door becomes ⟦1⟧. The witness is of course ⟦2⟧."],["①扉の ∀、②扉の ¬、③鍵 ⟦0⟧ を扉 ⊥ へ、④扉の ∃ で住人 ⟦1⟧、⑤鍵 ⟦2⟧ を扉へ。","① The door's ∀, ② the door's ¬, ③ key ⟦0⟧ into door ⊥, ④ resident ⟦1⟧ with the door's ∃, ⑤ key ⟦2⟧ into the door."],["順序の扉","The Door of Order"],["量化子の順序は大切です。「ある ⟦0⟧ について、すべての ⟦1⟧ で ⟦2⟧」から「すべての ⟦3⟧ について、ある ⟦4⟧ で ⟦5⟧」は導けます。証人を選ぶタイミングに注意しましょう。逆向きが導けないことは、{{w:s-ex}} で確かめます。","The order of quantifiers matters. From \"for some ⟦0⟧, for all ⟦1⟧, ⟦2⟧\" we can derive \"for all ⟦3⟧, for some ⟦4⟧, ⟦5⟧\". Pay attention to when you choose the witness. We check in {{w:s-ex}} that the converse cannot be derived."],["扉の ∃ で証人を選ぶには、証人になれる住人が必要。","To choose a witness with the door's ∃, you need a resident who can be the witness."],["まず扉の ∀ で住人 ⟦0⟧ の部屋へ。次に鍵の ∃ で、すべての住人と ⟦1⟧ の関係にある誰か ⟦2⟧ を連れてくる。","First go to the room of resident ⟦0⟧ with the door's ∀. Then, with the key's ∃, bring in someone ⟦2⟧ who stands in relation ⟦1⟧ to every resident."],["①扉の ∀、②鍵の ∃、③扉の ∃ で住人 ⟦0⟧、④鍵 ⟦1⟧ の ∀ で住人 ⟦2⟧、⑤鍵 ⟦3⟧ を扉へ。","① The door's ∀, ② the key's ∃, ③ resident ⟦0⟧ with the door's ∃, ④ resident ⟦2⟧ for the ∀ of key ⟦1⟧, ⑤ key ⟦3⟧ into the door."],["魔法と量化子","Spells and Quantifiers"],["背理法の魔法と量化子、構造による反証","The reductio spell with quantifiers, and refutation by structures"],["すべてではない","Not Everyone"],["「すべての住人が ⟦0⟧ というわけではない」から「⟦1⟧ でない住人がいる」を導きます。数学で頻繁に使う推論ですが、証人を直接は作れないので、背理法の魔法が必要です。","From \"not every resident is ⟦0⟧\", derive \"some resident is not ⟦1⟧\". An inference used very often in mathematics, but the witness cannot be built directly, so the reductio spell is needed."],["まず扉全体に背理法の魔法。鍵 ⟦0⟧ が手に入る。","First cast the reductio spell on the whole door. You get key ⟦0⟧."],["鍵 ⟦0⟧ を扉 ⊥ に差し込むと、扉は ⟦1⟧。住人 ⟦2⟧ の部屋で、もう一度魔法を唱えよう。","Insert key ⟦0⟧ into door ⊥ and the door becomes ⟦1⟧. Cast the spell once more in the room of resident ⟦2⟧."],["①魔法、②鍵 ⟦0⟧ を扉 ⊥ へ、③扉の ∀、④魔法、⑤鍵 ⟦1⟧ を扉 ⊥ へ、⑥扉の ∃ で住人 ⟦2⟧、⑦鍵 ⟦3⟧ を扉へ。","① Spell, ② key ⟦0⟧ into door ⊥, ③ the door's ∀, ④ spell, ⑤ key ⟦1⟧ into door ⊥, ⑥ resident ⟦2⟧ with the door's ∃, ⑦ key ⟦3⟧ into the door."],["酒飲みのパラドックス","The Drinker Paradox"],["「ある住人 ⟦0⟧ がいて、⟦1⟧ が飲むならば全員が飲む」という、少し不思議な定理です（酒飲みのパラドックス）。一階述語論理では、住人が少なくとも一人はいると約束するので、新しい住人はいつでも呼べます。","A slightly strange theorem: \"there is a resident ⟦0⟧ such that if ⟦1⟧ drinks, everyone drinks\" (the drinker paradox). In first-order logic we agree that there is at least one resident, so you can always call a new one."],["まず魔法で、鍵 ⟦0⟧ を手に入れよう。","First use the spell to get key ⟦0⟧."],["扉の ∃ では「新しい住人」を証人にしてよい。その後 ⟦0⟧ を示すために住人の部屋に入り、もう一度魔法を唱える。","At the door's ∃ you may take \"a new resident\" as the witness. Then, to show ⟦0⟧, enter a resident's room and cast the spell once more."],["①魔法、②鍵を扉 ⊥ へ、③扉の ∃ で新しい住人、④扉の →、⑤扉の ∀、⑥魔法、⑦鍵 ⟦0⟧ を扉 ⊥ へ、⑧扉の ∃ でいまの部屋の住人 ⟦1⟧、⑨扉の →、⑩鍵 ⟦2⟧ を鍵 ⟦3⟧ へ、⑪出てきた鍵 ⊥ を扉へ。","① Spell, ② the key into door ⊥, ③ a new resident with the door's ∃, ④ the door's →, ⑤ the door's ∀, ⑥ spell, ⑦ key ⟦0⟧ into door ⊥, ⑧ the current room's resident ⟦1⟧ with the door's ∃, ⑨ the door's →, ⑩ key ⟦2⟧ onto key ⟦3⟧, ⑪ the ⊥ key that came out into the door."],["量化子の鑑定","Judging Quantifiers"],["3 つの扉のうち、正しい（証明できる）ものと誤り（証明できない）ものを見極めましょう。誤りのものは、住人と関係の表からなる<b>構造</b>を作って反例を示します。","Of the 3 doors, tell the valid ones (provable) from the invalid ones (not provable). Show the invalid ones by building a <b>structure</b> of residents and relation tables as a counterexample."],["誤りの扉は、住人 2 人の小さな構造で反例が作れる。","The invalid doors have counterexamples with a small structure of 2 residents."],["扉 A は {{s:7-5}} と同じ形。扉 B は ⟦0⟧ を「等しい」関係にしてみよう。扉 C は ⟦1⟧ と ⟦2⟧ を住人ごとに分けてみよう。","Door A has the same form as {{s:7-5}}. For door B, try making ⟦0⟧ the relation \"is equal to\". For door C, try giving ⟦1⟧ and ⟦2⟧ to different residents."],["A は正しく、B と C は誤り。B：住人 1, 2 で、⟦0⟧ は (1,1) と (2,2) を真にし、残りは偽。C：住人 1, 2 で、⟦1⟧ と ⟦2⟧ を真にし、残りは偽にする。","A is valid; B and C are invalid. B: with residents 1, 2, make ⟦0⟧ true at (1,1) and (2,2) and false elsewhere. C: with residents 1, 2, make ⟦1⟧ and ⟦2⟧ true and the rest false."],["量化子の順序を入れ替えて、∃∀ から ∀∃ へは進めます。","Swapping the order of quantifiers, you can go from ∃∀ to ∀∃."],["逆は成り立ちません。住人 1, 2 で ⟦0⟧ を「等しい」とすると、どの ⟦1⟧ にも自分自身という ⟦2⟧ がいますが、全員と関係する ⟦3⟧ はいません。数学の「連続」と「一様連続」の違いも、この形です。","The converse fails. With residents 1, 2 and ⟦0⟧ meaning \"is equal to\", every ⟦1⟧ has a ⟦2⟧, namely itself, but no ⟦3⟧ is related to everyone. The difference between \"continuous\" and \"uniformly continuous\" in mathematics has this form."],["「全員が ⟦0⟧ か ⟦1⟧」と「全員が ⟦2⟧、または全員が ⟦3⟧」は違います。住人 1 だけが ⟦4⟧、住人 2 だけが ⟦5⟧ の構造が反例です。","\"Everyone is ⟦0⟧ or ⟦1⟧\" differs from \"everyone is ⟦2⟧, or everyone is ⟦3⟧\". A structure where only resident 1 is ⟦4⟧ and only resident 2 is ⟦5⟧ is a counterexample."],["等号の工房","Equality Forge"],["=I、=E、関数記号、定理カード","=I, =E, function symbols, theorem cards"],["等しいもの","Equal Things"],["等号を扱います。扉の両辺が同じ項なら、扉の <b>=</b> をタップすると開きます（=I、反射律）。鍵 ⟦0⟧ を扉に差し込むと、扉の中の ⟦1⟧ を ⟦2⟧ に書き換えられます（=E）。「⟦3⟧ なら、⟦4⟧ についての扉は ⟦5⟧ についての扉と同じ」という考え方です。ここで証明する<b>対称律</b>は、定理カードになります。","This deals with equality. If both sides of a door are the same term, tap its <b>=</b> to open it (=I, reflexivity). Insert key ⟦0⟧ into a door to rewrite ⟦1⟧ in the door to ⟦2⟧ (=E). The idea is: \"if ⟦3⟧, a door about ⟦4⟧ is the same as a door about ⟦5⟧\". The <b>symmetry</b> proved here becomes a theorem card."],["∀ を2回、→ を1回タップして、鍵 ⟦0⟧ を持った部屋へ。扉は ⟦1⟧。","Tap ∀ twice and → once to enter a room holding key ⟦0⟧. The door is ⟦1⟧."],["鍵 ⟦0⟧ を扉に差し込むと、扉の中の ⟦1⟧ が ⟦2⟧ に書き換わる。","Insert key ⟦0⟧ into the door and ⟦1⟧ in the door is rewritten to ⟦2⟧."],["①②扉の ∀ を2回、③扉の →、④鍵 ⟦0⟧ を扉へ、⑤扉 ⟦1⟧ の = をタップ。","①② the door's ∀ twice, ③ the door's →, ④ key ⟦0⟧ into the door, ⑤ tap the = of door ⟦1⟧."],["等式をつなぐ","Joining Equations"],["二つの等式をつなぐ<b>推移律</b>です。証明すると、これも定理カードになります。","<b>Transitivity</b>, joining two equations. Once proved, this also becomes a theorem card."],["∀ を3回、→ を2回タップしよう。扉は ⟦0⟧、鍵は ⟦1⟧ と ⟦2⟧。","Tap ∀ three times and → twice. The door is ⟦0⟧, and the keys are ⟦1⟧ and ⟦2⟧."],["鍵 ⟦0⟧ を扉 ⟦1⟧ に差し込むと、⟦2⟧ が ⟦3⟧ に書き換わる。","Insert key ⟦0⟧ into door ⟦1⟧ and ⟦2⟧ is rewritten to ⟦3⟧."],["①〜③扉の ∀、④⑤扉の →、⑥鍵 ⟦0⟧ を扉へ、⑦鍵 ⟦1⟧ を扉へ。","①–③ the door's ∀, ④⑤ the door's →, ⑥ key ⟦0⟧ into the door, ⑦ key ⟦1⟧ into the door."],["関数と等号","Functions and Equality"],["⟦0⟧ の ⟦1⟧ は、住人 ⟦2⟧ に操作 <i>f</i> を施して得られる住人です（関数記号）。等しい住人に同じ操作を施すと、結果も等しくなります。","⟦1⟧ in ⟦0⟧ is the resident obtained by applying the operation <i>f</i> to resident ⟦2⟧ (a function symbol). Applying the same operation to equal residents gives equal results."],["∀ を2回、→ を1回で、鍵 ⟦0⟧ を持った部屋へ。扉は ⟦1⟧。","With ∀ twice and → once, enter a room holding key ⟦0⟧. The door is ⟦1⟧."],["鍵 ⟦0⟧ を扉に差し込むと、⟦1⟧ の中の ⟦2⟧ も書き換わる。","Insert key ⟦0⟧ into the door and ⟦2⟧ inside ⟦1⟧ is rewritten too."],["①②扉の ∀、③扉の →、④鍵 ⟦0⟧ を扉へ、⑤扉 ⟦1⟧ の = をタップ。","①② the door's ∀, ③ the door's →, ④ key ⟦0⟧ into the door, ⑤ tap the = of door ⟦1⟧."],["定理カード","Theorem cards"],["=E は右辺を左辺に戻す向きの規則なので、鍵 ⟦0⟧ のままでは扉 ⟦1⟧ の ⟦2⟧ を書き換えられません。ここで、{{s:9-1}} で証明した<b>定理カード</b>「等号の対称律」が使えます。定理カードは入口の広間に置かれた特別な鍵で、∀ に住人を当てはめて使います。","=E is a rule in the direction that turns the right side back into the left side, so key ⟦0⟧ as it is cannot rewrite ⟦2⟧ in door ⟦1⟧. Here you can use the <b>theorem card</b> \"Symmetry of equality\" proved in {{s:9-1}}. A theorem card is a special key placed in the entrance hall; instantiate its ∀ with residents to use it."],["対称律のカード ⟦0⟧ に、⟦1⟧ と ⟦2⟧ を当てはめよう。","Instantiate the symmetry card ⟦0⟧ with ⟦1⟧ and ⟦2⟧."],["できた鍵 ⟦0⟧ に鍵 ⟦1⟧ を差し込むと、⟦2⟧ が手に入る。","Insert key ⟦1⟧ into the new key ⟦0⟧ and you get ⟦2⟧."],["①カードの ∀ で ⟦0⟧、②次の ∀ で ⟦1⟧、③鍵 ⟦2⟧ を鍵 ⟦3⟧ へ、④鍵 ⟦4⟧ を扉へ、⑤鍵 ⟦5⟧ を扉へ。","① ⟦0⟧ for the card's ∀, ② ⟦1⟧ for the next ∀, ③ key ⟦2⟧ onto key ⟦3⟧, ④ key ⟦4⟧ into the door, ⑤ key ⟦5⟧ into the door."],["単位元はただ一つ","The Identity Is Unique"],["群の単位元がただ一つであることを証明します。⟦0⟧ は「⟦1⟧ を左から掛けても変わらない」、⟦2⟧ は「⟦3⟧ を右から掛けても変わらない」という意味です。⟦4⟧ と ⟦5⟧ を掛け合わせた ⟦6⟧ に注目しましょう。定理カードは使っても使わなくてもかまいません。","Prove that the identity element of a group is unique. ⟦0⟧ means \"multiplying by ⟦1⟧ on the left changes nothing\", and ⟦2⟧ means \"multiplying by ⟦3⟧ on the right changes nothing\". Look at ⟦6⟧, the product of ⟦4⟧ and ⟦5⟧. You may use the theorem cards or not."],["二つの鍵に、それぞれ ⟦0⟧ と ⟦1⟧ を当てはめてみよう。","Instantiate the two keys with ⟦0⟧ and ⟦1⟧ respectively."],["鍵 ⟦0⟧ を扉 ⟦1⟧ に差し込むと、扉の左辺 ⟦2⟧ が ⟦3⟧ に書き換わる。","Insert key ⟦0⟧ into door ⟦1⟧ and the left side ⟦2⟧ of the door is rewritten to ⟦3⟧."],["①鍵 ⟦0⟧ の ∀ で ⟦1⟧、②鍵 ⟦2⟧ の ∀ で ⟦3⟧、③鍵 ⟦4⟧ を扉へ、④鍵 ⟦5⟧ を扉へ。","① ⟦1⟧ for the ∀ of key ⟦0⟧, ② ⟦3⟧ for the ∀ of key ⟦2⟧, ③ key ⟦4⟧ into the door, ④ key ⟦5⟧ into the door."],["群論の最初の定理です。等式を書き換えでつなぐ ⟦0⟧ = ⟦1⟧ = ⟦2⟧ という計算が、そのまま証明図になっています。","The first theorem of group theory. The calculation ⟦0⟧ = ⟦1⟧ = ⟦2⟧, linking equations by rewriting, is itself the proof tree."],["数学の街","Town of Mathematics"],["順序・写像・集合・群","Orders, maps, sets, groups"],["最大元はただ一つ","The Greatest Element Is Unique"],["順序 ⟦0⟧ の反対称律と、⟦1⟧ と ⟦2⟧ がどちらも最大元であることから、⟦3⟧ を示します。数学の定理の多くは、このように「公理や仮定を鍵として持ち、∀ に具体的な住人を当てはめて使う」形で証明できます。","From antisymmetry of the order ⟦0⟧ and the fact that both ⟦1⟧ and ⟦2⟧ are greatest elements, show ⟦3⟧. Many theorems of mathematics are proved in this way: \"hold the axioms and assumptions as keys, and instantiate their ∀ with concrete residents\"."],["反対称律の鍵に ⟦0⟧ と ⟦1⟧ を当てはめて、扉 ⟦2⟧ に差し込もう。","Instantiate the antisymmetry key with ⟦0⟧ and ⟦1⟧ and insert it into door ⟦2⟧."],["扉が ⟦0⟧ になったら、∧ で二つに分ける。それぞれ、最大元の鍵に住人を当てはめれば開く。","When the door becomes ⟦0⟧, split it in two with ∧. Each opens if you instantiate a greatest-element key with a resident."],["①②反対称律の ∀ に ⟦0⟧、⟦1⟧、③できた鍵を扉へ、④扉の ∧、⑤鍵 ⟦2⟧ に ⟦3⟧、⑥鍵を扉へ、⑦鍵 ⟦4⟧ に ⟦5⟧、⑧鍵を扉へ。","①② ⟦0⟧, ⟦1⟧ for the ∀ of antisymmetry, ③ the new key into the door, ④ the door's ∧, ⑤ ⟦3⟧ for key ⟦2⟧, ⑥ the key into the door, ⑦ ⟦5⟧ for key ⟦4⟧, ⑧ the key into the door."],["狭義の順序","Strict Orders"],["非反射律と推移律から、狭義の順序が非対称（⟦0⟧ なら ⟦1⟧）であることを示します。","From irreflexivity and transitivity, show that a strict order is asymmetric (if ⟦0⟧ then ⟦1⟧)."],["∀ を2回、→ と ¬ をタップして、鍵 ⟦0⟧ と ⟦1⟧ を持った部屋へ。扉は ⊥。","Tap ∀ twice, then → and ¬, to enter a room holding keys ⟦0⟧ and ⟦1⟧. The door is ⊥."],["非反射律に ⟦0⟧ を当てはめた鍵 ⟦1⟧ を扉 ⊥ に差し込むと、扉は ⟦2⟧。推移律の出番。","Insert into door ⊥ the key ⟦1⟧, irreflexivity instantiated with ⟦0⟧, and the door becomes ⟦2⟧. Now it is transitivity's turn."],["①〜④扉の ∀、∀、→、¬、⑤非反射律に ⟦0⟧、⑥鍵を扉 ⊥ へ、⑦〜⑨推移律に ⟦1⟧、⟦2⟧、⟦3⟧、⑩鍵を扉へ、⑪扉の ∧、⑫⑬鍵 ⟦4⟧ と ⟦5⟧ で扉を開ける。","①–④ the door's ∀, ∀, →, ¬, ⑤ ⟦0⟧ for irreflexivity, ⑥ the key into door ⊥, ⑦–⑨ ⟦1⟧, ⟦2⟧, ⟦3⟧ for transitivity, ⑩ the key into the door, ⑪ the door's ∧, ⑫⑬ open the doors with keys ⟦4⟧ and ⟦5⟧."],["単射の合成","Composing Injections"],["写像 <i>f</i> と <i>g</i> がどちらも単射なら、合成 ⟦0⟧ も単射です。∀ の鍵には、住人だけでなく ⟦1⟧ のような<b>項</b>も当てはめられます。","If the maps <i>f</i> and <i>g</i> are both injective, so is the composite ⟦0⟧. A ∀ key can be instantiated not only with residents but also with <b>terms</b> such as ⟦1⟧."],["扉の ∀ を2回、→ を1回で、鍵 ⟦0⟧ を持った部屋へ。扉は ⟦1⟧。","With the door's ∀ twice and → once, enter a room holding key ⟦0⟧. The door is ⟦1⟧."],["<i>f</i> の単射性の鍵に ⟦0⟧、⟦1⟧ を当てはめて扉に差し込むと、扉は ⟦2⟧。次は <i>g</i> の単射性に、項 ⟦3⟧ と ⟦4⟧ を当てはめる。","Instantiate the injectivity key of <i>f</i> with ⟦0⟧, ⟦1⟧ and insert it into the door; the door becomes ⟦2⟧. Next, instantiate the injectivity of <i>g</i> with the terms ⟦3⟧ and ⟦4⟧."],["①②扉の ∀、③扉の →、④⑤<i>f</i> の鍵に ⟦0⟧、⟦1⟧、⑥鍵を扉へ、⑦⑧<i>g</i> の鍵に ⟦2⟧、⟦3⟧、⑨鍵を扉へ、⑩鍵 ⟦4⟧ を扉へ。","①② the door's ∀, ③ the door's →, ④⑤ ⟦0⟧, ⟦1⟧ for the key of <i>f</i>, ⑥ the key into the door, ⑦⑧ ⟦2⟧, ⟦3⟧ for the key of <i>g</i>, ⑨ the key into the door, ⑩ key ⟦4⟧ into the door."],["全射の合成","Composing Surjections"],["<i>f</i> と <i>g</i> がどちらも全射なら、合成も全射です。∃ の鍵から連れてきた住人を、証人として使います。","If <i>f</i> and <i>g</i> are both surjective, so is the composite. Use residents brought in from ∃ keys as witnesses."],["扉の ∀ で住人 ⟦0⟧ の部屋へ。<i>g</i> の全射性に ⟦1⟧ を当てはめ、∃ から ⟦2⟧ を満たす ⟦3⟧ を連れてこよう。","Go to the room of resident ⟦0⟧ with the door's ∀. Instantiate the surjectivity of <i>g</i> with ⟦1⟧ and bring in ⟦3⟧ satisfying ⟦2⟧ from the ∃."],["<i>f</i> の全射性に ⟦0⟧ を当てはめて ⟦1⟧ を満たす ⟦2⟧ を連れてきたら、扉の ∃ の証人は ⟦3⟧。あとは等式で書き換える。","Once you instantiate the surjectivity of <i>f</i> with ⟦0⟧ and bring in ⟦2⟧ satisfying ⟦1⟧, the witness for the door's ∃ is ⟦3⟧. Then rewrite with the equations."],["①扉の ∀、②<i>g</i> の鍵に ⟦0⟧、③鍵の ∃、④<i>f</i> の鍵に ⟦1⟧、⑤鍵の ∃、⑥扉の ∃ で ⟦2⟧、⑦鍵 ⟦3⟧ を扉へ、⑧鍵 ⟦4⟧ を扉へ、⑨扉の = をタップ。","① The door's ∀, ② ⟦0⟧ for the key of <i>g</i>, ③ the key's ∃, ④ ⟦1⟧ for the key of <i>f</i>, ⑤ the key's ∃, ⑥ ⟦2⟧ with the door's ∃, ⑦ key ⟦3⟧ into the door, ⑧ key ⟦4⟧ into the door, ⑨ tap the door's =."],["集合は、⟦0⟧（⟦1⟧ は ⟦2⟧ の要素）という述語で扱います。⟦3⟧ や ⟦4⟧ などは<b>定義による略記</b>で、記号をタップすると定義どおりに展開されます。⟦5⟧ は ⟦6⟧、⟦7⟧ は ⟦8⟧ の略記です。","Sets are handled with the predicate ⟦0⟧ (⟦1⟧ is an element of ⟦2⟧). Things like ⟦3⟧ and ⟦4⟧ are <b>abbreviations by definition</b>; tap the symbol to unfold it by its definition. ⟦5⟧ is short for ⟦6⟧, and ⟦7⟧ is short for ⟦8⟧."],["扉の ⊆ をタップして、定義を展開しよう。","Tap the door's ⊆ to unfold the definition."],["∀ と → で、鍵 ⟦0⟧ を持った部屋へ。鍵の ∩ をタップして展開すると、∧ の鍵になる。","With ∀ and →, enter a room holding key ⟦0⟧. Tap the key's ∩ to unfold it, and it becomes a ∧ key."],["①扉の ⊆、②扉の ∀、③扉の →、④鍵の ∩、⑤鍵の ∧、⑥鍵 ⟦0⟧ を扉へ。","① The door's ⊆, ② the door's ∀, ③ the door's →, ④ the key's ∩, ⑤ the key's ∧, ⑥ key ⟦0⟧ into the door."],["包含は推移的","Inclusion Is Transitive"],["包含 ⊆ の推移律です。扉と鍵の両方で、⊆ を定義どおりに展開して使います。","Transitivity of inclusion ⊆. Unfold ⊆ by its definition in both the door and the keys."],["扉の ⊆ を展開し、∀ と → で鍵 ⟦0⟧ を持った部屋へ。扉は ⟦1⟧。","Unfold the door's ⊆ and, with ∀ and →, enter a room holding key ⟦0⟧. The door is ⟦1⟧."],["鍵 ⟦0⟧ を展開して ⟦1⟧ を当てはめ、扉に差し込む。次は鍵 ⟦2⟧ の番。","Unfold key ⟦0⟧, instantiate it with ⟦1⟧, and insert it into the door. Next is key ⟦2⟧'s turn."],["①扉の ⊆、②扉の ∀、③扉の →、④鍵 ⟦0⟧ の ⊆、⑤ ∀ に ⟦1⟧、⑥鍵を扉へ、⑦鍵 ⟦2⟧ の ⊆、⑧ ∀ に ⟦3⟧、⑨鍵を扉へ、⑩鍵 ⟦4⟧ を扉へ。","① The door's ⊆, ② the door's ∀, ③ the door's →, ④ the ⊆ of key ⟦0⟧, ⑤ ⟦1⟧ for its ∀, ⑥ the key into the door, ⑦ the ⊆ of key ⟦2⟧, ⑧ ⟦3⟧ for its ∀, ⑨ the key into the door, ⑩ key ⟦4⟧ into the door."],["左からの消去","Cancelling on the Left"],["群の公理（結合律、左単位元、左逆元）から、左からの消去律 ⟦0⟧ ⇒ ⟦1⟧ を示します。数学の計算らしく、<b>この層の等式は両方の向きに使えます</b>（逆向きに使うと、対称律が自動で証明図に入ります）。⟦2⟧ は ⟦3⟧ の逆元です。","From the group axioms (associativity, left identity, left inverse), show the left cancellation law ⟦0⟧ ⇒ ⟦1⟧. As in mathematical calculation, <b>equations on this level can be used in both directions</b> (when used backwards, symmetry is added to the proof tree automatically). ⟦2⟧ is the inverse of ⟦3⟧."],["まず、必要な等式の鍵を作ろう。単位元の鍵に ⟦0⟧ と ⟦1⟧、逆元の鍵に ⟦2⟧、結合律に ⟦3⟧、⟦4⟧、⟦5⟧ を当てはめる。最後の ∀ だけを外した途中の鍵に ⟦6⟧ を当てはめれば、もう一つの結合律の鍵も 1 手で作れる。","First make the equation keys you need: instantiate the identity key with ⟦0⟧ and ⟦1⟧, the inverse key with ⟦2⟧, and associativity with ⟦3⟧, ⟦4⟧, ⟦5⟧. If you instantiate with ⟦6⟧ the intermediate key in which only the last ∀ remains, you get the other associativity key in one move."],["扉 ⟦0⟧ を、⟦1⟧ ＝ ⟦2⟧ ＝ ⟦3⟧ ＝ ⟦4⟧ の順に書き換えていく。⟦5⟧ の側も同じ。最後に仮定 ⟦6⟧ を使う。","Rewrite door ⟦0⟧ in the order ⟦1⟧ = ⟦2⟧ = ⟦3⟧ = ⟦4⟧. The same for the ⟦5⟧ side. Finally use the assumption ⟦6⟧."],["①〜⑦鍵を作る、⑧鍵 ⟦0⟧ を扉へ、⑨鍵 ⟦1⟧ を扉へ、⑩鍵 ⟦2⟧ を扉へ（両方の ⟦3⟧）、⑪⑫結合律の二つの鍵を扉へ（逆向き）、⑬鍵 ⟦4⟧ を扉へ、⑭扉の = をタップ。","①–⑦ make the keys, ⑧ key ⟦0⟧ into the door, ⑨ key ⟦1⟧ into the door, ⑩ key ⟦2⟧ into the door (both occurrences of ⟦3⟧), ⑪⑫ the two associativity keys into the door (backwards), ⑬ key ⟦4⟧ into the door, ⑭ tap the door's =."],["補集合のド・モルガン","De Morgan for Complements"],["補集合 ⟦0⟧ の定義は ⟦1⟧ ⇔ ⟦2⟧ です。定義の展開と、これまでの規則をすべて組み合わせます。","The complement ⟦0⟧ is defined by ⟦1⟧ ⇔ ⟦2⟧. Combine unfolding definitions with all the rules so far."],["扉の ⊆ を展開し、∀ と → で鍵 ⟦0⟧ を持った部屋へ。扉の ∩ と鍵の ᶜ も展開しよう。","Unfold the door's ⊆ and, with ∀ and →, enter a room holding key ⟦0⟧. Unfold the door's ∩ and the key's ᶜ too."],["扉を ∧ で分けたら、⟦0⟧ を展開して ¬ の部屋に入り、鍵 ⟦1⟧ を扉 ⊥ に差し込む。","After splitting the door with ∧, unfold ⟦0⟧, enter the ¬ room, and insert key ⟦1⟧ into door ⊥."],["①扉の ⊆、②扉の ∀、③扉の →、④扉の ∩、⑤鍵の ᶜ、⑥扉の ∧、⑦扉の ᶜ、⑧扉の ¬、⑨鍵 ⟦0⟧ を扉 ⊥ へ、⑩扉の ∪、⑪扉の ∨ で左、⑫鍵 ⟦1⟧ を扉へ。もう一方の扉も同じように（⑬〜⑱）。","① The door's ⊆, ② the door's ∀, ③ the door's →, ④ the door's ∩, ⑤ the key's ᶜ, ⑥ the door's ∧, ⑦ the door's ᶜ, ⑧ the door's ¬, ⑨ key ⟦0⟧ into door ⊥, ⑩ the door's ∪, ⑪ left with the door's ∨, ⑫ key ⟦1⟧ into the door. The other door in the same way (⑬–⑱)."],["補題の工房","Lemma Workshop"],["補題を立てる（カット）、定理カードを鍛える","Stating lemmas (cut), forging theorem cards"],["同じ道を三度","The Same Path Three Times"],["同じ推論を何度も繰り返すときは、<b>補題</b>を立てると証明がすっきりします。扉の「補題を立てる」を押して式を選ぶと、扉が「補題を証明する扉」と「補題を鍵として使う扉」の二つに分かれます。ここでは、住人 ⟦0⟧、⟦1⟧、⟦2⟧ について同じ鎖を3回たどる代わりに、⟦3⟧ を一度だけ証明して使い回しましょう。目安の手数は、補題を使ったときの手数です。","When the same reasoning is repeated, stating a <b>lemma</b> makes the proof neater. Press \"State a lemma\" on a door and choose a formula, and the door splits into a \"door that proves the lemma\" and a \"door that uses the lemma as a key\". Here, instead of following the same chain three times for residents ⟦0⟧, ⟦1⟧, ⟦2⟧, prove ⟦3⟧ once and reuse it. The par is the number of moves using the lemma."],["補題 ⟦0⟧ を立てよう。","State the lemma ⟦0⟧."],["補題の扉では、∀ と → で部屋に入り、4つの鍵を後ろ向きにたどる。使う側の扉では ∧ で分けて、補題に住人を当てはめる。","At the lemma's door, enter a room with ∀ and → and trace back through the four keys. At the door that uses it, split with ∧ and instantiate the lemma with residents."],["①補題を立てる、②〜⑫補題の証明（∀、→、4つの鍵に住人を当てはめて扉へ、⟦0⟧ で閉じる）、⑬⑭扉の ∧ を2回、⑮〜㉓三つの扉で「補題に住人を当てはめ、扉へ差し込み、⟦1⟧ で閉じる」。","① State the lemma, ②–⑫ prove the lemma (∀, →, instantiate the four keys with the resident and insert them, close with ⟦0⟧), ⑬⑭ the door's ∧ twice, ⑮–㉓ at the three doors, \"instantiate the lemma with the resident, insert it, close with ⟦1⟧\"."],["左消去律を鍛える","Forging Left Cancellation"],["{{s:10-7}} の左からの消去律を、すべての住人について成り立つ定理として証明します。証明すると、<b>定理カード「左消去律」</b>として、次の部屋で使えるようになります。数学で、一度証明した補題を定理として何度も使うのと同じです。","Prove the left cancellation law of {{s:10-7}} as a theorem holding for all residents. Once proved, it can be used in the next room as the <b>theorem card \"Left cancellation\"</b>, just as mathematicians reuse a lemma they have proved as a theorem."],["扉の ∀ を3回、→ を1回で、鍵 ⟦0⟧ を持った部屋へ。あとは {{s:10-7}} と同じ。","With the door's ∀ three times and → once, enter a room holding key ⟦0⟧. The rest is the same as {{s:10-7}}."],["⟦0⟧ ＝ ⟦1⟧ ＝ ⟦2⟧ ＝ ⟦3⟧ と書き換えていく。","Rewrite in the order ⟦0⟧ = ⟦1⟧ = ⟦2⟧ = ⟦3⟧."],["①〜④扉の ∀、∀、∀、→、⑤〜⑪鍵を作る（{{s:10-7}} と同じ）、⑫〜⑰扉を書き換える、⑱扉の = をタップ。","①–④ the door's ∀, ∀, ∀, →, ⑤–⑪ make the keys (as in {{s:10-7}}), ⑫–⑰ rewrite the door, ⑱ tap the door's =."],["右単位元","The Right Identity"],["群の公理は「左単位元」⟦0⟧ だけを仮定していますが、実は ⟦1⟧ は右単位元でもあります。前の部屋で鍛えた定理カード「左消去律」を使えば、短く証明できます。","The group axioms assume only the \"left identity\" ⟦0⟧, but in fact ⟦1⟧ is also a right identity. With the theorem card \"Left cancellation\" forged in the previous room, the proof is short."],["扉の ∀ で住人 ⟦0⟧ の部屋へ。逆元の鍵に ⟦1⟧ を当てはめて ⟦2⟧ を登場させよう。","Go to the room of resident ⟦0⟧ with the door's ∀. Instantiate the inverse key with ⟦1⟧ to bring ⟦2⟧ into play."],["左消去律のカードに ⟦0⟧、⟦1⟧、⟦2⟧ を当てはめて扉に差し込むと、扉は ⟦3⟧。あとは結合律と逆元と単位元で書き換える。","Instantiate the left cancellation card with ⟦0⟧, ⟦1⟧, ⟦2⟧ and insert it into the door; the door becomes ⟦3⟧. Then rewrite with associativity, inverses and the identity."],["①扉の ∀、②逆元の鍵に ⟦0⟧、③〜⑤カードに ⟦1⟧、⟦2⟧、⟦3⟧、⑥鍵を扉へ、⑦〜⑨結合律に ⟦4⟧、⟦5⟧、⟦6⟧、⑩その鍵を扉へ、⑪鍵 ⟦7⟧ を扉へ（二つの ⟦8⟧ がまとめて ⟦9⟧ に書き換わる）、⑫単位元の鍵に ⟦10⟧、⑬鍵を扉へ。","① The door's ∀, ② ⟦0⟧ for the inverse key, ③–⑤ ⟦1⟧, ⟦2⟧, ⟦3⟧ for the card, ⑥ the key into the door, ⑦–⑨ ⟦4⟧, ⟦5⟧, ⟦6⟧ for associativity, ⑩ that key into the door, ⑪ key ⟦7⟧ into the door (both occurrences of ⟦8⟧ are rewritten to ⟦9⟧ at once), ⑫ ⟦10⟧ for the identity key, ⑬ the key into the door."],["自然数の塔","Tower of Natural Numbers"],["足し算の定義、数学的帰納法","Definition of addition, mathematical induction"],["自然数を、⟦0⟧ と「次の数」⟦1⟧（後者）で表します。⟦2⟧ が 1、⟦3⟧ が 2 です。足し算は二つの鍵で定義されています：⟦4⟧ と ⟦5⟧。この定義だけを使って、1 + 1 = 2 を計算しましょう。等式は両方の向きに使えます。","Natural numbers are written with ⟦0⟧ and \"the next number\" ⟦1⟧ (the successor): ⟦2⟧ is 1 and ⟦3⟧ is 2. Addition is defined by two keys: ⟦4⟧ and ⟦5⟧. Using only this definition, compute 1 + 1 = 2. Equations can be used in both directions."],["二つ目の定義の鍵に ⟦0⟧ と ⟦1⟧ を当てはめよう。","Instantiate the second definition key with ⟦0⟧ and ⟦1⟧."],["⟦0⟧ で扉の左辺を書き換え、次に一つ目の定義に ⟦1⟧ を当てはめた鍵で ⟦2⟧ を書き換える。","Rewrite the left side of the door with ⟦0⟧, then rewrite ⟦2⟧ with the first definition instantiated with ⟦1⟧."],["①②二つ目の鍵に ⟦0⟧、⟦1⟧、③その鍵を扉へ、④一つ目の鍵に ⟦2⟧、⑤その鍵を扉へ、⑥扉の = をタップ。","①② ⟦0⟧, ⟦1⟧ for the second key, ③ that key into the door, ④ ⟦2⟧ for the first key, ⑤ that key into the door, ⑥ tap the door's =."],["0 を左から足す","Adding 0 on the left"],["定義からは ⟦0⟧ は分かりますが、⟦1⟧ は分かりません。すべての自然数について示すには<b>数学的帰納法</b>を使います。扉 ⟦2⟧ の「帰納法」を押すと、扉が「⟦3⟧（出発点）」と「帰納法の部屋」に分かれます。部屋では、住人 ⟦4⟧ について帰納法の仮定 ⟦5⟧ を鍵として、⟦6⟧ について示します。","The definition gives ⟦0⟧, but not ⟦1⟧. To show something for all natural numbers, use <b>mathematical induction</b>. Press \"Induction\" on door ⟦2⟧ and the door splits into \"⟦3⟧ (the base case)\" and the \"induction room\". In the room, using the induction hypothesis ⟦5⟧ about resident ⟦4⟧ as a key, you show it for ⟦6⟧."],["扉の「帰納法」を押そう。出発点の扉 ⟦0⟧ は、一つ目の定義に ⟦1⟧ を当てはめれば開く。","Press \"Induction\" on the door. The base-case door ⟦0⟧ opens if you instantiate the first definition with ⟦1⟧."],["帰納法の部屋の扉は ⟦0⟧。二つ目の定義に ⟦1⟧ と ⟦2⟧ を当てはめて書き換え、次に帰納法の仮定 ⟦3⟧ で書き換える。","The door of the induction room is ⟦0⟧. Rewrite with the second definition instantiated with ⟦1⟧ and ⟦2⟧, then rewrite with the induction hypothesis ⟦3⟧."],["①帰納法、②一つ目の鍵に ⟦0⟧、③その鍵で扉を開ける、④⑤二つ目の鍵に ⟦1⟧、⟦2⟧、⑥その鍵を扉へ、⑦帰納法の仮定を扉へ、⑧扉の = をタップ。","① Induction, ② ⟦0⟧ for the first key, ③ open the door with that key, ④⑤ ⟦1⟧, ⟦2⟧ for the second key, ⑥ that key into the door, ⑦ the induction hypothesis into the door, ⑧ tap the door's =."],["後者を外に出す","Moving the successor out"],["⟦0⟧ を、⟦1⟧ についての帰納法で示します。⟦2⟧ は先に ∀ で住人 ⟦3⟧ にしておき、そのあと扉 ⟦4⟧ で帰納法を使います。","Show ⟦0⟧ by induction on ⟦1⟧. First make ⟦2⟧ a resident ⟦3⟧ with ∀, then use induction on door ⟦4⟧."],["扉の ∀ で住人 ⟦0⟧ の部屋に入ってから、「帰納法」を押そう。","Enter the room of resident ⟦0⟧ with the door's ∀, then press \"Induction\"."],["出発点 ⟦0⟧ は、一つ目の定義に ⟦1⟧ と ⟦2⟧ をそれぞれ当てはめて書き換える。推進では、二つ目の定義を2回（⟦3⟧、⟦4⟧ と ⟦5⟧、⟦6⟧）と、帰納法の仮定を使う。","For the base case ⟦0⟧, rewrite with the first definition instantiated with ⟦1⟧ and with ⟦2⟧. For the step, use the second definition twice (⟦3⟧, ⟦4⟧ and ⟦5⟧, ⟦6⟧) and the induction hypothesis."],["①扉の ∀、②帰納法、③一つ目の定義に ⟦0⟧、④扉へ、⑤一つ目の定義に ⟦1⟧、⑥扉へ、⑦ = をタップ、⑧⑨二つ目の定義に ⟦2⟧、⟦3⟧、⑩扉へ、⑪帰納法の仮定を扉へ、⑫⑬二つ目の定義に ⟦4⟧、⟦5⟧、⑭扉へ、⑮ = をタップ。","① The door's ∀, ② induction, ③ ⟦0⟧ for the first definition, ④ into the door, ⑤ ⟦1⟧ for the first definition, ⑥ into the door, ⑦ tap =, ⑧⑨ ⟦2⟧, ⟦3⟧ for the second definition, ⑩ into the door, ⑪ the induction hypothesis into the door, ⑫⑬ ⟦4⟧, ⟦5⟧ for the second definition, ⑭ into the door, ⑮ tap =."],["足し算の交換法則","Commutativity of addition"],["足し算の交換法則 ⟦0⟧ を、⟦1⟧ についての帰納法で示します。{{s:12-2}} と {{s:12-3}} で鍛えた二つの定理カードが、ちょうど出発点と推進で役に立ちます。","Show commutativity of addition ⟦0⟧ by induction on ⟦1⟧. The two theorem cards forged in {{s:12-2}} and {{s:12-3}} fit exactly the base case and the step."],["扉の ∀ で住人 ⟦0⟧ の部屋に入り、帰納法を使おう。","Enter the room of resident ⟦0⟧ with the door's ∀ and use induction."],["出発点 ⟦0⟧ は、一つ目の定義とカード「0 を左から足す」で両辺を ⟦1⟧ にする。推進 ⟦2⟧ は、二つ目の定義、帰納法の仮定、カード「後者を外に出す」の順に書き換える。","For the base case ⟦0⟧, make both sides ⟦1⟧ with the first definition and the card \"Adding 0 on the left\". For the step ⟦2⟧, rewrite with the second definition, the induction hypothesis, and the card \"Moving the successor out\", in that order."],["①扉の ∀、②帰納法、③一つ目の定義に ⟦0⟧、④扉へ、⑤カード「0 を左から足す」に ⟦1⟧、⑥扉へ、⑦ = をタップ、⑧⑨二つ目の定義に ⟦2⟧、⟦3⟧、⑩扉へ、⑪帰納法の仮定を扉へ、⑫⑬カード「後者を外に出す」に ⟦4⟧、⟦5⟧、⑭扉へ、⑮ = をタップ。","① The door's ∀, ② induction, ③ ⟦0⟧ for the first definition, ④ into the door, ⑤ ⟦1⟧ for the card \"Adding 0 on the left\", ⑥ into the door, ⑦ tap =, ⑧⑨ ⟦2⟧, ⟦3⟧ for the second definition, ⑩ into the door, ⑪ the induction hypothesis into the door, ⑫⑬ ⟦4⟧, ⟦5⟧ for the card \"Moving the successor out\", ⑭ into the door, ⑮ tap =."],["掛け算の塔","Tower of Multiplication"],["掛け算の定義、結合法則、分配法則","Definition of multiplication, associativity, distributivity"],["1 を掛ける","Multiplying by 1"],["掛け算 ⟦0⟧ を、二つの鍵で定義します：⟦1⟧ と ⟦2⟧。「⟦3⟧ を ⟦4⟧ 回足す」は「⟦5⟧ を ⟦6⟧ 回足して、もう一度 ⟦7⟧ を足す」という意味です。まずは、1（⟦8⟧）を掛けても変わらないことを示しましょう。","Multiplication ⟦0⟧ is defined by two keys: ⟦1⟧ and ⟦2⟧. \"Adding ⟦3⟧ ⟦4⟧ times\" means \"adding ⟦5⟧ ⟦6⟧ times, then adding ⟦7⟧ once more\". First show that multiplying by 1 (⟦8⟧) changes nothing."],["扉の ∀ で住人 ⟦0⟧ の部屋へ。掛け算の二つ目の定義に ⟦1⟧ と ⟦2⟧ を当てはめて、扉を書き換えよう。","Go to the room of resident ⟦0⟧ with the door's ∀. Instantiate the second definition of multiplication with ⟦1⟧ and ⟦2⟧ and rewrite the door."],["扉が ⟦0⟧ になったら、掛け算の一つ目の定義で ⟦1⟧ を ⟦2⟧ に。最後はカード「0 を左から足す」。","When the door becomes ⟦0⟧, turn ⟦1⟧ into ⟦2⟧ with the first definition of multiplication. Finish with the card \"Adding 0 on the left\"."],["①扉の ∀、②③掛け算の二つ目の定義に ⟦0⟧、⟦1⟧、④扉へ、⑤掛け算の一つ目の定義に ⟦2⟧、⑥扉へ、⑦カードに ⟦3⟧、⑧その鍵で扉を開ける。","① The door's ∀, ②③ ⟦0⟧, ⟦1⟧ for the second definition of multiplication, ④ into the door, ⑤ ⟦2⟧ for the first definition of multiplication, ⑥ into the door, ⑦ ⟦3⟧ for the card, ⑧ open the door with that key."],["0 を左から掛ける","Multiplying by 0 on the left"],["定義からは ⟦0⟧ しか分かりません。⟦1⟧ は帰納法で示します。","The definition gives only ⟦0⟧. Show ⟦1⟧ by induction."],["帰納法を使おう。出発点 ⟦0⟧ は、掛け算の一つ目の定義に ⟦1⟧ を当てはめれば開く。","Use induction. The base case ⟦0⟧ opens if you instantiate the first definition of multiplication with ⟦1⟧."],["推進の扉 ⟦0⟧ は、掛け算の二つ目の定義で書き換え、帰納法の仮定で ⟦1⟧ を ⟦2⟧ にする。最後は ⟦3⟧。","For the step door ⟦0⟧, rewrite with the second definition of multiplication and turn ⟦1⟧ into ⟦2⟧ with the induction hypothesis. Finish with ⟦3⟧."],["①帰納法、②掛け算の一つ目の定義に ⟦0⟧、③その鍵で開ける、④⑤掛け算の二つ目の定義に ⟦1⟧、⟦2⟧、⑥扉へ、⑦帰納法の仮定を扉へ、⑧足し算の一つ目の定義に ⟦3⟧、⑨その鍵で開ける。","① Induction, ② ⟦0⟧ for the first definition of multiplication, ③ open with that key, ④⑤ ⟦1⟧, ⟦2⟧ for the second definition of multiplication, ⑥ into the door, ⑦ the induction hypothesis into the door, ⑧ ⟦3⟧ for the first definition of addition, ⑨ open with that key."],["足し算の結合法則","Associativity of addition"],["足し算の結合法則を、⟦0⟧ についての帰納法で示します。証明すると、定理カード「足し算の結合法則」になります。項が大きくなるので、書き換えの欄で、どの項がどこへ移るかをよく見ましょう。","Show associativity of addition by induction on ⟦0⟧. Once proved, it becomes the theorem card \"Associativity of addition\". The terms get large, so watch in the rewriting picker which term moves where."],["扉の ∀ を2回で住人 ⟦0⟧、⟦1⟧ の部屋に入り、帰納法を使おう（新しい住人は ⟦2⟧）。","Enter the room of residents ⟦0⟧, ⟦1⟧ with the door's ∀ twice, and use induction (the new resident is ⟦2⟧)."],["出発点は足し算の一つ目の定義を2回（⟦0⟧ と ⟦1⟧）。推進は、二つ目の定義（⟦2⟧, ⟦3⟧）→ 帰納法の仮定 → 二つ目の定義（⟦4⟧, ⟦5⟧）→ 二つ目の定義（⟦6⟧, ⟦7⟧）の順に書き換える。","The base case uses the first definition of addition twice (⟦0⟧ and ⟦1⟧). For the step, rewrite in the order: second definition (⟦2⟧, ⟦3⟧) → induction hypothesis → second definition (⟦4⟧, ⟦5⟧) → second definition (⟦6⟧, ⟦7⟧)."],["①②扉の ∀、③帰納法、④〜⑧出発点（定義に ⟦0⟧、扉へ、定義に ⟦1⟧、扉へ、=）、⑨⑩二つ目の定義に ⟦2⟧、⟦3⟧、⑪扉へ、⑫帰納法の仮定を扉へ、⑬⑭二つ目の定義に ⟦4⟧、⟦5⟧、⑮扉へ、⑯⑰二つ目の定義に ⟦6⟧、⟦7⟧、⑱扉へ、⑲ = をタップ。","①② the door's ∀, ③ induction, ④–⑧ base case (⟦0⟧ for the definition, into the door, ⟦1⟧ for the definition, into the door, =), ⑨⑩ ⟦2⟧, ⟦3⟧ for the second definition, ⑪ into the door, ⑫ the induction hypothesis into the door, ⑬⑭ ⟦4⟧, ⟦5⟧ for the second definition, ⑮ into the door, ⑯⑰ ⟦6⟧, ⟦7⟧ for the second definition, ⑱ into the door, ⑲ tap =."],["分配法則","Distributivity"],["分配法則 ⟦0⟧ を、⟦1⟧ についての帰納法で示します。足し算と掛け算の定義をすべて使い、最後に {{s:13-3}} で鍛えた結合法則のカードで仕上げます。","Show distributivity ⟦0⟧ by induction on ⟦1⟧. Use every definition of addition and multiplication, and finish with the associativity card forged in {{s:13-3}}."],["扉の ∀ を2回、帰納法。出発点 ⟦0⟧ は、⟦1⟧、⟦2⟧、⟦3⟧ の順に定義で書き換える。","The door's ∀ twice, then induction. For the base case ⟦0⟧, rewrite by the definitions in the order ⟦1⟧, ⟦2⟧, ⟦3⟧."],["推進 ⟦0⟧ では、⟦1⟧ → ⟦2⟧ → 帰納法の仮定 → ⟦3⟧ の順に書き換えると、扉は ⟦4⟧。これは結合法則そのもの。","For the step ⟦0⟧, rewriting in the order ⟦1⟧ → ⟦2⟧ → induction hypothesis → ⟦3⟧ turns the door into ⟦4⟧. This is associativity itself."],["①②扉の ∀、③帰納法、④〜⑩出発点（足し算の定義に ⟦0⟧、掛け算の定義に ⟦1⟧、足し算の定義に ⟦2⟧、それぞれ扉へ、最後に =）、⑪〜⑲推進の書き換え（足し算の二つ目に ⟦3⟧, ⟦4⟧、掛け算の二つ目に ⟦5⟧, ⟦6⟧、帰納法の仮定、そして掛け算の二つ目に ⟦7⟧ だけを当てはめた途中の鍵に ⟦8⟧）、⑳〜㉒結合法則のカードに ⟦9⟧、⟦10⟧、⟦11⟧、㉓その鍵で開ける。","①② the door's ∀, ③ induction, ④–⑩ base case (⟦0⟧ for the definition of addition, ⟦1⟧ for the definition of multiplication, ⟦2⟧ for the definition of addition, each into the door, and finally =), ⑪–⑲ rewriting in the step (⟦3⟧, ⟦4⟧ for the second of addition, ⟦5⟧, ⟦6⟧ for the second of multiplication, the induction hypothesis, and ⟦8⟧ for the intermediate key of the second of multiplication instantiated only with ⟦7⟧), ⑳–㉒ ⟦9⟧, ⟦10⟧, ⟦11⟧ for the associativity card, ㉓ open with that key."],["掛け算の法則","Laws of Multiplication"],["掛け算の結合法則と交換法則","Associativity and commutativity of multiplication"],["掛け算の結合法則","Associativity of multiplication"],["掛け算の結合法則を、⟦0⟧ についての帰納法で示します。推進の最後に、{{s:13-4}} で鍛えた分配法則のカードが登場します。","Show associativity of multiplication by induction on ⟦0⟧. At the end of the step, the distributivity card forged in {{s:13-4}} appears."],["扉の ∀ を2回、帰納法（新しい住人は ⟦0⟧）。出発点は掛け算の一つ目の定義を3回（⟦1⟧、⟦2⟧、⟦3⟧）使って、両辺を ⟦4⟧ にする。","The door's ∀ twice, then induction (the new resident is ⟦0⟧). The base case uses the first definition of multiplication three times (⟦1⟧, ⟦2⟧, ⟦3⟧) to make both sides ⟦4⟧."],["推進では、掛け算の二つ目の定義（⟦0⟧, ⟦1⟧）→ 帰納法の仮定 → 掛け算の二つ目の定義（⟦2⟧, ⟦3⟧）の順に書き換えると、扉は ⟦4⟧。これは分配法則の左右を入れ替えた形。","For the step, rewriting in the order: second definition of multiplication (⟦0⟧, ⟦1⟧) → induction hypothesis → second definition of multiplication (⟦2⟧, ⟦3⟧) turns the door into ⟦4⟧. This is distributivity with its two sides swapped."],["①②扉の ∀、③帰納法、④〜⑩出発点（定義に ⟦0⟧、扉へ、定義に ⟦1⟧、扉へ、定義に ⟦2⟧、扉へ、=）、⑪〜⑰推進の書き換え3回、⑱〜⑳分配法則のカードに ⟦3⟧、⟦4⟧、⟦5⟧、㉑扉へ、㉒ = をタップ。","①② the door's ∀, ③ induction, ④–⑩ base case (⟦0⟧ for the definition, into the door, ⟦1⟧ for the definition, into the door, ⟦2⟧ for the definition, into the door, =), ⑪–⑰ three rewrites in the step, ⑱–⑳ ⟦3⟧, ⟦4⟧, ⟦5⟧ for the distributivity card, ㉑ into the door, ㉒ tap =."],["後者を左から掛ける","Successor on the left of a product"],["掛け算の交換法則への準備として、⟦0⟧ を ⟦1⟧ についての帰納法で示します。この層で一番長い計算です。∀ の鍵に住人を当てはめると、続けて次の ∀ の住人を選ぶ欄が開きます（途中でやめると、途中の鍵が残ります）。","As preparation for commutativity of multiplication, show ⟦0⟧ by induction on ⟦1⟧. This is the longest calculation on this level. When you instantiate a ∀ key with a resident, the picker for the next ∀ opens right away (if you stop midway, the intermediate key remains)."],["扉の ∀、帰納法（新しい住人は ⟦0⟧）。出発点 ⟦1⟧ は定義で両辺を ⟦2⟧ にする。","The door's ∀, then induction (the new resident is ⟦0⟧). For the base case ⟦1⟧, make both sides ⟦2⟧ with the definitions."],["推進では、まず定義と帰納法の仮定で扉を ⟦0⟧ にする。次に足し算の二つ目の定義で ⟦1⟧ を外に出し、結合法則で ⟦2⟧ を前にくくり出し、最後に交換法則で ⟦3⟧ と ⟦4⟧ をそろえる。","For the step, first turn the door into ⟦0⟧ with the definitions and the induction hypothesis. Then move ⟦1⟧ out with the second definition of addition, factor ⟦2⟧ to the front with associativity, and finally line up ⟦3⟧ and ⟦4⟧ with commutativity."],["結合法則のカードは、⟦0⟧ だけを当てはめた途中の鍵を2回使うと手数が減る。交換法則のカードには ⟦1⟧、⟦2⟧ を当てはめる。","Using twice the intermediate associativity key instantiated only with ⟦0⟧ saves moves. Instantiate the commutativity card with ⟦1⟧, ⟦2⟧."],["掛け算の交換法則","Commutativity of Multiplication"],["掛け算の交換法則です。{{s:13-2}} と {{s:14-2}} で鍛えた二つのカードが、{{s:12-4}}（足し算の交換法則）と同じように、出発点と推進で役に立ちます。","Commutativity of multiplication. The two cards forged in {{s:13-2}} and {{s:14-2}} serve as the base case and the step, just as in {{s:12-4}} (commutativity of addition)."],["扉の ∀、帰納法。出発点 ⟦0⟧ は、掛け算の一つ目の定義とカード「0 を左から掛ける」で両辺を ⟦1⟧ にする。","The door's ∀, then induction. For the base case ⟦0⟧, make both sides ⟦1⟧ with the first definition of multiplication and the card \"Multiplying by 0 on the left\"."],["推進 ⟦0⟧ は、掛け算の二つ目の定義、帰納法の仮定、カード「後者を左から掛ける」の順に。","For the step ⟦0⟧: the second definition of multiplication, the induction hypothesis, and the card \"Successor on the left of a product\", in that order."],["①扉の ∀、②帰納法、③定義に ⟦0⟧、④扉へ、⑤カードに ⟦1⟧、⑥扉へ、⑦ =、⑧⑨二つ目の定義に ⟦2⟧、⟦3⟧、⑩扉へ、⑪帰納法の仮定を扉へ、⑫⑬カード「後者を左から掛ける」に ⟦4⟧、⟦5⟧、⑭扉へ、⑮ =。","① The door's ∀, ② induction, ③ ⟦0⟧ for the definition, ④ into the door, ⑤ ⟦1⟧ for the card, ⑥ into the door, ⑦ =, ⑧⑨ ⟦2⟧, ⟦3⟧ for the second definition, ⑩ into the door, ⑪ the induction hypothesis into the door, ⑫⑬ ⟦4⟧, ⟦5⟧ for the card \"Successor on the left of a product\", ⑭ into the door, ⑮ =."],["掛け算の並べ替え","Rearranging Products"],["掛け算の法則の総仕上げです。⟦0⟧――掛け算の順番を自由に並べ替えられることを示します。もう帰納法は要りません。{{s:14-1}} の結合法則と {{s:14-3}} の交換法則、二枚の<b>定理カード</b>を組み合わせて計算しましょう。","The grand finale of the laws of multiplication: ⟦0⟧ — products can be rearranged freely. Induction is no longer needed. Combine the two <b>theorem cards</b>, associativity from {{s:14-1}} and commutativity from {{s:14-3}}, and calculate."],["扉の ∀ を3回タップして、住人 ⟦0⟧、⟦1⟧、⟦2⟧ の部屋へ。扉は ⟦3⟧。","Tap the door's ∀ three times to enter the room of residents ⟦0⟧, ⟦1⟧, ⟦2⟧. The door is ⟦3⟧."],["⟦0⟧ ＝ ⟦1⟧ ＝ ⟦2⟧ ＝ ⟦3⟧ の順に書き換える。一つ目と三つ目は結合法則、二つ目は交換法則のカードで。","Rewrite in the order ⟦0⟧ = ⟦1⟧ = ⟦2⟧ = ⟦3⟧. The first and third steps use the associativity card, the second the commutativity card."],["①〜③扉の ∀、④〜⑥結合法則のカードに ⟦0⟧、⟦1⟧、⟦2⟧、⑦その鍵を扉へ（逆向き）、⑧⑨交換法則のカードに ⟦3⟧、⟦4⟧、⑩その鍵を扉へ、⑪〜⑬結合法則のカードに ⟦5⟧、⟦6⟧、⟦7⟧、⑭その鍵で扉を開ける。","①–③ the door's ∀, ④–⑥ ⟦0⟧, ⟦1⟧, ⟦2⟧ for the associativity card, ⑦ that key into the door (backwards), ⑧⑨ ⟦3⟧, ⟦4⟧ for the commutativity card, ⑩ that key into the door, ⑪–⑬ ⟦5⟧, ⟦6⟧, ⟦7⟧ for the associativity card, ⑭ open the door with that key."],["順序の塔","Tower of Order"],["自然数の順序の定義 x ≤ y :⇔ ∃z(x + z = y)","The order of natural numbers, defined by x ≤ y :⇔ ∃z(x + z = y)"],["0 は最小","0 Is the Least"],["自然数の順序を、⟦0⟧ ⇔ ⟦1⟧（⟦2⟧ に何かを足すと ⟦3⟧ になる）で<b>定義</b>します。{{w:10-5}} の集合と同じく、点線の ≤ をタップすると定義どおりに展開されます。","We <b>define</b> the order of natural numbers by ⟦0⟧ ⇔ ⟦1⟧ (adding something to ⟦2⟧ gives ⟦3⟧). As with the sets of {{w:10-5}}, tap the dotted ≤ to unfold it by its definition."],["扉の ∀ で住人 ⟦0⟧ の部屋へ。扉の ≤ をタップして展開しよう。","Go to the room of resident ⟦0⟧ with the door's ∀. Tap the door's ≤ to unfold it."],["扉 ⟦0⟧ の証人は ⟦1⟧。","The witness for door ⟦0⟧ is ⟦1⟧."],["①扉の ∀、②扉の ≤、③扉の ∃ で ⟦0⟧、④カード「0 を左から足す」に ⟦1⟧、⑤その鍵で開ける。","① The door's ∀, ② the door's ≤, ③ ⟦0⟧ with the door's ∃, ④ ⟦1⟧ for the card \"Adding 0 on the left\", ⑤ open with that key."],["反射律","Reflexivity"],["順序の反射律 ⟦0⟧ です。何を足せば自分自身になるでしょうか。","Reflexivity of the order, ⟦0⟧. What do you add to get yourself back?"],["扉の ∀ と ≤ の展開で、扉は ⟦0⟧。","With the door's ∀ and unfolding ≤, the door becomes ⟦0⟧."],["証人は ⟦0⟧。","The witness is ⟦0⟧."],["①扉の ∀、②扉の ≤、③扉の ∃ で ⟦0⟧、④足し算の一つ目の定義に ⟦1⟧、⑤その鍵で開ける。","① The door's ∀, ② the door's ≤, ③ ⟦0⟧ with the door's ∃, ④ ⟦1⟧ for the first definition of addition, ⑤ open with that key."],["次の数は大きい","The Next Number Is Bigger"],["⟦0⟧ を示します。証人には、住人だけでなく ⟦1⟧ のような項も選べます。","Show ⟦0⟧. As the witness you can choose not only residents but also terms such as ⟦1⟧."],["扉の ∀ と ≤ の展開で、扉は ⟦0⟧。証人は ⟦1⟧（1）。","With the door's ∀ and unfolding ≤, the door becomes ⟦0⟧. The witness is ⟦1⟧ (that is, 1)."],["扉 ⟦0⟧ は、足し算の二つ目の定義（⟦1⟧, ⟦2⟧）と一つ目の定義（⟦3⟧）で書き換える。","Rewrite door ⟦0⟧ with the second definition of addition (⟦1⟧, ⟦2⟧) and the first definition (⟦3⟧)."],["①扉の ∀、②扉の ≤、③扉の ∃ で ⟦0⟧、④⑤二つ目の定義に ⟦1⟧、⟦2⟧、⑥扉へ、⑦一つ目の定義に ⟦3⟧、⑧扉へ、⑨ =。","① The door's ∀, ② the door's ≤, ③ ⟦0⟧ with the door's ∃, ④⑤ ⟦1⟧, ⟦2⟧ for the second definition, ⑥ into the door, ⑦ ⟦3⟧ for the first definition, ⑧ into the door, ⑨ =."],["後者は順序を保つ","The Successor Preserves Order"],["⟦0⟧ なら ⟦1⟧。扉と鍵の両方で ≤ を展開し、∃ の鍵から差 ⟦2⟧ を連れてきます。","If ⟦0⟧ then ⟦1⟧. Unfold ≤ in both the door and the key, and bring in the difference ⟦2⟧ from the ∃ key."],["扉の ∀ を2回、→ を1回。扉の ≤ と鍵 ⟦0⟧ の ≤ を展開しよう。","The door's ∀ twice and → once. Unfold the ≤ of the door and of key ⟦0⟧."],["鍵の ∃ から ⟦0⟧ を満たす ⟦1⟧ を連れてきたら、扉の証人も ⟦2⟧。鍵 ⟦3⟧ で扉の ⟦4⟧ を書き換えると、カード「後者を外に出す」の形になる。","Once you bring in ⟦1⟧ satisfying ⟦0⟧ from the key's ∃, the door's witness is also ⟦2⟧. Rewrite ⟦4⟧ in the door with key ⟦3⟧, and it takes the form of the card \"Moving the successor out\"."],["①②扉の ∀、③扉の →、④扉の ≤、⑤鍵の ≤、⑥鍵の ∃、⑦扉の ∃ で ⟦0⟧、⑧鍵 ⟦1⟧ を扉へ、⑨⑩カードに ⟦2⟧、⟦3⟧、⑪その鍵で開ける。","①② the door's ∀, ③ the door's →, ④ the door's ≤, ⑤ the key's ≤, ⑥ the key's ∃, ⑦ ⟦0⟧ with the door's ∃, ⑧ key ⟦1⟧ into the door, ⑨⑩ ⟦2⟧, ⟦3⟧ for the card, ⑪ open with that key."],["順序の推移律","Transitivity of Order"],["順序の推移律です。二つの ∃ の鍵から差 ⟦0⟧ と ⟦1⟧ を連れてきて、扉の証人に <b>⟦2⟧</b> を選びます。選ぶ欄の下の入力欄に <code>d + e</code> と書けば、見えていない項も当てはめられます。","Transitivity of the order. Bring in the differences ⟦0⟧ and ⟦1⟧ from the two ∃ keys and choose <b>⟦2⟧</b> as the door's witness. Typing <code>d + e</code> in the input box below the picker lets you use a term that does not appear yet."],["扉の ∀ を3回、→ を2回。扉と二つの鍵の ≤ を展開し、∃ の鍵から ⟦0⟧ と ⟦1⟧ を手に入れよう。","The door's ∀ three times and → twice. Unfold the ≤ of the door and of both keys, and get ⟦0⟧ and ⟦1⟧ from the ∃ keys."],["扉の ∃ で、入力欄に <code>d + e</code> と書いて当てはめる。扉 ⟦0⟧ を、鍵 ⟦1⟧、⟦2⟧ の順に書き換えると、結合法則の形になる。","At the door's ∃, type <code>d + e</code> in the input box and apply it. Rewrite door ⟦0⟧ with keys ⟦1⟧ and ⟦2⟧ in turn, and it takes the form of associativity."],["①〜⑤扉の ∀×3、→×2、⑥扉の ≤、⑦⑧鍵 ⟦0⟧ の ≤ と ∃、⑨⑩鍵 ⟦1⟧ の ≤ と ∃、⑪扉の ∃ で ⟦2⟧、⑫⑬二つの等式の鍵を扉へ、⑭〜⑯結合法則のカードに ⟦3⟧、⟦4⟧、⟦5⟧、⑰扉へ、⑱ =。","①–⑤ the door's ∀×3, →×2, ⑥ the door's ≤, ⑦⑧ the ≤ and ∃ of key ⟦0⟧, ⑨⑩ the ≤ and ∃ of key ⟦1⟧, ⑪ ⟦2⟧ with the door's ∃, ⑫⑬ the two equation keys into the door, ⑭–⑯ ⟦3⟧, ⟦4⟧, ⟦5⟧ for the associativity card, ⑰ into the door, ⑱ =."],["単射の言い換え","Injectivity Restated"],["写像 <i>f</i> が単射であるとは、⟦0⟧ から ⟦1⟧ が言えることでした。実はこのとき、⟦2⟧ と ⟦3⟧ は<b>同値</b>になります。逆向きの ⟦4⟧ は、どんな写像でも成り立つ性質で、{{s:9-3}} で鍛えた<b>定理カード「関数の合同」</b>そのものです。","A map <i>f</i> is injective when ⟦1⟧ follows from ⟦0⟧. In that case, ⟦2⟧ and ⟦3⟧ are in fact <b>equivalent</b>. The converse ⟦4⟧ holds for every map, and it is exactly the <b>theorem card \"Congruence for functions\"</b> forged in {{s:9-3}}."],["扉の ∀ を2回タップして住人 ⟦0⟧、⟦1⟧ の部屋へ。扉の ∧ で二つに分けよう。","Tap the door's ∀ twice to enter the room of residents ⟦0⟧, ⟦1⟧. Split the door in two with its ∧."],["左の扉 ⟦0⟧ は、単射の鍵に ⟦1⟧、⟦2⟧ を当てはめればそのまま開く。右の扉は、カード「関数の合同」に同じ住人を当てはめる。","The left door ⟦0⟧ opens as soon as you instantiate the injectivity key with ⟦1⟧, ⟦2⟧. For the right door, instantiate the card \"Congruence for functions\" with the same residents."],["①②扉の ∀、③扉の ∧、④⑤単射の鍵に ⟦0⟧、⟦1⟧、⑥その鍵で扉を開ける、⑦⑧カードに ⟦2⟧、⟦3⟧、⑨その鍵で扉を開ける。","①② the door's ∀, ③ the door's ∧, ④⑤ ⟦0⟧, ⟦1⟧ for the injectivity key, ⑥ open the door with that key, ⑦⑧ ⟦2⟧, ⟦3⟧ for the card, ⑨ open the door with that key."],["含意を選言に","From Implication to Disjunction"],["⟦0⟧ から ⟦1⟧ を導きます。「⟦2⟧ ならば ⟦3⟧」を「⟦4⟧ でないか、⟦5⟧」と言い換える、数学でよく使う推論です。∨ の左右のどちらを示すかを先に決められないので、背理法の魔法から始めます。","Derive ⟦1⟧ from ⟦0⟧, rephrasing \"if ⟦2⟧ then ⟦3⟧\" as \"not ⟦4⟧, or ⟦5⟧\" — an inference often used in mathematics. We cannot decide in advance which side of the ∨ to show, so we start with the reductio spell."],["鍵 ⟦0⟧ を扉 ⊥ に差し込み、扉 ⟦1⟧ で左の ⟦2⟧ を選ぶ。¬ の部屋で ⟦3⟧ が手に入ったら、もう一度同じ鍵を使い、今度は右の ⟦4⟧ を選ぶ。","Insert key ⟦0⟧ into door ⊥ and choose the left side ⟦2⟧ at door ⟦1⟧. Once you get ⟦3⟧ in the ¬ room, use the same key again, this time choosing the right side ⟦4⟧."],["①魔法、②鍵 ⟦0⟧ を扉 ⊥ へ、③扉の ∨ で左、④扉の ¬、⑤鍵 ⟦1⟧ を扉 ⊥ へ、⑥扉の ∨ で右、⑦鍵 ⟦2⟧ を扉 ⟦3⟧ へ、⑧鍵 ⟦4⟧ を扉へ。","① Spell, ② key ⟦0⟧ into door ⊥, ③ left with the door's ∨, ④ the door's ¬, ⑤ key ⟦1⟧ into door ⊥, ⑥ right with the door's ∨, ⑦ key ⟦2⟧ into door ⟦3⟧, ⑧ key ⟦4⟧ into the door."],["対偶から元の命題へ","From the Contrapositive Back"],["「⟦0⟧ でないなら ⟦1⟧ でない」（対偶）から、「⟦2⟧ ならば ⟦3⟧」を導きます。数学で「対偶を示せば十分」と言うときに使う推論で、この向きには背理法の魔法が必要です。","From \"if not ⟦0⟧ then not ⟦1⟧\" (the contrapositive), derive \"if ⟦2⟧ then ⟦3⟧\". This is the inference used when mathematicians say \"it suffices to prove the contrapositive\", and this direction needs the reductio spell."],["扉の → で ⟦0⟧ を持って部屋に入り、扉 ⟦1⟧ で背理法の魔法を唱えよう。","Enter a room holding ⟦0⟧ with the door's →, and cast the reductio spell on door ⟦1⟧."],["鍵 ⟦0⟧ を扉 ⊥ に差し込むと、扉が ⟦1⟧ と ⟦2⟧ の二つに分かれる。","Insert key ⟦0⟧ into door ⊥ and the door splits into two: ⟦1⟧ and ⟦2⟧."],["①扉の →、②背理法の魔法、③鍵 ⟦0⟧ を扉 ⊥ へ、④鍵 ⟦1⟧ を扉 ⟦2⟧ へ、⑤鍵 ⟦3⟧ を扉 ⟦4⟧ へ。","① The door's →, ② reductio spell, ③ key ⟦0⟧ into door ⊥, ④ key ⟦1⟧ into door ⟦2⟧, ⑤ key ⟦3⟧ into door ⟦4⟧."],["逆は必ずしも真ならず","The Converse Need Not Hold"],["古典論理の<b>意味論</b>では、各原子命題に<b>真</b>か<b>偽</b>を割り当て、真理値表の規則で式の真偽を計算します。証明できる式は、どの割り当てでも真になります（<b>健全性定理</b>）。だから、仮定がすべて真で目標が偽になる割り当て（反例）が一つでもあれば、その推論は背理法の魔法を使っても証明できません。⟦0⟧ から、その「逆」⟦1⟧ は導けないことを示しましょう。","In the <b>semantics</b> of classical logic, we assign <b>true</b> or <b>false</b> to each atomic proposition and compute the truth value of formulas by the truth-table rules. A provable formula is true under every assignment (the <b>soundness theorem</b>). So if there is even one assignment that makes all assumptions true and the goal false (a counterexample), the inference cannot be proved even with the reductio spell. Show that the \"converse\" ⟦1⟧ cannot be derived from ⟦0⟧."],["目標 ⟦0⟧ が偽になるのは、⟦1⟧ が真で ⟦2⟧ が偽のとき。","The goal ⟦0⟧ is false when ⟦1⟧ is true and ⟦2⟧ is false."],["そのとき、仮定 ⟦0⟧ は真になるかを確かめよう。","Check whether the assumption ⟦0⟧ is then true."],["⟦0⟧ を偽、⟦1⟧ を真にする。","Make ⟦0⟧ false and ⟦1⟧ true."],["裏も真ならず","Nor the Inverse"],["⟦0⟧ から、その「裏」⟦1⟧ も導けません。正しく導けるのは「対偶」⟦2⟧ です。","The \"inverse\" ⟦1⟧ cannot be derived from ⟦0⟧ either. What can be derived correctly is the \"contrapositive\" ⟦2⟧."],["目標が偽になるのは、⟦0⟧ が真で ⟦1⟧ が偽のとき。","The goal is false when ⟦0⟧ is true and ⟦1⟧ is false."],["つまり、⟦0⟧ が偽で ⟦1⟧ が真。","That is, ⟦0⟧ false and ⟦1⟧ true."],["選言の片方","One Side of a Disjunction"],["「⟦0⟧ または ⟦1⟧」から「⟦2⟧」は導けません。条件分岐（∨E）で両方の場合を調べなければならないのは、このためです。","\"⟦2⟧\" cannot be derived from \"⟦0⟧ or ⟦1⟧\". This is why branching (∨E) must examine both cases."],["目標 ⟦0⟧ を偽にしよう。","Make the goal ⟦0⟧ false."],["それでも仮定 ⟦0⟧ を真にするには？","How can you still make the assumption ⟦0⟧ true?"],["否定の配り方","Distributing Negation"],["⟦0⟧ から導けるのは ⟦1⟧（{{s:6-5}}）で、⟦2⟧ ではありません。ド・モルガンの法則で ∧ と ∨ を入れ替えるのを忘れると、誤った推論になります。","What follows from ⟦0⟧ is ⟦1⟧ ({{s:6-5}}), not ⟦2⟧. Forgetting to swap ∧ and ∨ in De Morgan's law gives an invalid inference."],["目標 ⟦0⟧ が偽になるのは、⟦1⟧ と ⟦2⟧ の少なくとも一方が真のとき。","The goal ⟦0⟧ is false when at least one of ⟦1⟧ and ⟦2⟧ is true."],["ただし両方を真にすると、仮定 ⟦0⟧ が偽になってしまう。","But if you make both true, the assumption ⟦0⟧ becomes false."],["⟦0⟧ を真、⟦1⟧ を偽にする（逆でもよい）。","Make ⟦0⟧ true and ⟦1⟧ false (or the other way round)."],["名前の付け替え","Renaming"],["⟦0⟧ と ⟦1⟧ は、束縛された変数の名前が違うだけで、同じ意味です。扉の ∀ で任意の住人を連れてきて、鍵の ∀ にその住人を当てはめましょう。","⟦0⟧ and ⟦1⟧ differ only in the name of the bound variable and mean the same thing. Bring in an arbitrary resident with the door's ∀ and instantiate the key's ∀ with that resident."],["扉の → をタップして、鍵 ⟦0⟧ を持って部屋へ。","Tap the door's → to enter a room holding key ⟦0⟧."],["扉 ⟦0⟧ の ∀ で住人 ⟦1⟧ の部屋に入り、鍵の ∀ に ⟦2⟧ を当てはめる。","Enter the room of resident ⟦1⟧ with the ∀ of door ⟦0⟧ and instantiate the key's ∀ with ⟦2⟧."],["①扉の →、②扉の ∀、③鍵の ∀ で ⟦0⟧、④鍵 ⟦1⟧ を扉へ。","① The door's →, ② the door's ∀, ③ ⟦0⟧ with the key's ∀, ④ key ⟦1⟧ into the door."],["三段論法","Syllogism"],["「すべての ⟦0⟧ は ⟦1⟧」と「すべての ⟦2⟧ は ⟦3⟧」から「すべての ⟦4⟧ は ⟦5⟧」。アリストテレス以来の三段論法です。","From \"every ⟦0⟧ is ⟦1⟧\" and \"every ⟦2⟧ is ⟦3⟧\", \"every ⟦4⟧ is ⟦5⟧\". The syllogism, known since Aristotle."],["扉の ∀ と → で、鍵 ⟦0⟧ を持った部屋へ。扉は ⟦1⟧。","With the door's ∀ and →, enter a room holding key ⟦0⟧. The door is ⟦1⟧."],["二つ目の仮定に ⟦0⟧ を当てはめて扉に差し込むと、扉は ⟦1⟧。一つ目の仮定も同じように使う。","Instantiate the second assumption with ⟦0⟧ and insert it into the door; the door becomes ⟦1⟧. Use the first assumption in the same way."],["①扉の ∀、②扉の →、③鍵 ⟦0⟧ に ⟦1⟧、④その鍵を扉へ、⑤鍵 ⟦2⟧ に ⟦3⟧、⑥その鍵を扉へ、⑦鍵 ⟦4⟧ を扉へ。","① The door's ∀, ② the door's →, ③ ⟦1⟧ for key ⟦0⟧, ④ that key into the door, ⑤ ⟦3⟧ for key ⟦2⟧, ⑥ that key into the door, ⑦ key ⟦4⟧ into the door."],["∀ を外へ","∀ Outward"],["⟦0⟧ が住人によらない命題なら、⟦1⟧ と ⟦2⟧ は同じ意味です。まずは左から右へ。","If ⟦0⟧ is a proposition that does not depend on residents, ⟦1⟧ and ⟦2⟧ mean the same thing. First from left to right."],["扉の → で鍵 ⟦0⟧ を持って部屋に入り、扉の ∀ で住人 ⟦1⟧ の部屋へ。","Enter a room holding key ⟦0⟧ with the door's →, then go to the room of resident ⟦1⟧ with the door's ∀."],["鍵 ⟦0⟧ に ⟦1⟧ を当てはめ、扉 ⟦2⟧ に差し込む。","Instantiate key ⟦0⟧ with ⟦1⟧ and insert it into door ⟦2⟧."],["①扉の →、②扉の ∀、③鍵の ∀ で ⟦0⟧、④鍵 ⟦1⟧ を扉へ、⑤鍵 ⟦2⟧ を扉へ。","① The door's →, ② the door's ∀, ③ ⟦0⟧ with the key's ∀, ④ key ⟦1⟧ into the door, ⑤ key ⟦2⟧ into the door."],["∀ を内へ","∀ Inward"],["今度は右から左へ。鍵 ⟦0⟧ を手に入れてから、鍵 ⟦1⟧ を使います。","Now from right to left. Get key ⟦0⟧ first, then use key ⟦1⟧."],["扉の ∀ で住人 ⟦0⟧ の部屋に入り、扉の → で鍵 ⟦1⟧ を持ってさらに部屋へ。","Enter the room of resident ⟦0⟧ with the door's ∀, then another room holding key ⟦1⟧ with the door's →."],["鍵 ⟦0⟧ を鍵 ⟦1⟧ に差し込むと、鍵 ⟦2⟧ が手に入る。","Insert key ⟦0⟧ into key ⟦1⟧ and you get key ⟦2⟧."],["①扉の ∀、②扉の →、③鍵 ⟦0⟧ を鍵 ⟦1⟧ へ、④鍵 ⟦2⟧ に ⟦3⟧、⑤鍵 ⟦4⟧ を扉へ。","① The door's ∀, ② the door's →, ③ key ⟦0⟧ onto key ⟦1⟧, ④ ⟦3⟧ for key ⟦2⟧, ⑤ key ⟦4⟧ into the door."],["∀ と ∧","∀ and ∧"],["⟦0⟧ から、⟦1⟧ と ⟦2⟧ の両方を導きます。∧ で分かれた二つの扉では、それぞれ別の住人の部屋に入ることになります。","From ⟦0⟧, derive both ⟦1⟧ and ⟦2⟧. Behind the two doors split by ∧, you enter the rooms of different residents."],["扉の → と ∧ で、扉を ⟦0⟧ と ⟦1⟧ に分けよう。","With the door's → and ∧, split the door into ⟦0⟧ and ⟦1⟧."],["それぞれの扉で、∀ で部屋に入る → 鍵に住人を当てはめる → ∧ で分ける、の順に進む。","At each door: enter a room with ∀ → instantiate the key with the resident → split with ∧."],["①扉の →、②扉の ∧、③扉の ∀、④鍵の ∀ で ⟦0⟧、⑤鍵の ∧、⑥鍵 ⟦1⟧ を扉へ。もう一方の扉も同じように（⑦〜⑩、住人は ⟦2⟧）。","① The door's →, ② the door's ∧, ③ the door's ∀, ④ ⟦0⟧ with the key's ∀, ⑤ the key's ∧, ⑥ key ⟦1⟧ into the door. The other door in the same way (⑦–⑩, with resident ⟦2⟧)."],["証人を選ぶ","Choosing a Witness"],["⟦0⟧ を示すには、⟦1⟧ を満たす住人（<b>証人</b>）を一人見つければ十分です。ここでは ⟦2⟧ と ⟦3⟧ のどちらを証人にしてもかまいません。一方、⟦4⟧ から ⟦5⟧ は導けません。任意に選んだ住人は、⟦6⟧ でも ⟦7⟧ でもないかもしれないからです。","To show ⟦0⟧, it suffices to find one resident satisfying ⟦1⟧ (a <b>witness</b>). Here you may take either ⟦2⟧ or ⟦3⟧ as the witness. On the other hand, ⟦5⟧ cannot be derived from ⟦4⟧, because an arbitrarily chosen resident might be neither ⟦6⟧ nor ⟦7⟧."],["まず鍵の ∧ で、⟦0⟧ と ⟦1⟧ を取り出そう。","First take out ⟦0⟧ and ⟦1⟧ with the key's ∧."],["扉の ∃ で、証人に ⟦0⟧（または ⟦1⟧）を選ぶ。","With the door's ∃, choose ⟦0⟧ (or ⟦1⟧) as the witness."],["①鍵の ∧、②扉の ∃ で ⟦0⟧、③鍵 ⟦1⟧ を扉へ。","① The key's ∧, ② ⟦0⟧ with the door's ∃, ③ key ⟦1⟧ into the door."],["∃ を外へ","∃ Outward"],["⟦0⟧ が住人によらない命題なら、⟦1⟧ と ⟦2⟧ は同じ意味です。まずは左から右へ。∃ の鍵から「誰か」を連れてきてから、その誰かを証人に選びましょう。","If ⟦0⟧ is a proposition that does not depend on residents, ⟦1⟧ and ⟦2⟧ mean the same thing. First from left to right. Bring in \"someone\" from the ∃ key, then choose that someone as the witness."],["鍵の ∧ で ⟦0⟧ と ⟦1⟧ を取り出し、∃ の鍵から誰か ⟦2⟧ を連れてこよう。","Take out ⟦0⟧ and ⟦1⟧ with the key's ∧, and bring in someone ⟦2⟧ from the ∃ key."],["扉の ∃ の証人は ⟦0⟧。扉 ⟦1⟧ を ∧ で分ける。","The witness for the door's ∃ is ⟦0⟧. Split door ⟦1⟧ with ∧."],["①鍵の ∧、②鍵 ⟦0⟧ の ∃、③扉の ∃ で ⟦1⟧、④扉の ∧、⑤⑥鍵 ⟦2⟧ と ⟦3⟧ で扉を開ける。","① The key's ∧, ② the ∃ of key ⟦0⟧, ③ ⟦1⟧ with the door's ∃, ④ the door's ∧, ⑤⑥ open the doors with keys ⟦2⟧ and ⟦3⟧."],["∃ を内へ","∃ Inward"],["今度は右から左へ。∃ の鍵から誰かを連れてくれば、⟦0⟧ も ⟦1⟧ も示せます。","Now from right to left. Bring in someone from the ∃ key, and you can show both ⟦0⟧ and ⟦1⟧."],["先に鍵の ∃ で、⟦0⟧ を満たす誰か ⟦1⟧ を連れてこよう。","First bring in someone ⟦1⟧ satisfying ⟦0⟧ with the key's ∃."],["鍵 ⟦0⟧ を ∧ で分け、扉の ∧ で ⟦1⟧ と ⟦2⟧ に分ける。","Split key ⟦0⟧ with ∧, and split the door into ⟦1⟧ and ⟦2⟧ with its ∧."],["①鍵の ∃、②鍵の ∧、③扉の ∧、④鍵 ⟦0⟧ を扉へ、⑤扉の ∃ で ⟦1⟧、⑥鍵 ⟦2⟧ を扉へ。","① The key's ∃, ② the key's ∧, ③ the door's ∧, ④ key ⟦0⟧ into the door, ⑤ ⟦1⟧ with the door's ∃, ⑥ key ⟦2⟧ into the door."],["∀ の仮定と ∃","A ∀ Assumption and ∃"],["⟦0⟧ が住人によらない命題なら、⟦1⟧ と ⟦2⟧ は同じ意味です。左から右へは、∃ の鍵から連れてきた誰かに、∀ の鍵を当てはめます。","If ⟦0⟧ is a proposition that does not depend on residents, ⟦1⟧ and ⟦2⟧ mean the same thing. From left to right, instantiate the ∀ key with the someone brought in from the ∃ key."],["扉の → で鍵 ⟦0⟧ を持って部屋に入り、その ∃ から誰か ⟦1⟧ を連れてこよう。","Enter a room holding key ⟦0⟧ with the door's →, and bring in someone ⟦1⟧ from its ∃."],["①扉の →、②鍵の ∃、③鍵 ⟦0⟧ に ⟦1⟧、④鍵 ⟦2⟧ を扉へ、⑤鍵 ⟦3⟧ を扉へ。","① The door's →, ② the key's ∃, ③ ⟦1⟧ for key ⟦0⟧, ④ key ⟦2⟧ into the door, ⑤ key ⟦3⟧ into the door."],["∃ の仮定から ∀ へ","From an ∃ Assumption to ∀"],["今度は右から左へ。任意の住人 ⟦0⟧ について ⟦1⟧ を仮定すれば、⟦2⟧ がそのまま ⟦3⟧ の証人になります。","Now from right to left. If you assume ⟦1⟧ about an arbitrary resident ⟦0⟧, then ⟦2⟧ itself becomes the witness for ⟦3⟧."],["鍵 ⟦0⟧ を扉 ⟦1⟧ に差し込むと、扉は ⟦2⟧。証人は ⟦3⟧。","Insert key ⟦0⟧ into door ⟦1⟧ and the door becomes ⟦2⟧. The witness is ⟦3⟧."],["①扉の ∀、②扉の →、③鍵を扉 ⟦0⟧ へ、④扉の ∃ で ⟦1⟧、⑤鍵 ⟦2⟧ を扉へ。","① The door's ∀, ② the door's →, ③ the key into door ⟦0⟧, ④ ⟦1⟧ with the door's ∃, ⑤ key ⟦2⟧ into the door."],["ネズミとネコ","Mice and Cats"],["⟦0⟧：⟦1⟧ はネズミ、⟦2⟧：⟦3⟧ はネコ、⟦4⟧：⟦5⟧ は ⟦6⟧ を恐れる、とします。「すべてのネズミに恐れられているネコがいる」から「すべてのネズミは、あるネコを恐れている」を導きましょう。逆向きが導けないことは、{{w:s-ex}} で確かめます。","Let ⟦0⟧ mean ⟦1⟧ is a mouse, ⟦2⟧ mean ⟦3⟧ is a cat, and ⟦4⟧ mean ⟦5⟧ fears ⟦6⟧. From \"there is a cat feared by every mouse\", derive \"every mouse fears some cat\". We check in {{w:s-ex}} that the converse cannot be derived."],["扉の ∀ と → で、鍵 ⟦0⟧ を持った部屋へ。次に、仮定の ∃ から、そのネコ ⟦1⟧ を連れてこよう。","With the door's ∀ and →, enter a room holding key ⟦0⟧. Next, bring in that cat ⟦1⟧ from the assumption's ∃."],["鍵を ∧ で分け、扉の ∃ の証人に ⟦0⟧ を選ぶ。扉 ⟦1⟧ を ∧ で分ける。","Split the key with ∧ and choose ⟦0⟧ as the witness for the door's ∃. Split door ⟦1⟧ with ∧."],["①扉の ∀、②扉の →、③鍵の ∃、④鍵の ∧、⑤扉の ∃ で ⟦0⟧、⑥扉の ∧、⑦鍵 ⟦1⟧ を扉へ、⑧鍵 ⟦2⟧ に ⟦3⟧、⑨その鍵を扉へ、⑩鍵 ⟦4⟧ を扉へ。","① The door's ∀, ② the door's →, ③ the key's ∃, ④ the key's ∧, ⑤ ⟦0⟧ with the door's ∃, ⑥ the door's ∧, ⑦ key ⟦1⟧ into the door, ⑧ ⟦3⟧ for key ⟦2⟧, ⑨ that key into the door, ⑩ key ⟦4⟧ into the door."],["島の床屋","The Island Barber"],["島の床屋の ⟦0⟧ さんは、自分で髪を切らない住人全員の髪を切っています（⟦1⟧：⟦2⟧ が ⟦3⟧ の髪を切る）。では、⟦4⟧ さんは自分の髪を切っているでしょうか。背理法の魔法で確かめましょう。","⟦0⟧, the barber of the island, cuts the hair of every resident who does not cut their own hair (⟦1⟧: ⟦2⟧ cuts the hair of ⟦3⟧). Does ⟦4⟧ cut their own hair? Find out with the reductio spell."],["扉 ⟦0⟧ で背理法の魔法。鍵 ⟦1⟧ が手に入る。","Reductio spell on door ⟦0⟧. You get key ⟦1⟧."],["鍵 ⟦0⟧ を扉 ⊥ に差し込むと、扉は ⟦1⟧ に戻る。仮定の鍵に ⟦2⟧ 自身を当てはめよう。","Insert key ⟦0⟧ into door ⊥ and the door goes back to ⟦1⟧. Instantiate the assumption key with ⟦2⟧ itself."],["①背理法の魔法、②鍵 ⟦0⟧ を扉 ⊥ へ、③仮定の鍵の ∀ で ⟦1⟧、④鍵 ⟦2⟧ を扉へ、⑤鍵 ⟦3⟧ を扉へ。","① Reductio spell, ② key ⟦0⟧ into door ⊥, ③ ⟦1⟧ with the ∀ of the assumption key, ④ key ⟦2⟧ into the door, ⑤ key ⟦3⟧ into the door."],["⟦0⟧ さんは自分の髪を切っています。ここで「自分で切らない人<b>だけ</b>を切る」という条件まで加えると、仮定そのものが矛盾します（ラッセルのパラドックスと同じ形です）。","⟦0⟧ cuts their own hair. If we add the condition that the barber cuts the hair of <b>only</b> those who do not cut their own, the assumption itself becomes contradictory (the same form as Russell's paradox)."],["反例のない全称","A Universal with No Counterexample"],["「⟦0⟧ でない住人はいない」から「すべての住人が ⟦1⟧」を導きます。任意の住人について、背理法の魔法を使います。","From \"no resident is not ⟦0⟧\", derive \"every resident is ⟦1⟧\". Use the reductio spell for an arbitrary resident."],["扉の ∀ で住人 ⟦0⟧ の部屋へ。扉 ⟦1⟧ で背理法の魔法。","Go to the room of resident ⟦0⟧ with the door's ∀. Reductio spell on door ⟦1⟧."],["鍵 ⟦0⟧ を扉 ⊥ に差し込むと、扉は ⟦1⟧。証人は ⟦2⟧。","Insert key ⟦0⟧ into door ⊥ and the door becomes ⟦1⟧. The witness is ⟦2⟧."],["①扉の ∀、②背理法の魔法、③鍵 ⟦0⟧ を扉 ⊥ へ、④扉の ∃ で ⟦1⟧、⑤鍵 ⟦2⟧ を扉へ。","① The door's ∀, ② reductio spell, ③ key ⟦0⟧ into door ⊥, ④ ⟦1⟧ with the door's ∃, ⑤ key ⟦2⟧ into the door."],["否定の否定から証人へ","From a Double Negation to a Witness"],["「どの住人も ⟦0⟧ でない、ということはない」から「⟦1⟧ である住人がいる」を導きます。証人を直接は作れないので、背理法の魔法が必要です。","From \"it is not the case that no resident is ⟦0⟧\", derive \"some resident is ⟦1⟧\". The witness cannot be built directly, so the reductio spell is needed."],["まず背理法の魔法。鍵 ⟦0⟧ が手に入る。","First the reductio spell. You get key ⟦0⟧."],["鍵 ⟦0⟧ を扉 ⊥ に差し込むと、扉は ⟦1⟧。住人 ⟦2⟧ の部屋で ¬ の部屋に入り、鍵 ⟦3⟧ を使う。","Insert key ⟦0⟧ into door ⊥ and the door becomes ⟦1⟧. In the room of resident ⟦2⟧, enter the ¬ room and use key ⟦3⟧."],["①魔法、②鍵 ⟦0⟧ を扉 ⊥ へ、③扉の ∀、④扉の ¬、⑤鍵 ⟦1⟧ を扉 ⊥ へ、⑥扉の ∃ で ⟦2⟧、⑦鍵 ⟦3⟧ を扉へ。","① Spell, ② key ⟦0⟧ into door ⊥, ③ the door's ∀, ④ the door's ¬, ⑤ key ⟦1⟧ into door ⊥, ⑥ ⟦2⟧ with the door's ∃, ⑦ key ⟦3⟧ into the door."],["住人によらない選言","A Disjunct Independent of Residents"],["⟦0⟧ が住人によらない命題なら、「どの住人も ⟦1⟧ か ⟦2⟧」から「全員が ⟦3⟧、または ⟦4⟧」が言えます。古典論理では ⟦5⟧ が成り立つかどうかで場合分けできるからで、魔法なしでは証明できない式です。","If ⟦0⟧ is a proposition that does not depend on residents, from \"every resident is ⟦1⟧ or ⟦2⟧\" we get \"everyone is ⟦3⟧, or ⟦4⟧\". This is because classical logic can split into cases on whether ⟦5⟧ holds; the formula cannot be proved without the spell."],["まず背理法の魔法。鍵 ⟦0⟧ を扉 ⊥ に差し込み、左の ⟦1⟧ を選ぶ。","First the reductio spell. Insert key ⟦0⟧ into door ⊥ and choose the left side ⟦1⟧."],["住人 ⟦0⟧ の部屋で、仮定の鍵に ⟦1⟧ を当てはめ、⟦2⟧ で条件分岐する。⟦3⟧ の世界では「⊥ を目指す」。","In the room of resident ⟦0⟧, instantiate the assumption key with ⟦1⟧ and branch on ⟦2⟧. In the world of ⟦3⟧, \"Aim for ⊥\"."],["①魔法、②鍵を扉 ⊥ へ、③扉の ∨ で左、④扉の ∀、⑤仮定の鍵に ⟦0⟧、⑥鍵 ⟦1⟧ の ∨、⑦鍵 ⟦2⟧ を扉へ、⑧（⟦3⟧ の世界で）⊥ を目指す、⑨鍵 ⟦4⟧ を扉 ⊥ へ、⑩扉の ∨ で右、⑪鍵 ⟦5⟧ を扉へ。","① Spell, ② the key into door ⊥, ③ left with the door's ∨, ④ the door's ∀, ⑤ ⟦0⟧ for the assumption key, ⑥ the ∨ of key ⟦1⟧, ⑦ key ⟦2⟧ into the door, ⑧ (in the world of ⟦3⟧) aim for ⊥, ⑨ key ⟦4⟧ into door ⊥, ⑩ right with the door's ∨, ⑪ key ⟦5⟧ into the door."],["誰かと全員","Someone and Everyone"],["一階述語論理の<b>意味論</b>では、住人の集まり（議論領域）と、各述語がどの住人で真かを決めた<b>構造</b>の中で、式の真偽を計算します。証明できる式は、どの構造でも真です（<b>健全性定理</b>）。仮定がすべて真で目標が偽になる構造があれば、その推論は背理法の魔法を使っても証明できません。まずは「⟦0⟧ である住人がいる」から「全員が ⟦1⟧」は導けないことを示しましょう。","In the <b>semantics</b> of first-order logic, the truth of a formula is computed in a <b>structure</b>: a collection of residents (the domain of discourse) together with which residents make each predicate true. A provable formula is true in every structure (the <b>soundness theorem</b>). If some structure makes all assumptions true and the goal false, the inference cannot be proved even with the reductio spell. First show that \"everyone is ⟦1⟧\" cannot be derived from \"some resident is ⟦0⟧\"."],["住人を 2 人にしよう。","Use 2 residents."],["一人だけ ⟦0⟧ を真にする。","Make ⟦0⟧ true for only one of them."],["住人 1, 2 で、⟦0⟧ を真、⟦1⟧ を偽にする。","With residents 1, 2, make ⟦0⟧ true and ⟦1⟧ false."],["変数の位置","Position of Variables"],["{{s:7-5}} では ⟦0⟧ から ⟦1⟧ を導きました。では ⟦2⟧ からはどうでしょう。量化子の並びは同じ「∃∀ から ∀∃」ですが、⟦3⟧ のどちらの位置の変数を量化しているかが違います。","In {{s:7-5}} we derived ⟦1⟧ from ⟦0⟧. What about from ⟦2⟧? The quantifiers come in the same order, \"∃∀ to ∀∃\", but which argument position of ⟦3⟧ is quantified differs."],["住人を 2 人にして、住人 1 が全員と ⟦0⟧ の関係にあるようにしよう。","Use 2 residents and let resident 1 stand in relation ⟦0⟧ to everyone."],["目標を偽にするには、誰とも ⟦0⟧ の関係にない住人がいればよい。","To make the goal false, it suffices to have a resident who stands in relation ⟦0⟧ to no one."],["住人 1, 2 で、⟦0⟧ は (1,1) と (1,2) を真にし、残りは偽にする（未定のボタンは、1 回押すと偽になる）。","With residents 1, 2, make ⟦0⟧ true at (1,1) and (1,2) and false elsewhere (an unknown button becomes false with one press)."],["それぞれのネコ","Each Mouse's Cat"],["{{s:f-mouse}} の逆向きです。「すべてのネズミは、あるネコを恐れている」から「すべてのネズミに恐れられているネコがいる」は導けません。⟦0⟧：ネズミ、⟦1⟧：ネコ、⟦2⟧：⟦3⟧ は ⟦4⟧ を恐れる、です。ネズミは少なくとも一匹いるとします。","The converse of {{s:f-mouse}}. From \"every mouse fears some cat\" we cannot derive \"there is a cat feared by every mouse\". ⟦0⟧: mouse, ⟦1⟧: cat, ⟦2⟧: ⟦3⟧ fears ⟦4⟧. Assume there is at least one mouse."],["ネズミ 2 匹が、それぞれ別のネコを恐れている構造を作ろう。","Build a structure where two mice each fear a different cat."],["住人 1, 2 をネズミ（⟦0⟧）、住人 3, 4 をネコ（⟦1⟧）にする。","Make residents 1, 2 mice (⟦0⟧) and residents 3, 4 cats (⟦1⟧)."],["⟦0⟧、⟦1⟧、⟦2⟧、⟦3⟧、⟦4⟧、⟦5⟧ を真にし、残りは偽にする（未定のボタンは、1 回押すと偽になる）。","Make ⟦0⟧, ⟦1⟧, ⟦2⟧, ⟦3⟧, ⟦4⟧, ⟦5⟧ true and the rest false (an unknown button becomes false with one press)."],["ネズミのいない島","The Island Without Mice"],["「すべてのネズミはすべてのネコを恐れる」から「あるネズミはあるネコを恐れている」は導けるでしょうか。ネコは少なくとも一匹いるとします。「すべての…」「…が存在する」は、あくまで議論領域の中での話です。","Can \"some mouse fears some cat\" be derived from \"every mouse fears every cat\"? Assume there is at least one cat. \"Every…\" and \"there exists…\" speak only about the domain of discourse."],["ネズミが一匹もいない構造を考えよう。","Think of a structure with no mice at all."],["⟦0⟧ がどの住人でも偽なら、「すべてのネズミは〜」という形の式は自動的に真になる。","If ⟦0⟧ is false for every resident, any formula of the form \"every mouse …\" is automatically true."],["住人 1 人をネコにして（⟦0⟧ を真）、残りは偽にする（ネズミは一匹もいない）。","Make one resident a cat (⟦0⟧ true) and the rest false (there are no mice)."],["比べられない二人","Two Who Cannot Be Compared"],["数学の理論が「何を証明できないか」も、構造で調べられます。半順序の公理（反射律・反対称律・推移律）から、比較可能律（どの二人も比べられる）は証明できません。半順序の公理を満たすのに、比べられない二人がいる構造を作りましょう。等号 ⟦0⟧ は「同じ住人」という意味です。","What a mathematical theory \"cannot prove\" can also be examined with structures. From the axioms of a partial order (reflexivity, antisymmetry, transitivity), comparability (any two can be compared) cannot be proved. Build a structure that satisfies the partial order axioms but has two residents that cannot be compared. Equality ⟦0⟧ means \"the same resident\"."],["住人を 2 人にしよう。反射律のために、⟦0⟧ と ⟦1⟧ は真にする。","Use 2 residents. For reflexivity, make ⟦0⟧ and ⟦1⟧ true."],["住人 1 と 2 の間には、どちら向きにも ⟦0⟧ の関係を作らない。","Do not relate residents 1 and 2 by ⟦0⟧ in either direction."],["住人 1, 2 で、⟦0⟧ は (1,1) と (2,2) を真にし、残りは偽にする（未定のボタンは、1 回押すと偽になる）。","With residents 1, 2, make ⟦0⟧ true at (1,1) and (2,2) and false elsewhere (an unknown button becomes false with one press)."],["前順序と反対称律","Preorders and Antisymmetry"],["反射律と推移律だけを満たす関係を<b>前順序</b>と呼びます。前順序の公理からは、反対称律は証明できません。","A relation satisfying only reflexivity and transitivity is called a <b>preorder</b>. Antisymmetry cannot be proved from the preorder axioms."],["異なる二人が、互いに ⟦0⟧ の関係にある構造を考えよう。","Think of a structure where two different residents are related by ⟦0⟧ in both directions."],["住人 2 人で、すべての組を ⟦0⟧ にしても、反射律と推移律は成り立つ。","With 2 residents, even if every pair is related by ⟦0⟧, reflexivity and transitivity still hold."],["住人 1, 2 で、⟦0⟧ を 4 つの組すべてで真にする。","With residents 1, 2, make ⟦0⟧ true at all four pairs."],["極大と最大","Maximal and Greatest"],["⟦0⟧ は「⟦1⟧ より大きい住人はいない」、つまり ⟦2⟧ が<b>極大元</b>であることを表します。半順序では、極大元が<b>最大元</b>（⟦3⟧）とは限りません。定数 ⟦4⟧ がどの住人を表すかも、構造で決めます。","⟦0⟧ says \"no resident is bigger than ⟦1⟧\", that is, ⟦2⟧ is a <b>maximal element</b>. In a partial order, a maximal element need not be the <b>greatest element</b> (⟦3⟧). Which resident the constant ⟦4⟧ denotes is also decided in the structure."],["⟦0⟧ と比べられない住人がいれば、⟦1⟧ は最大元ではない。","If some resident cannot be compared with ⟦0⟧, then ⟦1⟧ is not the greatest element."],["住人 2 人で、⟦0⟧ を住人 1 にし、比べられない二人にする。","With 2 residents, let ⟦0⟧ be resident 1 and make the two incomparable."],["⟦0⟧ は住人 1。⟦1⟧ は (1,1) と (2,2) を真にし、残りは偽にする。","⟦0⟧ is resident 1. Make ⟦1⟧ true at (1,1) and (2,2) and false elsewhere."],["右単位元はどこへ","Where Is the Right Identity?"],["{{s:11-3}} では、群の公理から右単位元 ⟦0⟧ を証明しました。そのとき使った<b>左逆元の公理</b>を外し、結合律と左単位元だけにすると、右単位元は証明できません。演算 ⟦1⟧ の表（積の表）と、定数 ⟦2⟧ の解釈を決めて、反例を作りましょう。表のボタンは、押すたびに値が変わります。","In {{s:11-3}} we proved the right identity ⟦0⟧ from the group axioms. If we drop the <b>left inverse axiom</b> used there and keep only associativity and the left identity, the right identity cannot be
