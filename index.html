proved. Decide the table of the operation ⟦1⟧ (the multiplication table) and the interpretation of the constant ⟦2⟧ to build a counterexample. Each press of a table button changes the value."],["住人 2 人で、「積はいつも右側の住人」（⟦0⟧）という演算を考えよう。","With 2 residents, think of the operation \"the product is always the right-hand resident\" (⟦0⟧)."],["この演算は結合律を満たし、どの住人も左単位元になる。でも右単位元にはならない。","This operation is associative, and every resident is a left identity. But none is a right identity."],["⟦0⟧ は住人 1。積の表は、1·1 = 1、1·2 = 2、2·1 = 1、2·2 = 2。","⟦0⟧ is resident 1. The multiplication table is 1·1 = 1, 1·2 = 2, 2·1 = 1, 2·2 = 2."],["二つの左単位元","Two Left Identities"],["{{s:9-5}} では、左単位元 ⟦0⟧ と<b>右</b>単位元 ⟦1⟧ が一致することを示しました。どちらも<b>左</b>単位元のときは、一致するとは限りません。","In {{s:9-5}} we showed that a left identity ⟦0⟧ and a <b>right</b> identity ⟦1⟧ coincide. When both are <b>left</b> identities, they need not coincide."],["前の部屋と同じ「積はいつも右側の住人」の演算が使える。","The same operation as in the previous room, \"the product is always the right-hand resident\", works."],["⟦0⟧ と ⟦1⟧ を、別々の住人にする。","Make ⟦0⟧ and ⟦1⟧ different residents."],["⟦0⟧ は住人 1、⟦1⟧ は住人 2。積の表は 1·1 = 1、1·2 = 2、2·1 = 1、2·2 = 2。","⟦0⟧ is resident 1 and ⟦1⟧ is resident 2. The multiplication table is 1·1 = 1, 1·2 = 2, 2·1 = 1, 2·2 = 2."],["可換とは限らない","Not Necessarily Commutative"],["結合律と（左右の）単位元を持つ演算を<b>モノイド</b>と呼びます。モノイドの公理からは、可換律は証明できません。住人 3 人で反例を作れます。","An operation with associativity and a (two-sided) identity is called a <b>monoid</b>. Commutativity cannot be proved from the monoid axioms. A counterexample can be built with 3 residents."],["⟦0⟧ を住人 1 にして、住人 1 との積は相手そのものにする。","Let ⟦0⟧ be resident 1, and make any product with resident 1 equal to the other factor."],["残りの住人 2, 3 の間では「積はいつも右側の住人」にする。","Between the remaining residents 2, 3, let \"the product always be the right-hand resident\"."],["⟦0⟧ は住人 1。1·x = x·1 = x、2·2 = 2、2·3 = 3、3·2 = 2、3·3 = 3。","⟦0⟧ is resident 1. 1·x = x·1 = x, 2·2 = 2, 2·3 = 3, 3·2 = 2, 3·3 = 3."],["帰納法の力","The Power of Induction"],["{{s:12-2}} では、帰納法で ⟦0⟧ を証明しました。帰納法を使わず、足し算の定義の二つの公理だけからは、これは証明できません。⟦1⟧ から ⟦2⟧ を何回たどっても届かない「余分な住人」がいる構造が反例になります。住人の番号（1, 2）と、記号 ⟦3⟧ の解釈は別物であることに注意しましょう。","In {{s:12-2}} we proved ⟦0⟧ by induction. Without induction, from the two axioms defining addition alone, it cannot be proved. A structure with an \"extra resident\" that can never be reached from ⟦1⟧ by following ⟦2⟧ is a counterexample. Note that the residents' numbers (1, 2) are different from the interpretation of the symbol ⟦3⟧."],["住人 2 人。⟦0⟧ を住人 1 にし、⟦1⟧ は住人をそのまま返す（s(1) = 1、s(2) = 2）。","2 residents. Let ⟦0⟧ be resident 1, and let ⟦1⟧ return each resident unchanged (s(1) = 1, s(2) = 2)."],["足し算の表は、⟦0⟧ になるように（x + 1 = x）。残りの欄で、⟦1⟧ + 住人 2 が住人 2 にならないようにする。","Fill the addition table so that ⟦0⟧ holds (x + 1 = x). In the remaining cells, make ⟦1⟧ + resident 2 different from resident 2."],["⟦0⟧ は住人 1、s(1) = 1、s(2) = 2、足し算は 1+1 = 1、2+1 = 2、1+2 = 1、2+2 = 2。","⟦0⟧ is resident 1, s(1) = 1, s(2) = 2, and addition is 1+1 = 1, 2+1 = 2, 1+2 = 1, 2+2 = 2."],["この構造の住人 2 は、⟦0⟧ から ⟦1⟧ でたどり着けない「非標準的な数」です。帰納法の公理は、こうした余分な住人を排除する役割を持っています。","Resident 2 of this structure is a \"nonstandard number\" that cannot be reached from ⟦0⟧ by ⟦1⟧. The axiom of induction has the role of excluding such extra residents."],["順序の鑑定","Judging Orders"],["<b>狭義順序</b>の公理（非反射律 ⟦0⟧ と推移律）から、どの性質が証明でき、どれが証明できないかを見極めましょう。正しいものは証明し、誤りのものは構造で反例を示します。","From the axioms of a <b>strict order</b> (irreflexivity ⟦0⟧ and transitivity), tell which properties can be proved and which cannot. Prove the valid ones and show counterexamples to the invalid ones with structures."],["誤りの扉は、住人 1〜2 人の小さな構造で反例が作れる。","The invalid doors have counterexamples with small structures of 1 or 2 residents."],["扉 A は {{s:10-2}} と同じ。扉 B は「比べられない二人」、扉 C は「一番上の住人」を考えよう。","Door A is the same as {{s:10-2}}. For door B think of \"two who cannot be compared\", and for door C \"the topmost resident\"."],["A は正しく、B と C は誤り。B：住人 2 人で ⟦0⟧ をどこでも偽にする。C：住人 1 人で ⟦1⟧ を偽にする（未定のボタンは、1 回押すと偽になる）。","A is valid; B and C are invalid. B: with 2 residents, make ⟦0⟧ false everywhere. C: with 1 resident, make ⟦1⟧ false (an unknown button becomes false with one press)."],["狭義順序は非対称です（{{s:10-2}}）。","A strict order is asymmetric ({{s:10-2}})."],["三分律（比較可能性）は、狭義順序の公理からは出てきません。比べられない二人がいる構造が反例です。","Trichotomy (comparability) does not follow from the strict order axioms. A structure with two incomparable residents is a counterexample."],["「どの住人にも、もっと大きい住人がいる」は証明できません。住人 1 人の構造が反例です。一方、自然数の順序ではこれが成り立つので、自然数の構造は無限に大きくなります。","\"Every resident has a bigger resident\" cannot be proved. A structure with 1 resident is a counterexample. In the order of the natural numbers, on the other hand, it holds, so the structure of natural numbers is infinitely large."],["⟦0⟧ は ⟦1⟧ の略記です。⟦2⟧ が ⟦3⟧ に含まれることを示しましょう。","⟦0⟧ is short for ⟦1⟧. Show that ⟦2⟧ is contained in ⟦3⟧."],["扉の ⊆ を展開し、∀ と → で鍵 ⟦0⟧ を持った部屋へ。","Unfold the door's ⊆ and, with ∀ and →, enter a room holding key ⟦0⟧."],["扉 ⟦0⟧ の ∪ を展開すると、∨ の扉になる。","Unfold the ∪ of door ⟦0⟧ and it becomes a ∨ door."],["①扉の ⊆、②扉の ∀、③扉の →、④扉の ∪、⑤扉の ∨ で左、⑥鍵 ⟦0⟧ を扉へ。","① The door's ⊆, ② the door's ∀, ③ the door's →, ④ the door's ∪, ⑤ left with the door's ∨, ⑥ key ⟦0⟧ into the door."],["共通部分の交換","Swapping an Intersection"],["共通部分は、順番を入れ替えても同じです。鍵と扉の両方で ∩ を展開します。","An intersection is the same with its order swapped. Unfold ∩ in both the key and the door."],["鍵と扉の ∩ をどちらも展開すると、∧ の鍵と ∧ の扉になる。","Unfold the ∩ of both the key and the door, and you get a ∧ key and a ∧ door."],["①扉の ⊆、②扉の ∀、③扉の →、④鍵の ∩、⑤鍵の ∧、⑥扉の ∩、⑦扉の ∧、⑧⑨鍵 ⟦0⟧ と ⟦1⟧ で扉を開ける。","① The door's ⊆, ② the door's ∀, ③ the door's →, ④ the key's ∩, ⑤ the key's ∧, ⑥ the door's ∩, ⑦ the door's ∧, ⑧⑨ open the doors with keys ⟦0⟧ and ⟦1⟧."],["包含と共通部分","Inclusion and Intersection"],["⟦0⟧ なら、両方に同じ集合 ⟦1⟧ との共通部分をとっても、包含関係は保たれます。","If ⟦0⟧, inclusion is preserved when you intersect both sides with the same set ⟦1⟧."],["扉の ⊆ を展開し、∀ と → で鍵 ⟦0⟧ を持った部屋へ。鍵と扉の ∩ を展開しよう。","Unfold the door's ⊆ and, with ∀ and →, enter a room holding key ⟦0⟧. Unfold the ∩ of the key and the door."],["扉 ⟦0⟧ には、仮定 ⟦1⟧ を展開して ⟦2⟧ を当てはめた鍵を使う。","For door ⟦0⟧, use the key obtained by unfolding the assumption ⟦1⟧ and instantiating it with ⟦2⟧."],["①扉の ⊆、②扉の ∀、③扉の →、④鍵の ∩、⑤鍵の ∧、⑥扉の ∩、⑦扉の ∧、⑧仮定の ⊆、⑨ ∀ に ⟦0⟧、⑩その鍵を扉 ⟦1⟧ へ、⑪鍵 ⟦2⟧ を扉へ、⑫鍵 ⟦3⟧ を扉へ。","① The door's ⊆, ② the door's ∀, ③ the door's →, ④ the key's ∩, ⑤ the key's ∧, ⑥ the door's ∩, ⑦ the door's ∧, ⑧ the assumption's ⊆, ⑨ ⟦0⟧ for its ∀, ⑩ that key into door ⟦1⟧, ⑪ key ⟦2⟧ into the door, ⑫ key ⟦3⟧ into the door."],["補集合と背理法","Complements and Reductio"],["⟦0⟧ は、ド・モルガンの塔（{{s:6-5}}）の集合版です。前の部屋の向きとは違い、こちらの向きには背理法の魔法が必要です。","⟦0⟧ is the set version of De Morgan's Tower ({{s:6-5}}). Unlike the direction in the previous room, this direction needs the reductio spell."],["扉の ⊆ を展開し、∀ と → で鍵 ⟦0⟧ を持った部屋へ。扉の ∪ を展開してから、背理法の魔法を唱えよう。","Unfold the door's ⊆ and, with ∀ and →, enter a room holding key ⟦0⟧. Unfold the door's ∪, then cast the reductio spell."],["鍵 ⟦0⟧ の ᶜ を展開して扉 ⊥ に差し込み、扉 ⟦1⟧ を ∩ と ∧ で分ける。分かれた扉のそれぞれで、もう一度魔法を唱える。","Unfold the ᶜ of key ⟦0⟧ and insert it into door ⊥; split door ⟦1⟧ with ∩ and ∧. Cast the spell again on each of the split doors."],["扉 ⟦0⟧ で魔法 → 鍵 ⟦1⟧ を扉 ⊥ へ → 扉の ∨ で左 → 扉の ᶜ を展開 → 鍵 ⟦2⟧ で閉じる。扉 ⟦3⟧ も同じように。","Spell on door ⟦0⟧ → key ⟦1⟧ into door ⊥ → left with the door's ∨ → unfold the door's ᶜ → close with key ⟦2⟧. Door ⟦3⟧ in the same way."],["2 乗が単位元とは限らない","Squares Need Not Be the Identity"],["群の公理（結合律・左単位元・左逆元）からは、「どの元も 2 乗すると単位元」は証明できません。構造の欄の「既製の構造」から、よく知られた群を読み込んで試せます。読み込んだ後も、表は自由に書き換えられます。","From the group axioms (associativity, left identity, left inverse), \"every element squares to the identity\" cannot be proved. You can load well-known groups from \"Preset structures\" in the structure panel and try them. After loading, you can still freely edit the tables."],["「既製の構造」の一覧を開いてみよう。","Open the list of \"Preset structures\"."],["⟦0⟧/2 とクラインの四元群では、どの元も 2 乗すると単位元になるので反例にならない。","In ⟦0⟧/2 and the Klein four-group every element squares to the identity, so they are not counterexamples."],["3 人の巡回群 ℤ/3 を読み込む（3 人なら手で表を作ることもできる）。","Load the cyclic group ℤ/3 with 3 residents (with 3 residents you can also fill the table by hand)."],["非可換な群","A Noncommutative Group"],["群の公理からは、可換律は証明できません。ただし、可換でない群は最小でも 6 人必要で、6 × 6 の積の表を手で埋めるのは大変です。こういうときは「既製の構造」が役に立ちます。","Commutativity cannot be proved from the group axioms. But a noncommutative group needs at least 6 residents, and filling a 6 × 6 multiplication table by hand is hard work. This is where \"Preset structures\" helps."],["5 人以下の群はすべて可換なので、6 人の群が必要。","Every group with 5 or fewer residents is commutative, so you need a group with 6 residents."],["既製の構造の中で、住人が 6 人のものを探そう。","Look for one with 6 residents among the preset structures."],["3 次対称群 S₃ を読み込む。たとえば住人 2 と 5 の積を、順番を変えて比べてみよう。","Load the symmetric group S₃. For example, compare the products of residents 2 and 5 in both orders."],["背理法の魔法","The reductio spell"],["背理法の魔法（RAA）と排中律","The reductio spell (RAA) and excluded middle"],["真理値の鏡","Mirror of Truth Values"],["真理値の割り当てによる反証と、真偽の鑑定","Refutation by truth assignments, and judging truth"],["魔法の扉","Magic Doors"],["術なしの論理（直観主義論理）と Kripke 模型","Logic without the spell (intuitionistic logic) and Kripke models"],["∀I、∀E","∀I, ∀E"],["存在の扉","Doors of Existence"],["∃I、∃E","∃I, ∃E"],["古典述語論理（背理法の魔法と量化子）","Classical predicate logic (the reductio spell with quantifiers)"],["構造の鑑定","Judging Structures"],["構造による反証と、量化子の鑑定","Refutation by structures, and judging quantifiers"],["集合の街","Town of Sets"],["集合の演算（定義の展開）","Operations on sets (unfolding definitions)"],["順序・写像・群（等式の計算）","Orders, maps, groups (calculating with equations)"],["公理の鏡","Mirror of Axioms"],["順序・群・自然数の公理から証明できないことを、構造で示す","Showing with structures what the axioms of orders, groups and natural numbers cannot prove"],["隠し層","Hidden Level"],["第 ⟦0⟧ 層","Level ⟦0⟧"],["第 ? 層","Level ?"],["等号の対称律","Symmetry of equality"],["等号の推移律","Transitivity of equality"],["関数の合同","Congruence for functions"],["左消去律","Left cancellation"],["鍵 ⟦0⟧","key ⟦0⟧"],["扉 ⟦0⟧","door ⟦0⟧"],["この鍵には ∀ がありません。","This key has no ∀."],["鍵 ⟦0⟧ はすでに持っています。","You already have key ⟦0⟧."],["鍵 ⟦0⟧ に⟦1⟧住人 ⟦2⟧ を当てはめ、鍵 ⟦3⟧ を得る。","Instantiate key ⟦0⟧ with ⟦1⟧resident ⟦2⟧ to get key ⟦3⟧."],["新しく呼んだ","the newly called "],["手元の部品に ∀E の断片ができる：⟦0⟧ から ⟦1⟧","A ∀E fragment appears among your parts: from ⟦0⟧ to ⟦1⟧"],["この扉には ∃ がありません。","This door has no ∃."],["⟦0⟧住人 ⟦1⟧ を証人に選ぶ。扉は ⟦2⟧ になる。","Choose ⟦0⟧resident ⟦1⟧ as the witness. The door becomes ⟦2⟧."],["目標 ⟦0⟧ の上に ∃I の線。その上では証人 ⟦1⟧ について ⟦2⟧ を目指す","A ∃I line appears above the goal ⟦0⟧. Above it, aim for ⟦2⟧ about the witness ⟦1⟧"],["等式の鍵ではありません。","This is not an equation key."],["扉 ⟦0⟧ には ⟦1⟧ も ⟦2⟧ も現れないので、鍵 ⟦3⟧ では書き換えられません。","Neither ⟦1⟧ nor ⟦2⟧ occurs in door ⟦0⟧, so key ⟦3⟧ cannot rewrite it."],["扉 ⟦0⟧ には ⟦1⟧ が現れないので、鍵 ⟦2⟧ では書き換えられません（=E は、扉の中の右辺 ⟦3⟧ を左辺 ⟦4⟧ に戻す規則）。","⟦1⟧ does not occur in door ⟦0⟧, so key ⟦2⟧ cannot rewrite it (=E turns the right-hand side ⟦3⟧ in the door back into the left-hand side ⟦4⟧)."],["書き換える場所を選んでください。","Choose the places to rewrite."],["鍵 ⟦0⟧ で、扉の ⟦1⟧ を ⟦2⟧ に書き換える⟦3⟧。扉は ⟦4⟧ になる。","Use key ⟦0⟧ to rewrite ⟦1⟧ in the door to ⟦2⟧⟦3⟧. The door becomes ⟦4⟧."],["（等式を逆向きに使う）"," (using the equation backwards)"],["目標 ⟦0⟧ の上に =E の線。鍵 ⟦1⟧ と、新しい ⋮ ⟦2⟧ が並ぶ","A =E line appears above the goal ⟦0⟧, with key ⟦1⟧ and a new ⋮ ⟦2⟧ side by side"],["鍵 ⟦0⟧ には ⟦1⟧ が現れないので、鍵 ⟦2⟧ では書き換えられません。","⟦1⟧ does not occur in key ⟦0⟧, so key ⟦2⟧ cannot rewrite it."],["鍵 ⟦0⟧ で、鍵 ⟦1⟧ の ⟦2⟧ を ⟦3⟧ に書き換え⟦4⟧、鍵 ⟦5⟧ を得る。","Use key ⟦0⟧ to rewrite ⟦2⟧ in key ⟦1⟧ to ⟦3⟧⟦4⟧, getting key ⟦5⟧."],["手元の部品に =E の断片ができる：⟦0⟧ と ⟦1⟧ から ⟦2⟧","A =E fragment appears among your parts: from ⟦0⟧ and ⟦1⟧ to ⟦2⟧"],["この扉には展開できる定義がありません。","This door has no definition to unfold."],["定義","定義"],["扉 ⟦0⟧ の ⟦1⟧（⟦2⟧）を定義どおりに展開する。扉は ⟦3⟧ になる。","Unfold ⟦1⟧ (⟦2⟧) in door ⟦0⟧ by its definition. The door becomes ⟦3⟧."],["目標 ⟦0⟧ の上に「定義」の線。その上で ⟦1⟧ を目指す（意味は同じ）","A \"Def\" line appears above the goal ⟦0⟧. Above it, aim for ⟦1⟧ (same meaning)"],["この鍵には展開できる定義がありません。","This key has no definition to unfold."],["鍵 ⟦0⟧ の ⟦1⟧（⟦2⟧）を定義どおりに展開し、鍵 ⟦3⟧ を得る。","Unfold ⟦1⟧ (⟦2⟧) in key ⟦0⟧ by its definition, getting key ⟦3⟧."],["手元の部品に「定義」の断片ができる：⟦0⟧ から ⟦1⟧","A \"Def\" fragment appears among your parts: from ⟦0⟧ to ⟦1⟧"],["補題の式を選んでください。","Choose the lemma formula."],["補題","補題"],["補題 ⟦0⟧ を立てる。まず扉 ⟦1⟧ で補題を証明し、もう一方の扉では鍵 ⟦2⟧ を使って ⟦3⟧ を開ける。","State the lemma ⟦0⟧. First prove the lemma at door ⟦1⟧; at the other door, open ⟦3⟧ using key ⟦2⟧."],["目標 ⟦0⟧ の上に →E の線。左に「[⟦1⟧]<sup>⟦2⟧</sup> から ⟦3⟧」を →I<sup>⟦4⟧</sup> でまとめた ⟦5⟧、右に補題 ⟦6⟧ の ⋮","A →E line appears above the goal ⟦0⟧: on the left, ⟦5⟧ collecting \"from [⟦1⟧]<sup>⟦2⟧</sup> to ⟦3⟧\" with →I<sup>⟦4⟧</sup>; on the right, a ⋮ for the lemma ⟦6⟧"],["帰納法は ∀ の扉で使えます。","Induction can be used on a ∀ door."],["帰納法","帰納法"],["扉 ⟦0⟧ を帰納法で、⟦1⟧（出発点）と、帰納法の仮定 ⟦2⟧ から ⟦3⟧ を示す扉に分ける。","Split door ⟦0⟧ by induction into ⟦1⟧ (the base case) and a door showing ⟦3⟧ from the induction hypothesis ⟦2⟧."],["目標 ⟦0⟧ の上に「帰納法」の線。⟦1⟧ の ⋮ と、[⟦2⟧]<sup>⟦3⟧</sup> からの ⟦4⟧ の ⋮ が並ぶ（固有変数 ⟦5⟧）","An \"Ind\" line appears above the goal ⟦0⟧, with a ⋮ for ⟦1⟧ and a ⋮ for ⟦4⟧ from [⟦2⟧]<sup>⟦3⟧</sup> (eigenvariable ⟦5⟧)"],["住人 ⟦0⟧ は ⟦1⟧ に現れているので、「任意の住人」とは言えません（固有変数条件）。まだ登場していない名前を選びましょう。","Resident ⟦0⟧ occurs in ⟦1⟧, so it is not an \"arbitrary resident\" (the eigenvariable condition). Choose a name that has not appeared yet."],["、",", "],["任意の住人 ⟦0⟧ を連れて部屋に入る。扉は ⟦1⟧ になる（⟦2⟧ は部屋の外に出られない）。","Enter a room with an arbitrary resident ⟦0⟧. The door becomes ⟦1⟧ (⟦2⟧ cannot leave the room)."],["目標 ⟦0⟧ の上に ∀I の線（固有変数 ⟦1⟧）。その上で ⟦2⟧ を目指す","A ∀I line appears above the goal ⟦0⟧ (eigenvariable ⟦1⟧). Above it, aim for ⟦2⟧"],["扉の ∃ は、証人となる住人を選んで使います。","Use the ∃ of a door by choosing a resident as the witness."],["両辺が同じ項のときだけ、= をタップして開けられます（=I）。等式の鍵で扉を書き換えましょう（=E）。","You can open the door by tapping = only when both sides are the same term (=I). Rewrite the door with an equation key (=E)."],["扉 ⟦0⟧ は両辺が同じなので開く（反射律）。","Door ⟦0⟧ opens because both sides are the same (reflexivity)."],["⋮ ⟦0⟧ が =I（前提なし）でふさがる","⋮ ⟦0⟧ is closed by =I (no premises)"],["仮定 ⟦0⟧ を持って部屋 ⟦1⟧ に入る。扉は ⟦2⟧ になる。","Enter room ⟦1⟧ with the assumption ⟦0⟧. The door becomes ⟦2⟧."],["目標 ⟦0⟧ の上に →I<sup>⟦1⟧</sup> の線。その上で、仮定 [⟦2⟧]<sup>⟦3⟧</sup> から ⟦4⟧ を目指す","A →I<sup>⟦1⟧</sup> line appears above the goal ⟦0⟧. Above it, aim for ⟦4⟧ from the assumption [⟦2⟧]<sup>⟦3⟧</sup>"],["扉 ⟦0⟧ を ⟦1⟧ と ⟦2⟧ に分ける。","Split door ⟦0⟧ into ⟦1⟧ and ⟦2⟧."],["目標 ⟦0⟧ の上に ∧I の線。⟦1⟧ と ⟦2⟧ の二つの ⋮ に分かれる","A ∧I line appears above the goal ⟦0⟧, splitting into two ⋮: ⟦1⟧ and ⟦2⟧"],["扉の ∨ は、左右どちらを示すかを選んで使います。","Use the ∨ of a door by choosing which side to show."],["原子命題の扉は分解できません。合う鍵を差し込みましょう。","An atomic door cannot be split. Insert a matching key."],["⊥ の扉に背理法の魔法を唱えても、何も変わりません。","Casting the reductio spell on a ⊥ door changes nothing."],["背理法の魔法を唱え、「⟦0⟧ でない」と仮定して（⟦1⟧）魔法の部屋 ⟦2⟧ に入る。扉は ⊥ になる。","Cast the reductio spell: assume \"not ⟦0⟧\" (⟦1⟧) and enter the spell room ⟦2⟧. The door becomes ⊥."],["目標 ⟦0⟧ の上に RAA<sup>⟦1⟧</sup> の線。その上で、仮定 [⟦2⟧]<sup>⟦3⟧</sup> から矛盾 ⊥ を目指す","A RAA<sup>⟦1⟧</sup> line appears above the goal ⟦0⟧. Above it, aim for the contradiction ⊥ from the assumption [⟦2⟧]<sup>⟦3⟧</sup>"],["この扉はすでに ⊥ です。","This door is already ⊥."],["扉 ⟦0⟧ を、矛盾 ⊥ を導く扉に切り替える。","Switch door ⟦0⟧ to a door that derives the contradiction ⊥."],["目標 ⟦0⟧ の上に ⊥E の線。その上では矛盾 ⊥ を目指す","A ⊥E line appears above the goal ⟦0⟧. Above it, aim for the contradiction ⊥"],["この扉は選言ではありません。","This door is not a disjunction."],["扉 ⟦0⟧ の⟦1⟧を選び、⟦2⟧ を示すことにする。","Choose the ⟦1⟧ side of door ⟦0⟧ and aim to show ⟦2⟧."],["左","left"],["右","right"],["目標 ⟦0⟧ の上に ∨I の線。その上では ⟦1⟧ だけを目指す","A ∨I line appears above the goal ⟦0⟧. Above it, aim only for ⟦1⟧"],["その鍵はこの部屋では使えません。","That key cannot be used in this room."],["仮定","仮定"],["鍵 ⟦0⟧ で扉 ⟦1⟧ を開ける。","Open door ⟦1⟧ with key ⟦0⟧."],["⋮ ⟦0⟧ の位置に、部品（鍵 ⟦1⟧ の作り方）がつながる","At ⋮ ⟦0⟧, the part (how key ⟦1⟧ was made) is attached"],["⋮ ⟦0⟧ が仮定 ⟦1⟧ でふさがり、証明図の葉になる","⋮ ⟦0⟧ is closed by the assumption ⟦1⟧ and becomes a leaf of the proof tree"],["⊥ の鍵で扉 ⟦0⟧ を開ける（矛盾からは何でも導ける）。","Open door ⟦0⟧ with the ⊥ key (anything follows from a contradiction)."],["⊥ の下に ⊥E の線を引いて ⟦0⟧ を導き、⋮ ⟦1⟧ をふさぐ","Draw a ⊥E line under ⊥ to derive ⟦0⟧ and close ⋮ ⟦1⟧"],["鍵 ⟦0⟧ を扉 ⟦1⟧ に差し込む。扉は ⟦2⟧ に付け替わる。","Insert key ⟦0⟧ into door ⟦1⟧. The door is replaced by ⟦2⟧."],["鍵 ⟦0⟧ を扉 ⟦1⟧ に差し込む。扉は ⟦2⟧ の ⟦3⟧ つに分かれる。","Insert key ⟦0⟧ into door ⟦1⟧. The door splits into ⟦3⟧ doors: ⟦2⟧."],["目標 ⟦0⟧ の上に →E の線。鍵 ⟦1⟧ と、新しい ⋮ ⟦2⟧ が並ぶ","A →E line appears above the goal ⟦0⟧, with key ⟦1⟧ and a new ⋮ ⟦2⟧ side by side"],["目標 ⟦0⟧ の上に →E の線が ⟦1⟧ 本。鍵 ⟦2⟧ と、新しい ⋮ ⟦3⟧ が並ぶ","⟦1⟧ →E lines appear above the goal ⟦0⟧, with key ⟦2⟧ and new ⋮ ⟦3⟧ side by side"],["鍵 ⟦0⟧ はそのままでは合いません。鍵の ∧ をタップして中身を取り出しましょう（∧E）。","Key ⟦0⟧ does not fit as it is. Tap the ∧ of the key to take out its contents (∧E)."],["鍵 ⟦0⟧ は、左右どちらが成り立つのか分からないので、そのままでは差し込めません。鍵の ∨ をタップして場合分けしましょう（∨E）。","Key ⟦0⟧ cannot be inserted as it is, because we do not know which side holds. Tap the ∨ of the key to split into cases (∨E)."],["鍵 ⟦0⟧ は、∀ をタップして住人を当てはめてから使いましょう（∀E）。","Tap the ∀ of key ⟦0⟧ and instantiate it with a resident before using it (∀E)."],["鍵 ⟦0⟧ は、∃ をタップして住人を連れてきてから使いましょう（∃E）。","Tap the ∃ of key ⟦0⟧ and bring in a resident before using it (∃E)."],["鍵 ⟦0⟧ から出てくるのは矛盾 ⊥ です。扉の「⊥ を目指す」で扉を ⊥ に切り替えてから差し込むか（⊥E）、先に ⊥ の鍵を作りましょう。","What comes out of key ⟦0⟧ is the contradiction ⊥. Switch the door to ⊥ with \"Aim for ⊥\" before inserting it (⊥E), or make the ⊥ key first."],["鍵 ⟦0⟧ の右側（結論の側）に ⟦1⟧ が現れないので、この扉には差し込めません。","⟦1⟧ does not occur on the right side (the conclusion side) of key ⟦0⟧, so it cannot be inserted into this door."],["鍵 ⟦0⟧ は扉 ⟦1⟧ に合いません。","Key ⟦0⟧ does not fit door ⟦1⟧."],["住人 ⟦0⟧ は ⟦1⟧ に現れているので、「名前の分からない誰か」の名前には使えません（固有変数条件）。まだ登場していない名前を選びましょう。","Resident ⟦0⟧ occurs in ⟦1⟧, so it cannot be used as the name of \"someone whose name we don't know\" (the eigenvariable condition). Choose a name that has not appeared yet."],["鍵 ⟦0⟧ から、⟦1⟧ を満たす誰か ⟦2⟧ を連れて部屋に入る（⟦3⟧ は部屋の外に出られない）。","From key ⟦0⟧, enter a room with someone ⟦2⟧ who satisfies ⟦1⟧ (⟦3⟧ cannot leave the room)."],["目標 ⟦0⟧ の上に ∃E<sup>⟦1⟧</sup> の線。⟦2⟧ と、仮定 [⟦3⟧]<sup>⟦4⟧</sup> からの ⟦5⟧ が並ぶ（固有変数 ⟦6⟧）","A ∃E<sup>⟦1⟧</sup> line appears above the goal ⟦0⟧, with ⟦2⟧ and ⟦5⟧ from the assumption [⟦3⟧]<sup>⟦4⟧</sup> side by side (eigenvariable ⟦6⟧)"],["鍵 ⟦0⟧ で条件分岐。⟦1⟧ の場合（世界 ⟦2⟧）と ⟦3⟧ の場合（世界 ⟦4⟧）の両方で、扉 ⟦5⟧ を開ける。","Branch on key ⟦0⟧. Open door ⟦5⟧ both in the case ⟦1⟧ (world ⟦2⟧) and in the case ⟦3⟧ (world ⟦4⟧)."],["目標 ⟦0⟧ の上に ∨E<sup>⟦1⟧</sup> の線。⟦2⟧、[⟦3⟧]<sup>⟦4⟧</sup> からの ⟦5⟧、[⟦6⟧]<sup>⟦7⟧</sup> からの ⟦8⟧ の三つが並ぶ","A ∨E<sup>⟦1⟧</sup> line appears above the goal ⟦0⟧, with three premises: ⟦2⟧, ⟦5⟧ from [⟦3⟧]<sup>⟦4⟧</sup>, and ⟦8⟧ from [⟦6⟧]<sup>⟦7⟧</sup>"],["この鍵は分解できません。","This key cannot be taken apart."],["この鍵の中身は、どちらもすでに持っています。","You already have both parts of this key."],["鍵 ⟦0⟧ から ⟦1⟧ を取り出す。","Take ⟦1⟧ out of key ⟦0⟧."],[" と "," and "],["手元の部品に ∧E の断片ができる：⟦0⟧ から ⟦1⟧","A ∧E fragment appears among your parts: from ⟦0⟧ to ⟦1⟧"],["どちらの鍵も ⟦0⟧ の形ではないので、組み合わせられません。","Neither key has the form ⟦0⟧, so they cannot be combined."],["鍵 ⟦0⟧ に差し込めるのは ⟦1⟧ の鍵だけです。","Only a key ⟦1⟧ can be inserted into key ⟦0⟧."],["鍵 ⟦0⟧ を鍵 ⟦1⟧ に差し込み、⟦2⟧ を得る。","Insert key ⟦0⟧ into key ⟦1⟧ and get ⟦2⟧."],["手元の部品に →E の断片ができる：⟦0⟧ と ⟦1⟧ から ⟦2⟧","A →E fragment appears among your parts: from ⟦0⟧ and ⟦1⟧ to ⟦2⟧"],["2 人の巡回群 ℤ/2","Cyclic group ℤ/2 (2 residents)"],["演算は 2 で割った余りの足し算。住人 1 が単位元（0）、住人 2 が 1。","Addition modulo 2. Resident 1 is the identity (0) and resident 2 is 1."],["3 人の巡回群 ℤ/3","Cyclic group ℤ/3 (3 residents)"],["演算は 3 で割った余りの足し算。住人 1, 2, 3 が 0, 1, 2 を表す。","Addition modulo 3. Residents 1, 2, 3 stand for 0, 1, 2."],["クラインの四元群","Klein four-group"],["4 人。どの元も 2 乗すると単位元（住人 1）になる可換群。","4 residents. A commutative group in which every element squares to the identity (resident 1)."],["3 次対称群 S₃","Symmetric group S₃"],["6 人。{1,2,3} の並べ替え全体で、住人 1 = 恒等置換、2 = (1 2)、3 = (1 3)、4 = (2 3)、5 = (1 2 3)、6 = (1 3 2)。積 x·y は「y を先に、x を後に」行う合成。","6 residents: all permutations of {1,2,3}. Resident 1 = identity, 2 = (1 2), 3 = (1 3), 4 = (2 3), 5 = (1 2 3), 6 = (1 3 2). The product x·y is the composition \"first y, then x\"."],["3 人の鎖","Chain of 3"],["1 < 2 < 3 と一列に並ぶ全順序。","A total order 1 < 2 < 3 in a single line."],["ひし形の半順序","Diamond partial order"],["4 人。1 が一番下、4 が一番上で、2 と 3 は比べられない。","4 residents. 1 is the bottom, 4 is the top, and 2 and 3 are incomparable."],["「⟦0⟧」を読み込みました。表は自由に書き換えられます。","Loaded \"⟦0⟧\". You can freely edit the tables."],["⟦0⟧ はスコープ外です","⟦0⟧ is out of scope"],["未解決の穴が残っています","Unfinished holes remain"],["RAA の形が正しくありません","Malformed RAA"],["→E の前提が合いません","The premises of →E do not match"],["∧E の前提が連言ではありません","The premise of ∧E is not a conjunction"],["固有変数 ⟦0⟧ が仮定に現れています","The eigenvariable ⟦0⟧ occurs in an assumption"],["∀I の形が正しくありません","Malformed ∀I"],["∀I の前提が合いません","The premise of ∀I does not match"],["帰納法の結論が ∀ ではありません","The conclusion of induction is not a ∀"],["帰納法の出発点が正しくありません","The base case of induction is incorrect"],["帰納法の仮定が正しくありません","The induction hypothesis is incorrect"],["帰納法の推進が正しくありません","The induction step is incorrect"],["補題の証明が補題と一致しません","The proof of the lemma does not match the lemma"],["補題を使った証明が目標と一致しません","The proof using the lemma does not match the goal"],["定義の展開が正しくありません","The unfolding of the definition is incorrect"],["=I の形が正しくありません","Malformed =I"],["=E の前提が等式ではありません","The premise of =E is not an equation"],["=E の書き換えが正しくありません","The rewriting by =E is incorrect"],["∀E の前提に ∀ がありません","The premise of ∀E has no ∀"],["∃I の前提が合いません","The premise of ∃I does not match"],["∃E の形が正しくありません","Malformed ∃E"],["∃E の結論が正しくありません","The conclusion of ∃E is incorrect"],["⊥E の前提が ⊥ ではありません","The premise of ⊥E is not ⊥"],["∨I の前提が合いません","The premise of ∨I does not match"],["∨E の主前提が選言ではありません","The major premise of ∨E is not a disjunction"],["∨E の二つの場合の結論が一致しません","The conclusions of the two cases of ∨E do not match"],["帰納法<span class=\"ind-n\">（⟦0⟧）</span>","Ind<span class=\"ind-n\">(⟦0⟧)</span>"],["→E<span class=\"cut-tag\">補題</span>","→E<span class=\"cut-tag\">Lemma</span>"],["証明図に変換できない項です","This term cannot be turned into a proof tree"],["<button type=\"button\" class=\"⟦0⟧\" data-goto=\"⟦1⟧\" aria-label=\"未完成の部分\"><span class=\"pt-dots\"></span>","<button type=\"button\" class=\"⟦0⟧\" data-goto=\"⟦1⟧\" aria-label=\"Unfinished part\"><span class=\"pt-dots\"></span>"],["<span class=\"pt-dead\">行き止まり</span>","<span class=\"pt-dead\">dead end</span>"],["<div class=\"pt-leaf ⟦0⟧⟦1⟧\" data-var=\"⟦2⟧\" data-scope=\"⟦3⟧\" data-scope-pick=\"⟦4⟧\" title=\"仮定 ⟦5⟧（タップで使える範囲を表示）\">[⟦6⟧]<sup class=\"sc\">⟦7⟧</sup></div>","<div class=\"pt-leaf ⟦0⟧⟦1⟧\" data-var=\"⟦2⟧\" data-scope=\"⟦3⟧\" data-scope-pick=\"⟦4⟧\" title=\"Assumption ⟦5⟧ (tap to show where it can be used)\">[⟦6⟧]<sup class=\"sc\">⟦7⟧</sup></div>"],["title=\"定理カード\"","title=\"Theorem card\""],["<span class=\"sc ⟦0⟧\" data-scope-pick=\"⟦1⟧\" title=\"範囲を見る\">⟦2⟧</span>","<span class=\"sc ⟦0⟧\" data-scope-pick=\"⟦1⟧\" title=\"Show the scope\">⟦2⟧</span>"],["-- 集合は「住人についての述語」として扱い、∈・⊆・∩・∪・ᶜ をゲームと同じ定義で書きます","-- Sets are treated as predicates on residents; ∈, ⊆, ∩, ∪, ᶜ are defined as in the game"],["-- 自然数：0 と「次の数」s だけからなる型。足し算・掛け算の性質は、ゲームと同じく公理（仮定）として与えます","-- Natural numbers: a type built from 0 and the successor s only. As in the game, the properties of + and * are given as axioms (hypotheses)"],["-- 帰納法：0 で成り立ち、n から s n へ受け継がれるなら、すべての数で成り立つ","-- Induction: if it holds for 0 and passes from n to s n, it holds for every number"],["-- ゲームの ≤（x に何かを足すと y になる）は、Lean の ≤ と区別して ≼ と書きます","-- The game's ≤ (adding something to x gives y) is written ≼ to distinguish it from Lean's ≤"],["新しい住人","new resident"],["<details class=\"lean-pre\"><summary>前置き（⟦0⟧の定義、⟦1⟧ 行）</summary><div class=\"lean-code\">⟦2⟧</div></details>","<details class=\"lean-pre\"><summary>Preamble (definitions of ⟦0⟧, ⟦1⟧ lines)</summary><div class=\"lean-code\">⟦2⟧</div></details>"],["自然数","natural numbers"],["集合","sets"],["<h3>Lean 4 のコード</h3><p class=\"note\">自然演繹の証明図と同じ証明を、Lean 4 のタクティクで書いたものです。右の <code>--</code> の後ろは、対応する推論規則です。上の再生ボタンで、証明図と一緒に一手ずつたどれます。</p><div class=\"lean-box static\" id=\"rpLean\">⟦0⟧</div>","<h3>Lean 4 code</h3><p class=\"note\">The same proof as the natural deduction proof tree, written with Lean 4 tactics. After <code>--</code> on the right is the corresponding inference rule. With the replay buttons above, you can follow it move by move together with the proof tree.</p><div class=\"lean-box static\" id=\"rpLean\">⟦0⟧</div>"],["<div class=\"lean-head\"><b>Lean 4</b></div><p class=\"note\">隠し層「魔法の扉」では、Lean のコードは出ません（Kripke 模型による反証の層のため）。</p>","<div class=\"lean-head\"><b>Lean 4</b></div><p class=\"note\">The Hidden Level \"Magic Doors\" shows no Lean code (it is a level of refutations by Kripke models).</p>"],["<div class=\"lean-head\"><b>Lean 4</b><span class=\"note\">操作するたびに、対応するタクティクが書き加えられます。<span class=\"lsorry\">sorry</span> はまだ開いていない扉です。</span></div>","<div class=\"lean-head\"><b>Lean 4</b><span class=\"note\">Each move adds the corresponding tactic. <span class=\"lsorry\">sorry</span> marks a door not yet opened.</span></div>"],["<dl class=\"guide\">\n  <div><dt>扉の → をタップ</dt><dd><span class=\"rule\">→I</span>仮定を持って部屋に入る（いつでも安全）</dd></div>\n  <div><dt>扉の ∧ をタップ</dt><dd><span class=\"rule\">∧I</span>扉を二つに分ける（いつでも安全）</dd></div>\n  <div><dt>鍵の ∧ をタップ</dt><dd><span class=\"rule\">∧E</span>中身を取り出す（鍵が増えるだけ）</dd></div>\n  <div><dt>扉の ∨ をタップ</dt><dd><span class=\"rule\">∨I</span>左右どちらかを選んで示す（元に戻らない選択）</dd></div>\n  <div><dt>住人を選ぶ欄の入力欄（⟦0⟧〜）</dt><dd>d + e のような項を書いて当てはめる。∀ が続く鍵は、続けて選ぶ欄が開く</dd></div>\n  <div><dt>全体地図（扉の上のスイッチ）</dt><dd>証明全体の部屋と扉をすべて表示。他の扉はタップで移動、開いた経路は畳んで表示</dd></div>\n  <div><dt>演算の表・定数の解釈・既製の構造（⟦1⟧）</dt><dd>構造の表のボタンで、演算の値や定数が表す住人を決める</dd></div>\n  <div><dt>扉の「帰納法」（⟦2⟧〜）</dt><dd><span class=\"rule\">帰納法</span>0 の場合と、n から次の数への推進に分ける</dd></div>\n  <div><dt>扉の「補題を立てる」（⟦3⟧〜）</dt><dd><span class=\"rule\">補題</span>まず補題を証明し、それを鍵として使う</dd></div>\n  <div><dt>点線の記号 ⊆ ∩ ∪ ᶜ ≤（⟦4⟧、⟦5⟧）</dt><dd><span class=\"rule\">定義</span>タップで定義どおりに展開する</dd></div>\n  <div><dt>扉の =／等式の鍵（⟦6⟧〜）</dt><dd><span class=\"rule\">=I</span>両辺が同じなら開く／<span class=\"rule\">=E</span>等式で項を書き換える</dd></div>\n  <div><dt>扉の ∀／鍵の ∀（⟦7⟧〜）</dt><dd><span class=\"rule\">∀I</span>任意の住人の部屋へ／<span class=\"rule\">∀E</span>住人を当てはめる</dd></div>\n  <div><dt>扉の ∃／鍵の ∃（⟦8⟧〜）</dt><dd><span class=\"rule\">∃I</span>証人を選ぶ（元に戻らない）／<span class=\"rule\">∃E</span>誰かを連れて部屋へ</dd></div>\n  <div><dt>扉の「背理法の魔法」（⟦9⟧〜）</dt><dd><span class=\"rule\">RAA</span>「A でない」と仮定して矛盾を目指す魔法</dd></div>\n  <div><dt>⊥ の鍵を扉へ／扉の「⊥ を目指す」</dt><dd><span class=\"rule\">⊥E</span>矛盾からは何でも導ける（扉の切り替えは元に戻らない選択）</dd></div>\n  <div><dt>鍵の ∨ をタップ</dt><dd><span class=\"rule\">∨E</span>条件分岐で世界を二つに分け、両方で同じ扉を開ける（いつでも安全）</dd></div>\n  <div><dt>鍵 ⟦10⟧ を鍵 ⟦11⟧ へ</dt><dd><span class=\"rule\">→E</span>鍵 ⟦12⟧ を得る（鍵が増えるだけ）</dd></div>\n  <div><dt>鍵を同じ形の扉へ</dt><dd><span class=\"rule\">仮定</span>扉が開く</dd></div>\n  <div><dt>鍵 ⟦13⟧ を扉 ⟦14⟧ へ</dt><dd><span class=\"rule\">→E</span>扉が ⟦15⟧ に付け替わる（元に戻らない選択）</dd></div>\n</dl>","<dl class=\"guide\">\n  <div><dt>Tap the → of a door</dt><dd><span class=\"rule\">→I</span>Enter a room with the assumption (always safe)</dd></div>\n  <div><dt>Tap the ∧ of a door</dt><dd><span class=\"rule\">∧I</span>Split the door in two (always safe)</dd></div>\n  <div><dt>Tap the ∧ of a key</dt><dd><span class=\"rule\">∧E</span>Take out its contents (you only gain keys)</dd></div>\n  <div><dt>Tap the ∨ of a door</dt><dd><span class=\"rule\">∨I</span>Choose one side to show (a choice you cannot undo)</dd></div>\n  <div><dt>The input box in the resident picker (⟦0⟧ on)</dt><dd>Type a term such as d + e to instantiate. For keys with several ∀, the picker opens again for the next one</dd></div>\n  <div><dt>Full map (the switch above the door)</dt><dd>Shows every room and door of the whole proof. Tap another door to move there; finished paths are folded</dd></div>\n  <div><dt>Operation tables, constants, preset structures (⟦1⟧)</dt><dd>Use the buttons in the structure tables to set the values of operations and the residents that constants denote</dd></div>\n  <div><dt>\"Induction\" on a door (⟦2⟧ on)</dt><dd><span class=\"rule\">Ind</span>Split into the case 0 and the step from n to the next number</dd></div>\n  <div><dt>\"State a lemma\" on a door (⟦3⟧ on)</dt><dd><span class=\"rule\">Lemma</span>First prove the lemma, then use it as a key</dd></div>\n  <div><dt>Dotted symbols ⊆ ∩ ∪ ᶜ ≤ (⟦4⟧, ⟦5⟧)</dt><dd><span class=\"rule\">Def</span>Tap to unfold by the definition</dd></div>\n  <div><dt>= on a door / equation keys (⟦6⟧ on)</dt><dd><span class=\"rule\">=I</span>Opens if both sides are the same / <span class=\"rule\">=E</span>Rewrite terms with an equation</dd></div>\n  <div><dt>∀ on a door / ∀ on a key (⟦7⟧ on)</dt><dd><span class=\"rule\">∀I</span>Into the room of an arbitrary resident / <span class=\"rule\">∀E</span>Instantiate with a resident</dd></div>\n  <div><dt>∃ on a door / ∃ on a key (⟦8⟧ on)</dt><dd><span class=\"rule\">∃I</span>Choose a witness (cannot be undone) / <span class=\"rule\">∃E</span>Enter a room with someone</dd></div>\n  <div><dt>\"Reductio spell\" on a door (⟦9⟧ on)</dt><dd><span class=\"rule\">RAA</span>A spell: assume \"not A\" and aim for a contradiction</dd></div>\n  <div><dt>⊥ key to a door / \"Aim for ⊥\" on a door</dt><dd><span class=\"rule\">⊥E</span>Anything follows from a contradiction (switching the door cannot be undone)</dd></div>\n  <div><dt>Tap the ∨ of a key</dt><dd><span class=\"rule\">∨E</span>Branch into two worlds and open the same door in both (always safe)</dd></div>\n  <div><dt>Key ⟦10⟧ into key ⟦11⟧</dt><dd><span class=\"rule\">→E</span>Get key ⟦12⟧ (you only gain keys)</dd></div>\n  <div><dt>A key into a door of the same shape</dt><dd><span class=\"rule\">Hyp</span>The door opens</dd></div>\n  <div><dt>Key ⟦13⟧ into door ⟦14⟧</dt><dd><span class=\"rule\">→E</span>The door is replaced by ⟦15⟧ (a choice you cannot undo)</dd></div>\n</dl>"],["<button class=\"btn tut-btn\" type=\"button\" data-cmd=\"tutorial\" title=\"チュートリアル（動きで操作を確認）\">⟦0⟧<span class=\"lbl\">チュートリアル</span>⟦1⟧</button>","<button class=\"btn tut-btn\" type=\"button\" data-cmd=\"tutorial\" title=\"Tutorial (see the moves in action)\">⟦0⟧<span class=\"lbl\">Tutorial</span>⟦1⟧</button>"],["<button class=\"btn theme-btn\" type=\"button\" data-cmd=\"theme\" title=\"表示の明るさ（押すたびに 自動 → ライト → ダーク）。いま：⟦0⟧\" aria-label=\"表示の明るさ：⟦1⟧\"><span class=\"theme-ic\" aria-hidden=\"true\">⟦2⟧</span><span class=\"lbl\">⟦3⟧</span></button>","<button class=\"btn theme-btn\" type=\"button\" data-cmd=\"theme\" title=\"Brightness (each press: Auto → Light → Dark). Now: ⟦0⟧\" aria-label=\"Brightness: ⟦1⟧\"><span class=\"theme-ic\" aria-hidden=\"true\">⟦2⟧</span><span class=\"lbl\">⟦3⟧</span></button>"],["日本語に切り替える","日本語に切り替える"],["日本語","日本語"],["<button class=\"btn\" type=\"button\" data-cmd=\"map\" title=\"ステージ一覧\">⟦0⟧<span class=\"lbl\">一覧</span></button>","<button class=\"btn\" type=\"button\" data-cmd=\"map\" title=\"Stage list\">⟦0⟧<span class=\"lbl\">Stages</span></button>"],["<button class=\"btn\" type=\"button\" data-cmd=\"undo\" id=\"undoBtn\" title=\"1手戻す（Z キー）\">⟦0⟧<span class=\"lbl\">戻す</span></button>\n       <button class=\"btn\" type=\"button\" data-cmd=\"reset\" title=\"最初の状態に戻す\">⟦1⟧<span class=\"lbl\">最初から</span></button>","<button class=\"btn\" type=\"button\" data-cmd=\"undo\" id=\"undoBtn\" title=\"Undo one move (Z key)\">⟦0⟧<span class=\"lbl\">Undo</span></button>\n       <button class=\"btn\" type=\"button\" data-cmd=\"reset\" title=\"Back to the initial state\">⟦1⟧<span class=\"lbl\">Restart</span></button>"],["<button class=\"btn tut-btn\" type=\"button\" data-cmd=\"help\" title=\"遊び方\">⟦0⟧<span class=\"lbl\">遊び方</span>⟦1⟧</button>","<button class=\"btn tut-btn\" type=\"button\" data-cmd=\"help\" title=\"How to play\">⟦0⟧<span class=\"lbl\">How to play</span>⟦1⟧</button>"],["<button class=\"btn tut-btn\" type=\"button\" data-cmd=\"help\">⟦0⟧<span class=\"lbl\">遊び方</span>⟦1⟧</button>","<button class=\"btn tut-btn\" type=\"button\" data-cmd=\"help\">⟦0⟧<span class=\"lbl\">How to play</span>⟦1⟧</button>"],["階","floors"],["手","moves"],["未クリア","Not cleared"],["鑑定済み","Judged"],["反証済み","Refuted"],["ベスト ⟦0⟧ ⟦1⟧⟦2⟧","Best ⟦0⟧ ⟦1⟧⟦2⟧"],["（目安達成 ★）"," (par reached ★)"],["<span>扉 ⟦0⟧ を鑑定</span>","<span>Judge doors ⟦0⟧</span>"],["・"," · "],["自動","Auto"],["ライト","Light"],["ダーク","Dark"],["あなたは古い迷宮の入口に立っている。苔むした石の扉には、こう刻まれている――「与えられた鍵だけを使い、目の前の扉を開けよ」。腰の袋の中で、数本の鍵が小さく鳴った。この迷宮で頼れるのは、その鍵と、あなたの推論だけだ。","You stand at the entrance of an ancient labyrinth. On the moss-covered stone door these words are carved: \"Use only the keys you are given, and open the door before you.\" A few keys clink softly in the pouch at your waist. In this labyrinth you can rely on nothing but those keys and your own reasoning."],["階段を下りると、長い回廊が続いていた。壁には、鍵穴の付いた不思議な鍵がいくつも掛かっている。「A を差し込めば B が出てくる」――そういう仕掛けの鍵らしい。この回廊では、部屋の奥にさらに部屋があるという。","At the bottom of the stairs a long corridor stretches ahead. On its walls hang many strange keys fitted with keyholes. \"Insert A, and out comes B\" — that seems to be how they work. In this corridor, they say, there are rooms beyond rooms."],["次の階層は、道がいくつにも枝分かれしていた。ここでは「どちらか」が鍵になる。扉が「どちらか」を求めるなら、片方を選べばよい。だが、鍵が「どちらか」しか教えてくれないなら、あなたは両方の道を歩かねばならない。","On the next level the path splits again and again. Here, \"either\" is the key. If a door asks for \"either\", you need only choose one side. But if a key tells you nothing more than \"either\", you must walk both paths."],["地下の書庫で、あなたは黒い表紙の魔導書を見つけた。題は「背理の術」。最初の頁には、こう記されている――「扉を開けられぬなら、扉が開かぬと仮定せよ。そこから矛盾の亀裂が生まれれば、扉ははじめから開いていたのだ」。この階層の扉の多くは、この術なしには開かないという。","In an underground archive you find a grimoire bound in black. Its title: \"The Art of Reductio\". On the first page is written: \"If you cannot open a door, suppose that it does not open. If a crack of contradiction appears from that, the door was open all along.\" Many doors on this level, they say, will not open without this art."],["階段の先は、壁一面に鏡が並ぶ広間だった。鏡は、扉に刻まれた式の真偽を映し出す。どの原子命題を真とし、どれを偽とするか――その選び方ひとつで、鏡の中の景色は変わる。術で開く本物の扉は、どの鏡にも真として映る。だから、鍵が真に映り、扉だけが偽に映る鏡を一枚でも見つければ、その扉は術を使っても開けられない偽りの扉だと分かるのだ。","Beyond the stairs lies a hall lined wall to wall with mirrors. The mirrors reflect whether the formulas carved on the doors are true or false. Which atomic propositions you take as true and which as false — that single choice changes the scene in the mirror. A genuine door that the art can open appears true in every mirror. So if you find even one mirror in which the keys appear true and only the door appears false, you know it is a false door that cannot be opened even with the art."],["この階層に足を踏み入れたとたん、魔導書が開かなくなった。ここは術の届かない場所だ。そして扉の中には、術なしでは決して開かない「魔法の扉」が紛れているという。魔法の扉を見抜くには、時の塔を建てるしかない。塔の上の階ほど、多くのことが分かっている未来だ。一度ともった灯りは、上の階でも消えない。","The moment you set foot on this level, the grimoire will no longer open. This is a place the art cannot reach. Among the doors, they say, are \"magic doors\" that never open without the art. The only way to see through a magic door is to build a tower of time. The higher the floor, the further into the future, where more is known. A light once lit never goes out on the floors above."],["命題の階層を抜けると、地下とは思えないほど広い空間に、ひとつの街が広がっていた。石畳の通りを、名も知らぬ住人たちが行き交っている。この街の扉の多くには ∀――「すべての住人について」の印が刻まれている。住人を一人残らず確かめて回るわけにはいかない。代わりに、特定の誰でもない「名前のない住人」を一人連れてきて、その者について示せばよい――街の門番は、そう教えてくれた。","Past the levels of propositions, a town spreads out in a space so vast it is hard to believe you are underground. Nameless residents come and go along the cobbled streets. Many of the town's doors bear the sign ∀ — \"for every resident\". You cannot go round checking every resident one by one. Instead, bring along one \"nameless resident\", no one in particular, and show it for them — so the town's gatekeeper tells you."],["街の奥には、∃ の印が刻まれた扉が並ぶ区画があった。「〜である住人がいる」――存在を告げる印だ。この区画では、証人を選ぶことが鍵になる。扉が存在を求めるなら、条件を満たす住人を一人連れてくればよい。だが、鍵が存在だけを告げるとき、あなたが会えるのは「名前の分からない誰か」だけだ。","Deep in the town lies a quarter of doors carved with the sign ∃ — \"there is a resident who…\", the sign that announces existence. In this quarter, choosing a witness is the key. If a door asks for existence, you need only bring one resident who meets the condition. But when a key tells you only that someone exists, all you can meet is \"someone whose name you do not know\"."],["街を離れ、海を望む島へ渡ると、懐の魔導書がふたたび温かくなった。この島では、背理の術が住人たちの世界にも及ぶ。誰も証人を差し出してくれない扉でも、「その扉は開かない」と仮定して矛盾を導けば、開けることができる。","Leaving the town, you cross to an island overlooking the sea, and the grimoire in your coat grows warm again. On this island, the art of reductio reaches into the residents' world as well. Even at a door where no one will offer you a witness, you can open it by supposing \"this door does not open\" and deriving a contradiction."],["島の灯台の地下には、模型の街が並ぶ工房があった。住人の数を決め、誰がネコで、誰が誰を恐れるのかを表に書き込めば、小さな街ができあがる。これを構造と呼ぶ。術で開く本物の扉は、どんな模型の街でも真となる。だから、鍵が真で扉だけが偽になる模型を一つ作れば、その扉は術を使っても開けられないと分かる。","Beneath the island's lighthouse is a workshop full of model towns. Decide how many residents there are, and write into tables who is a cat and who fears whom, and a small town takes shape. This is called a structure. A genuine door that the art can open is true in every model town. So if you build one model in which the keys are true and only the door is false, you know that door cannot be opened even with the art."],["金槌の音に導かれて進むと、炉の火が赤々と燃える工房に出た。壁には ＝ の印が刻まれている。ここは等号の工房――「等しいものは、互いに置き換えてよい」という掟のもと、式を鍛え直す場所だ。工房の親方は言う。「ここで鍛えた定理は、カードとなって、この先ずっとおまえの道具になる」。","Following the ring of a hammer, you come to a workshop where a forge burns red. The sign ＝ is carved on its wall. This is the Equality Forge, a place where formulas are reforged under one law: \"equal things may replace each other\". The master of the forge says, \"Theorems forged here will become cards, and serve you as tools from now on.\""],["灯台の工房を抜けると、城壁で区切られた区画がいくつも連なる街に出た。区画ごとに、そこに属する住人が決まっている。住人 x が区画 A に属することを x∈A と書く。この街の扉には ⊆ や ∩ といった見慣れない印が刻まれているが、どれも点線で描かれている。触れれば、その意味が ∀ や ∧ の言葉で書き下される仕掛けだ。","Passing through the lighthouse workshop, you come out into a town of quarters divided by walls. Each quarter has its own residents. That resident x belongs to quarter A is written x∈A. The town's doors bear unfamiliar signs such as ⊆ and ∩, all drawn in dotted lines. Touch one, and its meaning is written out in the words of ∀ and ∧."],["工房を出ると、白い石造りの学舎が並ぶ街に出た。学者たちは、公理と呼ばれる掟を壁に掲げ、それを鍵として定理を導いている。ここで使う技は、これまでと何も変わらない。∀ に具体的な住人を当てはめ、等式で書き換え、扉を開ける――数学の証明とは、そういうものなのだ。","Leaving the forge, you come to a town of white stone academies. The scholars hang laws called axioms on their walls and derive theorems from them, using them as keys. The skills used here are no different from before: instantiate ∀ with concrete residents, rewrite with equations, open the doors — that is what a mathematical proof is."],["講堂の奥の工房には、作りかけの道具がずらりと並んでいた。ここでは、扉を開ける前に、まず道具――補題――を作る。一度作った道具は、何度でも使える。そして特に出来の良い道具は、定理カードとして、この先の旅にも持って行けるのだ。","In the workshop behind the lecture hall, half-finished tools are lined up in rows. Here, before opening a door, you first make a tool — a lemma. A tool once made can be used again and again. And the best of them can be carried on your journey as theorem cards."],["階段を下り切った先に、天井の見えない塔がそびえていた。一階には 0 と刻まれた石板。そこから上へ、階段を一段上るごとに、s(0)、s(s(0))……と、「次の数」の石板が続いている。塔の入口には、足し算の掟が二つだけ刻まれていた――「x に 0 を足せば x」「x に s(y) を足せば、x+y の次」。この二つの掟だけで、塔の秘密を解き明かさねばならない。","At the very bottom of the stairs rises a tower whose ceiling you cannot see. On the ground floor is a stone tablet carved with 0. Upward from there, one tablet for each step — s(0), s(s(0)), … — \"the next number\". At the tower's entrance only two laws of addition are carved: \"x plus 0 is x\" and \"x plus s(y) is the number after x+y\". With these two laws alone, you must unlock the secrets of the tower."],["塔の上の階には、新たな掟が刻まれていた。「x に 0 を掛ければ 0」「x に s(y) を掛ければ、x·y に x を足したもの」。掛け算とは、同じ数を何度も足すこと――この掟は、そう告げている。足し算の掟と組み合わせて、さらに上を目指そう。","On the upper floors of the tower, new laws are carved: \"x times 0 is 0\" and \"x times s(y) is x·y plus x\". Multiplication is adding the same number again and again — so these laws declare. Combine them with the laws of addition and climb higher still."],["塔の上層は、静かな書庫になっていた。棚には、掛け算の法則を記した古い巻物が並んでいる。だが、どの巻物も最後の頁が破り取られている――証明は、自分の手で書き足さねばならない。これまでに集めたカードを、すべて携えて進もう。","The upper levels of the tower are a quiet library. On the shelves lie old scrolls recording the laws of multiplication. But the last page of every scroll has been torn out — the proofs you must write in yourself. Carry every card you have gathered, and press on."],["塔の最上層には、数の大小を測る測量の間があった。壁の銘板には、こう刻まれている――「x≤y とは、x に何かを足せば y になること」。≤ の印は点線で描かれ、触れれば ∃z(x+z=y) と書き下される。大小の比較も、足し算の言葉で語れるのだ。","At the very top of the tower is a surveying hall where the sizes of numbers are measured. On the plaque on its wall is carved: \"x≤y means that adding something to x gives y\". The sign ≤ is drawn in dotted lines; touch it, and it is written out as ∃z(x+z=y). Comparing sizes, too, can be told in the words of addition."],["旅の終わりに、あなたは巨大な鏡の広間にたどり着いた。鏡に映るのは、これまでに出会った掟――順序、群、そして数の掟だ。ここでは、掟から何が証明できないかを、模型の街で確かめる。掟をすべて満たしながら、なお扉だけが偽となる街を作れれば、その扉は掟の力の外にあると分かる。証明できることの限界を知ることも、旅の大切な一部なのだ。","At the end of your journey you reach a vast hall of mirrors. Reflected in them are the laws you have met — the laws of order, of groups, and of numbers. Here you check, with model towns, what cannot be proved from the laws. If you can build a town that satisfies every law and yet makes only the door false, you know that door lies beyond the power of the laws. Knowing the limits of what can be proved is also an important part of the journey."],["湿った空気の地下室。床のあちこちに、深い亀裂が走っている。これが ⊥――矛盾の亀裂だ。言い伝えによれば、亀裂からはどんな扉へも抜けられるという。そして ¬A という印は、「A を持ち込めば亀裂が開く」ことを意味している。","A cellar of damp air. Deep cracks run across the floor here and there. This is ⊥ — the crack of contradiction. Legend has it that through a crack you can pass to any door. And the sign ¬A means \"bring in A, and a crack opens\"."],["最初の部屋は、燭台がひとつ灯るだけの小さな石室だ。床には二本の鍵、⟦0⟧ と ⟦1⟧ が並んで落ちている。正面の扉には ⟦2⟧ と刻まれ、真ん中の ∧ の印が鈍く光っている。どうやら、この扉は二つの鍵を同時に求めているらしい。","The first room is a small stone chamber lit by a single candlestick. On the floor lie two keys side by side, ⟦0⟧ and ⟦1⟧. The door ahead is carved with ⟦2⟧, and the ∧ sign in its middle glows dully. It seems this door asks for both keys at once."],["扉は ∧ の印から二つに割れ、それぞれの鍵穴に ⟦0⟧ と ⟦1⟧ が吸い込まれていった。重い音とともに、奥への道が開く。","The door splits in two at the ∧ sign, and ⟦0⟧ and ⟦1⟧ are drawn into their keyholes. With a heavy sound, the way onward opens."],["次の部屋で手にしたのは、二本の鍵が鎖で束ねられた奇妙な鍵 ⟦0⟧ だった。ところが扉に刻まれているのは ⟦1⟧――並びが逆だ。束ねられたままでは合わない。鎖の留め金にも、見覚えのある ∧ の印がある。","In the next room you pick up a strange key: two keys bound together by a chain, ⟦0⟧. But the door is carved with ⟦1⟧ — the order is reversed. Bound as they are, they will not fit. The clasp of the chain, too, bears a familiar ∧ sign."],["鎖を外した二本の鍵は、並びを入れ替えて扉に収まった。束ねられたものは、ほどいて組み直せばいい。","Freed from the chain, the two keys settle into the door in swapped order. What is bound together can be untied and put back together."],["扉に刻まれた文字は ⟦0⟧。「⟦1⟧ を手にしているなら、⟦2⟧ の扉を開けてみせよ」という意味らしい。だが、あなたの手元にあるのは ⟦3⟧ だけだ。扉の → の印に触れると、奥に小部屋の気配がする――そこでは ⟦4⟧ が手に入りそうだ。","The words carved on the door are ⟦0⟧. It seems to mean \"if you hold ⟦1⟧, show that you can open the door ⟦2⟧\". But all you have is ⟦3⟧. When you touch the → sign on the door, you sense a small room beyond — there, it seems, you could get ⟦4⟧."],["小部屋で得た ⟦0⟧ と、持ち込んだ ⟦1⟧。二本の鍵で内側の扉が開くと、外の扉も静かに道を譲った。小部屋の ⟦2⟧ は、部屋を出るときに置いていくことになる。","The ⟦0⟧ found in the small room, and the ⟦1⟧ you brought. With the two keys the inner door opens, and the outer door quietly gives way too. The ⟦2⟧ of the small room must be left behind when you leave it."],["最初の階層の最奥。番人の石像が、低い声で告げる。「入れ子の鍵を、入れ子の扉に合わせてみよ」。扉には ⟦0⟧ の文字。束ね方の違う鍵と扉――これまでに覚えた技を、すべて使う時が来た。","The innermost chamber of the first level. A stone guardian speaks in a low voice: \"Fit nested keys to a nested door.\" The door reads ⟦0⟧. Keys and a door bound together in different ways — the time has come to use every skill you have learned."],["石像は満足げに目を閉じ、最初の階層の出口が開いた。鍵をほどき、部屋に入り、組み直す――あなたはもう、迷宮の基本を身につけている。","The statue closes its eyes in satisfaction, and the exit of the first level opens. Untie keys, enter rooms, put them back together — you have mastered the basics of the labyrinth."],["回廊の入口で、あなたは鍵穴の付いた鍵 ⟦0⟧ を見つけた。手持ちには ⟦1⟧ もある。扉に刻まれているのは ⟦2⟧ の一文字。鍵穴に何を差し込めばいいか、もう分かっているはずだ。","At the entrance of the corridor you find a key with a keyhole, ⟦0⟧. You also have ⟦1⟧. The door bears a single letter, ⟦2⟧. You surely know by now what to insert into the keyhole."],["⟦0⟧ を差し込むと、鍵穴の鍵がかちりと鳴って ⟦1⟧ に姿を変えた。鍵は、組み合わせることで新しい鍵を生む。","You insert ⟦0⟧, and with a click the keyhole key turns into ⟦1⟧. Combined, keys give birth to new keys."],["今度は、手ぶらで扉の前に立つことになった。刻まれているのは ⟦0⟧。→ の印が二つ――扉の奥に部屋があり、その部屋の奥にもう一つ部屋があるらしい。奥へ進むほど、持てる鍵は増えていく。","This time you stand before the door empty-handed. It reads ⟦0⟧. Two → signs — it seems there is a room beyond the door, and another room beyond that. The deeper you go, the more keys you can hold."],["最も奥の部屋で、二つの部屋から持ち込んだ鍵が組み合わさった。内側の部屋からは、外側の部屋の鍵がすべて使える。","In the innermost room, the keys brought in from the two rooms come together. From an inner room, every key of the outer rooms can be used."],["扉は ∧ の印で、左右二枚の扉に分かれようとしている。それぞれの扉の向こうに、別々の部屋が待っているようだ。片方の部屋で拾った鍵は、もう片方の部屋には持ち込めない――回廊の壁に、そう警告が刻まれている。","The door is about to split at its ∧ sign into two doors, left and right. Behind each door, it seems, a separate room is waiting. A key picked up in one room cannot be carried into the other — so a warning carved on the corridor wall says."],["二つの部屋をそれぞれ抜けると、拾った鍵は部屋に置いたまま扉が閉じた。部屋の鍵が使えるのは、その部屋の中だけだ。","When you have passed through each of the two rooms, the doors close with the keys you picked up left inside. A room's keys can be used only within that room."],["壁に掛かった鍵は二本、⟦0⟧ と ⟦1⟧。扉には ⟦2⟧。ふと思う――扉 ⟦3⟧ を開けたいなら、⟦4⟧ を生み出す鍵から逆にたどればいいのではないか。目標から道を逆算する。それも、迷宮を歩く技のひとつだ。","Two keys hang on the wall, ⟦0⟧ and ⟦1⟧. The door reads ⟦2⟧. A thought strikes you: if you want to open door ⟦3⟧, why not trace back from the key that produces ⟦4⟧? Working backward from the goal is another way of walking the labyrinth."],["⟦0⟧ から ⟦1⟧ へ、⟦2⟧ から ⟦3⟧ へ。二本の鍵が鎖のようにつながり、⟦4⟧ から ⟦5⟧ への道が通った。","From ⟦0⟧ to ⟦1⟧, from ⟦2⟧ to ⟦3⟧. The two keys link like a chain, and the way from ⟦4⟧ to ⟦5⟧ is open."],["回廊の終わりに、深い裂け目が口を開けていた。向こう岸の扉には ⟦0⟧ の一文字。手元には ⟦1⟧ と、奇妙な鍵 ⟦2⟧ がある。番人の声が響く。「橋は見えぬだけで、すでにそこにある」。","At the end of the corridor a deep chasm yawns. The door on the far side bears a single letter, ⟦0⟧. In hand you have ⟦1⟧ and a strange key, ⟦2⟧. The guardian's voice echoes: \"The bridge is there already — you simply cannot see it.\""],["見えなかった橋が、足元に現れた。手元の ⟦0⟧ さえあれば、⟦1⟧ の鍵は作れたのだ。回廊の出口が、あなたを迎える。","The unseen bridge appears beneath your feet. With the ⟦0⟧ in your hand, the key ⟦1⟧ could be made all along. The exit of the corridor welcomes you."],["扉には ⟦0⟧。「⟦1⟧ か ⟦2⟧ のどちらかを示せ」という意味だ。あなたの手元には ⟦3⟧ がある。扉の ∨ の印に触れると、左右どちらの道を進むか選べるらしい。ただし、一度選んだ道は引き返せない。","The door reads ⟦0⟧, meaning \"show either ⟦1⟧ or ⟦2⟧\". You hold ⟦3⟧. Touching the door's ∨ sign, it seems, lets you choose the left path or the right. But once you choose a path, there is no turning back."],["迷わず左の道を選び、鍵 ⟦0⟧ で扉を開けた。どちらかでよいなら、示せる方を選べばいい。","Without hesitation you take the left path and open the door with key ⟦0⟧. When either will do, choose the one you can show."],["手にした鍵は ⟦0⟧。「⟦1⟧ か ⟦2⟧ か、どちらかが成り立つ」――けれども、どちらなのかは鍵にも分からない。鍵の ∨ に触れると、目の前の景色が二つに裂けた。⟦3⟧ が成り立つ世界と、⟦4⟧ が成り立つ世界。あなたは両方で、同じ扉を開けねばならない。","The key in your hand is ⟦0⟧: \"either ⟦1⟧ or ⟦2⟧ holds\" — but even the key does not know which. When you touch the key's ∨, the scene before you splits in two: a world where ⟦3⟧ holds, and a world where ⟦4⟧ holds. You must open the same door in both."],["二つの世界の両方で扉が開くと、裂けた景色は一つに戻った。どちらの場合でも開くなら、どちらなのかを知る必要はない。","When the door opens in both worlds, the split scene becomes one again. If it opens in either case, you need not know which case it is."],["分かれ道の先にある扉は、どちらも ⟦0⟧。壁には ⟦1⟧ と ⟦2⟧ の二本の鍵。⟦3⟧ の道を進んでも、⟦4⟧ の道を進んでも、たどり着く扉は同じらしい。使う鍵は、道ごとに違ってかまわない。","Beyond the fork, both doors read ⟦0⟧. On the wall hang two keys, ⟦1⟧ and ⟦2⟧. Whether you take the path of ⟦3⟧ or the path of ⟦4⟧, it seems you reach the same door. The keys you use may differ from path to path."],["⟦0⟧ の世界では ⟦1⟧ が、⟦2⟧ の世界では ⟦3⟧ が扉を開けた。異なる道が、同じ出口に通じていた。","In the world of ⟦0⟧, ⟦1⟧ opened the door; in the world of ⟦2⟧, ⟦3⟧ did. Different paths led to the same exit."],["扉の奥に部屋があり、部屋の中で道が分かれる――そういう造りの区画だ。部屋で手に入れた鍵は、その奥で分かれたどちらの世界にも持っていける。部屋に入るのが先か、世界を分けるのが先か。順番次第で、歩く距離が変わりそうだ。","Beyond the door is a room, and inside the room the path forks — such is the design of this quarter. A key obtained in the room can be carried into either of the worlds that fork beyond it. Enter the room first, or split the worlds first? The distance you walk seems to depend on the order."],["部屋の鍵を携えたまま二つの世界を抜け、扉は開いた。部屋と世界は、重ねて使える。","Carrying the room's key, you pass through both worlds, and the door opens. Rooms and worlds can be layered."],["分岐の階層の最奥。番人が問う。「⟦0⟧ と、⟦1⟧ か ⟦2⟧ か。それを、⟦3⟧ と ⟦4⟧ か、⟦5⟧ と ⟦6⟧ か、に分け直せ」。扉の ∨ の印は、ここでも引き返せない選択を迫ってくる。だが、どちらを選ぶべきかが分かるのは、いつだろうか。","The innermost chamber of the branching level. The guardian asks: \"⟦0⟧, and ⟦1⟧ or ⟦2⟧. Divide it again into ⟦3⟧ and ⟦4⟧, or ⟦5⟧ and ⟦6⟧.\" Here too, the door's ∨ sign presses an irreversible choice on you. But when can you know which to choose?"],["世界を分けてから選べば、迷いはなかった。番人は道を開け、さらに深い階層への階段が姿を見せる。","Choosing after splitting the worlds left no room for doubt. The guardian opens the way, and stairs to a deeper level appear."],["扉には ⟦0⟧ とあるが、⟦1⟧ に通じる鍵はどこにもない。手元にあるのは ⟦2⟧ と、⟦3⟧ という不穏な鍵だけだ。⟦4⟧ を差し込めば、⊥――矛盾の亀裂が開く。亀裂の向こうには、どんな扉もある。","The door reads ⟦0⟧, yet no key anywhere leads to ⟦1⟧. All you hold is ⟦2⟧ and an ominous key, ⟦3⟧. Insert ⟦4⟧, and ⊥ — the crack of contradiction — opens. Beyond the crack lies every door."],["亀裂を抜けた先に、⟦0⟧ の扉があった。矛盾からは、何でも導ける。","Beyond the crack stood the door ⟦0⟧. From a contradiction, anything follows."],["扉の印は ⟦0⟧。¬ が二つ重なっている。¬A とは A→⊥、つまり「A を持ち込めば亀裂が開く」という意味だった。ならば ⟦1⟧ は、「⟦2⟧ を持ち込めば亀裂が開く」ということになる。","The door's sign is ⟦0⟧, with two ¬ stacked together. ¬A is A→⊥, that is, \"bring in A, and a crack opens\". Then ⟦1⟧ must mean \"bring in ⟦2⟧, and a crack opens\"."],["⟦0⟧ と ⟦1⟧ を同時に手にした瞬間、亀裂が開いた。否定の正体は、矛盾への道だった。","The moment you held ⟦0⟧ and ⟦1⟧ together, a crack opened. Negation, it turns out, is a road to contradiction."],["壁に掛かる鍵は ⟦0⟧。扉には ⟦1⟧。⟦2⟧ でないなら、⟦3⟧ でもない――言われてみれば当然だが、それを示すには、⟦4⟧ と ⟦5⟧ の両方を持ち込んで、亀裂が開くことを確かめねばならない。","The key on the wall is ⟦0⟧. The door reads ⟦1⟧. If not ⟦2⟧, then not ⟦3⟧ — obvious once said, but to show it you must bring in both ⟦4⟧ and ⟦5⟧ and see that a crack opens."],["⟦0⟧ から ⟦1⟧ を作った途端、⟦2⟧ とぶつかって亀裂が開いた。対偶は、矛盾を通って示される。","The instant you made ⟦1⟧ from ⟦0⟧, it collided with ⟦2⟧ and a crack opened. The contrapositive is shown by way of contradiction."],["鍵 ⟦0⟧ で世界を二つに分けると、片方の世界はどこか脆く見える。手元には ⟦1⟧ もある。⟦2⟧ の世界に ⟦3⟧ を持ち込めば――その世界ごと、亀裂に崩れ落ちるだろう。崩れた世界では、どの扉も開く。","When you split the world in two with key ⟦0⟧, one of the worlds looks somehow fragile. You also hold ⟦1⟧. Bring ⟦3⟧ into the world of ⟦2⟧ — and that whole world will crumble into the crack. In a crumbled world, every door opens."],["⟦0⟧ の世界は亀裂に呑まれ、⟦1⟧ の世界では鍵 ⟦2⟧ がそのまま扉を開けた。成り立たない場合は、矛盾として片付けられる。","The world of ⟦0⟧ was swallowed by the crack, and in the world of ⟦1⟧ the key ⟦2⟧ simply opened the door. A case that cannot hold is disposed of as a contradiction."],["地下室の最奥で、番人が静かに語る。「⟦0⟧ か、⟦1⟧ でないか。それを確かめる術は、この地下室にはない。だが、それを否定することが矛盾だとは示せるはずだ」。扉には ⟦2⟧。同じ鍵は、何度使ってもかまわない。","In the depths of the cellar, the guardian speaks quietly: \"⟦0⟧, or not ⟦1⟧. There is no art in this cellar to settle which. But you should be able to show that denying it is a contradiction.\" The door reads ⟦2⟧. You may use the same key as many times as you like."],["排中律そのものではなく、その影――二重否定の扉が開いた。この先の階層では、古い魔導書があなたを待っている。","Not the excluded middle itself, but its shadow — the door of its double negation — has opened. On the levels ahead, an old grimoire awaits you."],["魔導書を手にした最初の部屋。扉には ⟦0⟧。「⟦1⟧ でないことはない、ならば ⟦2⟧」――前の階層では、どうしても開けられなかった形の扉だ。だが今のあなたには術がある。開けたい扉の前で、「この扉は開かない」と唱えてみるのだ。","The first room with the grimoire in hand. The door reads ⟦0⟧: \"it is not the case that not ⟦1⟧, so ⟦2⟧\" — a door of the very form you could never open on the previous level. But now you have the art. Stand before the door you wish to open and speak the words \"this door does not open\"."],["「⟦0⟧ でない」と唱えた瞬間、手元の ⟦1⟧ とぶつかって亀裂が開いた。矛盾が生まれたのなら、⟦2⟧ ははじめから成り立っていたのだ。","The moment you spoke \"not ⟦0⟧\", it collided with the ⟦1⟧ in your hand and a crack opened. If a contradiction arose, ⟦2⟧ held all along."],["扉に刻まれているのは ⟦0⟧。⟦1⟧ か、⟦2⟧ でないか。ありふれた言葉に見えるが、地下室ではその影しか開けられなかった扉だ。扉の ∨ でいきなり左右を選ぶと、どちらの道も行き止まりになる。まずは術を唱え、「この扉は開かない」という仮定から始めよう。","The door is carved with ⟦0⟧. ⟦1⟧, or not ⟦2⟧. Ordinary words, it seems — yet in the cellar you could open only its shadow. If you choose a side with the door's ∨ at once, both paths are dead ends. Begin by casting the art, from the supposition \"this door does not open\"."],["開かないと仮定した扉が、二度、矛盾を呼んだ。こうして排中律の扉は、術によって正面から開かれた。","The door supposed not to open called up a contradiction — twice. And so the door of the excluded middle was opened head-on by the art."],["壁に掛かる鍵は ⟦0⟧。扉には ⟦1⟧。「⟦2⟧ ならば ⟦3⟧」を「⟦4⟧ でないか、⟦5⟧」と言い換えよ、ということらしい。だが、∨ の左右のどちらを選ぶべきかは、まだ分からない。迷ったときこそ、術の出番だ。","The key on the wall is ⟦0⟧. The door reads ⟦1⟧. It asks you to rephrase \"if ⟦2⟧ then ⟦3⟧\" as \"not ⟦4⟧, or ⟦5⟧\". But you do not yet know which side of the ∨ to choose. When in doubt, that is when the art is needed."],["術の部屋で ⟦0⟧ が成り立つかどうかを確かめるうちに、選ぶべき側がおのずと見えてきた。言い換えの扉は、静かに開いた。","As you tested in the spell room whether ⟦0⟧ holds, the side to choose came into view of its own accord. The door of rephrasing opened quietly."],["鍵は ⟦0⟧、扉は ⟦1⟧。数学者たちが「対偶を示せば十分だ」と言うとき、彼らはこの扉をくぐっている。⟦2⟧ を持って部屋に入っても、⟦3⟧ の扉はそのままでは開かない。部屋の中で、もう一度術を唱える必要がありそうだ。","The key is ⟦0⟧, the door ⟦1⟧. When mathematicians say \"it suffices to show the contrapositive\", they pass through this door. Entering a room with ⟦2⟧ does not by itself open the door ⟦3⟧. It seems you must cast the art once more inside the room."],["「⟦0⟧ でない」と唱えると、鍵 ⟦1⟧ が ⟦2⟧ を生み、手元の ⟦3⟧ とぶつかった。対偶から元の命題へ――その道には、術が欠かせなかった。","When you spoke \"not ⟦0⟧\", the key ⟦1⟧ produced ⟦2⟧, which collided with the ⟦3⟧ in your hand. From the contrapositive back to the original — on that road, the art was indispensable."],["この部屋に入ると、魔導書が固く閉じてしまった。術を封じる結界が張られているらしい。代わりに、床には排中律 ⟦0⟧ の鍵が置かれている。術なしで、⟦1⟧ から ⟦2⟧ を導けるだろうか。もし導けるなら、排中律こそが術の正体の一つということになる。","As you enter this room, the grimoire snaps shut. A barrier that seals the art seems to be in place. Instead, a key of the excluded middle, ⟦0⟧, lies on the floor. Can you derive ⟦2⟧ from ⟦1⟧ without the art? If you can, the excluded middle must be one of the true faces of the art."],["⟦0⟧ の世界ではそのまま、⟦1⟧ の世界では ⟦2⟧ とぶつかって亀裂が開いた。排中律の鍵があれば、術は要らなかった。","In the world of ⟦0⟧ it was immediate; in the world of ⟦1⟧ it collided with ⟦2⟧ and a crack opened. With the key of the excluded middle, the art was not needed."],["この部屋でも魔導書は閉じたままだ。代わりに置かれているのは、二重否定を取り去る鍵 ⟦0⟧。地下室の最奥で開けた ⟦1⟧ の扉を、覚えているだろうか。あのときの道筋が、ここでもう一度役に立つ。","In this room too, the grimoire stays shut. What lies here instead is a key that removes double negations, ⟦0⟧. Do you remember the door ⟦1⟧ you opened in the depths of the cellar? The path you took then will serve you once again."],["地下室で開いた影の扉と、二重否定を取り去る鍵。二つが合わさって、排中律の扉が開いた。背理法、排中律、二重否定除去――三つの術は、互いに互いを呼び出せる。","The shadow door opened in the cellar, and the key that removes double negations. Together they opened the door of the excluded middle. Reductio, the excluded middle, double negation elimination — each of the three arts can summon the others."],["書庫の奥にそびえる塔の扉には ⟦0⟧。手元の鍵は ⟦1⟧――「⟦2⟧ と ⟦3⟧ が両方成り立つことはない」。ならば、どちらかは成り立たないはずだ。ただし、どちらが成り立たないのかは、鍵も教えてくれない。術は何度唱えてもかまわない。","The door of the tower rising at the back of the archive reads ⟦0⟧. The key in your hand is ⟦1⟧: \"⟦2⟧ and ⟦3⟧ do not both hold\". Then one of them must fail. But which one fails, not even the key will tell you. You may cast the art as many times as you like."],["重ねて唱えた術が ⟦0⟧ と ⟦1⟧ をともに引き出し、⟦2⟧ とぶつけた。ド・モルガンの塔の頂で、魔導書の最後の頁がめくれた。","Cast again and again, the art drew out both ⟦0⟧ and ⟦1⟧ and set them against ⟦2⟧. At the top of De Morgan's Tower, the last page of the grimoire turned."],["最初の鏡の前の扉には ⟦0⟧。鍵は ⟦1⟧。「⟦2⟧ ならば ⟦3⟧」から、その逆を導けというのだ。だが、逆向きの道は本当にあるのだろうか。⟦4⟧ と ⟦5⟧ に真か偽を割り当てて、鍵は真に、扉は偽に映る鏡を探してみよう。","The door before the first mirror reads ⟦0⟧. The key is ⟦1⟧. You are asked to derive, from \"if ⟦2⟧ then ⟦3⟧\", its converse. But is there really a road in the opposite direction? Assign true or false to ⟦4⟧ and ⟦5⟧, and look for a mirror in which the key appears true and the door false."],["⟦0⟧ を偽、⟦1⟧ を真に映した鏡の中で、鍵は真に、扉は偽に光った。逆向きの道は、はじめから存在しなかったのだ。","In the mirror showing ⟦0⟧ as false and ⟦1⟧ as true, the key shone true and the door false. The road in the opposite direction never existed."],["次の扉には ⟦0⟧。「⟦1⟧ ならば ⟦2⟧」の「裏」だ。正しく導けるのは対偶 ⟦3⟧ のほうだと、あなたはもう知っている。では、裏はどうか。鏡に問うてみよう。","The next door reads ⟦0⟧ — the \"inverse\" of \"if ⟦1⟧ then ⟦2⟧\". You already know that what can rightly be derived is the contrapositive ⟦3⟧. Then what of the inverse? Ask the mirror."],["⟦0⟧ が偽で ⟦1⟧ が真の鏡では、⟦2⟧ は真、⟦3⟧ は偽。裏の扉は偽りだった。","In the mirror where ⟦0⟧ is false and ⟦1⟧ is true, ⟦2⟧ is true and ⟦3⟧ is false. The door of the inverse was false."],["鍵は ⟦0⟧、扉は ⟦1⟧。「⟦2⟧ か ⟦3⟧ か」と言われただけで、⟦4⟧ だと決めつけてよいのだろうか。分岐の階層で、あなたが両方の世界を歩かされた理由が、この鏡に映っているはずだ。","The key is ⟦0⟧, the door ⟦1⟧. Told only \"⟦2⟧ or ⟦3⟧\", may you conclude that it is ⟦4⟧? The reason you had to walk both worlds on the branching level should be reflected in this mirror."],["⟦0⟧ が偽で ⟦1⟧ が真の鏡が、答えを示した。「どちらか」から、片方を選び取ることはできない。","The mirror where ⟦0⟧ is false and ⟦1⟧ is true gave the answer. From \"either\", you cannot pick out one side."],["塔で開けた扉によく似た扉が、ここにもある。鍵は ⟦0⟧、扉は ⟦1⟧。否定を配るとき、∧ と ∨ を入れ替えるのを忘れていないだろうか。鏡がそれを確かめてくれる。","Here too is a door much like the one you opened in the tower. The key is ⟦0⟧, the door ⟦1⟧. When distributing a negation, have you forgotten to swap ∧ and ∨? The mirror will check it for you."],["片方だけが真に映る鏡では、鍵は真、扉は偽だった。否定を配るなら、∧ は ∨ に変わらねばならない。","In a mirror where only one side appears true, the key was true and the door false. To distribute a negation, ∧ must become ∨."],["鏡の広間の最奥で、番人が四枚の扉を指し示す。「この中には、術で開く本物の扉と、鏡が偽りを暴く扉が混じっている。見極めよ」。本物と見たなら術も使って開け、偽りと見たなら、それを暴く鏡を一枚見つけ出すのだ。","In the depths of the hall of mirrors, the guardian points to four doors. \"Among these are genuine doors the art can open, and doors whose falsehood a mirror exposes. Tell them apart.\" If you judge a door genuine, open it, using the art as well; if you judge it false, find a mirror that exposes it."],["四枚の扉の真偽を見極めると、番人は鏡の一枚を外し、奥の階段を示した。階段は二手に分かれている。一方は住人たちの住む街へ。もう一方の脇道（隠し層）の先では、術そのものが通じないという。","When you have judged the truth of the four doors, the guardian takes down one of the mirrors and shows you the stairs beyond. The stairs split in two. One way leads to the town where residents live. Down the other, a side path (the Hidden Level), the art itself does not work, it is said."],["最初の扉には ⟦0⟧。前の階層では術で開いた扉だ。だが術のない今、これを開ける道はあるのだろうか。今はまだ ⟦1⟧ とも ⟦2⟧ とも言えない――けれど、未来には ⟦3⟧ が分かるかもしれない。そんな塔を建てれば、この扉が術なしでは決して開かない魔法の扉だと示せる。","The first door reads ⟦0⟧ — a door you opened with the art on the previous level. But without the art, is there any way to open it? For now you can say neither ⟦1⟧ nor ⟦2⟧ — yet in the future, ⟦3⟧ might become known. Build such a tower, and you can show that this is a magic door that never opens without the art."],["一階では灯りがともらず、二階で ⟦0⟧ がともる塔。一階では ⟦1⟧ も ⟦2⟧ も光らなかった。術がなければ、排中律は決して開かない。排中律は、魔法の扉だったのだ。","A tower with no light on the ground floor, and ⟦0⟧ lit on the floor above. On the ground floor neither ⟦1⟧ nor ⟦2⟧ was lit. Without the art, the excluded middle never opens. It was a magic door."],["次の扉は ⟦0⟧。術があれば、魔導書の最初の部屋で開けた扉だ。「⟦1⟧ でないことはない」と分かっていても、今まさに ⟦2⟧ が分かっているとは限らない。さっき建てた塔を、もう一度思い出してみよう。","The next door is ⟦0⟧ — with the art, a door you opened in the grimoire's first room. Even if you know \"it is not the case that not ⟦1⟧\", it does not follow that ⟦2⟧ is known right now. Recall the tower you just built."],["同じ塔の一階では、⟦0⟧ は光るのに ⟦1⟧ は光らなかった。二重否定を外すのにも、術が要るのだ。","On the ground floor of the same tower, ⟦0⟧ was lit but ⟦1⟧ was not. Removing a double negation also needs the art."],["否定の印を一つも持たない扉が現れた。⟦0⟧――「パースの扉」と呼ばれるものだ。否定がないから術も要らない、と思うのは早い。この扉もまた、時の塔の上では魔法の扉の顔を見せる。","A door appears without a single negation sign. ⟦0⟧ — the one known as \"Peirce's door\". Do not be too quick to think that without negation no art is needed. This door, too, shows the face of a magic door on the tower of time."],["一階では何もともらず、二階で ⟦0⟧ だけがともる塔で、扉は一階で光らなかった。否定がなくても、術でしか開かない扉はある。","In a tower with nothing lit on the ground floor and only ⟦0⟧ lit on the floor above, the door was not lit on the ground floor. Even without negation, there are doors only the art can open."],["ド・モルガンの塔で開いた扉が、ここでは魔法の扉として立ちはだかる。鍵は ⟦0⟧、扉は ⟦1⟧。時の塔の階段は、枝分かれさせることもできる。ある未来では ⟦2⟧ が、別の未来では ⟦3⟧ が分かる――どちらの未来に進むかは、まだ決まっていない。","The door you opened in De Morgan's Tower stands before you here as a magic door. The key is ⟦0⟧, the door ⟦1⟧. The stairs of the tower of time can also branch. In one future ⟦2⟧ becomes known, in another ⟦3⟧ — and which future you will go to is not yet decided."],["二つに枝分かれした塔の根元では、⟦0⟧ と ⟦1⟧ が両方ともる未来はないのに、⟦2⟧ も ⟦3⟧ も光らなかった。未来が決まっていなければ、「どちらかが成り立たない」とは言えない。","At the base of the tower branching in two, there was no future where both ⟦0⟧ and ⟦1⟧ were lit, yet neither ⟦2⟧ nor ⟦3⟧ was lit. If the future is not decided, you cannot say \"one of them fails\"."],["術の届かない階層の最奥。番人が三枚の扉を示して言う。「術なしで開く扉と、術なしでは決して開かない魔法の扉を見極めよ。前の階層で正しかった扉が、ここでは魔法の扉かもしれぬ」。術なしで開くと見たなら開け、魔法の扉と見たなら時の塔でそれを示すのだ。","The depths of the level the art cannot reach. The guardian shows three doors and says, \"Tell the doors that open without the art from the magic doors that never open without it. A door that was valid on the previous level may be a magic door here.\" If you judge a door to open without the art, open it; if you judge it a magic door, show it with the tower of time."],["三枚の扉を見極めると、番人は時の塔の鍵をあなたに託した。脇道はここまで。元の階段に戻れば、住人たちの住む街が広がっている。","When you have judged the three doors, the guardian entrusts you with the key to the tower of time. The side path ends here. Go back to the stairs, and the town where residents live spreads out before you."],["街の最初の扉には ⟦0⟧。「すべての住人は ⟦1⟧」という意味だ。手元の鍵は ⟦2⟧――「すべての住人は ⟦3⟧ であり、⟦4⟧ でもある」。扉の ∀ に触れると、名前のない住人 ⟦5⟧ を連れて部屋に入れる。⟦6⟧ が誰であっても成り立つことを示せば、全員について示したことになる。","The first door of the town reads ⟦0⟧, meaning \"every resident is ⟦1⟧\". The key in your hand is ⟦2⟧: \"every resident is ⟦3⟧ and also ⟦4⟧\". Touch the door's ∀, and you can enter a room with a nameless resident ⟦5⟧. Show that it holds whoever ⟦6⟧ is, and you have shown it for everyone."],["鍵の ∀ に ⟦0⟧ を当てはめ、束ねられた ⟦1⟧ を取り出すと、扉は静かに開いた。名前のない一人について示せたなら、それは全員について示せたのと同じことだ。","You instantiate the key's ∀ with ⟦0⟧ and take out the bundled ⟦1⟧, and the door quietly opens. If you can show it for one nameless resident, you have shown it for everyone."],["扉に刻まれているのは ⟦0⟧。左と右で違うのは、⟦1⟧ と ⟦2⟧ という文字だけだ。住人に呼び名を付けるとき、⟦3⟧ と呼ぼうが ⟦4⟧ と呼ぼうが、指しているものは変わらない――それを確かめる扉らしい。","The door is carved with ⟦0⟧. The left and right differ only in the letters ⟦1⟧ and ⟦2⟧. Whether you call a resident ⟦3⟧ or ⟦4⟧, what you point to does not change — this door, it seems, is here to confirm that."],["⟦0⟧ と呼んでも ⟦1⟧ と呼んでも、住人 ⟦2⟧ は ⟦3⟧ のままだった。束縛された変数の名前は、意味を変えない。","Whether called ⟦0⟧ or ⟦1⟧, resident ⟦2⟧ remained ⟦3⟧. The name of a bound variable does not change the meaning."],["掲示板に二枚の札が貼られている。「すべての住人は、⟦0⟧ ならば ⟦1⟧」「すべての住人は ⟦2⟧」。扉には ⟦3⟧。部屋に連れてきた住人 ⟦4⟧ に、二枚の札を両方とも当てはめてみよう。∀ の鍵は、同じ住人に何度でも使える。","Two notices are posted on a board: \"every resident, if ⟦0⟧, is ⟦1⟧\" and \"every resident is ⟦2⟧\". The door reads ⟦3⟧. Apply both notices to the resident ⟦4⟧ you have brought into the room. A ∀ key can be used on the same resident any number of times."],["⟦0⟧ は ⟦1⟧ であり、⟦2⟧ ならば ⟦3⟧。二枚の札が同じ住人の上で重なり、扉が開いた。","⟦0⟧ is ⟦1⟧, and if ⟦2⟧ then ⟦3⟧. The two notices overlap on the same resident, and the door opens."],["広場の古い石碑に、二行の文が刻まれている。「すべての ⟦0⟧ は ⟦1⟧ である」「すべての ⟦2⟧ は ⟦3⟧ である」。そして扉には「すべての ⟦4⟧ は ⟦5⟧ である」。遠い昔の賢者が説いた三段論法だ。名前のない住人 ⟦6⟧ を連れて、その道筋をたどってみよう。","On an old stone monument in the square, two lines are carved: \"every ⟦0⟧ is ⟦1⟧\" and \"every ⟦2⟧ is ⟦3⟧\". And the door says \"every ⟦4⟧ is ⟦5⟧\". It is the syllogism taught by a sage of long ago. Bring along a nameless resident ⟦6⟧ and follow its path."],["⟦0⟧ が ⟦1⟧ なら ⟦2⟧、⟦3⟧ なら ⟦4⟧。石碑の二行は、一人の住人の上でつながった。三段論法は、∀ と → の組み合わせだったのだ。","If ⟦0⟧ is ⟦1⟧ then ⟦2⟧, and if ⟦3⟧ then ⟦4⟧. The two lines of the monument join on a single resident. The syllogism was a combination of ∀ and →."],["この区画の札には ⟦0⟧。⟦1⟧ は住人に関わりのない命題――たとえば「今日は晴れている」のようなものだ。扉には ⟦2⟧。住人に関わらない条件なら、∀ の外へ出してもかまわないはずだ。","The notice in this quarter reads ⟦0⟧. ⟦1⟧ is a proposition that has nothing to do with residents — something like \"it is sunny today\". The door reads ⟦2⟧. A condition unrelated to residents should be movable outside the ∀."],["⟦0⟧ を持って部屋に入り、名前のない住人 ⟦1⟧ を連れてくると、札の ∀ は ⟦2⟧ の上で ⟦3⟧ になった。住人に関わらない ⟦4⟧ は、∀ の外へ出せる。","You enter a room holding ⟦0⟧ and bring a nameless resident ⟦1⟧, and the notice's ∀ becomes ⟦3⟧ for ⟦2⟧. ⟦4⟧, which has nothing to do with residents, can be moved outside the ∀."],["さっきとは逆向きの扉だ。鍵は ⟦0⟧、扉は ⟦1⟧。まず名前のない住人 ⟦2⟧ を連れて部屋に入り、次に ⟦3⟧ を持ってもう一つ奥の部屋へ。⟦4⟧ が手に入れば、鍵から ⟦5⟧ を引き出せる。","A door in the opposite direction from before. The key is ⟦0⟧, the door ⟦1⟧. First enter a room with a nameless resident ⟦2⟧, then go into a further room holding ⟦3⟧. Once you have ⟦4⟧, you can draw ⟦5⟧ out of the key."],["⟦0⟧ から引き出した ⟦1⟧ を ⟦2⟧ に当てはめると、扉が開いた。住人に関わらない ⟦3⟧ をまたいで、∀ は外へも内へも動かせる。","You apply the ⟦1⟧ drawn out of ⟦0⟧ to ⟦2⟧, and the door opens. Across ⟦3⟧, which has nothing to do with residents, ∀ can be moved both outward and inward."],["街の中心にある時計塔。その扉の前で、番人が言う。「すべての住人が ⟦0⟧ かつ ⟦1⟧ なら、すべての住人は ⟦2⟧ であり、すべての住人は ⟦3⟧ である。それを示せ」。∧ で分かれた二枚の扉の先では、それぞれ別の名前のない住人を連れて行くことになる。","The clock tower at the heart of the town. Before its door the guardian says, \"If every resident is ⟦0⟧ and ⟦1⟧, then every resident is ⟦2⟧, and every resident is ⟦3⟧. Show it.\" Beyond the two doors split by ∧, you will take a different nameless resident each."],["二枚の扉の先で、二人の名前のない住人 ⟦0⟧ と ⟦1⟧ が、それぞれの役目を果たした。時計塔の鐘が鳴り、街の奥の門が開く。","Beyond the two doors, two nameless residents, ⟦0⟧ and ⟦1⟧, each played their part. The clock tower's bell rings, and the gate at the back of the town opens."],["最初の扉には ⟦0⟧――「⟦1⟧ である住人がいる」。手元の鍵は ⟦2⟧。鍵の ∃ に触れると、⟦3⟧ と ⟦4⟧ を満たす「誰か」を部屋に連れて来られる。正体は分からないが、その誰かこそが、扉の求める証人になれるはずだ。","The first door reads ⟦0⟧ — \"there is a resident who is ⟦1⟧\". The key in your hand is ⟦2⟧. Touch the key's ∃, and you can bring into the room \"someone\" who satisfies ⟦3⟧ and ⟦4⟧. You do not know who they are, but that someone should be able to serve as the witness the door asks for."],["鍵が連れてきた誰か ⟦0⟧ を証人に立てると、扉は開いた。正体が分からなくても、証人としては十分だった。","You put forward the someone ⟦0⟧ brought by the key as the witness, and the door opened. Even without knowing who they were, they were good enough as a witness."],["掲示板には、住人 ⟦0⟧ と住人 ⟦1⟧ がどちらも ⟦2⟧ だと書かれている。扉は ⟦3⟧。証人は一人いれば足りる。⟦4⟧ を選んでも、⟦5⟧ を選んでもかまわない。ただし、これだけで「全員が ⟦6⟧」とは言えない――街には、⟦7⟧ でも ⟦8⟧ でもない住人もいるのだから。","The board says that resident ⟦0⟧ and resident ⟦1⟧ are both ⟦2⟧. The door reads ⟦3⟧. One witness is enough; you may choose ⟦4⟧ or ⟦5⟧. But this alone does not mean \"everyone is ⟦6⟧\" — for the town also has residents who are neither ⟦7⟧ nor ⟦8⟧."],["⟦0⟧ を証人に立てると、扉はあっさり開いた。存在を示すには、一人見つければ十分だ。","You put forward ⟦0⟧ as the witness, and the door opened easily. To show existence, finding one is enough."],["鍵は ⟦0⟧、扉は ⟦1⟧。⟦2⟧ は住人に関わらない命題だ。扉の ∃ でいきなり証人を選んでも、誰が ⟦3⟧ なのか分からなければ行き詰まる。まず鍵の ∃ から「誰か」を連れてきて、それから証人に立てるのが順序というものだ。","The key is ⟦0⟧, the door ⟦1⟧. ⟦2⟧ is a proposition unrelated to residents. If you choose a witness at the door's ∃ right away, you get stuck when you do not know who is ⟦3⟧. The proper order is to bring \"someone\" from the key's ∃ first, and then put them forward as the witness."],["鍵が連れてきた誰か ⟦0⟧ は ⟦1⟧ であり、⟦2⟧ も成り立っている。⟦3⟧ を証人に立てると、扉は開いた。証人を選ぶのは、相手が分かってからでいい。","The someone ⟦0⟧ brought by the key is ⟦1⟧, and ⟦2⟧ holds too. You put forward ⟦3⟧ as the witness, and the door opened. Choose the witness once you know who they are."],["今度は逆向きだ。鍵は ⟦0⟧、扉は ⟦1⟧。鍵から誰か ⟦2⟧ を連れてくれば、⟦3⟧ も、⟦4⟧ である住人の存在も、まとめて手に入るはずだ。","Now the opposite direction. The key is ⟦0⟧, the door ⟦1⟧. Bring someone ⟦2⟧ from the key, and you should get both ⟦3⟧ and the existence of a resident who is ⟦4⟧ at once."],["⟦0⟧ は ⟦1⟧ と ⟦2⟧ を携えていた。⟦3⟧ は ⟦4⟧ の扉へ、⟦5⟧ は ⟦6⟧ の証人へ。二枚の扉が続けて開いた。","⟦0⟧ carried ⟦1⟧ and ⟦2⟧. ⟦3⟧ went to the door of ⟦4⟧, and ⟦5⟧ became the witness for ⟦6⟧. The two doors opened one after the other."],["札には ⟦0⟧――「どの住人も、⟦1⟧ ならば ⟦2⟧」。⟦3⟧ は住人に関わらない命題だ。扉は ⟦4⟧。⟦5⟧ である住人がいると分かったら、その誰かに札を当てはめてみればよい。誰であっても、札は当てはまるのだから。","The notice reads ⟦0⟧ — \"every resident, if ⟦1⟧, then ⟦2⟧\". ⟦3⟧ is a proposition unrelated to residents. The door is ⟦4⟧. Once you know there is a resident who is ⟦5⟧, apply the notice to that someone. Whoever they are, the notice applies."],["⟦0⟧ である誰か ⟦1⟧ に札を当てはめると、⟦2⟧ が出てきた。誰であっても ⟦3⟧ が出るのなら、それが誰なのかを知る必要はない。","You apply the notice to someone ⟦1⟧ who is ⟦0⟧, and out comes ⟦2⟧. If ⟦3⟧ comes out whoever it is, there is no need to know who it is."],["逆向きの扉だ。鍵は ⟦0⟧、扉は ⟦1⟧。名前のない住人 ⟦2⟧ を連れて部屋に入り、⟦3⟧ が ⟦4⟧ だと仮定する。すると、⟦5⟧ 自身が「⟦6⟧ である住人がいる」ことの証人になる。","A door in the opposite direction. The key is ⟦0⟧, the door ⟦1⟧. Enter a room with a nameless resident ⟦2⟧ and suppose that ⟦3⟧ is ⟦4⟧. Then ⟦5⟧ itself becomes the witness that \"there is a resident who is ⟦6⟧\"."],["⟦0⟧ を証人に立てて ⟦1⟧ を作ると、鍵から ⟦2⟧ が出てきた。名前のない住人が、そのまま証人になれることもある。","You put forward ⟦0⟧ as the witness to make ⟦1⟧, and ⟦2⟧ came out of the key. Sometimes a nameless resident can serve directly as the witness."],["街の外れの古い屋敷。門の札には ⟦0⟧――「⟦1⟧ である住人はいない」。扉には ⟦2⟧――「どの住人も ⟦3⟧ ではない」。同じことを言っているように聞こえるが、示すには手順がいる。名前のない住人 ⟦4⟧ が ⟦5⟧ だと仮定すれば、札とぶつかって亀裂が開くだろう。","An old mansion on the edge of town. The notice on the gate reads ⟦0⟧ — \"there is no resident who is ⟦1⟧\". The door reads ⟦2⟧ — \"no resident is ⟦3⟧\". They sound as if they say the same thing, but showing it takes steps. Suppose the nameless resident ⟦4⟧ is ⟦5⟧, and it will collide with the notice and open a crack."],["⟦0⟧ が ⟦1⟧ なら、⟦2⟧ が証人となって ⟦3⟧ が生まれ、札と矛盾した。誰も ⟦4⟧ ではない――屋敷の扉は、そう告げて開いた。","If ⟦0⟧ were ⟦1⟧, then ⟦2⟧ would be a witness and ⟦3⟧ would arise, contradicting the notice. No one is ⟦4⟧ — so the mansion's door declared as it opened."],["扉の文字は ⟦0⟧、鍵は ⟦1⟧。量化子の並びが入れ替わっている。「ある一人 ⟦2⟧ が、全員と ⟦3⟧ の関係にある」なら、「誰にでも、⟦4⟧ の関係にある相手がいる」はずだ。ただし、証人を選ぶ順番を誤ると、扉は開かない。","The door's words are ⟦0⟧; the key is ⟦1⟧. The order of the quantifiers is swapped. If \"one person ⟦2⟧ stands in relation ⟦3⟧ to everyone\", then \"everyone has a partner in relation ⟦4⟧\". But if you choose the witness in the wrong order, the door will not open."],["鍵が連れてきた ⟦0⟧ を、名前のない住人 ⟦1⟧ の相手に選ぶと、扉は開いた。全員と関係する一人がいるなら、誰にとっても相手はいる。だが、その逆が言えるとは限らない。","You chose the ⟦0⟧ brought by the key as the partner of the nameless resident ⟦1⟧, and the door opened. If there is one who is related to everyone, everyone has a partner. But the converse need not hold."],["街の地下倉庫には、ネズミとネコが棲んでいる。番人が告げる。「すべてのネズミに恐れられているネコが、一匹いる。ならば、どのネズミにも、恐れているネコがいるはずだ。それを示せ」。⟦0⟧ は ⟦1⟧ がネズミ、⟦2⟧ は ⟦3⟧ がネコ、⟦4⟧ は ⟦5⟧ が ⟦6⟧ を恐れる、という意味だ。","In the town's underground storehouse live mice and cats. The guardian announces, \"There is one cat feared by every mouse. Then every mouse must have a cat it fears. Show it.\" ⟦0⟧ means ⟦1⟧ is a mouse, ⟦2⟧ means ⟦3⟧ is a cat, and ⟦4⟧ means ⟦5⟧ fears ⟦6⟧."],["倉庫の主のネコ ⟦0⟧ が、どのネズミにとっても恐れる相手だった。番人はうなずき、街の門の外へ続く道を指した。その先では、ふたたび魔導書の力が目を覚ますという。","The storehouse's master cat, ⟦0⟧, was the one every mouse feared. The guardian nods and points to the road beyond the town gate. Out there, it is said, the power of the grimoire awakens once more."],["島には床屋が一人いる。名は ⟦0⟧。島の掟にはこうある――「自分で髪を切らない住人の髪は、すべて ⟦1⟧ が切る」。では、⟦2⟧ 自身の髪は誰が切るのか。扉には ⟦3⟧、「⟦4⟧ は自分の髪を切る」。正面から確かめる手立てはない。術を唱えてみよう。","The island has a single barber, named ⟦0⟧. The island's law says: \"⟦1⟧ cuts the hair of every resident who does not cut their own hair.\" Then who cuts ⟦2⟧'s own hair? The door reads ⟦3⟧: \"⟦4⟧ cuts their own hair\". There is no way to check it head-on. Try casting the art."],["「⟦0⟧ は自分の髪を切らない」と仮定すると、掟によって ⟦1⟧ が ⟦2⟧ の髪を切ることになり、矛盾した。床屋は、自分の髪を自分で切っていたのだ。","Suppose \"⟦0⟧ does not cut their own hair\": then by the law ⟦1⟧ cuts ⟦2⟧'s hair, a contradiction. The barber did cut their own hair."],["島の古文書には ⟦0⟧――「⟦1⟧ でない住人はいない」と記されている。扉は ⟦2⟧。名前のない住人 ⟦3⟧ を連れてきても、⟦4⟧ が ⟦5⟧ だと直接示す手がかりはない。だが、⟦6⟧ が ⟦7⟧ でないと仮定すれば、⟦8⟧ こそが、古文書がいないと言う住人になってしまう。","An old document of the island records ⟦0⟧ — \"there is no resident who is not ⟦1⟧\". The door is ⟦2⟧. Even if you bring a nameless resident ⟦3⟧, there is no clue to show directly that ⟦4⟧ is ⟦5⟧. But suppose ⟦6⟧ is not ⟦7⟧, and ⟦8⟧ becomes exactly the resident the document says does not exist."],["⟦0⟧ でない ⟦1⟧ を証人に立てると、古文書と矛盾した。反例がどこにもいないなら、全員が ⟦2⟧ だ。","You put forward ⟦1⟧, who is not ⟦0⟧, as the witness, and it contradicted the document. If there is no counterexample anywhere, everyone is ⟦2⟧."],["扉には ⟦0⟧――「⟦1⟧ でない住人がいる」。手元の鍵は ⟦2⟧、「全員が ⟦3⟧ というわけではない」。数学でも頻繁に使われる推論だが、誰が ⟦4⟧ でないのか、手がかりはまったくない。証人を直接は差し出せない以上、術を重ねて道を開くしかない。","The door reads ⟦0⟧ — \"there is a resident who is not ⟦1⟧\". The key in your hand is ⟦2⟧: \"not everyone is ⟦3⟧\". An inference used constantly in mathematics too, yet there is no clue at all as to who is not ⟦4⟧. Since you cannot produce the witness directly, the only way is to open the road by casting the art again and again."],["二度唱えた術が、「⟦0⟧ でない住人がいないなら、全員が ⟦1⟧ になってしまう」という矛盾を暴いた。名指しはできなくても、そういう住人は確かにいる。","The art, cast twice, exposed the contradiction: \"if there were no resident who is not ⟦0⟧, everyone would be ⟦1⟧\". Even if you cannot name them, such a resident surely exists."],["鍵は ⟦0⟧――「どの住人も ⟦1⟧ でない、ということはない」。扉は ⟦2⟧。否定が二重に重なった鍵から、⟦3⟧ である住人の存在を引き出せというのだ。ここでも、証人は直接には見つからない。","The key is ⟦0⟧ — \"it is not the case that no resident is ⟦1⟧\". The door is ⟦2⟧. From a key with a doubled negation, you are to draw out the existence of a resident who is ⟦3⟧. Here too, the witness cannot be found directly."],["⟦0⟧ である住人がいないと仮定すると、どの住人も ⟦1⟧ でないことになり、鍵と矛盾した。否定の否定の奥に、証人の存在が隠れていた。","Suppose there is no resident who is ⟦0⟧: then no resident is ⟦1⟧, which contradicts the key. Behind the negation of a negation, the existence of a witness was hidden."],["島の掟には ⟦0⟧――「どの住人も、⟦1⟧ であるか、さもなくば ⟦2⟧」。⟦3⟧ は住人に関わらない命題だ。扉は ⟦4⟧。⟦5⟧ が成り立つかどうかで場合を分けられれば話は早いが、それには術の力が要る。","The island's law reads ⟦0⟧ — \"every resident is ⟦1⟧, or else ⟦2⟧\". ⟦3⟧ is a proposition unrelated to residents. The door is ⟦4⟧. If you could split into cases on whether ⟦5⟧ holds, it would be quick — but that takes the power of the art."],["⟦0⟧ が成り立たないなら全員が ⟦1⟧、成り立つなら ⟦2⟧。術によって場合が分かれ、扉は開いた。魔法なしでは、この扉は開かない。","If ⟦0⟧ fails, everyone is ⟦1⟧; if it holds, ⟦2⟧. The art split the cases, and the door opened. Without the spell, this door does not open."],["島の酒場で、老人が奇妙な話をする。「この酒場には、ある一人がいる。その者が飲むなら、全員が飲むのだ」。そんな都合のよい者がいるものか――そう思うが、扉には ⟦0⟧ と刻まれている。住人は少なくとも一人いる。証人を選び直すことを恐れずに、術を唱えよう。","In the island's tavern, an old man tells a strange tale: \"In this tavern there is a certain someone. If that one drinks, everyone drinks.\" Surely no one so convenient exists — so you think, but the door is carved with ⟦0⟧. There is at least one resident. Do not fear choosing the witness anew, and cast the art."],["全員が飲むなら誰を選んでもよく、飲まない者がいるならその者を選べばよい。老人は笑ってグラスを掲げた。古典論理の不思議な定理が、ここに開いた。","If everyone drinks, choose anyone; if someone does not, choose that one. The old man laughs and raises his glass. A strange theorem of classical logic has opened here."],["最初の作業台の札には、「⟦0⟧ である住人がいる」から「全員が ⟦1⟧」を導け、とある。だが、本当にそう言えるだろうか。住人が二人いて、片方だけが ⟦2⟧ の模型を作ってみよう。","The notice on the first workbench says: derive \"everyone is ⟦1⟧\" from \"there is a resident who is ⟦0⟧\". But can you really? Build a model with two residents, only one of whom is ⟦2⟧."],["住人 1 は ⟦0⟧、住人 2 は ⟦1⟧ でない模型の中で、鍵は真に、扉は偽になった。誰かがそうだからといって、全員がそうだとは限らない。","In the model where resident 1 is ⟦0⟧ and resident 2 is not ⟦1⟧, the key was true and the door false. That someone is so does not mean everyone is."],["次の札は、街の順序の扉によく似ている。鍵は ⟦0⟧、扉は ⟦1⟧。並びは同じ「∃∀ から ∀∃」だが、⟦2⟧ のどちらの席の変数を量化しているかが違う。わずかな違いが、扉の真偽を分けることがある。","The next notice closely resembles the town's door of order. The key is ⟦0⟧, the door ⟦1⟧. The order is the same, \"∃∀ to ∀∃\", but which seat of ⟦2⟧ the quantified variable occupies is different. A slight difference can decide whether a door is true or false."],["住人 1 は誰とでも ⟦0⟧ の関係にあるが、住人 2 には ⟦1⟧ の相手が一人もいない。そんな模型で、扉は偽になった。変数の位置ひとつで、意味は大きく変わる。","Resident 1 stands in relation ⟦0⟧ to everyone, but resident 2 has no partner at all in relation ⟦1⟧. In such a model, the door was false. The position of a single variable changes the meaning greatly."],["工房の奥に、地下倉庫の模型が置かれている。札には、「どのネズミにも、恐れるネコがいる」から「すべてのネズミに恐れられているネコがいる」を導け、とある。倉庫で開いた扉の、ちょうど逆向きだ。ネズミは少なくとも一匹いるという。","At the back of the workshop sits a model of the underground storehouse. The notice says: derive \"there is a cat feared by every mouse\" from \"every mouse has a cat it fears\" — exactly the opposite of the door you opened in the storehouse. There is at least one mouse, it says."],["二匹のネズミが、それぞれ別のネコを恐れる模型。どのネズミにも恐れる相手はいるが、全員に恐れられるネコはいなかった。逆向きの扉は、開かない扉だったのだ。","A model where two mice each fear a different cat. Every mouse had a cat to fear, but no cat was feared by all. The door in the opposite direction did not open."],["札には、「すべてのネズミは、すべてのネコを恐れる」から「あるネズミが、あるネコを恐れている」を導け、とある。ネコは少なくとも一匹いるという。一見もっともらしいが、「すべてのネズミは」という言葉は、ネズミがいることまでは約束していない。","The notice says: derive \"some mouse fears some cat\" from \"every mouse fears every cat\". There is at least one cat, it says. It seems plausible at first glance, but the words \"every mouse\" do not promise that there are any mice."],["ネコが一匹いて、ネズミは一匹もいない模型。「すべてのネズミは…」は、確かめる相手がいないまま真となり、扉は偽になった。","A model with one cat and no mice at all. \"Every mouse…\" became true with no one to check, and the door was false."],["工房の主である番人が、三枚の扉を並べる。「量化子の並びを入れ替えた扉、∀ を ∨ に配った扉。開く扉と開かない扉が混じっている。開くと見たなら開け、開かないと見たなら、模型の街でそれを暴け」。","The guardian, master of the workshop, lines up three doors. \"A door with its quantifiers swapped, a door that distributes ∀ over ∨. Doors that open and doors that do not are mixed. If you judge one to open, open it; if not, expose it with a model town.\""],["三枚の扉を見極めると、番人は工房の奥の扉を開けた。その先には、城壁で区切られた区画がいくつも連なる街が広がっている。","When you have judged the three doors, the guardian opens the door at the back of the workshop. Beyond it spreads a town of quarters divided by walls."],["親方が最初に示した扉には ⟦0⟧。「⟦1⟧ と ⟦2⟧ が等しいなら、⟦3⟧ と ⟦4⟧ も等しい」。当たり前に思えるが、この工房で使える技は二つだけだ。両辺がまったく同じなら、扉は開く。そして等式の鍵があれば、扉の中の式を書き換えられる。","The first door the master shows you reads ⟦0⟧: \"if ⟦1⟧ and ⟦2⟧ are equal, then ⟦3⟧ and ⟦4⟧ are equal\". It seems obvious, but only two techniques can be used in this forge. If both sides are exactly the same, the door opens. And with an equation key, you can rewrite the formula in the door."],["等式の鍵で書き換えると、扉の両辺は同じ形に揃い、そのまま開いた。親方はうなずき、最初の定理カード「等号の対称律」を手渡した。","Rewriting with the equation key, both sides of the door take the same shape, and it opens. The master nods and hands you the first theorem card, \"Symmetry of equality\"."],["次の扉は ⟦0⟧。二本の等式を、一本につなげよという。⟦1⟧ と ⟦2⟧ の鍵を手にしたら、扉の中のどこを書き換えれば、鍵と同じ形になるだろうか。","The next door is ⟦0⟧. You are to join two equations into one. With the keys ⟦1⟧ and ⟦2⟧ in hand, where in the door should you rewrite to match the shape of a key?"],["二本目の等式で扉を書き換えると、一本目の鍵がそのまま扉に合った。二枚目の定理カード「等号の推移律」が、カード入れに収まる。","Rewriting the door with the second equation, the first key fits the door exactly. The second theorem card, \"Transitivity of equality\", goes into your card case."],["炉の脇には、住人を別の住人に変える不思議な型がある。型 ⟦0⟧ に住人 ⟦1⟧ を流し込むと、住人 ⟦2⟧ ができあがる。扉には ⟦3⟧。等しい住人を同じ型に流し込めば、できあがるものも等しいはずだ。","Beside the forge is a strange mould that turns one resident into another. Pour resident ⟦1⟧ into mould ⟦0⟧,
