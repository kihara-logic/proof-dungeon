cope-note ⟦0⟧\"><b>Room of resident ⟦1⟧</b>: resident ⟦2⟧ exists only in the colored part of the proof tree (above the ∀I line). ⟦3⟧ does not appear in keys or doors outside it. This is the eigenvariable condition.</div>"],["⟦0⟧ の右の前提の上。住人 ⟦1⟧ もこの範囲の外には出られません","above the right premise of ⟦0⟧. Resident ⟦1⟧ cannot leave this range either"],["⟦0⟧ の⟦1⟧番目の前提の上。もう一方の条件分岐：世界 ⟦2⟧ の中では使えません","above premise ⟦1⟧ of ⟦0⟧. It cannot be used inside the other branch, world ⟦2⟧"],["⟦0⟧ の線より上","above the ⟦0⟧ line"],["<div class=\"scope-note ⟦0⟧\"><b>⟦1⟧</b>：仮定 [⟦2⟧]<sup class=\"sc\">⟦3⟧</sup> を使えるのは、証明図で色を付けた範囲（⟦4⟧）だけです。","<div class=\"scope-note ⟦0⟧\"><b>⟦1⟧</b>: the assumption [⟦2⟧]<sup class=\"sc\">⟦3⟧</sup> can be used only in the colored part of the proof tree (⟦4⟧). "],["いまの扉はこの範囲の中にあるので、この鍵を使えます。","The current door is inside this range, so this key can be used. "],["いまの扉はこの範囲の外にあるので、この鍵は使えません。","The current door is outside this range, so this key cannot be used. "],["証明図の中で ⟦0⟧ 回使われています。","It is used ⟦0⟧ times in the proof tree."],["まだ一度も使われていません。","It has not been used yet."],["鍵 ⟦0⟧ を選択中：","Key ⟦0⟧ selected: "],["緑に光っている扉や鍵をタップしてください。","Tap a door or key glowing green."],["この鍵を今すぐ使える場所はありません。","There is nowhere this key can be used right now."],["もう一度タップすると選択を解除します。","Tap again to deselect."],["鍵を扉や別の鍵へドラッグします（タップで鍵を選んでから、扉や鍵をタップしても同じです）。色の付いた ∧ や → はタップで使えます。部屋の名前や、いまいる世界のタブをタップすると、その仮定が使える範囲が証明図に表示されます。","Drag keys onto doors or other keys (or tap a key to select it, then tap a door or key). Tap a colored ∧ or → to use it. Tap a room name or the tab of the current world to show in the proof tree where its assumption can be used."],["補題の式を入力するか、候補から選んでください。","Type a lemma formula or choose a candidate."],["式を読み取れませんでした（⟦0⟧）。書き方の例を参考にしてください。","Could not read the formula (⟦0⟧). See the notation examples."],["項を入力してください（例：d + e、s(0)）。","Type a term (e.g. d + e, s(0))."],["集合は当てはめられません","Sets cannot be used here"],["項を読み取れませんでした。書き方の例：d + e、s(0)、a * b、f(a)。","Could not read the term. Examples: d + e, s(0), a * b, f(a)."],["住人 ⟦0⟧ の部屋を出ました。∀I の線が完成し、⟦1⟧ はもう登場しません（固有変数）。","You left the room of resident ⟦0⟧. The ∀I line is complete and ⟦1⟧ no longer appears (eigenvariable)."],["住人 ⟦0⟧ の部屋を出ました。仮定 [⟦1⟧]<sup>⟦2⟧</sup> は ∃E<sup>⟦3⟧</sup> で解除され、⟦4⟧ はもう登場しません。","You left the room of resident ⟦0⟧. The assumption [⟦1⟧]<sup>⟦2⟧</sup> is discharged by ∃E<sup>⟦3⟧</sup>, and ⟦4⟧ no longer appears."],["帰納法の部屋 ⟦0⟧ を出ました。帰納法の仮定 [⟦1⟧]<sup>⟦2⟧</sup> は解除され、住人 ⟦3⟧ はもう登場しません。","You left induction room ⟦0⟧. The induction hypothesis [⟦1⟧]<sup>⟦2⟧</sup> is discharged, and resident ⟦3⟧ no longer appears."],["補題の部屋 ⟦0⟧ を出ました。補題 [⟦1⟧]<sup>⟦2⟧</sup> を使う側の証明が完成しました。","You left lemma room ⟦0⟧. The part of the proof that uses the lemma [⟦1⟧]<sup>⟦2⟧</sup> is complete."],["魔法の部屋 ⟦0⟧ で矛盾を導き、背理法の魔法が完成しました。仮定 [⟦1⟧]<sup>⟦2⟧</sup> は RAA<sup>⟦3⟧</sup> で解除され、⟦4⟧ が示されました。","You derived a contradiction in spell room ⟦0⟧, completing the reductio spell. The assumption [⟦1⟧]<sup>⟦2⟧</sup> is discharged by RAA<sup>⟦3⟧</sup>, and ⟦4⟧ is shown."],["条件分岐：世界 ⟦0⟧ の扉をすべて開けました。仮定 [⟦1⟧]<sup>⟦2⟧</sup> は ∨E<sup>⟦3⟧</sup> で解除され、ここから先では使えません。","You opened every door of branch world ⟦0⟧. The assumption [⟦1⟧]<sup>⟦2⟧</sup> is discharged by ∨E<sup>⟦3⟧</sup> and cannot be used from here on."],["部屋 ⟦0⟧ を出ました。仮定 [⟦1⟧]<sup>⟦2⟧</sup> は →I<sup>⟦3⟧</sup> で解除され、ここから先では使えません。","You left room ⟦0⟧. The assumption [⟦1⟧]<sup>⟦2⟧</sup> is discharged by →I<sup>⟦3⟧</sup> and cannot be used from here on."],["扉の ⟦0⟧ をタップすると使えます。鍵を差し込むなら、先に鍵を選んでください。","Tap the ⟦0⟧ of the door to use it. To insert a key, select the key first."],["⊥ の扉は、矛盾する鍵の組から ⊥ を作るか、¬A の鍵を差し込んで開けます。先に鍵を選んでください。","Open a ⊥ door by making ⊥ from a contradictory pair of keys, or by inserting a ¬A key. Select a key first."],["先に鍵を選んでから、扉をタップしてください。","Select a key first, then tap the door."],["扉の ∨ をタップすると、左右どちらを示すかを選べます。鍵を差し込むなら、先に鍵を選んでください。","Tap the ∨ of the door to choose which side to show. To insert a key, select the key first."],["扉の ⟦0⟧ をタップすると分解できます。鍵を差し込むなら、先に鍵を選んでください。","Tap the ⟦0⟧ of the door to split it. To insert a key, select the key first."],["<span class=\"rp-lab\">完成</span>すべての扉が開き、証明図が完成しました（全 ⟦0⟧ 手）。","<span class=\"rp-lab\">Done</span>Every door is open and the proof tree is complete (⟦0⟧ moves in all)."],["<span class=\"rp-lab\">はじめ</span>結論 ⟦0⟧ だけの扉（⋮）から出発します。","<span class=\"rp-lab\">Start</span>We begin from a single door (⋮) holding only the conclusion ⟦0⟧."],["<span class=\"rp-lab\">第 ⟦0⟧ 手</span><span class=\"rule\">⟦1⟧</span><b>⟦2⟧</b><div class=\"rp-op\"><span class=\"rp-k\">操作</span>⟦3⟧</div>⟦4⟧","<span class=\"rp-lab\">Move ⟦0⟧</span><span class=\"rule\">⟦1⟧</span><b>⟦2⟧</b><div class=\"rp-op\"><span class=\"rp-k\">Move</span>⟦3⟧</div>⟦4⟧"],["<div class=\"rp-op\"><span class=\"rp-k\">証明図</span>⟦0⟧</div>","<div class=\"rp-op\"><span class=\"rp-k\">Proof tree</span>⟦0⟧</div>"],["⟦0⟧ / ⟦1⟧ 手（完成）","⟦0⟧ / ⟦1⟧ moves (done)"],["⟦0⟧ / ⟦1⟧ 手","⟦0⟧ / ⟦1⟧ moves"],["❚❚ 止める","❚❚ Pause"],["↻ はじめから再生","↻ Replay from the start"],["▶ 再生","▶ Play"],["結論が目標と一致しません","The conclusion does not match the goal"],["定理カード「⟦0⟧」を手に入れました。以降のステージで使えます。","You obtained the theorem card \"⟦0⟧\". You can use it in later stages."],["\n    <h2>脱出成功</h2>\n    ⟦0⟧\n    <p>⟦1⟧「⟦2⟧」のすべての扉を開けました。⟦3⟧</p>\n    <div class=\"score\"><span><b>⟦4⟧</b> 手</span><span class=\"par\">目安 ⟦5⟧ 手</span>⟦6⟧⟦7⟧</div>\n    ⟦8⟧\n    ⟦9⟧\n    <h3>完成した証明木</h3>\n    ⟦10⟧\n    <div class=\"ptw\"><div class=\"ptr\" id=\"rpTree\">⟦11⟧</div></div>\n    ⟦12⟧\n    <p class=\"note\">右肩の数字は仮定の番号です⟦13⟧。[ ]¹ で囲まれた仮定は、その番号の →I、∨E、RAA で解除された（部屋や世界を出るときに置いてきた）仮定です。</p>\n    ⟦14⟧\n    <p class=\"check⟦15⟧\">⟦16⟧</p>\n    <h3>操作と推論規則の対応</h3>\n    <ol class=\"log\">⟦17⟧</ol>\n    <div class=\"actions\">\n      <button class=\"btn\" type=\"button\" data-cmd=\"retry\">もう一度</button>\n      <button class=\"btn\" type=\"button\" data-cmd=\"map\">ステージ一覧</button>\n      ⟦18⟧\n    </div>","\n    <h2>Escaped!</h2>\n    ⟦0⟧\n    <p>You opened every door of ⟦1⟧ \"⟦2⟧\".⟦3⟧</p>\n    <div class=\"score\"><span><b>⟦4⟧</b> moves</span><span class=\"par\">Par ⟦5⟧ moves</span>⟦6⟧⟦7⟧</div>\n    ⟦8⟧\n    ⟦9⟧\n    <h3>The finished proof tree</h3>\n    ⟦10⟧\n    <div class=\"ptw\"><div class=\"ptr\" id=\"rpTree\">⟦11⟧</div></div>\n    ⟦12⟧\n    <p class=\"note\">The superscript numbers are assumption labels⟦13⟧. An assumption in [ ]¹ was discharged by the →I, ∨E or RAA with that number (left behind when you left the room or world).</p>\n    ⟦14⟧\n    <p class=\"check⟦15⟧\">⟦16⟧</p>\n    <h3>Moves and inference rules</h3>\n    <ol class=\"log\">⟦17⟧</ol>\n    <div class=\"actions\">\n      <button class=\"btn\" type=\"button\" data-cmd=\"retry\">Retry</button>\n      <button class=\"btn\" type=\"button\" data-cmd=\"map\">Stage list</button>\n      ⟦18⟧\n    </div>"],[" <button type=\"button\" class=\"btn small guide-again\" data-guide=\"clear\">クリア画面の案内</button>"," <button type=\"button\" class=\"btn small guide-again\" data-guide=\"clear\">Guide to this screen</button>"],["<span class=\"par\">あと ⟦0⟧ 手、縮められます</span>","<span class=\"par\">⟦0⟧ moves over par</span>"],["<span class=\"par\">背理法の魔法 ⟦0⟧ 回</span>","<span class=\"par\">Reductio spell ×⟦0⟧</span>"],["<p class=\"note\">使った定理カード：⟦0⟧</p>","<p class=\"note\">Theorem cards used: ⟦0⟧</p>"],["<div class=\"rp-ctrl\" role=\"group\" aria-label=\"証明の再生\">\n      <button type=\"button\" class=\"btn small\" data-rp=\"first\" aria-label=\"はじめへ\">⏮</button><button type=\"button\" class=\"btn small\" data-rp=\"prev\" aria-label=\"1 手戻る\">◀</button>\n      <button type=\"button\" class=\"btn small primary\" data-rp=\"play\" id=\"rpPlay\">▶ 再生</button>\n      <button type=\"button\" class=\"btn small\" data-rp=\"next\" aria-label=\"1 手進む\">▶</button><button type=\"button\" class=\"btn small\" data-rp=\"last\" aria-label=\"最後へ\">⏭</button>\n      <span class=\"rp-count\" id=\"rpCount\"></span>\n      <button type=\"button\" class=\"toggle\" data-rp=\"auto\" id=\"rpAuto\" aria-pressed=\"⟦0⟧\"><span class=\"sw-track\"><span class=\"sw-knob\"></span></span>クリア時に自動で再生</button></div>","<div class=\"rp-ctrl\" role=\"group\" aria-label=\"Replay the proof\">\n      <button type=\"button\" class=\"btn small\" data-rp=\"first\" aria-label=\"To the start\">⏮</button><button type=\"button\" class=\"btn small\" data-rp=\"prev\" aria-label=\"One move back\">◀</button>\n      <button type=\"button\" class=\"btn small primary\" data-rp=\"play\" id=\"rpPlay\">▶ Play</button>\n      <button type=\"button\" class=\"btn small\" data-rp=\"next\" aria-label=\"One move forward\">▶</button><button type=\"button\" class=\"btn small\" data-rp=\"last\" aria-label=\"To the end\">⏭</button>\n      <span class=\"rp-count\" id=\"rpCount\"></span>\n      <button type=\"button\" class=\"toggle\" data-rp=\"auto\" id=\"rpAuto\" aria-pressed=\"⟦0⟧\"><span class=\"sw-track\"><span class=\"sw-knob\"></span></span>Auto-play on clear</button></div>"],["（証明項の <span class=\"nm\">x</span> の添字と対応）"," (matching the subscripts of <span class=\"nm\">x</span> in the proof term)"],["<h3>証明項</h3><div class=\"term\">⟦0⟧</div>","<h3>Proof term</h3><div class=\"term\">⟦0⟧</div>"],["型検査に合格：⟦0⟧⊢ この項 : ⟦1⟧","Type check passed: ⟦0⟧⊢ this term : ⟦1⟧"],["証明の検査に合格：⟦0⟧⟦1⟧⊢ ⟦2⟧（すべての推論が規則どおりで、仮定の範囲も正しい）","Proof check passed: ⟦0⟧⟦1⟧⊢ ⟦2⟧ (every inference follows the rules and assumptions are used within their scopes)"],["検査に失敗：","Check failed: "],["<li data-rp-go=\"⟦0⟧\" title=\"この手まで再生する\"><span class=\"rule\">⟦1⟧</span>⟦2⟧</li>","<li data-rp-go=\"⟦0⟧\" title=\"Replay up to this move\"><span class=\"rule\">⟦1⟧</span>⟦2⟧</li>"],["<div class=\"door tut-door\" data-t=\"⟦0⟧\">⟦1⟧<div class=\"door-cap\">開けるべき扉</div><div class=\"door-f f\">⟦2⟧</div>⟦3⟧</div>","<div class=\"door tut-door\" data-t=\"⟦0⟧\">⟦1⟧<div class=\"door-cap\">Door to open</div><div class=\"door-f f\">⟦2⟧</div>⟦3⟧</div>"],["<div class=\"room scoped s⟦0⟧ tut-room\" data-t=\"room⟦1⟧\"><div class=\"room-head\"><span class=\"rpick s⟦2⟧\" data-t=\"rp⟦3⟧\"><span class=\"rdot\"></span><span class=\"rname\">⟦4⟧</span><span class=\"rsee\">範囲を見る</span></span></div><div class=\"keys\">⟦5⟧</div>⟦6⟧</div>","<div class=\"room scoped s⟦0⟧ tut-room\" data-t=\"room⟦1⟧\"><div class=\"room-head\"><span class=\"rpick s⟦2⟧\" data-t=\"rp⟦3⟧\"><span class=\"rdot\"></span><span class=\"rname\">⟦4⟧</span><span class=\"rsee\">show scope</span></span></div><div class=\"keys\">⟦5⟧</div>⟦6⟧</div>"],["<span class=\"resident s⟦0⟧\">⟦1⟧住人 ⟦2⟧</span>","<span class=\"resident s⟦0⟧\">⟦1⟧resident ⟦2⟧</span>"],["<div class=\"floor\" data-t=\"f⟦0⟧\"><div class=\"fl-head\"><span class=\"fl-name\">階 ⟦1⟧</span></div><div class=\"lamps\"><span class=\"lamp\" data-t=\"lamp⟦2⟧\"><i class=\"at\">P</i></span></div>⟦3⟧</div>","<div class=\"floor\" data-t=\"f⟦0⟧\"><div class=\"fl-head\"><span class=\"fl-name\">Floor ⟦1⟧</span></div><div class=\"lamps\"><span class=\"lamp\" data-t=\"lamp⟦2⟧\"><i class=\"at\">P</i></span></div>⟦3⟧</div>"],["<div class=\"fl-acts\"><span class=\"btn small\" data-t=\"add\">＋ 上の階</span></div>","<div class=\"fl-acts\"><span class=\"btn small\" data-t=\"add\">+ Floor above</span></div>"],["扉と鍵の基本","Doors and keys basics"],["扉の ∧ をタップ（∧I）","Tap the ∧ of a door (∧I)"],["扉の色の付いた結合子にマウスを重ねると、操作する前に、証明図がどう変わるかが点線で表示されます。タップすると操作が実行され、扉 P∧Q が二つの扉 P と Q に分かれます。","Hover over a colored connective on the door to see, as a dotted preview, how the proof tree will change. Tap to do it: door P∧Q splits into two doors P and Q."],["マウスを重ねる","Hover"],["タップ","Tap"],["鍵を扉へドラッグ","Drag a key onto a door"],["鍵を同じ形の扉へドラッグすると、扉が開きます。証明図では、⋮ がその仮定でふさがって、証明図の葉になります。","Drag a key onto a door of the same shape and the door opens. In the proof tree, the ⋮ is closed by that assumption and becomes a leaf."],["ドラッグ","Drag"],["脱出成功","Escaped!"],["タップで選んでからタップ","Tap to select, then tap"],["ドラッグの代わりに、鍵をタップして選び、続けて扉をタップしても同じです。鍵を選ぶと、その鍵を使える場所が緑に光ります。","Instead of dragging, you can tap a key to select it and then tap the door. When a key is selected, the places where it can be used glow green."],["鍵をタップ","Tap the key"],["扉をタップ","Tap the door"],["鍵の分解（∧E）","Taking a key apart (∧E)"],["鍵の ∧ をタップ","Tap the ∧ of a key"],["鍵の ∧ をタップすると、中身の二つの鍵が取り出されます（点線の鍵）。証明図では「手元の部品」として、仮定から下へ伸びる断片ができます。","Tap the ∧ of a key to take out the two keys inside (dotted keys). In the proof tree, a fragment growing down from the assumption appears as a \"part at hand\"."],["部屋に入る（→I）","Entering a room (→I)"],["扉の → をタップ","Tap the → of a door"],["扉 A→B の → をタップすると、A を鍵として持って新しい部屋に入り、扉は B になります。部屋の中では外の鍵も使えますが、部屋の鍵は外に持ち出せません。証明図では →I の線が引かれ、その上が部屋と同じ色の範囲になります。","Tap the → of door A→B to enter a new room holding A as a key; the door becomes B. Inside the room you can also use outer keys, but the room's keys cannot be taken out. In the proof tree, a →I line is drawn and the part above it gets the room's color."],["部屋 1","Room 1"],["部屋に入った","Entered the room"],["鍵穴（→E）","Keyholes (→E)"],["前向き：鍵を鍵に差し込む","Forward: a key into a key"],["鍵 A を鍵 A→B にドラッグすると、鍵 B が手に入ります（→E）。証明図には、手元の部品として →E の断片ができます。","Drag key A onto key A→B to get key B (→E). A →E fragment appears in the proof tree as a part at hand."],["後ろ向き：鍵を扉に差し込む","Backward: a key into a door"],["鍵 A→B を扉 B にドラッグすると、扉が A に付け替わります。扉が証明できない形に変わることもある、元に戻らない選択です。","Drag key A→B onto door B to replace the door with A. The door may turn into something unprovable, so this choice cannot be undone."],["部屋と証明図の範囲","Rooms and scopes in the proof tree"],["部屋の名前をタップ","Tap the room name"],["部屋の名前（または証明図の →I の番号）をタップすると、その部屋の仮定が使える範囲が証明図で強調されます。部屋のすべての扉を開けて外に出ると、その仮定は解除されます。","Tap a room name (or a →I number in the proof tree) to highlight where that room's assumption can be used. When you open every door of the room and leave, its assumption is discharged."],["範囲が強調される","The scope is highlighted"],["どちらかを示す（∨I）","Showing one side (∨I)"],["扉の ∨ をタップして左右を選ぶ","Tap the ∨ of the door and choose a side"],["扉 A∨B の ∨ をタップすると、左右どちらを示すかを選ぶ欄が開きます。選んだ側だけが新しい扉になります。元に戻らない選択なので、迷ったら先に他の操作を済ませましょう。","Tap the ∨ of door A∨B to open a picker for which side to show. Only the chosen side becomes the new door. This cannot be undone, so if unsure, do other moves first."],["どちらを示しますか？","Which side will you show?"],["<span class=\"btn small\" data-t=\"left\">左の ⟦0⟧ を示す</span><span class=\"btn small\">右の ⟦1⟧ を示す</span>","<span class=\"btn small\" data-t=\"left\">Show the left ⟦0⟧</span><span class=\"btn small\">Show the right ⟦1⟧</span>"],["左を選ぶ","Choose left"],["条件分岐（∨E）","Branching (∨E)"],["鍵の ∨ をタップ","Tap the ∨ of a key"],["鍵 A∨B の ∨ をタップすると、「A の場合」と「B の場合」の二つの世界に分かれます。両方の世界で同じ扉を開ければ、元の扉が開きます。使っても損をしない操作です。","Tap the ∨ of key A∨B to split into two worlds: \"the case A\" and \"the case B\". Open the same door in both worlds and the original door opens. This move never hurts."],["<div class=\"room scoped s1 tut-room\"><div class=\"room-head\"><span class=\"rname\">条件分岐</span><span>鍵 ⟦0⟧</span><div class=\"worlds\"><span class=\"wtab s1 on\"><span class=\"rdot\"></span><span class=\"wname\">世界 1</span>：⟦1⟧ の場合<span class=\"wst\">いまここ</span></span><span class=\"wtab s2\"><span class=\"rdot\"></span><span class=\"wname\">世界 2</span>：⟦2⟧ の場合</span></div></div><div class=\"keys\">⟦3⟧</div>⟦4⟧</div>","<div class=\"room scoped s1 tut-room\"><div class=\"room-head\"><span class=\"rname\">Branching</span><span>key ⟦0⟧</span><div class=\"worlds\"><span class=\"wtab s1 on\"><span class=\"rdot\"></span><span class=\"wname\">World 1</span>: case ⟦1⟧<span class=\"wst\">you are here</span></span><span class=\"wtab s2\"><span class=\"rdot\"></span><span class=\"wname\">World 2</span>: case ⟦2⟧</span></div></div><div class=\"keys\">⟦3⟧</div>⟦4⟧</div>"],["ランタン","Lantern"],["ランタンで照らす","Light the lantern"],["扉の見出しのランタンを押すと、いま開いているすべての扉について、出口がある（証明できる）か、行き止まりかが分かります。1 つのステージで 3 回まで使えます。","Press the lantern in the door header to find out, for every open door, whether it has an exit (is provable) or is a dead end. Up to 3 times per stage."],["<div><span class=\"btn small lantern\" data-t=\"lan\">⟦0⟧ランタン（残り 3）</span></div><div class=\"tut-doors\" data-t=\"doors\">⟦1⟧⟦2⟧</div>","<div><span class=\"btn small lantern\" data-t=\"lan\">⟦0⟧Lantern (3 left)</span></div><div class=\"tut-doors\" data-t=\"doors\">⟦1⟧⟦2⟧</div>"],["押す","Press"],["<div class=\"lit-box ok\">出口あり</div>","<div class=\"lit-box ok\">has an exit</div>"],["<div class=\"lit-box dead\">行き止まり</div>","<div class=\"lit-box dead\">dead end</div>"],["矛盾 ⊥（⊥E）","Contradiction ⊥ (⊥E)"],["⊥ の鍵を作って使う","Make and use a ⊥ key"],["⊥ は矛盾を表します。鍵 A と鍵 A→⊥ を組み合わせると ⊥ の鍵ができます。⊥ の鍵はどの扉にも差し込めます（⊥E、爆発律）。","⊥ stands for a contradiction. Combining key A with key A→⊥ gives the ⊥ key. The ⊥ key fits any door (⊥E, ex falso)."],["⊥ の鍵は、どの扉にも合う","The ⊥ key fits any door"],["扉を ⊥ に切り替える","Switch the door to ⊥"],["扉の「⊥ を目指す」を押すと、扉そのものが ⊥ に変わります（これも ⊥E）。矛盾を導ければ、元の扉が開きます。","Press \"Aim for ⊥\" on a door to turn the door itself into ⊥ (this is ⊥E too). Derive a contradiction, and the original door opens."],["<div class=\"door-actions\"><span class=\"btn small exf\" data-t=\"exf\">⊥ を目指す（⊥E）</span></div>","<div class=\"door-actions\"><span class=\"btn small exf\" data-t=\"exf\">Aim for ⊥ (⊥E)</span></div>"],["¬A は A→⊥","¬A is A→⊥"],["¬A は A→⊥ の略記です。扉 ¬A の ¬ をタップすると、A を持って部屋に入り、⊥ を目指します（→I）。鍵 ¬A は、A を差し込むと ⊥ が出てくる鍵です。","¬A is short for A→⊥. Tap the ¬ of door ¬A to enter a room holding A and aim for ⊥ (→I). Key ¬A is a key that produces ⊥ when you insert A."],["Kripke 模型（反証）","Kripke models (refutation)"],["階を足して灯りを点ける","Add floors and turn on lights"],["「＋ 上の階」で未来の階を足し、各階の灯りのボタンで原子命題を点けます。下の階で点けた灯りは、上の階でも点いたままです。仮定がすべて光り、目標が光らない階ができれば反例です。","Add future floors with \"+ Floor above\" and turn on atomic propositions with each floor's light buttons. A light turned on at a lower floor stays on at the floors above. A floor where all assumptions are lit and the goal is not is a counterexample."],["階 0 で光る","lit at floor 0"],["＋ 上の階","+ Floor above"],["階 1 の灯りを点ける","Turn on a light at floor 1"],["階 0 で光らない（反例）","not lit at floor 0 (counterexample)"],["魔法を唱える","Cast the spell"],["扉 A の「背理法の魔法」を押すと、「A でない」（¬A）を鍵として持って魔法の部屋に入り、矛盾 ⊥ を目指します。矛盾を導けば、A が示されます。","Press \"Reductio spell\" on door A to enter a spell room holding \"not A\" (¬A) as a key and aim for the contradiction ⊥. Derive a contradiction, and A is shown."],["<div class=\"door-actions\"><span class=\"btn small raa\" data-t=\"raa\">⟦0⟧背理法の魔法（RAA）</span></div>","<div class=\"door-actions\"><span class=\"btn small raa\" data-t=\"raa\">⟦0⟧Reductio spell (RAA)</span></div>"],["⟦0⟧魔法の部屋 1","⟦0⟧Spell room 1"],["真理値の割り当て（反例）","Truth assignments (counterexamples)"],["真偽を決めていく","Deciding truth values"],["誤りの式は、仮定がすべて真で目標が偽になる真理値の割り当てで反証します。原子命題のボタンは最初は未定で、押すたびに 偽 → 真 → 偽 … と変わります。真偽が決まると、右の図で、原子命題から式全体へと順に真偽が決まっていきます。","An invalid formula is refuted by a truth assignment that makes all assumptions true and the goal false. The buttons for atomic propositions start unknown; each press changes them false → true → false …. As values are decided, the diagram on the right settles truth values from the atoms up to the whole formula."],["<div class=\"tut-plan\" data-t=\"plan\"><div class=\"assign\"><div class=\"pred-h\">真理値の割り当て</div><div class=\"lamps\">⟦0⟧⟦1⟧</div></div></div><div class=\"tut-proof tut-ev\" data-t=\"proof\">⟦2⟧</div>","<div class=\"tut-plan\" data-t=\"plan\"><div class=\"assign\"><div class=\"pred-h\">Truth assignment</div><div class=\"lamps\">⟦0⟧⟦1⟧</div></div></div><div class=\"tut-proof tut-ev\" data-t=\"proof\">⟦2⟧</div>"],["P を押す（未定 → 偽）","Press P (unknown → false)"],["Q を押す（未定 → 偽）","Press Q (unknown → false)"],["もう一度押す（偽 → 真）","Press again (false → true)"],["式全体が偽になった（反例）","The whole formula is false (counterexample)"],["全称 ∀（∀I・∀E）","Universal ∀ (∀I, ∀E)"],["扉の ∀ をタップ（∀I）","Tap the ∀ of a door (∀I)"],["扉 ∀x A(x) の ∀ をタップすると、任意の住人 a を連れて新しい部屋に入り、扉は A(a) になります。a は部屋の外に出られません（固有変数条件）。","Tap the ∀ of door ∀x A(x) to enter a new room with an arbitrary resident a; the door becomes A(a). a cannot leave the room (the eigenvariable condition)."],["住人 a の部屋","Room of resident a"],["鍵の ∀ をタップ（∀E）","Tap the ∀ of a key (∀E)"],["鍵 ∀x A(x) の ∀ をタップすると、当てはめる住人を選ぶ欄が開きます。住人を選ぶと、鍵 A(a) が手に入ります。","Tap the ∀ of key ∀x A(x) to open a picker for the resident to instantiate. Choose a resident and you get key A(a)."],["鍵 ⟦0⟧ の ⟦1⟧ に、誰を当てはめますか？","Whom will you put for ⟦1⟧ in key ⟦0⟧?"],["<span class=\"btn small\" data-t=\"pa\">住人 ⟦0⟧</span><span class=\"btn small\">やめる</span>","<span class=\"btn small\" data-t=\"pa\">resident ⟦0⟧</span><span class=\"btn small\">Cancel</span>"],["住人 a を選ぶ","Choose resident a"],["固有変数条件を確かめる","Checking the eigenvariable condition"],["扉の上の「名前を自分で選ぶ」をオンにすると、∀I と ∃E で住人の名前を自分で選びます。すでに鍵や扉に現れている名前を選ぶと、固有変数条件に反するので拒否され、問題の鍵が赤く光ります。","Turn on \"Choose names\" above the door to choose resident names yourself in ∀I and ∃E. A name that already appears in a key or door violates the eigenvariable condition, so it is rejected and the offending key glows red."],["どの住人を連れて部屋に入りますか？","Which resident will you bring into the room?"],["<span class=\"btn small\" data-t=\"na\">住人 ⟦0⟧</span><span class=\"btn small\" data-t=\"nb\">新しい名前（⟦1⟧）</span>","<span class=\"btn small\" data-t=\"na\">resident ⟦0⟧</span><span class=\"btn small\" data-t=\"nb\">New name (⟦1⟧)</span>"],["住人 a を選ぶと…","Choosing resident a…"],["鍵 P(a) に現れているので拒否","Rejected: it occurs in key P(a)"],["新しい名前を選ぶ","Choose a new name"],["住人 b の部屋","Room of resident b"],["存在 ∃（∃E・∃I）","Existential ∃ (∃E, ∃I)"],["鍵の ∃ をタップ（∃E）","Tap the ∃ of a key (∃E)"],["鍵 ∃x A(x) の ∃ をタップすると、A を満たす「名前の分からない誰か」a を連れて部屋に入ります。a は部屋の外に出られません。","Tap the ∃ of key ∃x A(x) to enter a room with \"someone whose name we don't know\", a, who satisfies A. a cannot leave the room."],["扉の ∃ をタップ（∃I）","Tap the ∃ of a door (∃I)"],["扉 ∃x A(x) の ∃ をタップして、証人となる住人を選びます。選んだ住人について A を示せば開きます。元に戻らない選択なので、証人になれる住人を先に連れてきましょう。","Tap the ∃ of door ∃x A(x) and choose a resident as the witness. Show A for that resident and the door opens. This cannot be undone, so bring in a resident who can be the witness first."],["証人として、誰を選びますか？","Whom will you choose as the witness?"],["<span class=\"btn small\" data-t=\"pa\">住人 ⟦0⟧</span><span class=\"btn small\">新しい住人を呼ぶ</span>","<span class=\"btn small\" data-t=\"pa\">resident ⟦0⟧</span><span class=\"btn small\">Call a new resident</span>"],["構造（一階述語論理の反例）","Structures (first-order counterexamples)"],["住人と表を決める","Deciding residents and tables"],["誤りの式は、住人と述語の表からなる構造で反証します。表のボタンは最初は未定で、押すたびに 偽 → 真 → 偽 … と変わります。右の図では、∀・∃ が住人ごとに枝分かれして、式の真偽が決まっていきます。","An invalid formula is refuted by a structure made of residents and predicate tables. Table buttons start unknown; each press changes them false → true → false …. In the diagram on the right, ∀ and ∃ branch for each resident as truth values are settled."],["<div class=\"tut-plan\" data-t=\"plan\"><div class=\"dom-row\">⟦0⟧⟦1⟧</div><div class=\"pred\"><div class=\"pred-h f\"><i class=\"at\">R</i>(<i class=\"tm\">x</i>,<i class=\"tm\">y</i>)</div><table class=\"rel\"><tr><th>x ＼ y</th><th>1</th><th>2</th></tr><tr><th>1</th><td>⟦2⟧</td><td>⟦3⟧</td></tr><tr><th>2</th><td>⟦4⟧</td><td>⟦5⟧</td></tr></table></div></div><div class=\"tut-proof tut-ev\" data-t=\"proof\">⟦6⟧</div>","<div class=\"tut-plan\" data-t=\"plan\"><div class=\"dom-row\">⟦0⟧⟦1⟧</div><div class=\"pred\"><div class=\"pred-h f\"><i class=\"at\">R</i>(<i class=\"tm\">x</i>,<i class=\"tm\">y</i>)</div><table class=\"rel\"><tr><th>x \\ y</th><th>1</th><th>2</th></tr><tr><th>1</th><td>⟦2⟧</td><td>⟦3⟧</td></tr><tr><th>2</th><td>⟦4⟧</td><td>⟦5⟧</td></tr></table></div></div><div class=\"tut-proof tut-ev\" data-t=\"proof\">⟦6⟧</div>"],["(1,1) を 2 回押して真に","Press (1,1) twice to make it true"],["(2,2) も真に","(2,2) true as well"],["残りは 1 回押して偽に","Press the rest once to make them false"],["量化子の順序で真偽が分かれる","The order of quantifiers makes the difference"],["等号（=I・=E）","Equality (=I, =E)"],["等式の鍵で書き換える","Rewriting with an equation key"],["等式の鍵 s = t を扉に差し込むと、扉の中の t が s に書き換わります（=E）。両辺が同じ項になった扉は、= をタップすると開きます（=I）。","Insert an equation key s = t into a door to rewrite t in the door to s (=E). A door whose two sides have become the same term opens when you tap = (=I)."],["= をタップ","Tap ="],["書き換える場所を選ぶ","Choosing where to rewrite"],["書き換えられる場所が複数あるときは、式の中の項がボタンになった欄が開きます。書き換えたいものだけを選んで「書き換える」を押します。","When there are several places to rewrite, a picker opens in which the terms of the formula are buttons. Select only the ones you want and press \"Rewrite\"."],["扉の中の ⟦0⟧ のうち、⟦1⟧ に書き換えるものを選んでください","Among the occurrences of ⟦0⟧ in the door, choose those to rewrite to ⟦1⟧"],["<div class=\"rew-f f\"><i class=\"fn\">f</i>(<span class=\"occ on\" data-t=\"o0\">⟦0⟧</span>)<span class=\"op\">=</span><span class=\"occ on\">⟦1⟧</span></div><span class=\"btn small primary\" data-t=\"go\">書き換える</span><span class=\"btn small\">やめる</span>","<div class=\"rew-f f\"><i class=\"fn\">f</i>(<span class=\"occ on\" data-t=\"o0\">⟦0⟧</span>)<span class=\"op\">=</span><span class=\"occ on\">⟦1⟧</span></div><span class=\"btn small primary\" data-t=\"go\">Rewrite</span><span class=\"btn small\">Cancel</span>"],["一つ目を外す","Deselect the first one"],["書き換える","Rewrite"],["定理カードを使う","Using theorem cards"],["以前に証明した定理は、定理カードとして入口の広間に置かれます。カードの ∀ に住人を当てはめれば、普通の鍵と同じように使えます。","Theorems proved earlier are placed in the entrance hall as theorem cards. Instantiate a card's ∀ with residents and use it like an ordinary key."],["カードの ∀ をタップ","Tap the ∀ of the card"],["誰を当てはめますか？","Whom will you put in?"],["<span class=\"btn small\" data-t=\"pc\">住人 ⟦0⟧</span><span class=\"btn small\">住人 ⟦1⟧</span>","<span class=\"btn small\" data-t=\"pc\">resident ⟦0⟧</span><span class=\"btn small\">resident ⟦1⟧</span>"],["住人 c を選ぶ","Choose resident c"],["もう一度当てはめると c = b → b = c","One more instantiation gives c = b → b = c"],["よく知られた構造を読み込む","Loading well-known structures"],["反例に大きな構造が必要なときは、構造の欄の「既製の構造」から、よく知られた群や順序を読み込めます。読み込んだ構造は、表のボタンで自由に書き換えられます。読み込む前の構造には「戻す」で戻れます。","When a counterexample needs a large structure, load well-known groups or orders from \"Preset structures\" in the structure panel. You can freely edit the loaded structure with the table buttons, and \"Undo\" brings back the structure before loading."],["<div class=\"tut-plan\" data-t=\"plan\"><div><span class=\"btn small\" data-t=\"open\">既製の構造</span></div><div data-t=\"panel\"></div><div class=\"pred\" data-t=\"tbl\"><div class=\"pred-h f\"><i class=\"tm\">x</i><span class=\"op\">·</span><i class=\"tm\">y</i> の表</div><div class=\"note\">住人 2 人（表はまだ未定）</div></div></div><div class=\"tut-proof tut-ev\" data-t=\"proof\">⟦0⟧</div>","<div class=\"tut-plan\" data-t=\"plan\"><div><span class=\"btn small\" data-t=\"open\">Preset structures</span></div><div data-t=\"panel\"></div><div class=\"pred\" data-t=\"tbl\"><div class=\"pred-h f\">Table of <i class=\"tm\">x</i><span class=\"op\">·</span><i class=\"tm\">y</i></div><div class=\"note\">2 residents (tables still unknown)</div></div></div><div class=\"tut-proof tut-ev\" data-t=\"proof\">⟦0⟧</div>"],["既製の構造を開く","Open preset structures"],["<div class=\"preset-panel\"><div class=\"preset\"><div class=\"pr-name\">3 人の巡回群 ℤ/3</div><span class=\"btn small primary\">読み込む</span></div><div class=\"preset\"><div class=\"pr-name\">3 次対称群 S₃<span class=\"pr-n\">住人 6 人</span></div><span class=\"btn small primary\" data-t=\"load\">読み込む</span></div></div>","<div class=\"preset-panel\"><div class=\"preset\"><div class=\"pr-name\">Cyclic group ℤ/3 (3 residents)</div><span class=\"btn small primary\">Load</span></div><div class=\"preset\"><div class=\"pr-name\">Symmetric group S₃<span class=\"pr-n\">6 residents</span></div><span class=\"btn small primary\" data-t=\"load\">Load</span></div></div>"],["S₃ を読み込む","Load S₃"],["<div class=\"pred-h f\"><i class=\"tm\">x</i><span class=\"op\">·</span><i class=\"tm\">y</i> の表</div><div class=\"note\">住人 6 人の積の表が読み込まれた（2·5 = 4、5·2 = 3 など）</div>","<div class=\"pred-h f\">Table of <i class=\"tm\">x</i><span class=\"op\">·</span><i class=\"tm\">y</i></div><div class=\"note\">The multiplication table of 6 residents is loaded (2·5 = 4, 5·2 = 3, and so on)</div>"],["可換律が偽になった（反例）","Commutativity is false (counterexample)"],["演算の表と定数","Operation tables and constants"],["表のボタンで演算を決める","Setting operations with the table buttons"],["演算や関数を含む構造では、積の表のような表で値を決めます。表のボタンは最初は ?（未定）で、押すたびに値が住人 1 → 2 → … と変わります。定数（e や 0 など）がどの住人を表すかも、ボタンで選びます。","In structures with operations or functions, values are set in tables such as a multiplication table. Table cells start as ? (unknown); each press changes the value to resident 1 → 2 → …. Which resident a constant (such as e or 0) denotes is also chosen with buttons."],["<div class=\"tut-plan\" data-t=\"plan\"><div class=\"pred\"><div class=\"pred-h f\">⟦0⟧ の解釈</div><div class=\"lamps\"><span class=\"lamp on\">住人 <b class=\"el\">1</b></span><span class=\"lamp\">住人 <b class=\"el\">2</b></span></div></div><div class=\"pred\"><div class=\"pred-h f\"><i class=\"tm\">x</i><span class=\"op\">·</span><i class=\"tm\">y</i> の表</div><table class=\"rel\"><tr><th>x ＼ y</th><th><b class=\"el\">1</b></th><th><b class=\"el\">2</b></th></tr><tr><th><b class=\"el\">1</b></th><td><span class=\"fcell unk\" data-t=\"f11\"><b class=\"el\">?</b></span></td><td><span class=\"fcell unk\" data-t=\"f12\"><b class=\"el\">?</b></span></td></tr><tr><th><b class=\"el\">2</b></th><td><span class=\"fcell unk\"><b class=\"el\">?</b></span></td><td><span class=\"fcell unk\"><b class=\"el\">?</b></span></td></tr></table></div></div><div class=\"tut-proof tut-ev\" data-t=\"proof\">⟦1⟧</div>","<div class=\"tut-plan\" data-t=\"plan\"><div class=\"pred\"><div class=\"pred-h f\">Interpretation of ⟦0⟧</div><div class=\"lamps\"><span class=\"lamp on\">resident <b class=\"el\">1</b></span><span class=\"lamp\">resident <b class=\"el\">2</b></span></div></div><div class=\"pred\"><div class=\"pred-h f\">Table of <i class=\"tm\">x</i><span class=\"op\">·</span><i class=\"tm\">y</i></div><table class=\"rel\"><tr><th>x \\ y</th><th><b class=\"el\">1</b></th><th><b class=\"el\">2</b></th></tr><tr><th><b class=\"el\">1</b></th><td><span class=\"fcell unk\" data-t=\"f11\"><b class=\"el\">?</b></span></td><td><span class=\"fcell unk\" data-t=\"f12\"><b class=\"el\">?</b></span></td></tr><tr><th><b class=\"el\">2</b></th><td><span class=\"fcell unk\"><b class=\"el\">?</b></span></td><td><span class=\"fcell unk\"><b class=\"el\">?</b></span></td></tr></table></div></div><div class=\"tut-proof tut-ev\" data-t=\"proof\">⟦1⟧</div>"],["1·1 の欄を押す（? → 1）","Press the 1·1 cell (? → 1)"],["1·2 の欄を押す（? → 1）","Press the 1·2 cell (? → 1)"],["もう一度押す（1 → 2）","Press again (1 → 2)"],["左単位元の公理が真になった","The left identity axiom is now true"],["≤ を定義どおりに展開する","Unfolding ≤ by its definition"],["⟦0⟧ では、x ≤ y を「x に何かを足すと y になる」、つまり ∃z(x + z = y) の略記として扱います。点線の ≤ をタップすると、定義どおりに展開されます。","In ⟦0⟧, x ≤ y is treated as short for \"adding something to x gives y\", that is, ∃z(x + z = y). Tap the dotted ≤ to unfold it by the definition."],["≤ をタップ","Tap ≤"],["∃ の扉になった","It became a ∃ door"],["入力欄に項を書く","Typing a term in the input box"],["∀ の鍵や ∃ の扉で住人を選ぶ欄の下に、項を書く入力欄があります。d + e のように、まだどこにも現れていない項も、書けば当てはめられます。","Below the resident picker for a ∀ key or a ∃ door there is an input box for terms. Even a term such as d + e that does not appear anywhere yet can be used if you type it."],["<span class=\"btn small\">住人 ⟦0⟧</span><span class=\"btn small\">住人 ⟦1⟧</span><div class=\"lem-input\"><span class=\"tut-input\" data-t=\"inp\"></span><span class=\"btn small primary\" data-t=\"go\">当てはめる</span></div>","<span class=\"btn small\">resident ⟦0⟧</span><span class=\"btn small\">resident ⟦1⟧</span><div class=\"lem-input\"><span class=\"tut-input\" data-t=\"inp\"></span><span class=\"btn small primary\" data-t=\"go\">Apply</span></div>"],["入力欄に d + e","Type d + e in the box"],["当てはめる","Apply"],["扉を出発点と推進に分ける","Splitting the door into base case and step"],["扉 ∀x A(x) の「帰納法」を押すと、扉が二つに分かれます。一つは出発点 A(0)、もう一つは帰納法の部屋の扉 A(s(a)) です。部屋では、任意の住人 a と、帰納法の仮定 A(a) が鍵として使えます。","Press \"Induction\" on door ∀x A(x) and the door splits in two: the base case A(0), and the door A(s(a)) in the induction room. In the room you can use an arbitrary resident a and the induction hypothesis A(a) as a key."],["<div class=\"door-actions\"><span class=\"btn small indb\" data-t=\"ind\">⟦0⟧帰納法</span></div>","<div class=\"door-actions\"><span class=\"btn small indb\" data-t=\"ind\">⟦0⟧Induction</span></div>"],["帰納法の部屋 1","Induction room 1"],["帰納法<sup class=\"sc s1\">1</sup>","Ind<sup class=\"sc s1\">1</sup>"],["出発点と推進の二つの扉","Two doors: base case and step"],["扉を補題で分ける","Splitting a door with a lemma"],["扉の「補題を立てる」を押して式を選ぶ（または自分で書く）と、扉が二つに分かれます。一つは補題そのものを証明する扉、もう一つは補題を鍵として使える部屋の扉です。証明図では、補題を使う側が →I でまとめられ、補題の証明と →E で合わさります。","Press \"State a lemma\" on a door and choose a formula (or write one), and the door splits in two: a door that proves the lemma itself, and the door of a room where the lemma can be used as a key. In the proof tree, the side that uses the lemma is collected by →I and combined with the lemma's proof by →E."],["<div class=\"door-actions\"><span class=\"btn small lem\" data-t=\"lem\">⟦0⟧補題を立てる</span></div>","<div class=\"door-actions\"><span class=\"btn small lem\" data-t=\"lem\">⟦0⟧State a lemma</span></div>"],["どんな補題を立てますか？","What lemma do you want to state?"],["補題を選ぶ","Choose the lemma"],["⟦0⟧補題の部屋 1","⟦0⟧Lemma room 1"],["補題の扉と、補題を使う扉","The lemma's door and the door that uses it"],["住人だけでなく項も選べる","Not only residents but also terms"],["∀ の鍵や ∃ の扉で選べるのは、住人の名前だけではありません。鍵や扉に現れている f(a) のような項も、そのまま当てはめられます。","A ∀ key or a ∃ door can take more than resident names. Terms such as f(a) that appear in keys or doors can be used directly."],["鍵の ∀ をタップ","Tap the ∀ of the key"],["<span class=\"btn small\">住人 ⟦0⟧</span><span class=\"btn small\">住人 ⟦1⟧</span><span class=\"btn small\" data-t=\"pfa\">項 ⟦2⟧</span><span class=\"btn small\">項 ⟦3⟧</span>","<span class=\"btn small\">resident ⟦0⟧</span><span class=\"btn small\">resident ⟦1⟧</span><span class=\"btn small\" data-t=\"pfa\">term ⟦2⟧</span><span class=\"btn small\">term ⟦3⟧</span>"],["項 f(a) を選ぶ","Choose the term f(a)"],["記号をタップして定義に戻す","Tap a symbol to go back to the definition"],["⊆、∩、∪、ᶜ は定義による略記です。扉や鍵の中の記号（点線の枠）をタップすると、定義どおりの式に書き直されます。証明図には「定義」の線が入ります。","⊆, ∩, ∪ and ᶜ are abbreviations by definition. Tap such a symbol (in a dotted frame) in a door or key to rewrite it into the defining formula. A \"Def\" line is added to the proof tree."],["⊆ をタップ","Tap ⊆"],["定義どおりに書き直された","Rewritten by the definition"],["鍵の記号も展開できる","Symbols in keys can be unfolded too"],["鍵 a ∈ A∩B の ∩ をタップすると、a ∈ A ∧ a ∈ B という鍵が手に入ります。","Tap the ∩ of key a ∈ A∩B to get the key a ∈ A ∧ a ∈ B."],["∩ をタップ","Tap ∩"],["等式を両方の向きに使う","Using equations both ways"],["逆向きの書き換え","Rewriting backwards"],["⟦0⟧ では、等式の鍵 s = t を、扉の中の s を t に書き換える向きにも使えます。両方の項が現れているときは、書き換えの欄の「向きを逆にする」で選べます。逆向きに使った分の対称律は、自動で証明図に入ります。","In ⟦0⟧, an equation key s = t can also be used in the direction that rewrites s in the door to t. When both terms appear, choose with \"Reverse the direction\" in the rewriting picker. The symmetry step for the backward use is added to the proof tree automatically."],["左辺が右辺の形に書き換わる","The left side is rewritten into the shape of the right side"],["\n    <h2>チュートリアル</h2>\n    ⟦0⟧\n    <h3>⟦1⟧⟦2⟧：⟦3⟧</h3>\n    <div class=\"tut-box\" id=\"tutBox\" aria-label=\"操作の動き\"></div>\n    <p class=\"tut-text\">⟦4⟧</p>\n    ⟦5⟧\n    <details class=\"tut-all\"><summary>すべてのチュートリアル</summary>⟦6⟧</details>\n    <div class=\"actions\"><button class=\"btn primary\" type=\"button\" data-cmd=\"close\">閉じる</button></div>","\n    <h2>Tutorial</h2>\n    ⟦0⟧\n    <h3>⟦1⟧⟦2⟧: ⟦3⟧</h3>\n    <div class=\"tut-box\" id=\"tutBox\" aria-label=\"The moves in action\"></div>\n    <p class=\"tut-text\">⟦4⟧</p>\n    ⟦5⟧\n    <details class=\"tut-all\"><summary>All tutorials</summary>⟦6⟧</details>\n    <div class=\"actions\"><button class=\"btn primary\" type=\"button\" data-cmd=\"close\">Close</button></div>"],["<div class=\"tut-here\"><span class=\"note\">この部屋で新しく登場：</span>⟦0⟧</div>","<div class=\"tut-here\"><span class=\"note\">New in this room: </span>⟦0⟧</div>"],["<div class=\"tut-here\"><span class=\"note\">この部屋に新しい操作はありません。直前に登場した操作：</span>⟦0⟧</div>","<div class=\"tut-here\"><span class=\"note\">No new moves in this room. Most recently introduced: </span>⟦0⟧</div>"],["<div class=\"tut-ctrl\"><button type=\"button\" class=\"btn small\" data-tutstep=\"prev\" ⟦0⟧>前へ</button><span class=\"tut-dots\">⟦1⟧</span><button type=\"button\" class=\"btn small\" data-tutstep=\"next\" ⟦2⟧>次へ</button></div>","<div class=\"tut-ctrl\"><button type=\"button\" class=\"btn small\" data-tutstep=\"prev\" ⟦0⟧>Back</button><span class=\"tut-dots\">⟦1⟧</span><button type=\"button\" class=\"btn small\" data-tutstep=\"next\" ⟦2⟧>Next</button></div>"],["画面の上の道具","Tools at the top"],["チュートリアル（操作の動きを見る）、ステージ一覧、戻す（1 手戻る。Z キーでも可）、最初から、遊び方。新しい操作が登場すると、チュートリアルに New が付きます。","Tutorial (see the moves in action), stage list, undo (one move back; the Z key also works), restart, and how to play. When a new move appears, the Tutorial button shows \"New\"."],["層の情報","Level information"],["層の名前と、目安の手数（お手本の解き方の手数）、これまでの記録です。","The level name, the par (the number of moves in the model solution), and your record."],["ステージの名前","Stage name"],["ステージの番号と名前です。層の最後はボスのステージです。","The stage number and name. The last stage of each level is the boss stage."],["証明したいシーケント","The sequent to prove"],["⊢ の左が仮定（最初から持っている鍵）、右が目標（開けるべき扉）です。⊬ の問題は「証明できないこと」を反例で示します。","Left of ⊢ are the assumptions (the keys you have from the start); right of it is the goal (the door to open). A ⊬ problem asks you to show \"not provable\" with a counterexample."],["この部屋の説明","About this room"],["新しい規則や考え方の説明です。▾ で開いたり閉じたりできます。","Explains new rules and ideas. Open and close it with ▾."],["扉の欄の見出し","Door panel header"],["扉の数と「次の扉を見る」、直前の推論、手数と目安の手数が並びます。","The number of doors and \"Next door\", the last inference, and your moves and the par."],["鍵","Keys"],["いま使える仮定や、導いた命題です。入口の広間には最初の鍵が、部屋の中にはその部屋で手に入れた鍵が置かれます。扉や別の鍵へドラッグするか、タップして選んでから使います。","The assumptions and derived propositions you can use now. The entrance hall holds the starting keys; a room holds the keys obtained in it. Drag them onto doors or other keys, or tap to select and then use them."],["開けるべき扉","Door to open"],["いまの目標です。色の付いた記号（∧、→ など）をタップすると、その記号の推論規則で扉が変わります。背理法の魔法などの特別な操作は、扉の下のボタンです。","The current goal. Tap a colored symbol (∧, →, …) and the door changes by that symbol's inference rule. Special moves such as the reductio spell are buttons below the door."],["証明図","Proof tree"],["操作するたびに、自然演繹の証明図が組み上がります。⋮ はまだ開いていない扉です。マウスを重ねると、操作する前に変化の見本が出ます。","Each move builds the natural deduction proof tree. ⋮ marks doors not yet opened. Hover over a symbol to preview the change before you act."],["ヒントと記録","Hints and log"],["ヒントは 1 段ずつ開けます。操作の記録には、これまでの操作と推論規則が並びます。","Hints open one step at a time. The move log lists your moves and the inference rules so far."],["<div class=\"hm\" id=\"hmMock\" aria-hidden=\"true\">\n    <div class=\"hm-r hm-top\" data-hm=\"0\"><b class=\"hm-logo\">Proof Dungeon</b><span class=\"hm-tools\"><i>チュートリアル</i><i>一覧</i><i>戻す</i><i>最初から</i><i>遊び方</i></span>⟦0⟧</div>\n    <div class=\"hm-r hm-meta\" data-hm=\"1\">第 1 層「仮定の部屋」　目安 3 手　未クリア⟦1⟧</div>\n    <div class=\"hm-r hm-title\" data-hm=\"2\"><b class=\"hm-id\">1-1</b> 二つの鍵⟦2⟧</div>\n    <div class=\"hm-r hm-seq\" data-hm=\"3\"><span class=\"f\">⟦3⟧, ⟦4⟧ <span class=\"turn\">⊢</span> ⟦5⟧</span>⟦6⟧</div>\n    <div class=\"hm-r hm-lesson\" data-hm=\"4\">▾ この部屋の説明　鍵を扉へ差し込むと…⟦7⟧</div>\n    <div class=\"hm-grid\">\n      <div class=\"hm-plan\">\n        <div class=\"hm-r hm-head\" data-hm=\"5\">扉 1 / 1　直前の推論　操作 0 手（目安 3）⟦8⟧</div>\n        <div class=\"hm-r hm-hall\" data-hm=\"6\"><div class=\"hm-cap\">● 入口の広間</div><div class=\"hm-keys\"><span class=\"hm-key f\">⟦9⟧</span><span class=\"hm-key f\">⟦10⟧</span></div>⟦11⟧</div>\n        <div class=\"hm-r hm-door\" data-hm=\"7\"><div class=\"hm-cap\">開けるべき扉</div><div class=\"f hm-df\">⟦12⟧<span class=\"hm-op\">∧</span>⟦13⟧</div>⟦14⟧</div>\n      </div>\n      <div class=\"hm-r hm-proof\" data-hm=\"8\"><div class=\"hm-cap\">証明図</div><div class=\"ptr\">⟦15⟧</div>⟦16⟧</div>\n    </div>\n    <div class=\"hm-r hm-aux\" data-hm=\"9\"><span>ヒント</span><span>操作の記録</span>⟦17⟧</div>\n  </div>","<div class=\"hm\" id=\"hmMock\" aria-hidden=\"true\">\n    <div class=\"hm-r hm-top\" data-hm=\"0\"><b class=\"hm-logo\">Proof Dungeon</b><span class=\"hm-tools\"><i>Tutorial</i><i>Stages</i><i>Undo</i><i>Restart</i><i>How to play</i></span>⟦0⟧</div>\n    <div class=\"hm-r hm-meta\" data-hm=\"1\">Level 1 \"Rooms of Assumption\"　Par 3 moves　Not cleared⟦1⟧</div>\n    <div class=\"hm-r hm-title\" data-hm=\"2\"><b class=\"hm-id\">1-1</b> Two keys⟦2⟧</div>\n    <div class=\"hm-r hm-seq\" data-hm=\"3\"><span class=\"f\">⟦3⟧, ⟦4⟧ <span class=\"turn\">⊢</span> ⟦5⟧</span>⟦6⟧</div>\n    <div class=\"hm-r hm-lesson\" data-hm=\"4\">▾ About this room　Insert a key into a door…⟦7⟧</div>\n    <div class=\"hm-grid\">\n      <div class=\"hm-plan\">\n        <div class=\"hm-r hm-head\" data-hm=\"5\">Door 1 / 1　Last inference　Moves 0 (par 3)⟦8⟧</div>\n        <div class=\"hm-r hm-hall\" data-hm=\"6\"><div class=\"hm-cap\">● Entrance hall</div><div class=\"hm-keys\"><span class=\"hm-key f\">⟦9⟧</span><span class=\"hm-key f\">⟦10⟧</span></div>⟦11⟧</div>\n        <div class=\"hm-r hm-door\" data-hm=\"7\"><div class=\"hm-cap\">Door to open</div><div class=\"f hm-df\">⟦12⟧<span class=\"hm-op\">∧</span>⟦13⟧</div>⟦14⟧</div>\n      </div>\n      <div class=\"hm-r hm-proof\" data-hm=\"8\"><div class=\"hm-cap\">Proof tree</div><div class=\"ptr\">⟦15⟧</div>⟦16⟧</div>\n    </div>\n    <div class=\"hm-r hm-aux\" data-hm=\"9\"><span>Hints</span><span>Move log</span>⟦17⟧</div>\n  </div>"],["<div class=\"help-anim\"><div class=\"tut-box\" id=\"helpAnim\" aria-label=\"操作の動き\"></div><p class=\"help-anim-cap\" id=\"helpAnimCap\"></p></div>","<div class=\"help-anim\"><div class=\"tut-box\" id=\"helpAnim\" aria-label=\"The moves in action\"></div><p class=\"help-anim-cap\" id=\"helpAnimCap\"></p></div>"],["<div class=\"hfig\"><div class=\"hfig-pic\">\n      <div class=\"room s0 tut-room hfig-hall\"><div class=\"room-head\"><span class=\"rpick s0\"><span class=\"rdot\"></span><span class=\"rname\">入口の広間</span></span></div>\n        <div class=\"keys\">⟦0⟧⟦1⟧<span class=\"hfig-tag\">鍵</span></div>\n        ⟦2⟧\n      </div></div>\n    <ul class=\"hfig-notes\">\n      <li><b>鍵</b>（⟦3⟧、⟦4⟧）：最初から持っている仮定。入口の広間の鍵は、どの部屋の中でも使えます。</li>\n      <li><b>部屋 1</b>：扉 ⟦5⟧ の → をタップして入った部屋です。鍵 ⟦6⟧ は、この部屋の中だけで使えます。</li>\n      <li><b>扉</b>（⟦7⟧）：いまの目標です。鍵 ⟦8⟧ を鍵 ⟦9⟧ に差し込むと鍵 ⟦10⟧ が手に入り、扉が開きます。</li>\n    </ul></div>","<div class=\"hfig\"><div class=\"hfig-pic\">\n      <div class=\"room s0 tut-room hfig-hall\"><div class=\"room-head\"><span class=\"rpick s0\"><span class=\"rdot\"></span><span class=\"rname\">Entrance hall</span></span></div>\n        <div class=\"keys\">⟦0⟧⟦1⟧<span class=\"hfig-tag\">keys</span></div>\n        ⟦2⟧\n      </div></div>\n    <ul class=\"hfig-notes\">\n      <li><b>Keys</b> (⟦3⟧, ⟦4⟧): the assumptions you have from the start. Keys in the entrance hall can be used inside any room.</li>\n      <li><b>Room 1</b>: the room entered by tapping the → of door ⟦5⟧. Key ⟦6⟧ can be used only inside this room.</li>\n      <li><b>Door</b> (⟦7⟧): the current goal. Insert key ⟦8⟧ into key ⟦9⟧ to get key ⟦10⟧, and the door opens.</li>\n    </ul></div>"],["<span class=\"hfig-tag\">部屋の鍵</span>","<span class=\"hfig-tag\">room key</span>"],["<span class=\"hfig-tag door-tag\">扉</span>","<span class=\"hfig-tag door-tag\">door</span>"],["<div class=\"hfig hfig-two\">\n      <div class=\"hfig-pic\">⟦0⟧</div>\n      <div class=\"hfig-arrow\" aria-hidden=\"true\">⇔</div>\n      <div class=\"hfig-pic hfig-pt\"><div class=\"ptr\">⟦1⟧</div></div>\n    </div>\n    <ul class=\"hfig-notes\"><li>部屋 1 の鍵 ⟦2⟧ は、証明図では <b>[⟦3⟧]¹</b> と書かれ、→I¹ の線より上の、同じ色の範囲でだけ使えます。</li>\n      <li>扉を分ける・部屋に入るなどの後ろ向きの操作は、証明図を<b>下から上へ</b>伸ばします。鍵を組み合わせる前向きの操作は、<b>上から下へ</b>伸びる部品を作ります。</li></ul>","<div class=\"hfig hfig-two\">\n      <div class=\"hfig-pic\">⟦0⟧</div>\n      <div class=\"hfig-arrow\" aria-hidden=\"true\">⇔</div>\n      <div class=\"hfig-pic hfig-pt\"><div class=\"ptr\">⟦1⟧</div></div>\n    </div>\n    <ul class=\"hfig-notes\"><li>Key ⟦2⟧ of room 1 is written <b>[⟦3⟧]¹</b> in the proof tree and can be used only in the same-colored part above the →I¹ line.</li>\n      <li>Backward moves such as splitting a door or entering a room grow the proof tree <b>from the bottom up</b>. Forward moves that combine keys make parts that grow <b>from the top down</b>.</li></ul>"],["<div class=\"hfig-gallery\">\n      <div class=\"hfig-card\"><div class=\"hfig-ct\">真理値の割り当て</div><div class=\"lamps\">⟦0⟧⟦1⟧</div><div class=\"hfig-cn\">⟦2⟧ は真、⟦3⟧ は偽</div></div>\n      <div class=\"hfig-card\"><div class=\"hfig-ct\">Kripke 模型</div><div class=\"hfig-kr\"><div class=\"hfig-fl\">階 1　<span class=\"lamp on\"><i class=\"at\">P</i></span></div><div class=\"hfig-st\">↑</div><div class=\"hfig-fl\">階 0</div></div><div class=\"hfig-cn\">階 0 で ⟦4⟧ は光らない</div></div>\n      <div class=\"hfig-card\"><div class=\"hfig-ct\">構造</div><table class=\"rel hfig-rel\"><tr><th>x＼y</th><th>1</th><th>2</th></tr><tr><th>1</th><td>⟦5⟧</td><td>⟦6⟧</td></tr><tr><th>2</th><td>⟦7⟧</td><td>⟦8⟧</td></tr></table><div class=\"hfig-cn\">⟦9⟧ の表（住人 2 人）</div></div>\n    </div>","<div class=\"hfig-gallery\">\n      <div class=\"hfig-card\"><div class=\"hfig-ct\">Truth assignment</div><div class=\"lamps\">⟦0⟧⟦1⟧</div><div class=\"hfig-cn\">⟦2⟧ is true, ⟦3⟧ is false</div></div>\n      <div class=\"hfig-card\"><div class=\"hfig-ct\">Kripke model</div><div class=\"hfig-kr\"><div class=\"hfig-fl\">Floor 1　<span class=\"lamp on\"><i class=\"at\">P</i></span></div><div class=\"hfig-st\">↑</div><div class=\"hfig-fl\">Floor 0</div></div><div class=\"hfig-cn\">⟦4⟧ is not lit at floor 0</div></div>\n      <div class=\"hfig-card\"><div class=\"hfig-ct\">Structure</div><table class=\"rel hfig-rel\"><tr><th>x\\y</th><th>1</th><th>2</th></tr><tr><th>1</th><td>⟦5⟧</td><td>⟦6⟧</td></tr><tr><th>2</th><td>⟦7⟧</td><td>⟦8⟧</td></tr></table><div class=\"hfig-cn\">Table of ⟦9⟧ (2 residents)</div></div>\n    </div>"],["<div class=\"hfig-replay\" aria-hidden=\"true\"><div class=\"hfig-cap\">クリア画面の見本</div>\n    <div class=\"rp-ctrl\"><span class=\"btn small\">⏮</span><span class=\"btn small\">◀</span><span class=\"btn small primary\" id=\"rpdPlay\">▶ 再生</span><span class=\"btn small\">▶</span><span class=\"btn small\">⏭</span><span class=\"rp-count\" id=\"rpdCount\"></span><span class=\"toggle\"><span class=\"sw-track\"><span class=\"sw-knob\"></span></span>クリア時に自動で再生</span></div>\n    <div class=\"ptw\"><div class=\"ptr\" id=\"rpdTree\"></div></div><div class=\"rp-step\" id=\"rpdStep\"></div></div>","<div class=\"hfig-replay\" aria-hidden=\"true\"><div class=\"hfig-cap\">Sample clear screen</div>\n    <div class=\"rp-ctrl\"><span class=\"btn small\">⏮</span><span class=\"btn small\">◀</span><span class=\"btn small primary\" id=\"rpdPlay\">▶ Play</span><span class=\"btn small\">▶</span><span class=\"btn small\">⏭</span><span class=\"rp-count\" id=\"rpdCount\"></span><span class=\"toggle\"><span class=\"sw-track\"><span class=\"sw-knob\"></span></span>Auto-play on clear</span></div>\n    <div class=\"ptw\"><div class=\"ptr\" id=\"rpdTree\"></div></div><div class=\"rp-step\" id=\"rpdStep\"></div></div>"],["<span class=\"rp-lab\">第 ⟦0⟧ 手</span><span class=\"rule\">⟦1⟧</span><b>⟦2⟧</b><div class=\"rp-op\"><span class=\"rp-k\">操作</span>⟦3⟧</div>","<span class=\"rp-lab\">Move ⟦0⟧</span><span class=\"rule\">⟦1⟧</span><b>⟦2⟧</b><div class=\"rp-op\"><span class=\"rp-k\">Move</span>⟦3⟧</div>"],["画面の見方","The screen"],["<p>証明する問題（⊢）の画面です。番号を押すと、その部分が光ります（自動でも順に光ります）。</p>\n      <div class=\"hm-layout\"><div class=\"hm-wrap\">⟦0⟧</div>\n      <ol class=\"hm-legend\">⟦1⟧</ol></div>\n      <p class=\"note\">反例を作る問題（⊬）では、左が反例の欄（真理値の割り当て、Kripke 模型、構造）、右が真偽の計算になります。画面の幅が狭いときは、左右の欄が縦に並びます。</p>","<p>The screen for a problem to prove (⊢). Click a number to highlight that part (they also light up in turn automatically).</p>\n      <div class=\"hm-layout\"><div class=\"hm-wrap\">⟦0⟧</div>\n      <ol class=\"hm-legend\">⟦1⟧</ol></div>\n      <p class=\"note\">In a problem asking for a counterexample (⊬), the left is the counterexample panel (truth assignment, Kripke model, or structure) and the right is the evaluation. On narrow screens the two panels stack vertically.</p>"],["鍵と扉と部屋","Keys, doors, rooms"],["⟦0⟧⟦1⟧<p>手持ちの<b>鍵</b>（仮定や、導いた命題）を使って、<b>扉</b>（証明目標）をすべて開ければ脱出成功です。脱出すると、攻略の手順がそのまま自然演繹の証明木と証明項になって表示されます。</p>\n    <p><b>部屋</b>は仮定の有効範囲（スコープ）です。扉 ⟦2⟧ の → をタップすると、⟦3⟧ を鍵として持って新しい部屋に入ります。部屋の中では外の鍵も使えますが、部屋の中の鍵は外へ持ち出せません。</p>\n    <p><b>条件分岐：世界</b>は、鍵 ⟦4⟧ の ∨ をタップしたときにできる、「⟦5⟧ の場合」と「⟦6⟧ の場合」の二つ一組の部屋です。⟦7⟧ が成り立つ世界と ⟦8⟧ が成り立つ世界の両方で、同じ扉を開ける必要があります。片方の世界の鍵は、もう片方の世界では使えません。証明図では ∨E の2番目と3番目の前提が、それぞれの世界に対応します。</p>\n    <p><b>⊥ と ¬</b>：⊥ は矛盾を表します。⟦9⟧ は ⟦10⟧ の略記なので、扉 ⟦11⟧ の ¬ をタップすると ⟦12⟧ を持って部屋に入り、⊥ を目指します。</p>\n    \n    <h3>操作のしかた</h3>\n    <p>鍵は扉や別の鍵へドラッグします。鍵をタップして選んでから、扉や別の鍵をタップしても同じです。鍵を選ぶと、その鍵を使える場所が緑色に光ります。</p>\n    <p>「戻す」（Z キー）で何手でも巻き戻せます。行き詰まったら、戻って別の方針を試してください。扉が複数あるときは、扉の欄の「次の扉を見る」か、証明図の ⋮ をタップして、取り組む扉を選べます。</p>\n    \n      <p>動きで見たいときは、チュートリアルを開きましょう：<button type=\"button\" class=\"tut-chip\" data-tut=\"basics\">扉と鍵の基本</button><button type=\"button\" class=\"tut-chip\" data-tut=\"impI\">部屋に入る</button><button type=\"button\" class=\"tut-chip\" data-tut=\"orE\">条件分岐</button></p>","⟦0⟧⟦1⟧<p>Use your <b>keys</b> (assumptions and derived propositions) to open all the <b>doors</b> (goals) and you escape. When you escape, your moves are shown as a natural deduction proof tree and a proof term.</p>\n    <p>A <b>room</b> is the scope of an assumption. Tap the → of door ⟦2⟧ to enter a new room holding ⟦3⟧ as a key. Inside a room you can use outer keys, but keys inside the room cannot be taken out.</p>\n    <p><b>Branching worlds</b> are the pair of rooms created when you tap the ∨ of key ⟦4⟧: \"the case ⟦5⟧\" and \"the case ⟦6⟧\". You must open the same door both in the world where ⟦7⟧ holds and in the world where ⟦8⟧ holds. Keys of one world cannot be used in the other. In the proof tree, the second and third premises of ∨E correspond to the two worlds.</p>\n    <p><b>⊥ and ¬</b>: ⊥ stands for a contradiction. ⟦9⟧ is short for ⟦10⟧, so tapping the ¬ of door ⟦11⟧ enters a room holding ⟦12⟧ and aims for ⊥.</p>\n    \n    <h3>How to operate</h3>\n    <p>Drag keys onto doors or other keys. You can also tap a key to select it and then tap a door or another key. When a key is selected, the places where it can be used glow green.</p>\n    <p>\"Undo\" (Z key) takes back as many moves as you like. If you get stuck, go back and try another plan. When there are several doors, choose the one to work on with \"Next door\" in the door panel or by tapping a ⋮ in the proof tree.</p>\n    \n      <p>To see the moves in action, open a tutorial: <button type=\"button\" class=\"tut-chip\" data-tut=\"basics\">Doors and keys basics</button><button type=\"button\" class=\"tut-chip\" data-tut=\"impI\">Entering a room</button><button type=\"button\" class=\"tut-chip\" data-tut=\"orE\">Branching</button></p>"],["⟦0⟧⟦1⟧\n    <p>画面の右側（スマートフォンでは下）には、操作するたびに自然演繹の証明図が組み上がっていきます。⋮ の部分は、まだ開いていない扉です。扉を分ける、部屋に入る、扉を付け替えるといった後ろ向きの操作は、証明図を<b>下から上へ</b>伸ばします。鍵の分解や鍵どうしの組み合わせといった前向きの操作は、「手元の部品」として証明図の断片を<b>上から下へ</b>作ります。部品を扉に差し込むと、二つがつながります。</p>\n    <p>部屋と証明図は色で対応しています。部屋 n の仮定は証明図では [ ]ⁿ と書かれ、→Iⁿ の線より上の範囲でだけ使えます。いまの扉を囲む部屋の範囲は、証明図にも同じ色で薄く塗られます。部屋の名前（または証明図の →I の番号）をタップすると、その範囲が強調されます。部屋のすべての扉を開けて外へ出ると、その仮定は解除され、以後は使えなくなります。</p>\n    <h3>クリア画面での再生</h3><p>クリアすると、完成した証明図を<b>一手ずつ再生</b>できます。▶ で再生、◀ ▶ で一手ずつ、⏮ ⏭ で最初と最後へ移ります。下の「操作と推論規則の対応」の行を押すと、その手まで再生した状態になります。「クリア時に自動で再生」をオンにすると、クリアした直後から再生が始まります。</p>⟦2⟧","⟦0⟧⟦1⟧\n    <p>On the right of the screen (below it on a smartphone), the natural deduction proof tree is built as you move. ⋮ marks doors not yet opened. Backward moves such as splitting a door, entering a room or replacing a door grow the proof tree <b>from the bottom up</b>. Forward moves such as taking keys apart or combining keys make fragments of the proof tree <b>from the top down</b>, shown as \"parts at hand\". Insert a part into a door and the two are joined.</p>\n    <p>Rooms and the proof tree correspond by color. The assumption of room n is written [ ]ⁿ in the proof tree and can be used only above the →Iⁿ line. The scope of the rooms around the current door is lightly tinted in the same color in the proof tree. Tap a room name (or a →I number in the proof tree) to highlight its scope. When you open every door of a room and leave, its assumption is discharged and can no longer be used.</p>\n    <h3>Replay on the clear screen</h3><p>When you clear a stage, you can <b>replay the finished proof tree move by move</b>. ▶ plays, ◀ ▶ step one move, and ⏮ ⏭ jump to the start or end. Click a row of \"Moves and inference rules\" below to replay up to that move. Turn on \"Auto-play on clear\" to start the replay right after clearing.</p>⟦2⟧"],["<h3>証明項（λ項）の表示</h3><p>証明図の欄の「証明項（λ項）を表示」をオンにすると、証明図の各式が「<span class=\"pt-tm\">項</span> : 命題」の形になり、その部分の証明を表す λ 項が色を変えて表示されます（カリー・ハワード対応）。仮定は変数（入口の鍵は <span class=\"pt-tm\">h₁, h₂, …</span>、部屋の仮定は <span class=\"pt-tm\">x₁, x₂, …</span>）、→I は λ 抽象、→E は関数の適用、∧I は対 ⟨ , ⟩ にあたります。たとえば 2-4 の証明図のいちばん下は <span class=\"pt-tm\">λx₁. h₂ (h₁ x₁)</span> : P→R です。項を消して型（命題）の部分だけを取り出すと、いつもの証明図になります。クリア画面の証明木とその再生、手元の部品、上の再生の見本にも表示されます。</p>","<h3>Showing proof terms (λ-terms)</h3><p>Turn on \"Show the proof term (λ-term)\" in the proof tree panel, and every formula in the proof tree takes the form \"<span class=\"pt-tm\">term</span> : proposition\": the λ-term representing the proof of that part is shown in a different color (the Curry–Howard correspondence). Assumptions are variables (entrance keys are <span class=\"pt-tm\">h₁, h₂, …</span> and room assumptions are <span class=\"pt-tm\">x₁, x₂, …</span>); →I corresponds to λ-abstraction, →E to function application, and ∧I to a pair ⟨ , ⟩. For example, the bottom of the proof tree of 2-4 is <span class=\"pt-tm\">λx₁. h₂ (h₁ x₁)</span> : P→R. Erase the terms and keep only the types (propositions), and you get the usual proof tree. Terms are also shown in the proof tree of the clear screen and its replay, in the parts at hand, and in the replay sample above.</p>"],["操作と推論規則","Moves and rules"],["<p>扉や鍵の操作と、自然演繹の推論規則の対応です。</p>⟦0⟧<h3>詳しい対応表</h3><div class=\"help-wrap\"><table class=\"help-table\">\n      <thead><tr><th>操作</th><th>規則</th><th>効果</th></tr></thead>\n      <tbody>\n        <tr><td>扉の → をタップ</td><td><span class=\"rule\">→I</span></td><td>仮定を持って新しい部屋に入る。証明できる扉なら、使っても損はしない</td></tr>\n        <tr><td>扉の ∧ をタップ</td><td><span class=\"rule\">∧I</span></td><td>扉を二つに分ける。これも使って損はしない</td></tr>\n        <tr><td>鍵の ∧ をタップ</td><td><span class=\"rule\">∧E</span></td><td>中身の二つの鍵を取り出す</td></tr>\n        <tr><td>扉の ∨ をタップ</td><td><span class=\"rule\">∨I</span></td><td>左右どちらを示すかを選ぶ。証明できない扉に変わることもある、元に戻らない選択</td></tr>\n        <tr><td>鍵の ∨ をタップ</td><td><span class=\"rule\">∨E</span></td><td>条件分岐で世界を二つに分け、両方の世界で同じ扉を開ける。使っても損はしない</td></tr>\n        <tr><td>扉の「背理法の魔法」</td><td><span class=\"rule\">RAA</span></td><td>「この扉でない」（¬A）と仮定して部屋に入り、矛盾 ⊥ を目指す。古典論理の魔法（⟦1⟧〜）</td></tr>\n        <tr><td>⊥ の鍵を扉へ</td><td><span class=\"rule\">⊥E</span></td><td>矛盾からは何でも導けるので、どの扉でも開く</td></tr>\n        <tr><td>扉の「⊥ を目指す」</td><td><span class=\"rule\">⊥E</span></td><td>扉を ⊥ に切り替える。証明できない扉に変わることもある、元に戻らない選択</td></tr>\n        <tr><td>鍵 ⟦2⟧ を鍵 ⟦3⟧ へ</td><td><span class=\"rule\">→E</span></td><td>鍵 ⟦4⟧ を手に入れる（前向きの推論）</td></tr>\n        <tr><td>鍵を同じ形の扉へ</td><td><span class=\"rule\">仮定</span></td><td>扉が開く</td></tr>\n        <tr><td>鍵 ⟦5⟧ を扉 ⟦6⟧ へ</td><td><span class=\"rule\">→E</span></td><td>扉が ⟦7⟧ に付け替わる（後ろ向きの推論）。証明できない扉に変わることもある選択なので注意</td></tr>\n      </tbody>\n    </table></div>\n    ","<p>How moves on doors and keys correspond to natural deduction rules.</p>⟦0⟧<h3>Detailed table</h3><div class=\"help-wrap\"><table class=\"help-table\">\n      <thead><tr><th>Move</th><th>Rule</th><th>Effect</th></tr></thead>\n      <tbody>\n        <tr><td>Tap the → of a door</td><td><span class=\"rule\">→I</span></td><td>Enter a new room with the assumption. If the door is provable, this never hurts</td></tr>\n        <tr><td>Tap the ∧ of a door</td><td><span class=\"rule\">∧I</span></td><td>Split the door in two. This never hurts either</td></tr>\n        <tr><td>Tap the ∧ of a key</td><td><span class=\"rule\">∧E</span></td><td>Take out the two keys inside</td></tr>\n        <tr><td>Tap the ∨ of a door</td><td><span class=\"rule\">∨I</span></td><td>Choose which side to show. An irreversible choice that may turn the door unprovable</td></tr>\n        <tr><td>Tap the ∨ of a key</td><td><span class=\"rule\">∨E</span></td><td>Branch into two worlds and open the same door in both. This never hurts</td></tr>\n        <tr><td>\"Reductio spell\" on a door</td><td><span class=\"rule\">RAA</span></td><td>Enter a room assuming \"not this door\" (¬A) and aim for the contradiction ⊥. The spell of classical logic (⟦1⟧ on)</td></tr>\n        <tr><td>⊥ key into a door</td><td><span class=\"rule\">⊥E</span></td><td>Anything follows from a contradiction, so any door opens</td></tr>\n        <tr><td>\"Aim for ⊥\" on a door</td><td><span class=\"rule\">⊥E</span></td><td>Switch the door to ⊥. An irreversible choice that may turn the door unprovable</td></tr>\n        <tr><td>Key ⟦2⟧ into key ⟦3⟧</td><td><span class=\"rule\">→E</span></td><td>Get key ⟦4⟧ (forward reasoning)</td></tr>\n        <tr><td>A key into a door of the same shape</td><td><span class=\"rule\">Hyp</span></td><td>The door opens</td></tr>\n        <tr><td>Key ⟦5⟧ into door ⟦6⟧</td><td><span class=\"rule\">→E</span></td><td>The door is replaced by ⟦7⟧ (backward reasoning). Be careful: it may turn the door unprovable</td></tr>\n      </tbody>\n    </table></div>\n    "],["⟦0⟧<p>証明できない推論は、<b>反例</b>を作って示します。証明できる式はどんな反例にも負けない（健全性定理）ので、反例が一つでもあれば証明できないことが分かります。</p>\n      <ul class=\"help-list\"><li><b>真理値の割り当て</b>（⟦1⟧）：原子命題に真・偽を割り当てます。</li><li><b>Kripke 模型</b>（⟦2⟧）：背理法の魔法を使わない論理での反例です。階を上り階段でつなぎ、灯りを点けます。</li><li><b>構造</b>（⟦3⟧）：住人と、述語・演算の表を決めます。よく知られた群や順序は「既製の構造」から読み込めます。</li></ul>\n      <p>真理値の割り当てと構造は、最初はすべて<b>未定</b>です。ボタンで真偽を決めると、右の真偽の計算が原子式から順に決まっていきます。仮定がすべて真で、目標が偽になれば反例の完成です（未定の部分が残っていてもかまいません）。「すべて未定に」で、最初の状態に戻せます。</p>\n      <p>真偽の計算は、「図で見る」（部分論理式を頂点とする木）と「理由で見る」（各式の真偽の理由をたどる一覧。真偽を決めている部分に印が付きます）の 2 通りで表示できます。</p>⟦4⟧","⟦0⟧<p>An unprovable inference is shown by making a <b>counterexample</b>. A provable formula survives every counterexample (the soundness theorem), so a single counterexample shows that it is not provable.</p>\n      <ul class=\"help-list\"><li><b>Truth assignment</b> (⟦1⟧): assign true or false to atomic propositions.</li><li><b>Kripke model</b> (⟦2⟧): a counterexample for logic without the reductio spell. Connect floors with stairs and turn on lights.</li><li><b>Structure</b> (⟦3⟧): decide the residents and the tables of predicates and operations. Well-known groups and orders can be loaded from \"Preset structures\".</li></ul>\n      <p>Truth assignments and structures start entirely <b>unknown</b>. As you decide values with the buttons, the evaluation on the right is settled from the atoms upward. When all assumptions are true and the goal is false, the counterexample is complete (unknown parts may remain). \"Reset to unknown\" brings back the initial state.</p>\n      <p>The evaluation can be shown in two ways: \"Diagram\" (a tree whose nodes are subformulas) and \"Reasons\" (a list tracing the reason for each truth value, with the deciding parts marked).</p>⟦4⟧"],["発展","Advanced"],["⟦0⟧<p><b>等号と関数記号（⟦1⟧〜）</b>：扉の両辺が同じ項なら、扉の = をタップすると開きます（=I）。等式の鍵 ⟦2⟧ を扉に差し込むと扉の中の ⟦3⟧ を ⟦4⟧ に、別の鍵に差し込むとその鍵の中の ⟦5⟧ を ⟦6⟧ に書き換えます（=E）。書き換えられる場所が複数あるときは、どれを書き換えるか選べます。証明した定理の一部は<b>定理カード</b>になり、後のステージで入口の広間に置かれます。</p>\n    <p><b>一階述語論理（⟦7⟧〜）</b>：扉の ∀ をタップすると、任意の住人 ⟦8⟧ を連れて新しい部屋に入ります（∀I）。⟦9⟧ は部屋の外に出られないので、固有変数条件は自動的に守られます。鍵の ∀ には好きな住人を当てはめられます（∀E）。扉の ∃ では証人の住人を選び（∃I）、鍵の ∃ からは「名前の分からない誰か」を連れて部屋に入ります（∃E）。住人は少なくとも一人いると約束するので、新しい住人はいつでも呼べます。扉の上の「名前を自分で選ぶ」をオンにすると、∀I と ∃E で住人の名前を自分で選べます。固有変数条件に反する名前を選ぶと、どの鍵や扉に現れているかを示して拒否されます。誤りの式は、住人と述語の表からなる構造で反証します。</p>\n    <p><b>古典論理（⟦10⟧、⟦11⟧）</b>：扉の「背理法の魔法」で、「⟦12⟧ でない」（⟦13⟧）と仮定して部屋に入り、矛盾 ⊥ を導けば ⟦14⟧ が示せます（RAA）。証明図では RAA の線が特別な色で示されます。誤りの式は、仮定がすべて真で目標が偽になる真理値の割り当てで反証します。</p>\n    <p><b>魔法なしの論理と反証（⟦15⟧）</b>：背理法の魔法を使わない論理（直観主義論理）で証明できない「魔法の扉」（魔法なしでは決して開かない扉）は、Kripke 模型という反例で示します。階を上り階段でつなぎ、各階で原子命題の灯りを点けて、仮定がすべて光り目標だけが光らない階を作れば反証成功です。光る・光らない（強制関係）は自動で計算され、理由も表示されます。</p>\n    <h3>入力の書き方</h3><p>補題や項を自分で書くときは、∀x を <code>!x.</code>、∃x を <code>?x.</code>、∧ を <code>&amp;</code>、∨ を <code>|</code>、→ を <code>-&gt;</code>、¬ を <code>~</code>、⊥ を <code>#</code> と書きます。述語は <code>P(x)</code>、等号は <code>a = b</code>、演算は <code>a * b</code>、<code>a + b</code> です。</p>","⟦0⟧<p><b>Equality and function symbols (⟦1⟧ on)</b>: if both sides of a door are the same term, tap its = to open it (=I). Inserting an equation key ⟦2⟧ into a door rewrites ⟦3⟧ in the door to ⟦4⟧; inserting it into another key rewrites ⟦5⟧ in that key to ⟦6⟧ (=E). When there are several places to rewrite, you can choose which. Some proved theorems become <b>theorem cards</b> and are placed in the entrance hall in later stages.</p>\n    <p><b>First-order logic (⟦7⟧ on)</b>: tap the ∀ of a door to enter a new room with an arbitrary resident ⟦8⟧ (∀I). ⟦9⟧ cannot leave the room, so the eigenvariable condition is kept automatically. A key's ∀ can be instantiated with any resident (∀E). At the ∃ of a door you choose a witness (∃I); from the ∃ of a key you enter a room with \"someone whose name we don't know\" (∃E). We agree that there is at least one resident, so you can always call a new one. Turn on \"Choose names\" above the door to choose resident names yourself in ∀I and ∃E; a name that violates the eigenvariable condition is rejected, showing the key or door where it occurs. Invalid formulas are refuted by structures made of residents and predicate tables.</p>\n    <p><b>Classical logic (⟦10⟧, ⟦11⟧)</b>: with the \"Reductio spell\" on a door, assume \"not ⟦12⟧\" (⟦13⟧), enter a room, and derive the contradiction ⊥ to show ⟦14⟧ (RAA). RAA lines are drawn in a special color in the proof tree. Invalid formulas are refuted by a truth assignment that makes all assumptions true and the goal false.</p>\n    <p><b>Logic without the spell and refutation (⟦15⟧)</b>: \"magic doors\", which never open without the spell (formulas not provable in logic without the reductio spell, that is, intuitionistic logic), are shown by counterexamples called Kripke models. Connect floors with stairs, turn on lights of atomic propositions at each floor, and build a floor where all assumptions are lit and only the goal is not. Lit or not (forcing) is computed automatically, with reasons.</p>\n    <h3>Input notation</h3><p>When you write a lemma or a term yourself, write ∀x as <code>!x.</code>, ∃x as <code>?x.</code>, ∧ as <code>&amp;</code>, ∨ as <code>|</code>, → as <code>-&gt;</code>, ¬ as <code>~</code>, and ⊥ as <code>#</code>. Predicates are <code>P(x)</code>, equality is <code>a = b</code>, and operations are <code>a * b</code> and <code>a + b</code>.</p>"],["Lean モード","Lean mode"],["<p>Lean モードをオンにすると、自然演繹で組み立てた証明と同じ証明を、定理証明支援系 <b>Lean 4</b> のコード（タクティクによる証明）として見られます。プレイ画面の証明図の欄にある「Lean モード」のスイッチで切り替えます。</p>\n    <p>たとえば 2-4「関数の合成」を解くと、次のコードが書き上がります。</p>⟦0⟧\n    <h3>画面の見方</h3>\n    <ul class=\"help-list\">\n      <li><b>Lean の欄</b>：証明図の上に開きます。操作するたびに、対応するタクティクが書き加えられ、直前の操作で増えた行が光ります。</li>\n      <li><b><code>sorry</code></b>：まだ開いていない扉です。証明図の ⋮ や証明項の ? にあたり、いま取り組んでいる扉の <code>sorry</code> は枠で囲まれます。</li>\n      <li><b>右側のコメント（<code>--</code> の後ろ）</b>：その行に対応する推論規則です。→I¹ などの番号は、証明図の [P]¹ や証明項の x₁ と同じです。</li>\n      <li><b>並び方</b>：操作した順番ではなく、扉の分かれ方に沿って並びます。扉が二つに分かれると、それぞれが <code>·</code> で始まる字下げされたまとまりになり、新しい行はその扉の場所に差し込まれます。</li>\n      <li><b>証明図の注記</b>：証明図の各規則の横に、対応するタクティク（<code>intro x₁</code> など）が小さく添えられます。</li>\n      <li><b>クリア画面</b>：完成した証明木の下に Lean のコードが表示されます。再生ボタンで証明図を一手ずつたどると、Lean のコードも同じ手まで巻き戻り、まだ組み上がっていない部分は <code>sorry</code> になります。</li>\n    </ul>\n    <h3>操作とタクティクの対応</h3>\n    <div class=\"help-wrap\"><table class=\"help-table\">\n      <thead><tr><th>操作</th><th>規則</th><th>Lean</th></tr></thead>\n      <tbody>\n        <tr><td>扉の → をタップ</td><td><span class=\"rule\">→I</span></td><td><code>intro x₁</code></td></tr>\n        <tr><td>扉の ∧ ／ 鍵の ∧ をタップ</td><td><span class=\"rule\">∧I</span> ／ <span class=\"rule\">∧E</span></td><td><code>constructor</code> ／ <code>have ⟨d₁, d₂⟩ := h₁</code></td></tr>\n        <tr><td>扉の ∨ ／ 鍵の ∨ をタップ</td><td><span class=\"rule\">∨I</span> ／ <span class=\"rule\">∨E</span></td><td><code>left</code>・<code>right</code> ／ <code>rcases h₁ with x₁ | x₂</code></td></tr>\n        <tr><td>鍵を同じ形の扉へ</td><td><span class=\"rule\">⟦1⟧</span></td><td><code>exact h₁</code></td></tr>\n        <tr><td>鍵 A→B を扉 B へ ／ 鍵を鍵へ</td><td><span class=\"rule\">→E</span></td><td><code>apply h₁</code> ／ <code>have d₁ := h₁ h₂</code></td></tr>\n        <tr><td>⊥ を目指す</td><td><span class=\"rule\">⊥E</span></td><td><code>exfalso</code></td></tr>\n        <tr><td>背理法の魔法</td><td><span class=\"rule\">RAA</span></td><td><code>apply Classical.byContradiction</code> と <code>intro x₁</code></td></tr>\n        <tr><td>扉の ∀ ／ 鍵の ∀</td><td><span class=\"rule\">∀I</span> ／ <span class=\"rule\">∀E</span></td><td><code>intro a</code> ／ <code>have d₁ := h₁ a</code></td></tr>\n        <tr><td>扉の ∃ ／ 鍵の ∃</td><td><span class=\"rule\">∃I</span> ／ <span class=\"rule\">∃E</span></td><td><code>refine ⟨a, ?_⟩</code> ／ <code>obtain ⟨a, x₁⟩ := h₁</code></td></tr>\n        <tr><td>扉の = ／ 等式の鍵で書き換え</td><td><span class=\"rule\">=I</span> ／ <span class=\"rule\">=E</span></td><td><code>rfl</code> ／ <code>rewrite [← d₁]</code></td></tr>\n        <tr><td>点線の記号を展開</td><td><span class=\"rule\">⟦2⟧</span></td><td><code>show …</code></td></tr>\n        <tr><td>補題を立てる ／ 帰納法</td><td><span class=\"rule\">⟦3⟧</span> ／ <span class=\"rule\">⟦4⟧</span></td><td><code>have x₁ : … := by</code> ／ <code>induction a with</code></td></tr>\n      </tbody>\n    </table></div>\n    <p class=\"note\">書き換えには、<code>rw</code> ではなく <code>rewrite</code> を使います。<code>rw</code> は書き換えた後で自動的に扉を閉じてしまうことがあり、ゲームの「= をタップする」一手と食い違うためです。また、鍵の ∧ を分解するときは、元の鍵を残すために <code>obtain</code> ではなく <code>have ⟨…⟩ :=</code> を使います。</p>\n    <h3>命題の書き方</h3>\n    <p>問題の主張は <code>example (…) : 目標 := by</code> の形で書かれます。( ) の中が仮定で、入口の鍵が <code>h₁, h₂, …</code>、定理カードが <code>c₁, …</code> です。</p>\n    <ul class=\"help-list\">\n      <li><b>住人</b>（⟦5⟧ 以降）：住人の型を <code>α</code> とし、「住人は少なくとも一人いる」という約束を <code>[Nonempty α]</code> と書きます。述語は <code>P : α → Prop</code>、∀x P(x) は <code>∀ x, P x</code> です。新しく呼んだ住人は、コードの最初に <code>[Nonempty α]</code> から取り出します。</li>\n      <li><b>集合</b>（⟦6⟧）：集合は「住人についての述語」として扱い、∈・⊆・∩・∪・ᶜ をゲームと同じ定義で前置きに書きます。定義の展開は、その定義どおりの形を <code>show</code> で示すことにあたります。</li>\n      <li><b>自然数</b>（⟦7⟧〜⟦8⟧）：0 と「次の数」s だけからなる型 <code>N</code> を前置きで定義します。足し算・掛け算の性質は、ゲームと同じく公理（仮定）として与えます。⟦9⟧ の ≤ は、Lean の ≤ と区別して <code>≼</code> と書きます。</li>\n    </ul>\n    <p>前置きは長いので、Lean の欄では「▶ 前置き」として折りたたまれています。押すと開きます。</p>\n    <h3>本物の Lean で試すには</h3>\n    <p>表示されるコードは、Mathlib を使わない Lean 4 だけで通るように書いてあります。このゲームを作るときに、すべてのステージのお手本の解き方から作ったコード（クリア画面の再生の各段階も含む）を、Lean 4（バージョン 4.35.0）で検査しています。前置きがあるときは前置きも含めて写せば、そのまま Lean のファイルとして使えます。証明の途中のコードも、<code>sorry</code> の警告が出るだけで読み込めます。</p>\n    <h3>対応している範囲</h3>\n    <p>証明する問題（⊢）のある層に対応しています。反例を作る問題（⊬）と、隠し層・公理の鏡では、Lean のコードは出ません。</p>\n    <p class=\"note\">Lean で背理法を使うには、<code>Classical</code>（選択公理などから導かれる古典論理の定理）を使います。隠し層「魔法の扉」の扉は、Lean でも <code>Classical</code> を使わなければ証明できない式です。</p>","<p>Turn on Lean mode to see the same proof you built in natural deduction as code of the proof assistant <b>Lean 4</b> (a proof by tactics). Switch it with the \"Lean mode\" switch in the proof tree panel of the play screen.</p>\n    <p>For example, solving 2-4 \"Composing Functions\" writes the following code.</p>⟦0⟧\n    <h3>Reading the screen</h3>\n    <ul class=\"help-list\">\n      <li><b>The Lean panel</b>: it opens above the proof tree. Each move adds the corresponding tactic, and the lines added by the last move glow.</li>\n      <li><b><code>sorry</code></b>: a door not yet opened. It corresponds to ⋮ in the proof tree and ? in the proof term; the <code>sorry</code> of the door you are working on is framed.</li>\n      <li><b>Comments on the right (after <code>--</code>)</b>: the inference rule corresponding to the line. Numbers such as →I¹ match [P]¹ in the proof tree and x₁ in the proof term.</li>\n      <li><b>Order</b>: lines follow how the doors split, not the order of your moves. When a door splits in two, each part becomes an indented block starting with <code>·</code>, and new lines are inserted at the place of that door.</li>\n      <li><b>Annotations in the proof tree</b>: next to each rule in the proof tree, the corresponding tactic (such as <code>intro x₁</code>) is shown in small type.</li>\n      <li><b>Clear screen</b>: the Lean code is shown below the finished proof tree. When you replay the proof tree move by move, the Lean code rewinds to the same move, and the parts not yet built become <code>sorry</code>.</li>\n    </ul>\n    <h3>Moves and tactics</h3>\n    <div class=\"help-wrap\"><table class=\"help-table\">\n      <thead><tr><th>Move</th><th>Rule</th><th>Lean</th></tr></thead>\n      <tbody>\n        <tr><td>Tap the → of a door</td><td><span class=\"rule\">→I</span></td><td><code>intro x₁</code></td></tr>\n        <tr><td>Tap the ∧ of a door / of a key</td><td><span class=\"rule\">∧I</span> / <span class=\"rule\">∧E</span></td><td><code>constructor</code> / <code>have ⟨d₁, d₂⟩ := h₁</code></td></tr>\n        <tr><td>Tap the ∨ of a door / of a key</td><td><span class=\"rule\">∨I</span> / <span class=\"rule\">∨E</span></td><td><code>left</code>, <code>right</code> / <code>rcases h₁ with x₁ | x₂</code></td></tr>\n        <tr><td>A key into a door of the same shape</td><td><span class=\"rule\">⟦1⟧</span></td><td><code>exact h₁</code></td></tr>\n        <tr><td>Key A→B into door B / a key into a key</td><td><span class=\"rule\">→E</span></td><td><code>apply h₁</code> / <code>have d₁ := h₁ h₂</code></td></tr>\n        <tr><td>Aim for ⊥</td><td><span class=\"rule\">⊥E</span></td><td><code>exfalso</code></td></tr>\n        <tr><td>Reductio spell</td><td><span class=\"rule\">RAA</span></td><td><code>apply Classical.byContradiction</code> and <code>intro x₁</code></td></tr>\n        <tr><td>∀ of a door / of a key</td><td><span class=\"rule\">∀I</span> / <span class=\"rule\">∀E</span></td><td><code>intro a</code> / <code>have d₁ := h₁ a</code></td></tr>\n        <tr><td>∃ of a door / of a key</td><td><span class=\"rule\">∃I</span> / <span class=\"rule\">∃E</span></td><td><code>refine ⟨a, ?_⟩</code> / <code>obtain ⟨a, x₁⟩ := h₁</code></td></tr>\n        <tr><td>= of a door / rewriting with an equation key</td><td><span class=\"rule\">=I</span> / <span class=\"rule\">=E</span></td><td><code>rfl</code> / <code>rewrite [← d₁]</code></td></tr>\n        <tr><td>Unfolding a dotted symbol</td><td><span class=\"rule\">⟦2⟧</span></td><td><code>show …</code></td></tr>\n        <tr><td>State a lemma / induction</td><td><span class=\"rule\">⟦3⟧</span> / <span class=\"rule\">⟦4⟧</span></td><td><code>have x₁ : … := by</code> / <code>induction a with</code></td></tr>\n      </tbody>\n    </table></div>\n    <p class=\"note\">Rewriting uses <code>rewrite</code> rather than <code>rw</code>: <code>rw</code> may close the door automatically after rewriting, which would not match the separate move \"tap =\" in the game. Also, taking a ∧ key apart uses <code>have ⟨…⟩ :=</code> rather than <code>obtain</code>, so that the original key is kept.</p>\n    <h3>How statements are written</h3>\n    <p>Th document.addEventListener("pointerover", e => {
  if (e.pointerType !== "mouse" || SCREEN !== "play" || drag || !S || !PROB || UI.mode === "refute") return;
  const t = e.target.closest ? e.target : e.target.parentElement;
  const pick = t.closest("[data-scope-pick]");
  const n = pick ? +pick.dataset.scopePick : null;
  if (n !== UI.hoverScope) { UI.hoverScope = n; applyScope(); }
  if (!S.active || $(".overlay")) return;
  // マウスを重ねた操作を試して、証明図に見本を出す
  const orp = t.closest("[data-orpick]"), intro = t.closest("[data-intro]"), split = t.closest("[data-split]");
  if (t.closest("[data-exfalso]")) return previewOp("exf", St => opExfalso(St, St.active));
  const ufv = t.closest("[data-unfold]");
  if (ufv) { const v = ufv.dataset.unfold; return previewOp("uf:" + v, St => v === "door" ? opUnfoldDoor(St, St.active) : opUnfoldKey(St, v, St.active)); }
  if (t.closest("[data-raa]")) return previewOp("raa", St => opRAA(St, St.active));
  const lpv = t.closest("[data-lempick]");
  if (lpv && UI.lemma) { const L = parse(STAGE.lemmas[+lpv.dataset.lempick]); return previewOp("lem:" + lpv.dataset.lempick, St => opCut(St, St.active, L)); }
  if (t.closest("[data-ind]")) return previewOp("ind", St => opInd(St, St.active));
  if (t.closest("[data-lemma]")) return previewOp("lemhint", null, { preview: true, rule: __T(665), fig: __T(1850) });
  if (orp && orp.dataset.orpick !== "x") { const side = orp.dataset.orpick; return previewOp("or:" + side, St => opOrIntro(St, St.active, side)); }
  if (UI.rew && t.closest("[data-rewgo]")) { const rw = UI.rew; return previewOp("rew:" + rw.sel.join(","), St => rewOp(St, rw, rw.sel)); }
  const tpv = t.closest("[data-tpick]");
  if (tpv && UI.pick && tpv.dataset.tpick !== "x") { const v = tpv.dataset.tpick, pk = UI.pick;
    return previewOp("tp:" + v, St => pickOp(St, pk, v)); }
  if (intro && S.goals[S.active].target.t === "ex")
    return previewOp("exhint", null, { preview: true, rule: "∃I", fig: __T(1851) });
  if (split && (findEntry(S.goals[S.active], split.dataset.split) || {}).f && findEntry(S.goals[S.active], split.dataset.split).f.t === "all")
    return previewOp("allhint", null, { preview: true, rule: "∀E", fig: __T(1852) });
  if (intro) {
    if (S.goals[S.active].target.t === "or")
      return previewOp("orhint", null, { preview: true, rule: "∨I", fig: __T(1853) });
    return previewOp("intro", St => opIntro(St, St.active));
  }
  if (split) { const k = split.dataset.split; return previewOp("split:" + k, St => opSplit(St, k, St.active)); }
  if (UI.sel) {
    const door = t.closest("#rooms .door"), key = t.closest("#rooms .key");
    if (door) { const a = UI.sel; return previewOp("use:" + a, St => opUse(St, a, St.active)); }
    if (key && key.dataset.key !== UI.sel) { const a = UI.sel, b = key.dataset.key; return previewOp("comb:" + a + ":" + b, St => opCombine(St, a, b, St.active)); }
  }
  endPreview();
});

/* --- 入力（ドラッグ：マウスとタッチの両方に対応） --- */
let pend = null, drag = null;
document.addEventListener("pointerdown", e => {
  if (SCREEN !== "play" || (e.button != null && e.button > 0)) return;
  const key = e.target.closest && e.target.closest("#rooms .key");
  if (!key || e.target.closest(".mainop")) return;
  pend = { name: key.dataset.key, x: e.clientX, y: e.clientY, el: key };
});
window.addEventListener("pointermove", e => {
  if (!pend) return;
  if (!drag) {
    if (Math.hypot(e.clientX - pend.x, e.clientY - pend.y) < 8) return;
    const ghost = document.createElement("div");
    ghost.className = "ghost"; ghost.innerHTML = pend.el.outerHTML;
    ghost.firstElementChild.classList.remove("sel", "can", "fresh");
    document.body.appendChild(ghost); document.body.classList.add("dragging");
    drag = { name: pend.name, ghost, over: null };
    select(pend.name);
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
  const el = document.elementFromPoint(e.clientX, e.clientY);
  let tgt = el && (el.closest("#rooms .door") || el.closest("#rooms .key"));
  if (tgt && tgt.dataset.key === drag.name) tgt = null;
  if (drag.over !== tgt) {
    if (drag.over) drag.over.classList.remove("drop-hover");
    if (tgt) tgt.classList.add("drop-hover");
    drag.over = tgt;
    const a = drag.name; // ドラッグ中も、落とす先に応じて証明図に見本を出す
    if (!tgt) endPreview();
    else if (tgt.classList.contains("door")) previewOp("use:" + a, St => opUse(St, a, St.active));
    else { const b = tgt.dataset.key; previewOp("comb:" + a + ":" + b, St => opCombine(St, a, b, St.active)); }
  }
}, { passive: false });
function endDrag() {
  if (!drag) return null;
  const d = drag; drag = null;
  d.ghost.remove(); document.body.classList.remove("dragging");
  if (d.over) d.over.classList.remove("drop-hover");
  return d;
}
window.addEventListener("pointerup", () => {
  if (!pend) return;
  pend = null;
  const d = endDrag();
  if (!d) return; // 動かしていなければタップとしてクリック処理に任せる
  suppressUntil = Date.now() + 350;
  if (!d.over) { endPreview(); select(null); return; }
  if (d.over.classList.contains("door")) doAct(S => opUse(S, d.name, S.active));
  else { const other = d.over.dataset.key; doAct(S => opCombine(S, d.name, other, S.active)); }
});
window.addEventListener("pointercancel", () => { pend = null; if (endDrag()) { endPreview(); select(null); } });

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if ($(".overlay")) closeModal(); else if (UI.sel) select(null); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("#rooms .key, #rooms .door")) { e.preventDefault(); e.target.click(); return; }
  if (e.target && e.target.id === "lemmaInput") { if (e.key === "Enter") { e.preventDefault(); submitLemma(); } return; } // 入力欄では他のキー操作を無効にする
  if (e.target && e.target.id === "termInput") { if (e.key === "Enter") { e.preventDefault(); submitTerm(); } return; }
  if (SCREEN === "play" && PROB && !$(".overlay") && (e.key === "z" || e.key === "Z") && !e.altKey) { e.preventDefault(); UI.mode === "refute" ? undoR() : undo(); }
});

// 動作確認用

applyTheme();
renderTools();
renderSelect();
})();
</script>
</body>
